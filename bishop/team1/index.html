<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Baseline</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <button class="btn-reset" onclick="resetSimulation()">Reset</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas to launch a ball.
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;         // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center

        // STATE VARIABLES
        let balls = [];
        let stars = [];
        let planets = [];
        let spaceships = [];
        let frameCount = 0;

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 12
        };

        function initBackground() {
            // Generate subtle twinkling stars using normalized coordinates
            stars = [];
            const starCount = 90;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    rx: Math.random(),
                    ry: Math.random(),
                    size: Math.random() < 0.2 ? 1.5 : 1,
                    baseAlpha: 0.15 + Math.random() * 0.35,
                    twinkleSpeed: 0.02 + Math.random() * 0.04,
                    phase: Math.random() * Math.PI * 2
                });
            }

            // Define background planets using relative positions so they scale cleanly
            planets = [
                {
                    type: 'ringed',
                    rx: 0.17,
                    ry: 0.24,
                    radius: 34,
                    tilt: -0.38
                },
                {
                    type: 'cratered',
                    rx: 0.82,
                    ry: 0.74,
                    radius: 44,
                    craters: [
                        { dx: -0.32, dy: -0.22, r: 0.22 },
                        { dx: 0.25, dy: 0.18, r: 0.28 },
                        { dx: -0.1, dy: 0.36, r: 0.14 },
                        { dx: 0.34, dy: -0.32, r: 0.13 }
                    ]
                },
                {
                    type: 'banded',
                    rx: 0.78,
                    ry: 0.20,
                    radius: 22,
                    moonAngle: 0.5
                }
            ];

            // Initialize background spaceships
            spaceships = [
                createSpaceship('fighter', true),
                createSpaceship('saucer', true),
                createSpaceship('cruiser', true),
                createSpaceship('fighter', true)
            ];
        }

        function createSpaceship(type, randomX = false) {
            const goingRight = Math.random() > 0.35;
            const dir = goingRight ? 1 : -1;
            const w = canvas.width || 1000;
            const h = canvas.height || 600;

            let speed = 0.45;
            let scale = 1;
            if (type === 'fighter') {
                speed = (0.7 + Math.random() * 0.45) * dir;
                scale = 0.85 + Math.random() * 0.25;
            } else if (type === 'saucer') {
                speed = (0.45 + Math.random() * 0.3) * dir;
                scale = 0.9;
            } else if (type === 'cruiser') {
                speed = (0.22 + Math.random() * 0.15) * dir;
                scale = 1.15;
            }

            const margin = 80;
            const startX = randomX
                ? Math.random() * w
                : (dir === 1 ? -margin : w + margin);

            return {
                type: type,
                x: startX,
                y: 45 + Math.random() * Math.max(100, h - 90),
                vx: speed,
                vy: (Math.random() - 0.5) * 0.14,
                dir: dir,
                scale: scale,
                bobPhase: Math.random() * Math.PI * 2,
                trail: []
            };
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        initBackground();

        // Canvas Click Handler: Directly launch ball at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchBall(clickX, clickY);
        });

        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Overwrite existing array to strictly maintain a single ball on screen
            balls = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4,
                trail: [] // Stores history of past {x, y} coordinates
            }];
        }

        function resetSimulation() {
            balls = [];
        }

        function updateBackground() {
            frameCount++;

            // Slowly orbit the distant moon on the banded planet
            for (const p of planets) {
                if (p.type === 'banded') {
                    p.moonAngle += 0.006;
                }
            }

            // Update spaceships
            const margin = 90;
            for (let i = 0; i < spaceships.length; i++) {
                const ship = spaceships[i];
                ship.x += ship.vx;
                ship.y += ship.vy + Math.sin(frameCount * 0.02 + ship.bobPhase) * 0.08;

                // Record thruster exhaust trail
                if (frameCount % 2 === 0) {
                    ship.trail.push({
                        x: ship.x - ship.dir * 12 * ship.scale,
                        y: ship.y
                    });
                    if (ship.trail.length > 22) {
                        ship.trail.shift();
                    }
                }

                // Respawn ship when it drifts off-screen
                if ((ship.dir === 1 && ship.x > canvas.width + margin) ||
                    (ship.dir === -1 && ship.x < -margin) ||
                    ship.y < -margin || ship.y > canvas.height + margin) {
                    spaceships[i] = createSpaceship(ship.type, false);
                }
            }
        }

        function updatePhysics() {
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove ball if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    balls.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }
        }

        function drawStars() {
            for (const s of stars) {
                const alpha = s.baseAlpha + Math.sin(frameCount * s.twinkleSpeed + s.phase) * 0.12;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.05, alpha)})`;
                ctx.fillRect(s.rx * canvas.width, s.ry * canvas.height, s.size, s.size);
            }
        }

        function drawPlanets() {
            for (const p of planets) {
                const px = p.rx * canvas.width;
                const py = p.ry * canvas.height;

                ctx.save();
                ctx.translate(px, py);

                if (p.type === 'ringed') {
                    // Back half of ring
                    ctx.save();
                    ctx.rotate(p.tilt);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.radius * 2.1, p.radius * 0.55, 0, Math.PI, Math.PI * 2);
                    ctx.strokeStyle = '#3b3b3b';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.radius * 1.75, p.radius * 0.42, 0, Math.PI, Math.PI * 2);
                    ctx.strokeStyle = '#292929';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.restore();

                    // Planet sphere
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#0d0d0d';
                    ctx.fill();
                    ctx.strokeStyle = '#444444';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();

                    // Subtle atmospheric bands clipped to planet
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius - 1, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.rotate(p.tilt);
                    ctx.strokeStyle = '#262626';
                    ctx.lineWidth = 1;
                    for (let band = -16; band <= 16; band += 8) {
                        ctx.beginPath();
                        ctx.moveTo(-p.radius, band);
                        ctx.lineTo(p.radius, band);
                        ctx.stroke();
                    }
                    ctx.restore();

                    // Front half of ring
                    ctx.save();
                    ctx.rotate(p.tilt);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.radius * 2.1, p.radius * 0.55, 0, 0, Math.PI);
                    ctx.strokeStyle = '#4a4a4a';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.radius * 1.75, p.radius * 0.42, 0, 0, Math.PI);
                    ctx.strokeStyle = '#2e2e2e';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.restore();

                } else if (p.type === 'cratered') {
                    // Planet body
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#0b0b0b';
                    ctx.fill();
                    ctx.strokeStyle = '#3f3f3f';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();

                    // Crescent terminator line
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius - 1, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.beginPath();
                    ctx.arc(-p.radius * 0.35, -p.radius * 0.15, p.radius * 0.95, 0, Math.PI * 2);
                    ctx.strokeStyle = '#242424';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Surface craters
                    for (const c of p.craters) {
                        ctx.beginPath();
                        ctx.arc(c.dx * p.radius, c.dy * p.radius, c.r * p.radius, 0, Math.PI * 2);
                        ctx.strokeStyle = '#303030';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                    ctx.restore();

                } else if (p.type === 'banded') {
                    // Orbit path for tiny moon
                    const orbitRx = p.radius * 1.9;
                    const orbitRy = p.radius * 0.65;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, orbitRx, orbitRy, 0.25, 0, Math.PI * 2);
                    ctx.strokeStyle = '#1f1f1f';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Planet body
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#0c0c0c';
                    ctx.fill();
                    ctx.strokeStyle = '#3d3d3d';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();

                    // Equator line
                    ctx.beginPath();
                    ctx.moveTo(-p.radius + 2, 0);
                    ctx.lineTo(p.radius - 2, 0);
                    ctx.strokeStyle = '#282828';
                    ctx.stroke();

                    // Orbiting moon
                    const mx = Math.cos(p.moonAngle) * orbitRx;
                    const my = Math.sin(p.moonAngle) * orbitRy;
                    const rot = 0.25;
                    const rmx = mx * Math.cos(rot) - my * Math.sin(rot);
                    const rmy = mx * Math.sin(rot) + my * Math.cos(rot);

                    ctx.beginPath();
                    ctx.arc(rmx, rmy, 3.2, 0, Math.PI * 2);
                    ctx.fillStyle = '#141414';
                    ctx.fill();
                    ctx.strokeStyle = '#4d4d4d';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        function drawSpaceships() {
            for (const ship of spaceships) {
                // Draw subtle thruster trail
                if (ship.trail.length > 1) {
                    for (let t = 1; t < ship.trail.length; t++) {
                        const alpha = (t / ship.trail.length) * 0.25;
                        ctx.beginPath();
                        ctx.moveTo(ship.trail[t - 1].x, ship.trail[t - 1].y);
                        ctx.lineTo(ship.trail[t].x, ship.trail[t].y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }

                ctx.save();
                ctx.translate(ship.x, ship.y);
                ctx.scale(ship.dir * ship.scale, ship.scale);

                if (ship.type === 'fighter') {
                    // Delta-wing starfighter wireframe
                    ctx.beginPath();
                    ctx.moveTo(14, 0);
                    ctx.lineTo(-10, -8);
                    ctx.lineTo(-6, 0);
                    ctx.lineTo(-10, 8);
                    ctx.closePath();
                    ctx.fillStyle = '#0a0a0a';
                    ctx.fill();
                    ctx.strokeStyle = '#5c5c5c';
                    ctx.lineWidth = 1.1;
                    ctx.stroke();

                    // Cockpit detail
                    ctx.beginPath();
                    ctx.moveTo(4, 0);
                    ctx.lineTo(-3, -2);
                    ctx.lineTo(-3, 2);
                    ctx.closePath();
                    ctx.strokeStyle = '#3d3d3d';
                    ctx.stroke();

                    // Flickering thruster flame
                    const flicker = 3 + Math.sin(frameCount * 0.6 + ship.bobPhase) * 2.5;
                    ctx.beginPath();
                    ctx.moveTo(-7, -2);
                    ctx.lineTo(-7 - flicker, 0);
                    ctx.lineTo(-7, 2);
                    ctx.strokeStyle = '#777777';
                    ctx.stroke();

                } else if (ship.type === 'saucer') {
                    // Top dome
                    ctx.beginPath();
                    ctx.arc(0, -2, 6, Math.PI, 0);
                    ctx.strokeStyle = '#555555';
                    ctx.lineWidth = 1.1;
                    ctx.stroke();

                    // Saucer hull
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 15, 4.5, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#0a0a0a';
                    ctx.fill();
                    ctx.strokeStyle = '#606060';
                    ctx.lineWidth = 1.1;
                    ctx.stroke();

                    // Blinking hull lights
                    const blink = Math.floor(frameCount / 18) % 2 === 0;
                    ctx.fillStyle = blink ? '#7a7a7a' : '#2e2e2e';
                    ctx.fillRect(-7, -0.5, 1.5, 1.5);
                    ctx.fillRect(-0.75, -0.5, 1.5, 1.5);
                    ctx.fillRect(5.5, -0.5, 1.5, 1.5);

                } else if (ship.type === 'cruiser') {
                    // Heavy sci-fi freighter / capital ship silhouette
                    ctx.beginPath();
                    ctx.moveTo(22, 0);
                    ctx.lineTo(14, -5);
                    ctx.lineTo(-16, -6);
                    ctx.lineTo(-20, -3);
                    ctx.lineTo(-20, 3);
                    ctx.lineTo(-16, 6);
                    ctx.lineTo(14, 5);
                    ctx.closePath();
                    ctx.fillStyle = '#080808';
                    ctx.fill();
                    ctx.strokeStyle = '#484848';
                    ctx.lineWidth = 1.1;
                    ctx.stroke();

                    // Bridge tower & panel lines
                    ctx.strokeRect(-8, -9, 6, 3);
                    ctx.beginPath();
                    ctx.moveTo(-4, -5);
                    ctx.lineTo(-4, 5);
                    ctx.moveTo(6, -5);
                    ctx.lineTo(6, 5);
                    ctx.strokeStyle = '#2d2d2d';
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        function draw() {
            // Clear canvas background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 0. Draw Background Layer (Stars, Planets, Spaceships)
            drawStars();
            drawPlanets();
            drawSpaceships();

            // 1. Draw Central Mass Node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Center mark on node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // 2. Draw Ball & Trail
            for (const b of balls) {
                // Draw path line
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }

                // Draw ball object
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }
        }

        function animate() {
            updateBackground();
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
