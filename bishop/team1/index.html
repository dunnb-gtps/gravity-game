<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Gravity Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #0c241c 0%, #06130f 65%, #030907 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #d4af37;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            color: #ffd166;
            text-shadow: 0 0 10px rgba(255, 209, 102, 0.35);
        }

        h1 .holly-accent {
            color: #e63946;
        }

        .btn-reset {
            background: rgba(185, 28, 28, 0.25);
            color: #ffd166;
            border: 1px solid #d4af37;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 3px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #c1121f;
            color: #ffffff;
            border-color: #ffd166;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.45);
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background: radial-gradient(circle at 50% 45%, #0c2620 0%, #071714 55%, #040c0b 100%);
            border: 1px solid #d4af37;
            box-shadow: 0 0 24px rgba(12, 46, 36, 0.8), inset 0 0 40px rgba(0, 0, 0, 0.65);
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #cbd5e1;
            text-align: center;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1><span class="holly-accent">❄</span> Christmas Gravity Simulation <span class="holly-accent">❄</span></h1>
        <button class="btn-reset" onclick="resetSimulation()">Reset</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere in the winter sky to launch more Christmas elves into orbit.
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;         // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center
        const MAX_ORBITING_ELVES = 45;    // Cap active orbiting elves for smooth performance

        // FESTIVE PALETTE FOR ELVES & FAIRY LIGHTS
        const ELF_THEMES = [
            { main: '#2ec4b6', hat: '#2d6a4f', tunic: '#2d6a4f', trim: '#e63946', boots: '#c1121f', trail: 'rgba(46, 196, 182, 0.7)' },  // Classic Evergreen Elf
            { main: '#e63946', hat: '#c1121f', tunic: '#c1121f', trim: '#ffd166', boots: '#2d6a4f', trail: 'rgba(230, 57, 70, 0.7)' },   // Holly Red Elf
            { main: '#ffd166', hat: '#1b9aaa', tunic: '#2d6a4f', trim: '#ffd166', boots: '#e63946', trail: 'rgba(255, 209, 102, 0.75)' }, // North Pole Frosted Elf
            { main: '#52b788', hat: '#e63946', tunic: '#40916c', trim: '#ffffff', boots: '#9e1b24', trail: 'rgba(82, 183, 136, 0.7)' },  // Candy Cane Mint Elf
            { main: '#c77dff', hat: '#7b2cbf', tunic: '#9d4edd', trim: '#ffd166', boots: '#2d6a4f', trail: 'rgba(199, 125, 255, 0.7)' }, // Sugarplum Elf
            { main: '#5ac8fa', hat: '#0077b6', tunic: '#0096c7', trim: '#e63946', boots: '#c1121f', trail: 'rgba(90, 200, 250, 0.7)' }   // Frost Blue Elf
        ];
        const FAIRY_LIGHT_COLORS = ['#ff3b30', '#ffd166', '#34c759', '#5ac8fa', '#ffffff'];
        const TREE_LIGHT_COLORS = ['#ff3b30', '#ffd166', '#34c759', '#5ac8fa', '#ff9f1c'];

        // Christmas trees arranged across the snowy ground
        const GROUND_TREES = [
            { rx: 0.05, height: 48, seed: 0 },
            { rx: 0.11, height: 36, seed: 1 },
            { rx: 0.19, height: 54, seed: 2 },
            { rx: 0.28, height: 42, seed: 3 },
            { rx: 0.38, height: 36, seed: 4 },
            { rx: 0.49, height: 44, seed: 5 },
            { rx: 0.59, height: 38, seed: 6 },
            { rx: 0.70, height: 52, seed: 7 },
            { rx: 0.79, height: 40, seed: 8 },
            { rx: 0.88, height: 56, seed: 9 },
            { rx: 0.95, height: 42, seed: 10 }
        ];

        // Cheerful elves standing on the snowy ground near the Christmas trees
        const GROUND_ELVES = [
            { rx: 0.08, themeIndex: 0, phase: 0.2, holdingGift: true },
            { rx: 0.23, themeIndex: 1, phase: 1.4, holdingGift: false },
            { rx: 0.33, themeIndex: 2, phase: 2.6, holdingGift: true },
            { rx: 0.54, themeIndex: 3, phase: 0.9, holdingGift: false },
            { rx: 0.74, themeIndex: 4, phase: 2.1, holdingGift: true },
            { rx: 0.91, themeIndex: 5, phase: 3.3, holdingGift: false }
        ];

        // STATE VARIABLES
        let elves = [];
        let stars = [];
        let snowflakes = [];
        let festiveObjects = [];
        let holidayFlyers = [];
        let sparkles = [];
        let frameCount = 0;
        let launchCount = 0;

        // Central Gravity Node Definition (Festive Star-Ornament Core)
        const centralNode = {
            x: 0,
            y: 0,
            radius: 12
        };

        function initBackground() {
            // Twinkling winter night stars
            stars = [];
            const starCount = 85;
            const starColors = ['#ffffff', '#fff3b0', '#caf0f8', '#ffd166'];
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    rx: Math.random(),
                    ry: Math.random() * 0.9,
                    size: Math.random() < 0.22 ? 2 : 1.2,
                    isFourPoint: Math.random() < 0.14,
                    color: starColors[Math.floor(Math.random() * starColors.length)],
                    baseAlpha: 0.25 + Math.random() * 0.45,
                    twinkleSpeed: 0.02 + Math.random() * 0.04,
                    phase: Math.random() * Math.PI * 2
                });
            }

            // Gently drifting snowfall
            snowflakes = [];
            const snowCount = 75;
            for (let i = 0; i < snowCount; i++) {
                snowflakes.push({
                    x: Math.random() * (canvas.width || 1000),
                    y: Math.random() * (canvas.height || 600),
                    radius: 1 + Math.random() * 2.2,
                    vy: 0.35 + Math.random() * 0.65,
                    vx: (Math.random() - 0.5) * 0.25,
                    swayPhase: Math.random() * Math.PI * 2,
                    swaySpeed: 0.015 + Math.random() * 0.02,
                    alpha: 0.3 + Math.random() * 0.5
                });
            }

            // Background festive celestial landmarks
            festiveObjects = [
                {
                    type: 'santa_moon',
                    rx: 0.16,
                    ry: 0.23,
                    radius: 32
                },
                {
                    type: 'wreath',
                    rx: 0.83,
                    ry: 0.72,
                    radius: 38
                },
                {
                    type: 'north_star',
                    rx: 0.79,
                    ry: 0.20,
                    radius: 20,
                    bellAngle: 0.4
                }
            ];

            // Flying holiday elements in the sky, featuring Santa's sleigh prominently
            holidayFlyers = [
                createHolidayFlyer('sleigh', true),
                createHolidayFlyer('comet_star', true),
                createHolidayFlyer('gift_paraglider', true),
                createHolidayFlyer('comet_star', true)
            ];
        }

        function spawnInitialElves() {
            elves = [];
            const maxRadius = Math.max(120, Math.min(canvas.width, canvas.height) * 0.36);
            const orbitPresets = [
                { rRatio: 0.38, angle: 0.0, dir: 1, ecc: 1.0 },
                { rRatio: 0.54, angle: 2.1, dir: -1, ecc: 1.02 },
                { rRatio: 0.70, angle: 4.2, dir: 1, ecc: 0.98 },
                { rRatio: 0.86, angle: 1.1, dir: 1, ecc: 1.01 },
                { rRatio: 1.00, angle: 3.5, dir: -1, ecc: 0.97 }
            ];

            for (let i = 0; i < orbitPresets.length; i++) {
                const preset = orbitPresets[i];
                const r = Math.max(55, maxRadius * preset.rRatio);
                const x = centralNode.x + Math.cos(preset.angle) * r;
                const y = centralNode.y + Math.sin(preset.angle) * r;

                // Circular orbital speed adjusted for gravity softening factor
                const accel = GRAVITY_CONSTANT / (r * r + SOFTENING_FACTOR);
                const speed = Math.sqrt(r * accel) * preset.ecc;

                const vx = -Math.sin(preset.angle) * speed * preset.dir;
                const vy = Math.cos(preset.angle) * speed * preset.dir;

                const theme = ELF_THEMES[launchCount % ELF_THEMES.length];
                launchCount++;

                elves.push({
                    x: x,
                    y: y,
                    vx: vx,
                    vy: vy,
                    radius: 6,
                    theme: theme,
                    phaseOffset: i * 1.3,
                    trail: []
                });
            }
        }

        function createHolidayFlyer(type, initial = false) {
            const goingRight = type === 'sleigh' ? true : Math.random() > 0.35;
            const dir = goingRight ? 1 : -1;
            const w = canvas.width || 1000;
            const h = canvas.height || 600;

            let speed = 0.5;
            let scale = 1;
            if (type === 'sleigh') {
                speed = 0.75 * dir;
                scale = 1.35;
            } else if (type === 'comet_star') {
                speed = (0.8 + Math.random() * 0.45) * dir;
                scale = 0.85 + Math.random() * 0.25;
            } else if (type === 'gift_paraglider') {
                speed = (0.3 + Math.random() * 0.2) * dir;
                scale = 0.95;
            }

            const margin = type === 'sleigh' ? 145 : 110;
            let startX;
            let startY;

            if (type === 'sleigh') {
                // Position Santa's sleigh prominently in the upper sky on initial load
                startX = initial ? w * 0.28 : (dir === 1 ? -margin : w + margin);
                startY = initial ? Math.max(76, h * 0.15) : 65 + Math.random() * Math.max(80, h * 0.25);
            } else {
                startX = initial ? Math.random() * w : (dir === 1 ? -margin : w + margin);
                startY = 45 + Math.random() * Math.max(100, h - 130);
            }

            return {
                type: type,
                x: startX,
                y: startY,
                vx: speed,
                vy: type === 'sleigh' ? 0 : (Math.random() - 0.5) * 0.12,
                dir: dir,
                scale: scale,
                bobPhase: Math.random() * Math.PI * 2,
                trail: []
            };
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        initBackground();
        spawnInitialElves();

        // Canvas Click Handler: Launch festive Christmas elf at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchElf(clickX, clickY);
        });

        function spawnSparkles(x, y, color, count = 14) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
                const speed = 0.8 + Math.random() * 2.2;
                sparkles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: 0.025 + Math.random() * 0.02,
                    color: i % 2 === 0 ? color : '#ffd166',
                    size: 1.5 + Math.random() * 1.5
                });
            }
        }

        function launchElf(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            const theme = ELF_THEMES[launchCount % ELF_THEMES.length];
            launchCount++;

            spawnSparkles(x, y, theme.main, 12);

            if (elves.length >= MAX_ORBITING_ELVES) {
                elves.shift();
            }

            elves.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 6,
                theme: theme,
                phaseOffset: Math.random() * Math.PI * 2,
                trail: [] // Stores history of past {x, y} coordinates
            });
        }

        function resetSimulation() {
            sparkles = [];
            spawnInitialElves();
        }

        function updateBackground() {
            frameCount++;

            // Update falling snow
            for (const flake of snowflakes) {
                flake.y += flake.vy;
                flake.x += flake.vx + Math.sin(frameCount * flake.swaySpeed + flake.swayPhase) * 0.25;

                if (flake.y > canvas.height + 5) {
                    flake.y = -5;
                    flake.x = Math.random() * canvas.width;
                }
                if (flake.x > canvas.width + 5) flake.x = -5;
                if (flake.x < -5) flake.x = canvas.width + 5;
            }

            // Orbit tiny jingle bell around the Guiding North Star
            for (const obj of festiveObjects) {
                if (obj.type === 'north_star') {
                    obj.bellAngle += 0.008;
                }
            }

            // Update flying holiday elements
            for (let i = 0; i < holidayFlyers.length; i++) {
                const flyer = holidayFlyers[i];
                const margin = flyer.type === 'sleigh' ? 150 : 120;
                flyer.x += flyer.vx;
                flyer.y += flyer.vy + Math.sin(frameCount * 0.03 + flyer.bobPhase) * (flyer.type === 'sleigh' ? 0.22 : 0.12);

                // Record golden stardust trail
                if (frameCount % 2 === 0) {
                    const offset = flyer.type === 'sleigh' ? -44 : -10;
                    const trailY = flyer.type === 'sleigh' ? flyer.y + 8 * flyer.scale : flyer.y;
                    flyer.trail.push({
                        x: flyer.x + flyer.dir * offset * flyer.scale,
                        y: trailY
                    });
                    const maxTrail = flyer.type === 'sleigh' ? 38 : 26;
                    if (flyer.trail.length > maxTrail) {
                        flyer.trail.shift();
                    }
                }

                // Gentle magic stardust sparkles drifting off Santa's sleigh
                if (flyer.type === 'sleigh' && frameCount % 7 === 0) {
                    sparkles.push({
                        x: flyer.x - flyer.dir * 42 * flyer.scale + (Math.random() - 0.5) * 8,
                        y: flyer.y + 6 * flyer.scale + (Math.random() - 0.5) * 6,
                        vx: -flyer.dir * (0.2 + Math.random() * 0.4),
                        vy: 0.15 + Math.random() * 0.35,
                        life: 0.9,
                        decay: 0.022,
                        color: Math.random() < 0.65 ? '#ffd166' : '#ffffff',
                        size: 1.3 + Math.random() * 1.1
                    });
                }

                // Respawn flyer when it drifts off-screen
                if ((flyer.dir === 1 && flyer.x > canvas.width + margin) ||
                    (flyer.dir === -1 && flyer.x < -margin) ||
                    flyer.y < -margin || flyer.y > canvas.height + margin) {
                    holidayFlyers[i] = createHolidayFlyer(flyer.type, false);
                }
            }

            // Update festive sparkle particles
            for (let i = sparkles.length - 1; i >= 0; i--) {
                const sp = sparkles[i];
                sp.x += sp.vx;
                sp.y += sp.vy;
                sp.vx *= 0.96;
                sp.vy *= 0.96;
                sp.life -= sp.decay;
                if (sp.life <= 0) {
                    sparkles.splice(i, 1);
                }
            }
        }

        function updatePhysics() {
            for (let i = elves.length - 1; i >= 0; i--) {
                const elf = elves[i];

                // Remove elf if it travels too far off-screen
                const margin = 500;
                if (elf.x < -margin || elf.x > canvas.width + margin ||
                    elf.y < -margin || elf.y > canvas.height + margin) {
                    elves.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - elf.x;
                const dy = centralNode.y - elf.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: elf reaches central star-ornament
                if (dist < centralNode.radius + elf.radius) {
                    spawnSparkles(elf.x, elf.y, elf.theme.main, 18);
                    elves.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                elf.vx += ax;
                elf.vy += ay;
                elf.x += elf.vx;
                elf.y += elf.vy;

                // Record position history for fairy-light trail
                elf.trail.push({ x: elf.x, y: elf.y });
                if (elf.trail.length > TRAIL_LENGTH) {
                    elf.trail.shift();
                }
            }
        }

        function drawStarsAndSnow() {
            // Twinkling stars
            for (const s of stars) {
                const alpha = Math.max(0.08, s.baseAlpha + Math.sin(frameCount * s.twinkleSpeed + s.phase) * 0.18);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = s.color;
                const sx = s.rx * canvas.width;
                const sy = s.ry * canvas.height;

                if (s.isFourPoint) {
                    ctx.beginPath();
                    ctx.moveTo(sx, sy - 4);
                    ctx.lineTo(sx + 1.2, sy - 1.2);
                    ctx.lineTo(sx + 4, sy);
                    ctx.lineTo(sx + 1.2, sy + 1.2);
                    ctx.lineTo(sx, sy + 4);
                    ctx.lineTo(sx - 1.2, sy + 1.2);
                    ctx.lineTo(sx - 4, sy);
                    ctx.lineTo(sx - 1.2, sy - 1.2);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillRect(sx, sy, s.size, s.size);
                }
                ctx.restore();
            }

            // Drifting snowflakes
            for (const flake of snowflakes) {
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(240, 249, 255, ${flake.alpha})`;
                ctx.fill();
            }
        }

        function getGroundY(rx, h) {
            return h - 18 - Math.sin(rx * Math.PI * 2.4 + 0.3) * 6 - Math.cos(rx * Math.PI * 1.1) * 4;
        }

        function drawChristmasTreeWithLights(tx, groundY, treeHeight, seed) {
            ctx.save();

            const trunkW = Math.max(4, treeHeight * 0.14);
            const trunkH = Math.max(5, treeHeight * 0.16);
            const boughBaseY = groundY - trunkH + 3;
            const foliageH = treeHeight - trunkH;

            // Wooden tree trunk
            ctx.fillStyle = '#5c3a21';
            ctx.fillRect(tx - trunkW / 2, groundY - trunkH, trunkW, trunkH + 2);
            ctx.strokeStyle = '#3d2514';
            ctx.lineWidth = 0.8;
            ctx.strokeRect(tx - trunkW / 2, groundY - trunkH, trunkW, trunkH + 2);

            // Three overlapping evergreen bough tiers (bottom, middle, top)
            const tiers = [
                {
                    topY: boughBaseY - foliageH * 0.52,
                    botY: boughBaseY,
                    halfW: treeHeight * 0.38
                },
                {
                    topY: boughBaseY - foliageH * 0.80,
                    botY: boughBaseY - foliageH * 0.34,
                    halfW: treeHeight * 0.30
                },
                {
                    topY: boughBaseY - foliageH,
                    botY: boughBaseY - foliageH * 0.62,
                    halfW: treeHeight * 0.21
                }
            ];

            for (let t = 0; t < tiers.length; t++) {
                const tier = tiers[t];
                const grad = ctx.createLinearGradient(tx, tier.topY, tx, tier.botY);
                grad.addColorStop(0, '#2d6a4f');
                grad.addColorStop(1, '#1b4332');

                ctx.beginPath();
                ctx.moveTo(tx, tier.topY);
                ctx.lineTo(tx - tier.halfW, tier.botY);
                ctx.lineTo(tx + tier.halfW, tier.botY);
                ctx.closePath();
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.strokeStyle = 'rgba(82, 183, 136, 0.35)';
                ctx.lineWidth = 0.9;
                ctx.stroke();
            }

            // Small snow mound around the base of the trunk
            ctx.beginPath();
            ctx.ellipse(tx, groundY + 1, trunkW * 1.35, 2.4, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(226, 241, 248, 0.45)';
            ctx.fill();

            // Glowing golden star topper
            const starY = boughBaseY - foliageH - 1.5;
            const starPulse = 0.8 + Math.sin(frameCount * 0.08 + seed) * 0.2;
            const starGlow = ctx.createRadialGradient(tx, starY, 0.5, tx, starY, 7 * starPulse);
            starGlow.addColorStop(0, 'rgba(255, 243, 176, 0.8)');
            starGlow.addColorStop(1, 'rgba(255, 209, 102, 0)');
            ctx.fillStyle = starGlow;
            ctx.beginPath();
            ctx.arc(tx, starY, 7 * starPulse, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffd166';
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const r = i % 2 === 0 ? 4.2 : 1.5;
                const ang = (i * Math.PI) / 4;
                const sx = tx + Math.cos(ang) * r;
                const sy = starY + Math.sin(ang) * r;
                if (i === 0) ctx.moveTo(sx, sy);
                else ctx.lineTo(sx, sy);
            }
            ctx.closePath();
            ctx.fill();

            // Draped light strings and twinkling Christmas bulbs across each tier
            const lightRows = [
                { tierIndex: 0, count: 4, yStartRatio: 0.42, yEndRatio: 0.82 },
                { tierIndex: 1, count: 3, yStartRatio: 0.40, yEndRatio: 0.80 },
                { tierIndex: 2, count: 2, yStartRatio: 0.45, yEndRatio: 0.78 }
            ];

            let bulbCounter = 0;
            for (const row of lightRows) {
                const tier = tiers[row.tierIndex];
                const points = [];

                for (let b = 0; b < row.count; b++) {
                    const frac = row.count === 1 ? 0.5 : b / (row.count - 1);
                    const yRatio = row.yStartRatio + (row.yEndRatio - row.yStartRatio) * frac;
                    const by = tier.topY + (tier.botY - tier.topY) * yRatio;
                    const maxSpan = tier.halfW * yRatio * 0.78;
                    const dir = row.tierIndex % 2 === 0 ? 1 : -1;
                    const bx = tx + dir * (-maxSpan + frac * (maxSpan * 2));
                    points.push({ x: bx, y: by });
                }

                // Subtle garland cord connecting the lights
                if (points.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(points[0].x, points[0].y);
                    for (let p = 1; p < points.length; p++) {
                        ctx.lineTo(points[p].x, points[p].y);
                    }
                    ctx.strokeStyle = 'rgba(255, 209, 102, 0.22)';
                    ctx.lineWidth = 0.7;
                    ctx.stroke();
                }

                // Glowing colorful bulbs
                for (const pt of points) {
                    const color = TREE_LIGHT_COLORS[(seed + bulbCounter) % TREE_LIGHT_COLORS.length];
                    const twinkle = 0.6 + 0.4 * Math.sin(frameCount * 0.08 + seed * 1.7 + bulbCounter * 1.4);

                    // Soft colored light halo
                    ctx.save();
                    ctx.globalAlpha = 0.35 * twinkle;
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, 4.2, 0, Math.PI * 2);
                    ctx.fill();

                    // Bright bulb core
                    ctx.globalAlpha = 0.7 + 0.3 * twinkle;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, 1.7, 0, Math.PI * 2);
                    ctx.fill();

                    // Crisp white sparkle center
                    ctx.globalAlpha = 0.85 * twinkle;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, 0.65, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    bulbCounter++;
                }
            }

            ctx.restore();
        }

        function drawGroundElves(w, h) {
            for (const gElf of GROUND_ELVES) {
                const ex = gElf.rx * w;
                const hop = Math.abs(Math.sin(frameCount * 0.06 + gElf.phase)) * 2.2;
                const ey = getGroundY(gElf.rx, h) - 8 - hop;
                const theme = ELF_THEMES[gElf.themeIndex % ELF_THEMES.length];

                drawChristmasElf({
                    x: ex,
                    y: ey,
                    vx: 0,
                    vy: 0,
                    theme: theme,
                    phaseOffset: gElf.phase,
                    isGrounded: true,
                    holdingGift: gElf.holdingGift
                });
            }
        }

        function drawWinterHorizon() {
            const w = canvas.width;
            const h = canvas.height;
            ctx.save();

            // Rolling snowy ground along the bottom edge
            const groundGrad = ctx.createLinearGradient(0, h - 30, 0, h);
            groundGrad.addColorStop(0, 'rgba(226, 241, 248, 0.26)');
            groundGrad.addColorStop(1, 'rgba(186, 218, 235, 0.14)');

            ctx.beginPath();
            ctx.moveTo(0, h);
            const steps = 40;
            for (let i = 0; i <= steps; i++) {
                const rx = i / steps;
                ctx.lineTo(rx * w, getGroundY(rx, h));
            }
            ctx.lineTo(w, h);
            ctx.closePath();
            ctx.fillStyle = groundGrad;
            ctx.fill();

            // Subtle frosty snow ridge highlight
            ctx.beginPath();
            for (let i = 0; i <= steps; i++) {
                const rx = i / steps;
                const gx = rx * w;
                const gy = getGroundY(rx, h);
                if (i === 0) ctx.moveTo(gx, gy);
                else ctx.lineTo(gx, gy);
            }
            ctx.strokeStyle = 'rgba(240, 249, 255, 0.32)';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // Draw Christmas trees with twinkling lights standing on the snow ground
            for (const tree of GROUND_TREES) {
                const tx = tree.rx * w;
                const groundY = getGroundY(tree.rx, h);
                drawChristmasTreeWithLights(tx, groundY, tree.height, tree.seed);
            }

            // Draw cheerful elves standing by the trees on the snow
            drawGroundElves(w, h);

            ctx.restore();
        }

        function drawFestiveObjects() {
            for (const obj of festiveObjects) {
                const px = obj.rx * canvas.width;
                const py = obj.ry * canvas.height;

                ctx.save();
                ctx.translate(px, py);

                if (obj.type === 'santa_moon') {
                    // Warm lunar halo
                    const grad = ctx.createRadialGradient(0, 0, obj.radius * 0.4, 0, 0, obj.radius * 1.9);
                    grad.addColorStop(0, 'rgba(255, 243, 176, 0.16)');
                    grad.addColorStop(1, 'rgba(255, 243, 176, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, obj.radius * 1.9, 0, Math.PI * 2);
                    ctx.fill();

                    // Golden Moon Sphere
                    ctx.beginPath();
                    ctx.arc(0, 0, obj.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#292518';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 209, 102, 0.55)';
                    ctx.lineWidth = 1.4;
                    ctx.stroke();

                    // Subtle moon craters
                    ctx.strokeStyle = 'rgba(255, 209, 102, 0.2)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(-9, 6, 6, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(10, 9, 4.5, 0, Math.PI * 2);
                    ctx.stroke();

                    // Cozy Santa Hat perched on top of the moon
                    ctx.save();
                    ctx.rotate(-0.22);
                    // Red cone
                    ctx.beginPath();
                    ctx.moveTo(-obj.radius * 0.78, -obj.radius * 0.62);
                    ctx.quadraticCurveTo(-2, -obj.radius * 1.85, obj.radius * 0.95, -obj.radius * 1.15);
                    ctx.lineTo(obj.radius * 0.78, -obj.radius * 0.62);
                    ctx.closePath();
                    ctx.fillStyle = '#9e1b24';
                    ctx.fill();
                    ctx.strokeStyle = '#e63946';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // White fluffy brim
                    ctx.beginPath();
                    ctx.roundRect(-obj.radius * 0.85, -obj.radius * 0.72, obj.radius * 1.7, 7, 3.5);
                    ctx.fillStyle = '#e2e8f0';
                    ctx.fill();

                    // White pom-pom
                    ctx.beginPath();
                    ctx.arc(obj.radius * 0.98, -obj.radius * 1.12, 4.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#f8fafc';
                    ctx.fill();
                    ctx.restore();

                } else if (obj.type === 'wreath') {
                    // Evergreen Christmas Wreath
                    ctx.beginPath();
                    ctx.arc(0, 0, obj.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(45, 106, 79, 0.65)';
                    ctx.lineWidth = 10;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, 0, obj.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(82, 183, 136, 0.45)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Holly berries around the wreath
                    for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                        const bx = Math.cos(a) * obj.radius;
                        const by = Math.sin(a) * obj.radius;
                        ctx.beginPath();
                        ctx.arc(bx, by, 2.3, 0, Math.PI * 2);
                        ctx.fillStyle = '#e63946';
                        ctx.fill();
                    }

                    // Festive Red Ribbon Bow at top
                    ctx.fillStyle = '#d62828';
                    ctx.beginPath();
                    ctx.ellipse(-6, -obj.radius, 6, 3.5, -0.35, 0, Math.PI * 2);
                    ctx.ellipse(6, -obj.radius, 6, 3.5, 0.35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(0, -obj.radius, 2.8, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffd166';
                    ctx.fill();

                } else if (obj.type === 'north_star') {
                    // Orbit path for tiny golden jingle bell
                    const orbitRx = obj.radius * 2.0;
                    const orbitRy = obj.radius * 0.7;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, orbitRx, orbitRy, 0.25, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 209, 102, 0.18)';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Glowing 8-point Guiding North Star
                    ctx.fillStyle = 'rgba(255, 209, 102, 0.65)';
                    ctx.beginPath();
                    for (let i = 0; i < 8; i++) {
                        const r = i % 2 === 0 ? obj.radius * 0.85 : obj.radius * 0.24;
                        const ang = (i * Math.PI) / 4;
                        const sx = Math.cos(ang) * r;
                        const sy = Math.sin(ang) * r;
                        if (i === 0) ctx.moveTo(sx, sy);
                        else ctx.lineTo(sx, sy);
                    }
                    ctx.closePath();
                    ctx.fill();

                    // Orbiting Golden Jingle Bell
                    const mx = Math.cos(obj.bellAngle) * orbitRx;
                    const my = Math.sin(obj.bellAngle) * orbitRy;
                    const rot = 0.25;
                    const rmx = mx * Math.cos(rot) - my * Math.sin(rot);
                    const rmy = mx * Math.sin(rot) + my * Math.cos(rot);

                    ctx.beginPath();
                    ctx.arc(rmx, rmy, 3.4, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffd166';
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function drawSantaSleigh(flyer) {
            const gallopPhase = frameCount * 0.2 + flyer.bobPhase;
            const wavePhase = Math.sin(frameCount * 0.14 + flyer.bobPhase);
            const hatBob = Math.sin(frameCount * 0.16 + flyer.bobPhase) * 1.2;

            // Warm golden magic halo behind Santa's sleigh
            const sleighAura = ctx.createRadialGradient(-22, -4, 3, -22, -4, 34);
            sleighAura.addColorStop(0, 'rgba(255, 209, 102, 0.22)');
            sleighAura.addColorStop(1, 'rgba(255, 209, 102, 0)');
            ctx.fillStyle = sleighAura;
            ctx.beginPath();
            ctx.arc(-22, -4, 34, 0, Math.PI * 2);

            ctx.lineTo(-7, 11);

            ctx.moveTo(-14, 11);
            ctx.lineTo(-13, 6);
            ctx.stroke();

            // 2. OVERFLOWING SACK OF PRESENTS IN BACK OF SLEIGH

            ctx.fillStyle = '#2d6a4f';
            ctx.fillRect(-37, -13, 6, 6);
            ctx.fillStyle = '#ffd166';
            ctx.fillRect(-34.5, -13, 1.2, 6);

            ctx.fillStyle = '#0077b6';
            ctx.fillRect(-30, -14, 6, 7);
            ctx.fillStyle = '#e63946';
            ctx.fillRect(-27.6, -14, 1.2, 7);

            ctx.fillStyle = '#ffd166';
            ctx.fillRect(-33.5, -17, 5, 5);
            ctx.fillStyle = '#c1121f';
            ctx.fillRect(-31.5, -17, 1, 5);

            // Brown velvet toy sack
            ctx.fillStyle = '#7f4f24';
            ctx.beginPath();
            ctx.ellipse(-32, -3, 8.5, 7.5, -0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#b08968';
            ctx.lineWidth = 0.8;

            // Gold ribbon tying the toy sack

            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.moveTo(-36, -8.5);
            ctx.lineTo(-27, -8.5);
            ctx.stroke();

            // 3. SANTA CLAUS SITTING IN THE SLEIGH
            // Santa's plump red coat torso
            ctx.fillStyle = '#d62828';
            ctx.beginPath();
            ctx.ellipse(-18, -5.5, 6.2, 6.5, 0.08, 0, Math.PI * 2);
            ctx.fill();

            // White fur trim down the front of Santa's coat
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(-14.2, -10, 2.2, 8);

            // Black leather belt & golden buckle
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-23.5, -4.5, 11, 2);
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 0.9;
            ctx.strokeRect(-15.5, -4.8, 3, 2.6);

            // Santa's head
            ctx.beginPath();
            ctx.arc(-16.5, -14.8, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffcdb2';
            ctx.fill();

            // Rosy cheek & cheerful eye
            ctx.fillStyle = 'rgba(230, 57, 70, 0.55)';
            ctx.beginPath();
            ctx.arc(-14.5, -14.2, 1.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.arc(-14.6, -15.6, 0.8, 0, Math.PI * 2);
            ctx.fill();

            // Full fluffy white beard & mustache
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-14.2, -12.6, 2.6, 0, Math.PI * 2);
            ctx.arc(-16.4, -12.2, 2.5, 0, Math.PI * 2);
            ctx.arc(-14.6, -9.8, 2.7, 0, Math.PI * 2);
            ctx.arc(-12.7, -13.5, 1.5, 0, Math.PI * 2);

            // Cute button nose
            ctx.fillStyle = '#f28482';
            ctx.beginPath();
            ctx.arc(-12.1, -14.8, 1.1, 0, Math.PI * 2);
            ctx.fill();

            // Classic Red Santa Hat with white fur brim & pom-pom
            ctx.fillStyle = '#d62828';
            ctx.beginPath();
            ctx.moveTo(-21.2, -17.5);
            ctx.quadraticCurveTo(-18.5, -23.5, -12.5, -17.8);
            ctx.lineTo(-24.8, -21.2 + hatBob);
            ctx.closePath();
            ctx.fill();

            // White fluffy hat brim
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.roundRect(-21.6, -18.8, 9.8, 2.5, 1.2);
            ctx.fill();

            // White pom-pom at tip of Santa's hat
            ctx.beginPath();
            ctx.arc(-25.3, -21.2 + hatBob, 2.2, 0, Math.PI * 2);

            // Santa's front arm holding the reins
            ctx.strokeStyle = '#d62828';

            ctx.lineTo(-9.5, -6.5);

            ctx.arc(-10.2, -6.7, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#c1121f';
            ctx.beginPath();
            ctx.arc(-8.8, -6.4, 1.6, 0, Math.PI * 2);
            ctx.fill();

            // Santa's waving arm ("Ho! Ho! Ho!")
            const waveX = -22.5 + wavePhase * 1.8;
            const waveY = -15.8 - Math.abs(wavePhase) * 1.2;
            ctx.strokeStyle = '#d62828';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-19.5, -9.2);
            ctx.lineTo(waveX, waveY);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(waveX + 0.5, waveY + 0.8, 1.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#c1121f';
            ctx.beginPath();
            ctx.arc(waveX, waveY - 0.3, 1.6, 0, Math.PI * 2);
            ctx.fill();

            // 4. SLEIGH CARRIAGE BODY (drawn over Santa's lower half so he sits inside)
            const sleighGrad = ctx.createLinearGradient(-42, -9, -6, 7);
            sleighGrad.addColorStop(0, '#9e1b24');
            sleighGrad.addColorStop(0.5, '#d62828');
            sleighGrad.addColorStop(1, '#b5171e');

            ctx.beginPath();
            ctx.moveTo(-43, -8.5);
            ctx.quadraticCurveTo(-36, -8.5, -33, -2.5);
            ctx.lineTo(-14, -2.5);
            ctx.quadraticCurveTo(-9, -2.5, -5.5, -7.5);
            ctx.quadraticCurveTo(-4, -1, -8.5, 6.5);
            ctx.lineTo(-39.5, 6.5);
            ctx.quadraticCurveTo(-44.5, 2, -43, -8.5);
            ctx.closePath();
            ctx.fillStyle = sleighGrad;
            ctx.fill();

            // Gold trim along sleigh rim & base
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Decorative gold flourish on sleigh side
            ctx.strokeStyle = 'rgba(255, 209, 102, 0.7)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-34, 2);
            ctx.quadraticCurveTo(-24, -1, -13, 2);
            ctx.stroke();

            // 5. GOLDEN REINS & REINDEER TEAM (WITH RUDOLPH)
            const reindeerTeam = [
                { x: 16, y: -5.5, phase: 0.7, isFar: true, isRudolph: false },
                { x: 20, y: -2.2, phase: 0.0, isFar: false, isRudolph: false },
                { x: 40, y: -5.5, phase: 2.2, isFar: true, isRudolph: false },
                { x: 45, y: -2.2, phase: 1.5, isFar: false, isRudolph: true }
            ];

            // Golden reins from Santa's hand to the reindeer
            ctx.strokeStyle = 'rgba(255, 209, 102, 0.65)';
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.moveTo(-8.5, -6.4);
            ctx.quadraticCurveTo(5, -3, 20, -4.5);
            ctx.quadraticCurveTo(32, -3.5, 45, -4.5);
            ctx.stroke();

            for (const deer of reindeerTeam) {
                const stride = Math.sin(gallopPhase + deer.phase);
                const bounce = Math.cos(gallopPhase + deer.phase) * 1.1;
                const rx = deer.x;
                const ry = deer.y + bounce;

                ctx.save();
                ctx.translate(rx, ry);
                if (deer.isFar) {
                    ctx.scale(0.92, 0.92);
                }

                // Galloping legs
                ctx.strokeStyle = deer.isFar ? '#5c4033' : '#6d4c41';
                ctx.lineWidth = 1.3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                // Back legs
                ctx.moveTo(-3.5, 1.5);
                ctx.lineTo(-5.5 - stride * 2.5, 6.5);
                // Front legs
                ctx.moveTo(3.5, 1.5);
                ctx.lineTo(5.5 + stride * 2.5, 6.5);
                ctx.stroke();

                // Reindeer torso
                ctx.fillStyle = deer.isFar ? '#6d4c41' : '#8d6e63';
                ctx.beginPath();
                ctx.ellipse(0, 0, 5.5, 2.7, -0.08, 0, Math.PI * 2);
                ctx.fill();

                // Little white tail
                ctx.fillStyle = '#f8fafc';
                ctx.beginPath();
                ctx.arc(-5.6, -1.2, 1.1, 0, Math.PI * 2);
                ctx.fill();

                // Neck & Head
                ctx.fillStyle = deer.isFar ? '#6d4c41' : '#8d6e63';
                ctx.beginPath();
                ctx.moveTo(3.5, -0.5);
                ctx.lineTo(5.2, -4.5);
                ctx.lineTo(7.2, -3.5);
                ctx.lineTo(5.2, 1.0);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(6.8, -4.3, 2.7, 1.8, 0.15, 0, Math.PI * 2);
                ctx.fill();

                // Festive red harness & gold jingle bell
                ctx.strokeStyle = '#e63946';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(2.8, -2.5);
                ctx.lineTo(3.6, 2.2);
                ctx.stroke();

                ctx.fillStyle = '#ffd166';
                ctx.beginPath();
                ctx.arc(4.2, -1.2, 1.0, 0, Math.PI * 2);
                ctx.fill();

                // Branching antlers
                ctx.strokeStyle = '#d7ccc8';
                ctx.lineWidth = 0.9;
                ctx.beginPath();
                ctx.moveTo(5.6, -5.8);
                ctx.lineTo(4.6, -9.8);
                ctx.moveTo(5.1, -7.8);
                ctx.lineTo(6.6, -9.2);
                ctx.moveTo(6.5, -5.8);
                ctx.lineTo(7.2, -9.6);
                ctx.stroke();

                // Rudolph's glowing red nose vs. standard dark nose
                if (deer.isRudolph) {
                    const nosePulse = 0.75 + 0.25 * Math.sin(frameCount * 0.18);
                    const noseGlow = ctx.createRadialGradient(9.6, -4.1, 0.5, 9.6, -4.1, 6.5);
                    noseGlow.addColorStop(0, `rgba(255, 59, 48, ${0.85 * nosePulse})`);
                    noseGlow.addColorStop(1, 'rgba(255, 59, 48, 0)');
                    ctx.fillStyle = noseGlow;
                    ctx.beginPath();
                    ctx.arc(9.6, -4.1, 6.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ff2a2a';
                    ctx.beginPath();
                    ctx.arc(9.6, -4.1, 1.8, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#2b1d16';
                    ctx.beginPath();
                    ctx.arc(9.3, -4.1, 1.0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function drawHolidayFlyers() {
            for (const flyer of holidayFlyers) {
                // Draw warm golden stardust trail
                if (flyer.trail.length > 1) {
                    for (let t = 1; t < flyer.trail.length; t++) {
                        const alpha = (t / flyer.trail.length) * (flyer.type === 'sleigh' ? 0.48 : 0.35);
                        ctx.beginPath();
                        ctx.moveTo(flyer.trail[t - 1].x, flyer.trail[t - 1].y);
                        ctx.lineTo(flyer.trail[t].x, flyer.trail[t].y);
                        ctx.strokeStyle = `rgba(255, 209, 102, ${alpha})`;
                        ctx.lineWidth = flyer.type === 'sleigh' ? 1.8 : 1.2;
                        ctx.stroke();
                    }
                }

                ctx.save();
                ctx.translate(flyer.x, flyer.y);
                ctx.scale(flyer.dir * flyer.scale, flyer.scale);

                if (flyer.type === 'sleigh') {
                    drawSantaSleigh(flyer);

                } else if (flyer.type === 'comet_star') {
                    // Glowing Christmas Shooting Star
                    ctx.rotate(frameCount * 0.03);
                    ctx.beginPath();
                    for (let i = 0; i < 10; i++) {
                        const rad = i % 2 === 0 ? 7.5 : 3.2;
                        const ang = (i * Math.PI) / 5;
                        const sx = Math.cos(ang) * rad;
                        const sy = Math.sin(ang) * rad;
                        if (i === 0) ctx.moveTo(sx, sy);
                        else ctx.lineTo(sx, sy);
                    }
                    ctx.closePath();
                    ctx.fillStyle = '#ffd166';
                    ctx.fill();

                } else if (flyer.type === 'gift_paraglider') {
                    // Candy-striped parachute canopy
                    ctx.beginPath();
                    ctx.arc(0, -10, 10, Math.PI, 0);
                    ctx.strokeStyle = '#e63946';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Parachute strings
                    ctx.beginPath();
                    ctx.moveTo(-9, -10);
                    ctx.lineTo(-4, -1);
                    ctx.moveTo(9, -10);
                    ctx.lineTo(4, -1);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
                    ctx.lineWidth = 0.8;
                    ctx.stroke();

                    // Wrapped Christmas Gift Box
                    ctx.fillStyle = '#2d6a4f';
                    ctx.fillRect(-5, -1, 10, 9);
                    ctx.fillStyle = '#ffd166';
                    ctx.fillRect(-1, -1, 2, 9);
                    ctx.fillRect(-5, 2.5, 10, 2);
                }

                ctx.restore();
            }
        }

        function drawCentralOrnament() {
            const cx = centralNode.x;
            const cy = centralNode.y;
            const r = centralNode.radius;
            const pulse = 1 + Math.sin(frameCount * 0.06) * 0.08;

            // Warm golden-crimson holiday glow aura
            const aura = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r * 3.4 * pulse);
            aura.addColorStop(0, 'rgba(255, 209, 102, 0.45)');
            aura.addColorStop(0.5, 'rgba(230, 57, 70, 0.16)');
            aura.addColorStop(1, 'rgba(230, 57, 70, 0)');
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(cx, cy, r * 3.4 * pulse, 0, Math.PI * 2);
            ctx.fill();

            // Metallic gold ornament cap & hanging loop at top
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.arc(cx, cy - r - 4.5, 2.5, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#d4af37';
            ctx.fillRect(cx - 3.5, cy - r - 2.5, 7, 3.5);

            // Main Crimson & Gold Bauble Body
            const ballGrad = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, 1, cx, cy, r);
            ballGrad.addColorStop(0, '#ff758f');
            ballGrad.addColorStop(0.45, '#d62828');
            ballGrad.addColorStop(1, '#780000');

            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = ballGrad;
            ctx.fill();
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // Center 4-point Golden North Star emblem
            ctx.fillStyle = '#fff3b0';
            ctx.beginPath();
            ctx.moveTo(cx, cy - 5.5);
            ctx.lineTo(cx + 1.6, cy - 1.6);
            ctx.lineTo(cx + 5.5, cy);
            ctx.lineTo(cx + 1.6, cy + 1.6);
            ctx.lineTo(cx, cy + 5.5);
            ctx.lineTo(cx - 1.6, cy + 1.6);
            ctx.lineTo(cx - 5.5, cy);
            ctx.lineTo(cx - 1.6, cy - 1.6);
            ctx.closePath();
            ctx.fill();
        }

        function drawChristmasElf(elf) {
            const phase = elf.phaseOffset || 0;
            const isGrounded = Boolean(elf.isGrounded);
            const tilt = isGrounded ? 0 : Math.max(-0.35, Math.min(0.35, elf.vx * 0.05));
            const kick = isGrounded ? 0 : Math.sin(frameCount * 0.25 + phase) * 1.4;
            const tipSway = Math.sin(frameCount * 0.15 + phase) * 1.5;

            ctx.save();
            ctx.translate(elf.x, elf.y);
            if (isGrounded) {
                ctx.scale(0.88, 0.88);
            }
            ctx.rotate(tilt);

            // Soft festive aura around the elf
            const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 14);
            glow.addColorStop(0, 'rgba(255, 243, 176, 0.28)');
            glow.addColorStop(1, 'rgba(255, 243, 176, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.fill();

            // Little striped elf legs
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 2.1;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-2.2, 5.5);
            ctx.lineTo(-2.6, 9 + kick);
            ctx.moveTo(2.2, 5.5);
            ctx.lineTo(2.6, 9 - kick);
            ctx.stroke();

            // Curled pointy elf boots with tiny gold toe bells
            ctx.fillStyle = elf.theme.boots;
            ctx.beginPath();
            ctx.ellipse(-3.6, 9.5 + kick, 2.5, 1.4, -0.25, 0, Math.PI * 2);
            ctx.ellipse(3.6, 9.5 - kick, 2.5, 1.4, 0.25, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffd166';
            ctx.beginPath();
            ctx.arc(-5.6, 9.0 + kick, 0.9, 0, Math.PI * 2);
            ctx.arc(5.6, 9.0 - kick, 0.9, 0, Math.PI * 2);
            ctx.fill();

            // Festive elf tunic
            ctx.fillStyle = elf.theme.tunic;
            ctx.beginPath();
            ctx.moveTo(-3.6, 0.5);
            ctx.lineTo(3.6, 0.5);
            ctx.lineTo(5.0, 6.2);
            ctx.lineTo(-5.0, 6.2);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 0.7;
            ctx.stroke();

            // Waving arm for grounded elves
            if (isGrounded) {
                const wave = Math.sin(frameCount * 0.14 + phase) * 2.2;
                ctx.strokeStyle = elf.theme.tunic;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(3.8, 1.8);
                ctx.lineTo(7.4, -1.5 + wave);
                ctx.stroke();

                ctx.fillStyle = '#ffcdb2';
                ctx.beginPath();
                ctx.arc(7.6, -1.7 + wave, 1.2, 0, Math.PI * 2);
                ctx.fill();

                if (elf.holdingGift) {
                    ctx.fillStyle = '#e63946';
                    ctx.fillRect(-8.8, 1.5, 5.2, 5.2);
                    ctx.fillStyle = '#ffd166';
                    ctx.fillRect(-6.6, 1.5, 1.0, 5.2);
                    ctx.fillRect(-8.8, 3.6, 5.2, 1.0);
                }
            }

            // Jagged festive collar
            ctx.fillStyle = elf.theme.trim;
            ctx.beginPath();
            ctx.moveTo(-3.8, 0.5);
            ctx.lineTo(-2.0, 2.5);
            ctx.lineTo(0, 1.1);
            ctx.lineTo(2.0, 2.5);
            ctx.lineTo(3.8, 0.5);
            ctx.closePath();
            ctx.fill();

            // Tiny black belt & golden buckle
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-4.5, 3.6, 9.0, 1.4);
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 0.8;
            ctx.strokeRect(-1.4, 3.3, 2.8, 2.0);

            // Pointed elf ears
            ctx.fillStyle = '#ffcdb2';
            ctx.beginPath();
            ctx.moveTo(-4.2, -4.5);
            ctx.lineTo(-8.4, -6.2);
            ctx.lineTo(-4.4, -2.0);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(4.2, -4.5);
            ctx.lineTo(8.4, -6.2);
            ctx.lineTo(4.4, -2.0);
            ctx.closePath();
            ctx.fill();

            // Elf head
            ctx.beginPath();
            ctx.arc(0, -3.5, 4.7, 0, Math.PI * 2);
            ctx.fillStyle = '#ffcdb2';
            ctx.fill();
            ctx.strokeStyle = '#e5989b';
            ctx.lineWidth = 0.6;
            ctx.stroke();

            // Rosy cheeks
            ctx.fillStyle = 'rgba(230, 57, 70, 0.45)';
            ctx.beginPath();
            ctx.arc(-2.6, -2.3, 1.1, 0, Math.PI * 2);
            ctx.arc(2.6, -2.3, 1.1, 0, Math.PI * 2);
            ctx.fill();

            // Cheerful eyes
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.arc(-1.6, -3.7, 0.85, 0, Math.PI * 2);
            ctx.arc(1.6, -3.7, 0.85, 0, Math.PI * 2);
            ctx.fill();

            // Happy little smile
            ctx.strokeStyle = '#7f1d1d';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.arc(0, -2.5, 1.5, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();

            // Tall pointy elf hat
            ctx.fillStyle = elf.theme.hat;
            ctx.beginPath();
            ctx.moveTo(-5.2, -6.4);
            ctx.quadraticCurveTo(-1.5, -12.5, 3.6 + tipSway, -16.5);
            ctx.quadraticCurveTo(3.5, -11.0, 5.2, -6.4);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 0.7;
            ctx.stroke();

            // Hat brim trim
            ctx.fillStyle = elf.theme.trim;
            ctx.beginPath();
            ctx.roundRect(-5.5, -7.4, 11.0, 2.2, 1.1);
            ctx.fill();

            // Golden jingle bell at tip of the elf's hat
            ctx.fillStyle = '#ffd166';
            ctx.beginPath();
            ctx.arc(3.6 + tipSway, -16.5, 1.9, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function draw() {
            // Clear canvas with deep winter forest gradient
            const bgGrad = ctx.createRadialGradient(
                canvas.width * 0.5, canvas.height * 0.45, 20,
                canvas.width * 0.5, canvas.height * 0.5, Math.max(canvas.width, canvas.height) * 0.75
            );
            bgGrad.addColorStop(0, '#0d2b24');
            bgGrad.addColorStop(0.6, '#071714');
            bgGrad.addColorStop(1, '#030b0a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 0. Draw Festive Background Layer (Stars, Snow, Horizon, Trees & Elves, Landmarks, Santa's Sleigh & Flyers)
            drawStarsAndSnow();
            drawWinterHorizon();
            drawFestiveObjects();
            drawHolidayFlyers();

            // 1. Draw Central Gravity Ornament Node
            drawCentralOrnament();

            // 2. Draw All Orbiting Christmas Elves & Glowing Fairy-Light Trails
            for (const elf of elves) {
                // Draw smooth golden-tinted ribbon trail
                if (elf.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(elf.trail[0].x, elf.trail[0].y);
                    for (let t = 1; t < elf.trail.length; t++) {
                        ctx.lineTo(elf.trail[t].x, elf.trail[t].y);
                    }
                    ctx.strokeStyle = elf.theme.trail;
                    ctx.lineWidth = 1.4;
                    ctx.stroke();

                    // Draw twinkling Christmas fairy-light bulbs along the orbit path
                    for (let t = 6; t < elf.trail.length; t += 14) {
                        const pt = elf.trail[t];
                        const bulbColor = FAIRY_LIGHT_COLORS[(t / 14 | 0) % FAIRY_LIGHT_COLORS.length];
                        const fade = t / elf.trail.length;
                        ctx.save();
                        ctx.globalAlpha = 0.35 + fade * 0.65;
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, 2.1, 0, Math.PI * 2);
                        ctx.fillStyle = bulbColor;
                        ctx.fill();
                        ctx.restore();
                    }
                }

                // Draw the orbiting Christmas elf
                drawChristmasElf(elf);
            }

            // 3. Draw Festive Sparkle Bursts
            for (const sp of sparkles) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, sp.life);
                ctx.fillStyle = sp.color;
                ctx.beginPath();
                ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function animate() {
            updateBackground();
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
