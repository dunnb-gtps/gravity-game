<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Baseline - Spider-Man</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <button class="btn-reset" onclick="resetSimulation()">Reset</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas for an alien spaceship to shoot Spider-Man into orbit.
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Offscreen cache canvas for the static galaxy nebula & deep starfield
        const bgCanvas = document.createElement('canvas');
        const bgCtx = bgCanvas.getContext('2d');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;         // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center

        // STATE VARIABLES
        let balls = [];
        let twinklingStars = [];
        let backgroundMeteors = [];
        let alienShip = null;
        let launchParticles = [];
        let shockwaves = [];
        let lastTimestamp = performance.now();

        // Realistic stellar color tints (pure white, blue-white, pale gold, soft rose)
        const STAR_COLORS = [
            { r: 255, g: 255, b: 255 }, // Pure white
            { r: 255, g: 255, b: 255 }, // Pure white (higher frequency)
            { r: 196, g: 222, b: 255 }, // Blue-white
            { r: 168, g: 205, b: 255 }, // Hot blue-white
            { r: 255, g: 242, b: 204 }, // Pale gold
            { r: 255, g: 224, b: 166 }, // Warm gold
            { r: 255, g: 208, b: 220 }  // Soft rose
        ];

        // Rocky mineral palettes for background meteors
        const METEOR_PALETTES = [
            { light: '#9aa5b4', mid: '#52606d', dark: '#1f2933', glow: 'rgba(154, 165, 180, 0.14)' }, // Cool iron-nickel
            { light: '#a39589', mid: '#5c5046', dark: '#241e1a', glow: 'rgba(184, 156, 130, 0.13)' }, // Warm silicate rock
            { light: '#8c96a8', mid: '#475166', dark: '#1a202c', glow: 'rgba(130, 160, 210, 0.14)' }, // Cosmic slate
            { light: '#9c8f96', mid: '#544950', dark: '#211b1f', glow: 'rgba(176, 142, 165, 0.12)' }  // Dusty carbonaceous
        ];

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 12
        };

        /**
         * Creates a single procedural background meteor with craggy vertices and craters.
         */
        function createBackgroundMeteor(w, h) {
            // Depth factor (0.35 = distant & small, 1.0 = closer & larger)
            const depth = 0.35 + Math.random() * 0.65;
            const radius = 4 + depth * 11;

            // Gentle floating drift velocity (px/sec)
            const speed = 10 + depth * 26;
            const driftAngle = Math.random() * Math.PI * 2;
            const vx = Math.cos(driftAngle) * speed;
            const vy = Math.sin(driftAngle) * speed;

            // Irregular craggy polygon outline (9 to 13 vertices)
            const vertexCount = 9 + Math.floor(Math.random() * 5);
            const vertices = [];
            for (let i = 0; i < vertexCount; i++) {
                const angle = (i / vertexCount) * Math.PI * 2;
                const radialScale = 0.74 + Math.random() * 0.34;
                vertices.push({ angle, scale: radialScale });
            }

            // Surface craters
            const craterCount = depth > 0.6 ? (2 + Math.floor(Math.random() * 3)) : 1;
            const craters = [];
            for (let i = 0; i < craterCount; i++) {
                const cAngle = Math.random() * Math.PI * 2;
                const cDist = Math.random() * radius * 0.48;
                craters.push({
                    x: Math.cos(cAngle) * cDist,
                    y: Math.sin(cAngle) * cDist,
                    r: radius * (0.14 + Math.random() * 0.16)
                });
            }

            return {
                x: Math.random() * w,
                y: Math.random() * h,
                vx,
                vy,
                radius,
                depth,
                alpha: 0.38 + depth * 0.44,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * (0.35 + depth * 0.55),
                vertices,
                craters,
                palette: METEOR_PALETTES[Math.floor(Math.random() * METEOR_PALETTES.length)],
                tailLength: radius * (1.8 + depth * 2.2)
            };
        }

        /**
         * Initializes the floating background meteor field scaled to viewport size.
         */
        function initBackgroundMeteors() {
            const w = canvas.width;
            const h = canvas.height;
            if (w <= 0 || h <= 0) return;

            const targetCount = Math.max(12, Math.min(22, Math.floor((w * h) / 42000)));
            backgroundMeteors = [];
            for (let i = 0; i < targetCount; i++) {
                backgroundMeteors.push(createBackgroundMeteor(w, h));
            }
            // Sort by depth so smaller distant meteors render behind larger closer ones
            backgroundMeteors.sort((a, b) => a.depth - b.depth);
        }

        /**
         * Updates background meteor drift, rotation, and seamless edge wrapping.
         */
        function updateBackgroundMeteors(dt) {
            const w = canvas.width;
            const h = canvas.height;
            if (w <= 0 || h <= 0) return;

            for (let i = 0; i < backgroundMeteors.length; i++) {
                const m = backgroundMeteors[i];
                m.x += m.vx * dt;
                m.y += m.vy * dt;
                m.rotation += m.rotSpeed * dt;

                const wrapMargin = m.radius * 2 + m.tailLength;
                if (m.x < -wrapMargin) m.x = w + wrapMargin;
                else if (m.x > w + wrapMargin) m.x = -wrapMargin;

                if (m.y < -wrapMargin) m.y = h + wrapMargin;
                else if (m.y > h + wrapMargin) m.y = -wrapMargin;
            }
        }

        /**
         * Renders floating meteors in the background layer with subtle cosmic wakes,
         * 3D directional lighting, and surface craters.
         */
        function drawBackgroundMeteors() {
            for (let i = 0; i < backgroundMeteors.length; i++) {
                const m = backgroundMeteors[i];
                const r = m.radius;

                ctx.save();
                ctx.globalAlpha = m.alpha;

                // 1. Subtle cosmic dust wake trailing opposite the drift direction
                const moveAngle = Math.atan2(m.vy, m.vx);
                const tailEndX = m.x - Math.cos(moveAngle) * m.tailLength;
                const tailEndY = m.y - Math.sin(moveAngle) * m.tailLength;
                const perpX = -Math.sin(moveAngle) * (r * 0.55);
                const perpY = Math.cos(moveAngle) * (r * 0.55);

                const wakeGrad = ctx.createLinearGradient(m.x, m.y, tailEndX, tailEndY);
                wakeGrad.addColorStop(0.0, m.palette.glow);
                wakeGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = wakeGrad;
                ctx.beginPath();
                ctx.moveTo(m.x + perpX, m.y + perpY);
                ctx.lineTo(tailEndX, tailEndY);
                ctx.lineTo(m.x - perpX, m.y - perpY);
                ctx.closePath();
                ctx.fill();

                // 2. Rotating craggy meteor body
                ctx.translate(m.x, m.y);
                ctx.rotate(m.rotation);

                ctx.beginPath();
                for (let v = 0; v < m.vertices.length; v++) {
                    const vert = m.vertices[v];
                    const vx = Math.cos(vert.angle) * r * vert.scale;
                    const vy = Math.sin(vert.angle) * r * vert.scale;
                    if (v === 0) ctx.moveTo(vx, vy);
                    else ctx.lineTo(vx, vy);
                }
                ctx.closePath();

                // Directional 3D rocky shading
                const rockGrad = ctx.createRadialGradient(-r * 0.32, -r * 0.32, r * 0.1, 0, 0, r * 1.15);
                rockGrad.addColorStop(0.0, m.palette.light);
                rockGrad.addColorStop(0.55, m.palette.mid);
                rockGrad.addColorStop(1.0, m.palette.dark);
                ctx.fillStyle = rockGrad;
                ctx.fill();

                // Clip craters cleanly inside the meteor silhouette
                ctx.save();
                ctx.clip();
                for (let c = 0; c < m.craters.length; c++) {
                    const crater = m.craters[c];
                    ctx.fillStyle = 'rgba(10, 12, 18, 0.42)';
                    ctx.beginPath();
                    ctx.arc(crater.x, crater.y, crater.r, 0, Math.PI * 2);
                    ctx.fill();

                    // Subtle lit crater rim
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
                    ctx.lineWidth = 0.7;
                    ctx.beginPath();
                    ctx.arc(crater.x, crater.y, crater.r, -0.3, Math.PI * 0.85);
                    ctx.stroke();
                }
                ctx.restore();

                // Faint starlight rim outline
                ctx.strokeStyle = `rgba(210, 224, 245, ${(0.18 * m.depth).toFixed(3)})`;
                ctx.lineWidth = 0.85;
                ctx.stroke();

                ctx.restore();
            }
        }

        /**
         * Builds the layered deep-space galaxy background onto an offscreen canvas
         * and populates the animated twinkling star layer for smooth 60fps rendering.
         */
        function generateGalaxyBackground() {
            const w = canvas.width;
            const h = canvas.height;
            if (w <= 0 || h <= 0) return;

            bgCanvas.width = w;
            bgCanvas.height = h;

            const diag = Math.hypot(w, h);
            const cx = w * 0.5;
            const cy = h * 0.5;

            // 1. Deep space base gradient (midnight black -> deep indigo -> dark cosmic blue)
            const baseGrad = bgCtx.createLinearGradient(0, 0, w, h);
            baseGrad.addColorStop(0.0, '#020208');
            baseGrad.addColorStop(0.35, '#09071d');
            baseGrad.addColorStop(0.68, '#050d1f');
            baseGrad.addColorStop(1.0, '#020208');
            bgCtx.fillStyle = baseGrad;
            bgCtx.fillRect(0, 0, w, h);

            // Subtle outer edge vignette to keep deep space corners rich and dark
            const vignette = bgCtx.createRadialGradient(cx, cy, diag * 0.18, cx, cy, diag * 0.65);
            vignette.addColorStop(0, 'rgba(9, 7, 29, 0)');
            vignette.addColorStop(1, 'rgba(2, 2, 8, 0.65)');
            bgCtx.fillStyle = vignette;
            bgCtx.fillRect(0, 0, w, h);

            // 2. Tilted Milky Way / Spiral Galaxy Formation
            bgCtx.save();
            bgCtx.translate(cx, cy);
            const galaxyTilt = -0.48; // Tilted diagonally from bottom-left to top-right
            bgCtx.rotate(galaxyTilt);

            // Broad outer galactic halo (elliptical perspective)
            bgCtx.save();
            bgCtx.scale(1, 0.34);
            const outerHalo = bgCtx.createRadialGradient(0, 0, 10, 0, 0, diag * 0.56);
            outerHalo.addColorStop(0.0, 'rgba(92, 46, 158, 0.24)');
            outerHalo.addColorStop(0.35, 'rgba(42, 34, 118, 0.18)');
            outerHalo.addColorStop(0.7, 'rgba(14, 38, 86, 0.10)');
            outerHalo.addColorStop(1.0, 'rgba(2, 2, 8, 0)');
            bgCtx.fillStyle = outerHalo;
            bgCtx.beginPath();
            bgCtx.arc(0, 0, diag * 0.56, 0, Math.PI * 2);
            bgCtx.fill();
            bgCtx.restore();

            // Additive nebula clouds along spiral arms & galactic disk
            bgCtx.globalCompositeOperation = 'screen';

            const nebulaClouds = [
                // Deep violet & cosmic magenta outer/mid arm clouds
                { x: -diag * 0.26, y: -18, rx: diag * 0.22, ry: diag * 0.08, color: 'rgba(104, 42, 178, 0.15)' },
                { x:  diag * 0.25, y:  20, rx: diag * 0.23, ry: diag * 0.085, color: 'rgba(112, 45, 185, 0.15)' },
                { x: -diag * 0.14, y:  24, rx: diag * 0.17, ry: diag * 0.065, color: 'rgba(182, 48, 128, 0.13)' },
                { x:  diag * 0.15, y: -22, rx: diag * 0.18, ry: diag * 0.068, color: 'rgba(188, 52, 134, 0.13)' },
                // Teal / cyan ionized star-forming pockets
                { x: -diag * 0.21, y:  10, rx: diag * 0.14, ry: diag * 0.052, color: 'rgba(26, 152, 188, 0.12)' },
                { x:  diag * 0.20, y: -12, rx: diag * 0.15, ry: diag * 0.055, color: 'rgba(32, 165, 196, 0.12)' },
                { x: -diag * 0.07, y: -14, rx: diag * 0.12, ry: diag * 0.048, color: 'rgba(45, 145, 185, 0.10)' },
                { x:  diag * 0.08, y:  14, rx: diag * 0.12, ry: diag * 0.048, color: 'rgba(45, 145, 185, 0.10)' }
            ];

            for (const cloud of nebulaClouds) {
                bgCtx.save();
                bgCtx.translate(cloud.x, cloud.y);
                bgCtx.scale(1, cloud.ry / cloud.rx);
                const g = bgCtx.createRadialGradient(0, 0, 0, 0, 0, cloud.rx);
                g.addColorStop(0.0, cloud.color);
                g.addColorStop(0.55, cloud.color.replace(/[\d.]+\)$/, '0.05)'));
                g.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
                bgCtx.fillStyle = g;
                bgCtx.beginPath();
                bgCtx.arc(0, 0, cloud.rx, 0, Math.PI * 2);
                bgCtx.fill();
                bgCtx.restore();
            }

            // Warm golden-amber galactic core glow (balanced so white central node stays crisp)
            bgCtx.save();
            bgCtx.scale(1, 0.42);
            const coreGrad = bgCtx.createRadialGradient(0, 0, 6, 0, 0, diag * 0.20);
            coreGrad.addColorStop(0.0, 'rgba(255, 206, 128, 0.20)');
            coreGrad.addColorStop(0.32, 'rgba(235, 142, 74, 0.14)');
            coreGrad.addColorStop(0.68, 'rgba(155, 62, 128, 0.07)');
            coreGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
            bgCtx.fillStyle = coreGrad;
            bgCtx.beginPath();
            bgCtx.arc(0, 0, diag * 0.20, 0, Math.PI * 2);
            bgCtx.fill();
            bgCtx.restore();

            // Unresolved powdery star-dust mist concentrated along spiral arms & galactic plane
            const dustCount = Math.min(900, Math.floor((w * h) / 750));
            for (let i = 0; i < dustCount; i++) {
                const u1 = Math.random() || 0.0001;
                const u2 = Math.random();
                const gauss = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);

                const alongDisk = (Math.random() - 0.5) * diag * 0.95;
                const spiralWave = Math.sin((alongDisk / (diag * 0.22)) * Math.PI) * 16;
                const perpDisk = gauss * (diag * 0.036) + spiralWave;

                const tint = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
                const alpha = 0.10 + Math.random() * 0.26;
                const size = 0.45 + Math.random() * 0.85;

                bgCtx.fillStyle = `rgba(${tint.r}, ${tint.g}, ${tint.b}, ${alpha.toFixed(3)})`;
                bgCtx.beginPath();
                bgCtx.arc(alongDisk, perpDisk, size, 0, Math.PI * 2);
                bgCtx.fill();
            }

            // Subtle dark cosmic dust lanes carving depth across the galactic plane
            bgCtx.globalCompositeOperation = 'source-over';
            const dustLanes = [
                { x: -diag * 0.16, y: -4, rx: diag * 0.16, ry: 7, rot: 0.06, alpha: 0.36 },
                { x:  diag * 0.04, y:  5, rx: diag * 0.15, ry: 6, rot: -0.05, alpha: 0.34 },
                { x:  diag * 0.20, y: -3, rx: diag * 0.14, ry: 6, rot: 0.04, alpha: 0.32 },
                { x: -diag * 0.04, y: -7, rx: diag * 0.11, ry: 4.5, rot: -0.03, alpha: 0.28 }
            ];

            for (const lane of dustLanes) {
                bgCtx.save();
                bgCtx.translate(lane.x, lane.y);
                bgCtx.rotate(lane.rot);
                bgCtx.scale(1, lane.ry / lane.rx);
                const dGrad = bgCtx.createRadialGradient(0, 0, 0, 0, 0, lane.rx);
                dGrad.addColorStop(0.0, `rgba(3, 3, 10, ${lane.alpha})`);
                dGrad.addColorStop(0.65, `rgba(4, 4, 14, ${lane.alpha * 0.45})`);
                dGrad.addColorStop(1.0, 'rgba(4, 4, 14, 0)');
                bgCtx.fillStyle = dGrad;
                bgCtx.beginPath();
                bgCtx.arc(0, 0, lane.rx, 0, Math.PI * 2);
                bgCtx.fill();
                bgCtx.restore();
            }

            bgCtx.restore(); // Restore galactic coordinate transform

            // 3. Multi-layered background starfield (baked onto offscreen canvas)
            const staticStarCount = Math.max(260, Math.min(620, Math.floor((w * h) / 1450)));
            for (let i = 0; i < staticStarCount; i++) {
                const sx = Math.random() * w;
                const sy = Math.random() * h;
                const radius = 0.4 + Math.pow(Math.random(), 2.4) * 1.35;
                const alpha = 0.25 + Math.random() * 0.65;
                const c = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];

                bgCtx.fillStyle = `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha.toFixed(3)})`;
                bgCtx.beginPath();
                bgCtx.arc(sx, sy, radius, 0, Math.PI * 2);
                bgCtx.fill();
            }

            // 4. Populate live twinkling stars & brighter diffraction-spike stars
            twinklingStars = [];
            const twinkleCount = Math.max(95, Math.min(165, Math.floor((w * h) / 5200)));
            const spikeStarCount = Math.max(10, Math.min(18, Math.floor(twinkleCount * 0.11)));

            for (let i = 0; i < twinkleCount; i++) {
                const isSpikeStar = i < spikeStarCount;
                const c = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];

                twinklingStars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    radius: isSpikeStar ? (1.4 + Math.random() * 0.8) : (0.75 + Math.random() * 0.95),
                    baseAlpha: isSpikeStar ? (0.72 + Math.random() * 0.22) : (0.45 + Math.random() * 0.42),
                    twinkleAmp: isSpikeStar ? 0.22 : (0.20 + Math.random() * 0.25),
                    speed: 0.0012 + Math.random() * 0.0026,
                    phase: Math.random() * Math.PI * 2,
                    color: c,
                    hasSpikes: isSpikeStar,
                    spikeLength: isSpikeStar ? (9 + Math.random() * 9) : 0
                });
            }
        }

        /**
         * Renders the cached galaxy backdrop and real-time twinkling stars onto the main canvas.
         */
        function drawGalaxyBackground(time) {
            ctx.drawImage(bgCanvas, 0, 0);

            for (let i = 0; i < twinklingStars.length; i++) {
                const s = twinklingStars[i];
                const wave = Math.sin(time * s.speed + s.phase);
                const alpha = Math.max(0.12, Math.min(0.95, s.baseAlpha + wave * s.twinkleAmp));
                const { r, g, b } = s.color;

                if (s.hasSpikes) {
                    // Soft stellar halo
                    const haloRadius = s.radius * 4.5;
                    const halo = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, haloRadius);
                    halo.addColorStop(0.0, `rgba(${r}, ${g}, ${b}, ${(alpha * 0.55).toFixed(3)})`);
                    halo.addColorStop(0.45, `rgba(${r}, ${g}, ${b}, ${(alpha * 0.16).toFixed(3)})`);
                    halo.addColorStop(1.0, `rgba(${r}, ${g}, ${b}, 0)`);
                    ctx.fillStyle = halo;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, haloRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // Delicate 4-point diffraction spikes
                    const len = s.spikeLength * (0.9 + wave * 0.12);
                    ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${(alpha * 0.65).toFixed(3)})`;
                    ctx.lineWidth = 0.85;
                    ctx.beginPath();
                    ctx.moveTo(s.x - len, s.y);
                    ctx.lineTo(s.x + len, s.y);
                    ctx.moveTo(s.x, s.y - len);
                    ctx.lineTo(s.x, s.y + len);
                    ctx.stroke();
                }

                // Crisp star core
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha.toFixed(3)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            // Regenerate cached galaxy and starfield for new dimensions
            generateGalaxyBackground();

            // Initialize or adjust floating background meteors
            if (backgroundMeteors.length === 0) {
                initBackgroundMeteors();
            } else {
                for (const m of backgroundMeteors) {
                    m.x = Math.min(canvas.width, Math.max(0, m.x));
                    m.y = Math.min(canvas.height, Math.max(0, m.y));
                }
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Canvas Click Handler: Spawn alien spaceship to shoot Spider-Man from click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchBall(clickX, clickY);
        });

        /**
         * Spawns the alien spaceship aligned so its plasma launcher cannon shoots
         * Spider-Man directly from (x, y), along with muzzle blast & spark effects.
         */
        function spawnAlienShooter(muzzleX, muzzleY, launchAngleRad) {
            // Cannon muzzle offset relative to spaceship center (in local unrotated coords)
            const cannonMuzzleOffsetX = 56;
            const cannonMuzzleOffsetY = 5;

            const shipX = muzzleX - cannonMuzzleOffsetX;
            const shipY = muzzleY - cannonMuzzleOffsetY;

            alienShip = {
                x: shipX,
                y: shipY,
                baseX: shipX,
                baseY: shipY,
                vx: 0,
                vy: 0,
                angle: launchAngleRad - Math.PI / 2, // 0 rad when shooting right (90°)
                recoil: 15,                          // Immediate kickback on shot
                pitchRecoil: -0.14,                  // Slight nose-up kick on blast
                age: 0,
                hoverDuration: 1.35,                 // Seconds hovering after shot
                departDuration: 0.85,                // Seconds zooming away
                alpha: 1,
                muzzleGlow: 1.0,
                bobPhase: Math.random() * Math.PI * 2
            };

            // Expanding plasma shockwave ring at cannon muzzle
            shockwaves.push({
                x: muzzleX,
                y: muzzleY,
                radius: 6,
                maxRadius: 46,
                alpha: 0.95
            });

            // Burst of neon alien energy sparks & plasma particles from the cannon
            const sparkColors = ['#5eff7a', '#00f5d4', '#b8ff66', '#ffffff', '#70e4ff'];
            for (let i = 0; i < 24; i++) {
                const spread = (Math.random() - 0.5) * 1.15;
                const dir = (launchAngleRad - Math.PI / 2) + spread;
                const speed = 2.2 + Math.random() * 6.5;
                launchParticles.push({
                    x: muzzleX + (Math.random() - 0.5) * 4,
                    y: muzzleY + (Math.random() - 0.5) * 6,
                    vx: Math.cos(dir) * speed,
                    vy: Math.sin(dir) * speed,
                    size: 1.4 + Math.random() * 2.6,
                    alpha: 1.0,
                    decay: 0.022 + Math.random() * 0.025,
                    color: sparkColors[Math.floor(Math.random() * sparkColors.length)]
                });
            }
        }

        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Position the alien spaceship so its cannon fires the ball right out of its barrel
            spawnAlienShooter(x, y, rad);

            // Overwrite existing array to strictly maintain a single Spider-Man ball on screen
            balls = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 15,
                trail: [] // Stores history of past {x, y} coordinates
            }];
        }

        function resetSimulation() {
            balls = [];
            alienShip = null;
            launchParticles = [];
            shockwaves = [];
        }

        function updateAlienAndEffects(dt) {
            // Update alien spaceship recoil, hover, and departure flight
            if (alienShip) {
                alienShip.age += dt;

                // Damped spring recovery from cannon recoil
                alienShip.recoil *= Math.pow(0.06, dt);
                alienShip.pitchRecoil *= Math.pow(0.05, dt);
                alienShip.muzzleGlow = Math.max(0, alienShip.muzzleGlow - dt * 2.4);

                if (alienShip.age <= alienShip.hoverDuration) {
                    // Gentle anti-gravity hover after firing
                    const bobY = Math.sin(alienShip.age * 5.2 + alienShip.bobPhase) * 3.5;
                    alienShip.x = alienShip.baseX - alienShip.recoil;
                    alienShip.y = alienShip.baseY + bobY;
                } else {
                    // Smooth thruster fly-away upward and backward into deep space
                    const departT = (alienShip.age - alienShip.hoverDuration) / alienShip.departDuration;
                    alienShip.vx -= 420 * dt;
                    alienShip.vy -= 260 * dt;
                    alienShip.x += alienShip.vx * dt;
                    alienShip.y += alienShip.vy * dt;
                    alienShip.pitchRecoil = Math.max(-0.32, alienShip.pitchRecoil - 0.35 * dt);
                    alienShip.alpha = Math.max(0, 1 - Math.pow(departT, 1.4));

                    // Thruster trail sparks during departure
                    if (Math.random() < 0.75) {
                        launchParticles.push({
                            x: alienShip.x - 10 + (Math.random() - 0.5) * 14,
                            y: alienShip.y + 16,
                            vx: (Math.random() - 0.5) * 1.4,
                            vy: 1.8 + Math.random() * 2.2,
                            size: 1.5 + Math.random() * 2.0,
                            alpha: 0.75 * alienShip.alpha,
                            decay: 0.035,
                            color: '#38f9d7'
                        });
                    }

                    if (departT >= 1) {
                        alienShip = null;
                    }
                }
            }

            // Update plasma shockwaves
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.radius += (sw.maxRadius - sw.radius) * 0.22;
                sw.alpha -= 0.055;
                if (sw.alpha <= 0.02) {
                    shockwaves.splice(i, 1);
                }
            }

            // Update launch spark particles
            for (let i = launchParticles.length - 1; i >= 0; i--) {
                const p = launchParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.96;
                p.vy *= 0.96;
                p.alpha -= p.decay;
                if (p.alpha <= 0.02) {
                    launchParticles.splice(i, 1);
                }
            }
        }

        function updatePhysics() {
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove ball if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    balls.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }
        }

        /**

         * with a side-mounted plasma launcher cannon firing the ball.
         */
        function drawAlienSpaceship(time) {
            if (!alienShip) return;

                flashGrad.addColorStop(0.35, `rgba(94, 255, 130, ${alienShip.muzzleGlow * 0.85})`);
                flashGrad.addColorStop(1.0, 'rgba(0, 245, 212, 0)');

            }

            // 3. Alien Pilot (drawn before glass dome so it sits visibly inside the cockpit)
            ctx.save();
            // Subtle recoil lean for the alien pilot
            const alienLean = Math.min(0.22, alienShip.recoil * 0.015);
            ctx.translate(0, -7);

            // Alien shoulders / flight suit
            ctx.fillStyle = '#2563eb';
            ctx.beginPath();

            // Glowing cockpit firing console & alien hands pressing the trigger button
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(6, 1, 9, 5);

            ctx.strokeStyle = '#38d958';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(-4, -12);

            ctx.bezierCurveTo(11, -11, 9, 1, 0, 2);
            ctx.closePath();
            ctx.fill();

            // Large glossy black alien eyes (looking right toward Spider-Man!)
            ctx.fillStyle = '#07090f';

            ctx.beginPath();

            ctx.fill();
            // Right eye
            ctx.beginPath();
            ctx.ellipse(4.4, -5.8, 2.9, 4.0, 0.25, 0, Math.PI * 2);

            // Crisp eye catchlights

            ctx.beginPath();

            // Excited alien expression ("O" right after firing, grin afterward)

            // Curved glass specular highlight streak

            ctx.lineCap = 'round';
            ctx.beginPath();

            // 5. Main Metallic UFO Saucer Hull
            const hullGrad = ctx.createLinearGradient(0, -7, 0, 14);
            hullGrad.addColorStop(0.0, '#cbd5e1');
            hullGrad.addColorStop(0.32, '#f8fafc');
            hullGrad.addColorStop(0.55, '#64748b');
            hullGrad.addColorStop(0.85, '#334155');

            ctx.fillStyle = hullGrad;
            ctx.beginPath();
            ctx.ellipse(0, 3, 38, 11, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1.4;
            ctx.stroke();

            // Metallic upper collar ring around cockpit base
            ctx.fillStyle = '#475569';
            ctx.beginPath();
            ctx.ellipse(0, -4, 22, 4.2, 0, 0, Math.PI * 2);

            // Pulsing perimeter UFO lights along the saucer rim

        /**
         * Renders muzzle shockwaves and glowing plasma launch sparks.
         */
        function drawLaunchEffects() {
            // Shockwave rings
            for (const sw of shockwaves) {
                ctx.save();
                ctx.translate(sw.x, sw.y);
                ctx.strokeStyle = `rgba(110, 255, 165, ${sw.alpha.toFixed(3)})`;
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.ellipse(0, 0, sw.radius * 0.38, sw.radius, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // Glowing plasma sparks
            for (const p of launchParticles) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        /**
         * Helper to trace a single Spider-Man eye lens path (dir = -1 for left, +1 for right).
         */
        function traceSpiderEyePath(r, dir, scale = 1) {
            const cx = dir * 0.45 * r;
            const cy = 0.04 * r;
            const sx = (x) => cx + (dir * x * r - cx) * scale;
            const sy = (y) => cy + (y * r - cy) * scale;

            ctx.beginPath();
            // Inner corner near nose bridge
            ctx.moveTo(sx(0.14), sy(0.14));
            // Upper brow sweep to sharp temple tip
            ctx.quadraticCurveTo(sx(0.42), sy(-0.02), sx(0.74), sy(-0.34));
            // Outer cheek curve
            ctx.quadraticCurveTo(sx(0.78), sy(0.16), sx(0.42), sy(0.26));
            // Lower lid return to inner corner
            ctx.quadraticCurveTo(sx(0.24), sy(0.26), sx(0.14), sy(0.14));
            ctx.closePath();
        }

        /**
         * Renders the ball as Spider-Man's iconic masked head with 3D spherical shading,
         * radiating web lines, scalloped web rings, and bold white-and-black lenses.
         */
        function drawSpiderManBall(b) {
            const r = b.radius;

            ctx.save();
            ctx.translate(b.x, b.y);

            // Subtle dynamic swing tilt based on vertical velocity
            const tilt = Math.max(-0.35, Math.min(0.35, b.vy * 0.035));
            ctx.rotate(tilt);

            // Soft crimson rim glow so Spider-Man pops against deep space
            ctx.save();
            ctx.shadowColor = 'rgba(255, 45, 55, 0.55)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = '#d9161e';
            ctx.fill();
            ctx.restore();

            // Clip everything inside the spherical mask silhouette
            ctx.save();
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.clip();

            // 1. 3D Spherical Spider-Man Crimson Base Gradient
            const maskGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r * 1.15);
            maskGrad.addColorStop(0.0, '#ff4d54');
            maskGrad.addColorStop(0.45, '#d9161e');
            maskGrad.addColorStop(0.85, '#990b11');
            maskGrad.addColorStop(1.0, '#590408');
            ctx.fillStyle = maskGrad;
            ctx.fillRect(-r, -r, r * 2, r * 2);

            // 2. Webbing Pattern (radiating from bridge of nose)
            const webOriginX = 0;
            const webOriginY = r * 0.08;
            const spokeAngles = [
                -Math.PI / 2,        // Top center
                -Math.PI * 0.25,     // Upper right
                -Math.PI * 0.05,     // Right temple
                 Math.PI * 0.22,     // Lower right
                 Math.PI / 2,        // Bottom chin
                 Math.PI * 0.78,     // Lower left
                 Math.PI * 1.05,     // Left temple
                -Math.PI * 0.75      // Upper left
            ];

            ctx.strokeStyle = 'rgba(18, 12, 14, 0.78)';
            ctx.lineWidth = Math.max(0.85, r * 0.06);

            // Radial web spokes
            for (const angle of spokeAngles) {
                ctx.beginPath();
                ctx.moveTo(webOriginX, webOriginY);
                ctx.lineTo(
                    webOriginX + Math.cos(angle) * r * 1.35,
                    webOriginY + Math.sin(angle) * r * 1.35
                );
                ctx.stroke();
            }

            // Concentric scalloped web arcs between spokes
            const ringRadii = [r * 0.38, r * 0.68, r * 0.98];
            for (const ringR of ringRadii) {
                ctx.beginPath();
                for (let i = 0; i < spokeAngles.length; i++) {
                    const a1 = spokeAngles[i];
                    const a2 = spokeAngles[(i + 1) % spokeAngles.length];

                    const x1 = webOriginX + Math.cos(a1) * ringR;
                    const y1 = webOriginY + Math.sin(a1) * ringR;
                    const x2 = webOriginX + Math.cos(a2) * ringR;
                    const y2 = webOriginY + Math.sin(a2) * ringR;

                    // Midpoint pulled slightly inward toward origin for authentic web sag
                    let midAngle = (a1 + a2) / 2;
                    if (Math.abs(a2 - a1) > Math.PI) {
                        midAngle += Math.PI;
                    }
                    const sagR = ringR * 0.84;
                    const cx = webOriginX + Math.cos(midAngle) * sagR;
                    const cy = webOriginY + Math.sin(midAngle) * sagR;

                    if (i === 0) {
                        ctx.moveTo(x1, y1);
                    }
                    ctx.quadraticCurveTo(cx, cy, x2, y2);
                }
                ctx.stroke();
            }

            ctx.restore(); // End circular mask clip

            // Crisp dark outer edge stroke
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.strokeStyle = '#180507';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // 3. Iconic Spider-Man Eyes (Left & Right)
            for (const dir of [-1, 1]) {
                // Thick black outer lens frame
                traceSpiderEyePath(r, dir, 1.0);
                ctx.fillStyle = '#0c0c0f';
                ctx.fill();

                // Bright white inner lens
                traceSpiderEyePath(r, dir, 0.72);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                // Subtle cool highlight glint inside lens
                ctx.fillStyle = 'rgba(200, 230, 255, 0.55)';
                ctx.beginPath();
                ctx.arc(dir * 0.48 * r, -0.04 * r, r * 0.055, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function draw(timestamp = performance.now()) {
            // Render galaxy & twinkling starfield background
            drawGalaxyBackground(timestamp);

            // Render floating background meteors behind active simulation objects
            drawBackgroundMeteors();

            // 1. Draw Central Mass Node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Center mark on node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // 2. Draw Alien Spaceship (behind Spider-Man so the ball emerges cleanly out of the barrel)
            drawAlienSpaceship(timestamp);

            // 3. Draw Spider-Man & Web Trail
            for (const b of balls) {
                // Draw web-silk path line
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.88)';
                    ctx.lineWidth = 1.4;
                    ctx.stroke();
                }

                // Draw Spider-Man ball
                drawSpiderManBall(b);
            }

            // 4. Draw Muzzle Flash Shockwaves & Plasma Sparks
            drawLaunchEffects();
        }

        function animate(timestamp) {
            const dt = Math.min(0.05, Math.max(0.001, (timestamp - lastTimestamp) / 1000));
            lastTimestamp = timestamp;

            updateBackgroundMeteors(dt);
            updateAlienAndEffects(dt);
            updatePhysics();
            draw(timestamp);
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            lastTimestamp = performance.now();
            animate(lastTimestamp);
        };
    </script>
</body>
</html>
