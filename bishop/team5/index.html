<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Simulation - Earth & Black Hole</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Subtle Monochrome Status Indicator */
        #status-indicator {
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #aaaaaa;
            padding: 4px 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            text-align: center;
            transition: color 0.15s ease, border-color 0.15s ease, text-shadow 0.15s ease;
        }

        #status-indicator.active {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.6);
        }

        #status-indicator.danger {
            color: #ffffff;
            border-color: #ffffff;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
            white-space: nowrap;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }

        /* Responsive adjustments for smaller mobile screens */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            h1 {
                font-size: 14px;
                letter-spacing: 1px;
            }
            #status-indicator {
                font-size: 10px;
                padding: 3px 6px;
                letter-spacing: 1px;
            }
            .btn-reset {
                padding: 4px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <div id="status-indicator">Ready</div>
        <button class="btn-reset" onclick="resetSimulation()">Reset</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas to launch Earth. Avoid the black hole's event horizon!
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status-indicator');

        // SIMULATION CONSTANTS (Tuned for stronger black hole gravity)
        const GRAVITY_CONSTANT = 2350;     // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;          // Number of historic trail points stored
        const SOFTENING_FACTOR = 180;      // Lowered softening for steeper pull near singularity

        // EARTH CONSTANTS
        const EARTH_RADIUS = 10;           // Radius of Earth in pixels
        const EARTH_AXIAL_TILT = -0.36;    // ~23.5° axial tilt in radians

        // Stylized spherical continent polygons (lon, lat in radians)
        const EARTH_CONTINENTS = [
            // North America
            {
                centerLon: -1.75,
                color: '#3ca35a',
                points: [
                    [-2.35, -0.95], [-1.75, -1.05], [-1.20, -0.82],
                    [-1.30, -0.45], [-1.58, -0.20], [-1.85, -0.25],
                    [-2.12, -0.58]
                ]
            },
            // South America
            {
                centerLon: -1.05,
                color: '#46b566',
                points: [
                    [-1.32, -0.05], [-0.88, 0.08], [-0.72, 0.42],
                    [-0.95, 0.88], [-1.18, 0.95], [-1.25, 0.42]
                ]
            },
            // Europe & Africa
            {
                centerLon: 0.35,
                color: '#43ad60',
                points: [
                    [-0.08, -0.88], [0.48, -0.92], [0.72, -0.60],
                    [0.45, -0.42], [0.78, -0.18], [0.75, 0.32],
                    [0.42, 0.72], [0.18, 0.65], [0.12, 0.18],
                    [-0.18, -0.05], [-0.15, -0.45]
                ]
            },
            // Asia
            {
                centerLon: 1.55,
                color: '#389c54',
                points: [
                    [0.78, -0.88], [1.65, -0.95], [2.35, -0.75],
                    [2.20, -0.28], [1.75, -0.08], [1.32, -0.12],
                    [0.95, -0.35]
                ]
            },
            // Australia
            {
                centerLon: 2.25,
                color: '#57b863',
                points: [
                    [1.95, 0.25], [2.48, 0.22], [2.55, 0.55],
                    [2.05, 0.60]
                ]
            }
        ];

        // Stylized drifting cloud bands (lon, lat in radians)
        const EARTH_CLOUDS = [
            { centerLon: -1.4, points: [[-1.9, -0.65], [-1.1, -0.70], [-0.95, -0.52], [-1.75, -0.48]] },
            { centerLon: -0.4, points: [[-0.85, 0.15], [-0.10, 0.10], [0.05, 0.26], [-0.75, 0.30]] },
            { centerLon: 0.9,  points: [[0.45, -0.30], [1.35, -0.36], [1.45, -0.18], [0.55, -0.14]] },
            { centerLon: 2.1,  points: [[1.65, 0.42], [2.45, 0.36], [2.52, 0.52], [1.72, 0.56]] }
        ];

        // BLACK HOLE CONSTANTS
        const EVENT_HORIZON_RADIUS = 16;   // Radius of the pitch-black singularity core
        const SUCTION_RADIUS = 56;         // Outer radius of the accretion suction danger zone
        const CAPTURE_DURATION = 18;       // Frames over which a captured Earth spirals into nothing
        const ACCRETION_PARTICLE_COUNT = 34;

        // STATE VARIABLES
        let balls = [];
        let ripples = [];
        let accretionParticles = [];
        let diskRotation = 0;
        let inSuctionZone = false;

        // Central Black Hole Node Definition
        const blackHole = {
            x: 0,
            y: 0,
            eventHorizonRadius: EVENT_HORIZON_RADIUS,
            suctionRadius: SUCTION_RADIUS
        };

        /**
         * Updates the subtle monochrome status indicator in the header
         */
        function setStatus(text, stateClass = '') {
            statusEl.textContent = text;
            statusEl.className = stateClass;
        }

        /**
         * Initializes orbiting accretion disk particles around the black hole
         */
        function initAccretionParticles() {
            accretionParticles = [];
            for (let i = 0; i < ACCRETION_PARTICLE_COUNT; i++) {
                const orbitRadius = EVENT_HORIZON_RADIUS + 3 + Math.random() * (SUCTION_RADIUS - EVENT_HORIZON_RADIUS - 6);
                accretionParticles.push({
                    angle: Math.random() * Math.PI * 2,
                    radius: orbitRadius,
                    baseRadius: orbitRadius,
                    size: Math.random() < 0.35 ? 1.5 : 1,
                    alpha: 0.25 + Math.random() * 0.65,
                    // Keplerian-style angular speed: faster closer to the event horizon
                    speed: (0.045 + Math.random() * 0.025) * (24 / orbitRadius)
                });
            }
        }

        /**
         * Spawns an expanding white gravitational shockwave/ripple ring
         */
        function spawnRipple(startRadius = EVENT_HORIZON_RADIUS, maxRadius = 95, lineWidth = 1.8) {
            ripples.push({
                radius: startRadius,
                maxRadius: maxRadius,
                alpha: 0.9,
                lineWidth: lineWidth
            });
        }

        /**
         * Dynamically resizes the canvas to fit its fluid container and centers the black hole
         */
        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter black hole dynamically
            blackHole.x = canvas.width / 2;
            blackHole.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        initAccretionParticles();

        // Canvas Click Handler: Directly launch Earth at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchEarth(clickX, clickY);
        });

        /**
         * Launches Earth at the specified coordinates
         */
        function launchEarth(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Overwrite existing array to strictly maintain a single Earth on screen
            balls = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: EARTH_RADIUS,
                initialRadius: EARTH_RADIUS,
                rotation: 0.4,
                cloudRotation: 0.8,
                trail: [],
                captured: false,
                captureFrame: 0,
                captureDist: 0,
                captureAngle: 0,
                spinDirection: 1
            }];

            inSuctionZone = false;
            setStatus('Orbiting', 'active');
        }

        /**
         * Clears active Earth and resets simulation state
         */
        function resetSimulation() {
            balls = [];
            ripples = [];
            inSuctionZone = false;
            setStatus('Ready', '');
        }

        /**
         * Updates ambient black hole rotation, accretion particles, and gravitational ripples
         */
        function updateBlackHoleEffects() {
            // Rotate accretion disk rings (slightly faster when Earth is inside the suction zone)
            diskRotation += inSuctionZone ? 0.032 : 0.016;

            // Update swirling accretion particles
            for (const p of accretionParticles) {
                p.angle += p.speed * (inSuctionZone ? 1.45 : 1);
                // Subtle inward drift with smooth respawn at outer accretion edge
                p.radius -= 0.04;
                if (p.radius <= EVENT_HORIZON_RADIUS + 1.5) {
                    p.radius = SUCTION_RADIUS - 3;
                    p.angle = Math.random() * Math.PI * 2;
                }
            }

            // Update expanding gravitational ripples
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.radius += 2.2;
                const progress = (r.radius - EVENT_HORIZON_RADIUS) / (r.maxRadius - EVENT_HORIZON_RADIUS);
                r.alpha = Math.max(0, 0.85 * (1 - progress));
                if (r.radius >= r.maxRadius) {
                    ripples.splice(i, 1);
                }
            }
        }

        /**
         * Updates Earth's trajectory, axial spin, suction zone pull, and event horizon capture spiral
         */
        function updatePhysics() {
            inSuctionZone = false;

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Handle Sucked-In Capture Spiral Animation
                if (b.captured) {
                    b.captureFrame++;
                    const t = Math.min(1, b.captureFrame / CAPTURE_DURATION);

                    // Rapidly spiral inward toward the singularity center while shrinking to 0
                    const currentDist = b.captureDist * Math.pow(1 - t, 1.6);
                    b.captureAngle += b.spinDirection * (0.28 + 0.35 * t);

                    b.x = blackHole.x + Math.cos(b.captureAngle) * currentDist;
                    b.y = blackHole.y + Math.sin(b.captureAngle) * currentDist;
                    b.radius = Math.max(0, b.initialRadius * (1 - t));
                    b.rotation += 0.18;
                    b.cloudRotation += 0.22;

                    // Record spiral trail points into the singularity
                    b.trail.push({ x: b.x, y: b.y });
                    if (b.trail.length > TRAIL_LENGTH) {
                        b.trail.shift();
                    }

                    // Remove Earth once fully collapsed into the singularity
                    if (b.captureFrame >= CAPTURE_DURATION) {
                        spawnRipple(EVENT_HORIZON_RADIUS, 72, 1.2);
                        balls.splice(i, 1);
                        setStatus('Consumed by Black Hole', 'danger');
                    }
                    continue;
                }

                // Remove Earth if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    setStatus('Lost in Space', '');
                    continue;
                }

                // Distance vector from Earth to black hole center
                const dx = blackHole.x - b.x;
                const dy = blackHole.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Event Horizon Check: trigger sucked-in capture animation
                if (dist < blackHole.eventHorizonRadius) {
                    b.captured = true;
                    b.captureFrame = 0;
                    b.captureDist = dist;
                    b.captureAngle = Math.atan2(b.y - blackHole.y, b.x - blackHole.x);

                    // Preserve angular spin direction based on entry velocity cross product
                    const cross = (-dx) * b.vy - (-dy) * b.vx;
                    b.spinDirection = cross >= 0 ? 1 : -1;

                    // Trigger bright white shockwave ring on the event horizon
                    spawnRipple(EVENT_HORIZON_RADIUS, 105, 2.2);
                    setStatus('Sucked In', 'danger');
                    continue;
                }

                // Normalized radial inward unit vector
                const nx = dx / dist;
                const ny = dy / dist;

                // Core inverse-square gravitational acceleration
                let acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Inner Suction Zone Physics (dist < SUCTION_RADIUS)
                if (dist < blackHole.suctionRadius) {
                    inSuctionZone = true;
                    setStatus('Suction Zone', 'danger');

                    // Smooth intensity factor from 0 at outer edge (56) to ~0.71 near event horizon (16)
                    const suctionFactor = 1 - (dist / blackHole.suctionRadius);

                    // Spin faster as tidal forces intensify inside the suction zone
                    b.rotation += 0.024 + 0.05 * suctionFactor;
                    b.cloudRotation += 0.032 + 0.06 * suctionFactor;

                    // Extra inward radial suction pull
                    acceleration += 0.16 * suctionFactor + 0.48 * (suctionFactor * suctionFactor);

                    // Slight tangential drag to decay grazing orbits into inward spirals
                    const tx = -ny;
                    const ty = nx;
                    const tangentialSpeed = b.vx * tx + b.vy * ty;
                    const tangentialDrag = tangentialSpeed * (0.022 * suctionFactor);

                    b.vx -= tx * tangentialDrag;
                    b.vy -= ty * tangentialDrag;
                } else {
                    b.rotation += 0.024;
                    b.cloudRotation += 0.032;
                    setStatus('Orbiting', 'active');
                }

                // Apply gravitational + suction acceleration
                b.vx += acceleration * nx;
                b.vy += acceleration * ny;
                b.x += b.vx;
                b.y += b.vy;

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }
        }

        /**
         * Wraps an angle in radians to the range [-PI, PI]
         */
        function wrapLongitude(angle) {
            return ((((angle + Math.PI) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)) - Math.PI;
        }

        /**
         * Projects a spherical polygon onto the front hemisphere of Earth
         */
        function drawSphericalPolygon(points, centerLon, rotation, r, fillStyle) {
            const relCenter = wrapLongitude(centerLon + rotation);
            if (Math.cos(relCenter) <= -0.25) return;

            ctx.beginPath();
            for (let i = 0; i < points.length; i++) {
                const [lon, lat] = points[i];
                let relLon = wrapLongitude(lon + rotation);

                // Clamp vertices slightly past the horizon to the limb edge so the sphere clips cleanly
                if (relLon > Math.PI / 2) relLon = Math.PI / 2;
                if (relLon < -Math.PI / 2) relLon = -Math.PI / 2;

                const px = r * Math.cos(lat) * Math.sin(relLon);
                const py = r * Math.sin(lat);

                if (i === 0) {
                    ctx.moveTo(px, py);
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.closePath();
            ctx.fillStyle = fillStyle;
            ctx.fill();
        }

        /**
         * Renders Earth with oceans, rotating continents, polar ice caps, clouds, and atmospheric glow
         */
        function drawEarth(b) {
            const r = b.radius;
            if (r <= 0.1) return;

            ctx.save();
            ctx.translate(b.x, b.y);

            // 1. Soft Outer Atmospheric Glow
            const atmoGrad = ctx.createRadialGradient(0, 0, r * 0.85, 0, 0, r * 1.35);
            atmoGrad.addColorStop(0, 'rgba(90, 175, 255, 0.45)');
            atmoGrad.addColorStop(0.55, 'rgba(56, 142, 235, 0.18)');
            atmoGrad.addColorStop(1, 'rgba(56, 142, 235, 0)');

            ctx.beginPath();
            ctx.arc(0, 0, r * 1.35, 0, Math.PI * 2);
            ctx.fillStyle = atmoGrad;
            ctx.fill();

            // 2. Clip to Planetary Sphere and Apply Axial Tilt
            ctx.save();
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.clip();

            ctx.rotate(EARTH_AXIAL_TILT);

            // 3. Ocean Sphere Base Gradient
            const oceanGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
            oceanGrad.addColorStop(0, '#38a3eb');
            oceanGrad.addColorStop(0.55, '#196ec2');
            oceanGrad.addColorStop(1, '#092c5c');

            ctx.fillStyle = oceanGrad;
            ctx.fillRect(-r, -r, r * 2, r * 2);

            // 4. Rotating Continents
            for (const continent of EARTH_CONTINENTS) {
                drawSphericalPolygon(continent.points, continent.centerLon, b.rotation, r, continent.color);
            }

            // 5. Polar Ice Caps (North & South)
            ctx.fillStyle = 'rgba(240, 248, 255, 0.9)';
            ctx.beginPath();
            ctx.ellipse(0, -r * 0.92, r * 0.45, r * 0.16, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(0, r * 0.93, r * 0.42, r * 0.15, 0, 0, Math.PI * 2);
            ctx.fill();

            // 6. Drifting Cloud Layer
            for (const cloud of EARTH_CLOUDS) {
                drawSphericalPolygon(cloud.points, cloud.centerLon, b.cloudRotation, r, 'rgba(255, 255, 255, 0.42)');
            }

            // Unrotate tilt before applying camera-relative 3D shading
            ctx.rotate(-EARTH_AXIAL_TILT);

            // 7. 3D Spherical Shadow Terminator & Atmospheric Limb Highlight
            const shadowGrad = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.25, 0, 0, r);
            shadowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.12)');
            shadowGrad.addColorStop(0.65, 'rgba(0, 10, 28, 0.15)');
            shadowGrad.addColorStop(1, 'rgba(0, 5, 18, 0.72)');

            ctx.fillStyle = shadowGrad;
            ctx.fillRect(-r, -r, r * 2, r * 2);

            ctx.restore(); // End sphere clip

            // 8. Crisp Blue Atmospheric Rim Border
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(130, 205, 255, 0.7)';
            ctx.lineWidth = Math.max(0.5, r * 0.08);
            ctx.stroke();

            ctx.restore();
        }

        /**
         * Renders the accretion disk, suction zone, Earth trail, and black hole singularity
         */
        function draw() {
            // Clear canvas background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = blackHole.x;
            const cy = blackHole.y;

            // 1. Draw Faint Outer Dashed Suction-Zone Danger Ring (r = 56)
            ctx.save();
            ctx.beginPath();
            ctx.setLineDash([4, 6]);
            ctx.lineDashOffset = -diskRotation * 24;
            ctx.arc(cx, cy, blackHole.suctionRadius, 0, Math.PI * 2);
            ctx.strokeStyle = inSuctionZone
                ? 'rgba(255, 255, 255, 0.65)'
                : 'rgba(255, 255, 255, 0.24)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();

            // 2. Draw Expanding Gravitational Shockwave Ripples
            for (const r of ripples) {
                ctx.beginPath();
                ctx.arc(cx, cy, r.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${r.alpha.toFixed(3)})`;
                ctx.lineWidth = r.lineWidth;
                ctx.stroke();
            }

            // 3. Draw Animated Rotating Accretion Disk Rings
            ctx.save();
            ctx.translate(cx, cy);

            // Inner fast accretion ring
            ctx.save();
            ctx.rotate(diskRotation * 1.8);
            ctx.beginPath();
            ctx.arc(0, 0, EVENT_HORIZON_RADIUS + 6, 0, Math.PI * 1.45);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, EVENT_HORIZON_RADIUS + 6, Math.PI * 1.6, Math.PI * 1.9);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();

            // Mid counter-rotating accretion arc
            ctx.save();
            ctx.rotate(-diskRotation * 1.15);
            ctx.beginPath();
            ctx.arc(0, 0, EVENT_HORIZON_RADIUS + 14, 0.2, Math.PI * 1.15);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, EVENT_HORIZON_RADIUS + 22, Math.PI * 0.7, Math.PI * 1.75);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.lineWidth = 0.9;
            ctx.stroke();
            ctx.restore();

            ctx.restore();

            // 4. Draw Swirling Accretion Particles
            for (const p of accretionParticles) {
                const px = cx + Math.cos(p.angle) * p.radius;
                const py = cy + Math.sin(p.angle) * p.radius;

                ctx.beginPath();
                ctx.arc(px, py, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha.toFixed(2)})`;
                ctx.fill();
            }

            // 5. Draw Earth Motion Trail (drawn underneath singularity core so trails vanish into the void)
            for (const b of balls) {
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = 'rgba(180, 224, 255, 0.85)';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }
            }

            // 6. Draw Pitch-Black Singularity Core & Bright Glowing Photon Ring
            ctx.save();
            const coronaGrad = ctx.createRadialGradient(
                cx, cy, EVENT_HORIZON_RADIUS - 1,
                cx, cy, EVENT_HORIZON_RADIUS + 14
            );
            coronaGrad.addColorStop(0, 'rgba(255, 255, 255, 0.75)');
            coronaGrad.addColorStop(0.35, 'rgba(255, 255, 255, 0.22)');
            coronaGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.beginPath();
            ctx.arc(cx, cy, EVENT_HORIZON_RADIUS + 14, 0, Math.PI * 2);
            ctx.fillStyle = coronaGrad;
            ctx.fill();

            // Pitch-black event horizon fill
            ctx.beginPath();
            ctx.arc(cx, cy, EVENT_HORIZON_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // Glowing white photon ring border
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 14;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            // 7. Draw Active Earth (including during its spiral collapse into the singularity)
            for (const b of balls) {
                drawEarth(b);
            }
        }

        function animate() {
            updatePhysics();
            updateBlackHoleEffects();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
