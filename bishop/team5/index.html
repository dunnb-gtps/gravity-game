<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Simulation - Planetary System & Black Hole</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #04030a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Subtle Monochrome Status Indicator */
        #status-indicator {
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #aaaaaa;
            padding: 4px 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            text-align: center;
            transition: color 0.15s ease, border-color 0.15s ease, text-shadow 0.15s ease;
        }

        #status-indicator.active {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.6);
        }

        #status-indicator.danger {
            color: #ffffff;
            border-color: #ffffff;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
            white-space: nowrap;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        canvas {
            background-color: #04030a;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }

        /* Responsive adjustments for smaller mobile screens */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            h1 {
                font-size: 14px;
                letter-spacing: 1px;
            }
            #status-indicator {
                font-size: 10px;
                padding: 3px 6px;
                letter-spacing: 1px;
            }
            .btn-reset {
                padding: 4px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

        /**
         * Pre-renders the deep-space spiral galaxy, colorful nebulae, dust lanes, and starfield
         */
        function buildGalaxyBackground() {
            const w = canvas.width;
            const h = canvas.height;
            bgCanvas.width = w;
            bgCanvas.height = h;

            if (w === 0 || h === 0) return;

            // 1. Deep Cosmic Void Base
            const baseGrad = bgCtx.createRadialGradient(w * 0.5, h * 0.5, 40, w * 0.5, h * 0.5, Math.max(w, h) * 0.85);
            baseGrad.addColorStop(0, '#090618');
            baseGrad.addColorStop(0.55, '#050410');
            baseGrad.addColorStop(1, '#020106');
            bgCtx.fillStyle = baseGrad;
            bgCtx.fillRect(0, 0, w, h);

            // 2. Large Sweeping Nebula Clouds (Violet, Magenta, Cyan, Royal Blue)
            const nebulae = [
                { x: w * 0.24, y: h * 0.30, rx: w * 0.38, ry: h * 0.26, rot: -0.35, c1: 'rgba(112, 42, 205, 0.22)', c2: 'rgba(55, 22, 130, 0.08)' },
                { x: w * 0.76, y: h * 0.68, rx: w * 0.40, ry: h * 0.28, rot: -0.32, c1: 'rgba(195, 52, 148, 0.19)', c2: 'rgba(95, 24, 98, 0.07)' },
                { x: w * 0.74, y: h * 0.24, rx: w * 0.30, ry: h * 0.22, rot: 0.40,  c1: 'rgba(26, 135, 205, 0.18)', c2: 'rgba(14, 65, 130, 0.06)' },
                { x: w * 0.26, y: h * 0.74, rx: w * 0.32, ry: h * 0.22, rot: 0.25,  c1: 'rgba(42, 165, 175, 0.15)', c2: 'rgba(18, 72, 105, 0.05)' }
            ];

            for (const neb of nebulae) {
                bgCtx.save();
                bgCtx.translate(neb.x, neb.y);
                bgCtx.rotate(neb.rot);
                bgCtx.scale(1, neb.ry / neb.rx);
                const grad = bgCtx.createRadialGradient(0, 0, neb.rx * 0.05, 0, 0, neb.rx);
                grad.addColorStop(0, neb.c1);
                grad.addColorStop(0.55, neb.c2);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                bgCtx.fillStyle = grad;
                bgCtx.beginPath();
                bgCtx.arc(0, 0, neb.rx, 0, Math.PI * 2);
                bgCtx.fill();
                bgCtx.restore();
            }

            // 3. Tilted Spiral Galaxy Arms Sweeping Across the Canvas
            bgCtx.save();
            bgCtx.translate(w * 0.5, h * 0.5);
            bgCtx.rotate(-0.34);
            bgCtx.scale(1.18, 0.54);

            const maxArmR = Math.max(w, h) * 0.68;
            const armCount = 4;
            const armColors = [
                'rgba(168, 115, 255, ',
                'rgba(235, 118, 198, ',
                'rgba(105, 195, 255, ',
                'rgba(255, 212, 148, '
            ];

            // Soft spiral arm gas glow
            for (let arm = 0; arm < armCount; arm++) {
                const baseAngle = (arm * Math.PI * 2) / armCount;
                for (let step = 18; step < 95; step++) {
                    const t = step / 95;
                    const r = t * maxArmR;
                    const theta = baseAngle + t * 3.6;
                    const gx = Math.cos(theta) * r;
                    const gy = Math.sin(theta) * r;
                    const blobR = 26 + t * 44;
                    const alpha = (1 - t * 0.72) * 0.045;

                    const armGrad = bgCtx.createRadialGradient(gx, gy, 1, gx, gy, blobR);
                    armGrad.addColorStop(0, `${armColors[arm]}${alpha.toFixed(3)})`);
                    armGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    bgCtx.fillStyle = armGrad;
                    bgCtx.beginPath();
                    bgCtx.arc(gx, gy, blobR, 0, Math.PI * 2);
                    bgCtx.fill();
                }
            }

            // Thousands of fine stardust particles along the spiral arms
            const starDustCount = 1350;
            for (let i = 0; i < starDustCount; i++) {
                const arm = i % armCount;
                const baseAngle = (arm * Math.PI * 2) / armCount;
                const t = Math.pow(Math.random(), 0.78);
                const r = 38 + t * maxArmR;
                const spread = (Math.random() - 0.5) * (0.28 + t * 0.48);
                const theta = baseAngle + t * 3.6 + spread;

                const sx = Math.cos(theta) * r + (Math.random() - 0.5) * 18;
                const sy = Math.sin(theta) * r + (Math.random() - 0.5) * 18;
                const size = Math.random() < 0.15 ? 1.5 : 0.95;
                const alpha = (0.18 + Math.random() * 0.52) * (1 - t * 0.45);

                bgCtx.fillStyle = `${armColors[arm]}${alpha.toFixed(2)})`;
                bgCtx.beginPath();
                bgCtx.arc(sx, sy, size, 0, Math.PI * 2);
                bgCtx.fill();
            }

            bgCtx.restore();

            // 4. Distant Mini Spiral Galaxies in the Corners
            const miniGalaxies = [
                { x: w * 0.13, y: h * 0.18, r: 24, angle: 0.55, hue: 'rgba(180, 155, 255, ' },
                { x: w * 0.88, y: h * 0.22, r: 19, angle: -0.45, hue: 'rgba(255, 175, 215, ' },
                { x: w * 0.85, y: h * 0.84, r: 26, angle: 0.30, hue: 'rgba(135, 215, 255, ' }
            ];

            for (const mg of miniGalaxies) {
                bgCtx.save();
                bgCtx.translate(mg.x, mg.y);
                bgCtx.rotate(mg.angle);
                bgCtx.scale(1, 0.42);
                const coreGrad = bgCtx.createRadialGradient(0, 0, 1, 0, 0, mg.r);
                coreGrad.addColorStop(0, 'rgba(255, 245, 225, 0.55)');
                coreGrad.addColorStop(0.35, `${mg.hue}0.28)`);
                coreGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                bgCtx.fillStyle = coreGrad;
                bgCtx.beginPath();
                bgCtx.arc(0, 0, mg.r, 0, Math.PI * 2);
                bgCtx.fill();
                bgCtx.restore();
            }

            // 5. Crisp Background Starfield
            const starColors = ['#ffffff', '#dceeff', '#ffe9c4', '#f3d9ff', '#bfe8ff'];
            const starCount = Math.floor((w * h) / 3600);
            for (let i = 0; i < starCount; i++) {
                const sx = Math.random() * w;
                const sy = Math.random() * h;
                const radius = Math.random() < 0.12 ? 1.45 : (Math.random() < 0.45 ? 0.95 : 0.65);
                const alpha = 0.28 + Math.random() * 0.68;
                bgCtx.fillStyle = starColors[i % starColors.length];
                bgCtx.globalAlpha = alpha;
                bgCtx.beginPath();
                bgCtx.arc(sx, sy, radius, 0, Math.PI * 2);
                bgCtx.fill();
            }
            bgCtx.globalAlpha = 1;
        }

        /**
         * Updates positions and animations of background stars, spaceships, UFOs, and aliens
         */
        function updateCosmicEntities() {
            galaxyTime += 0.016;
            const w = canvas.width;
            const h = canvas.height;
            const pad = 90;

            // Occasional Shooting Star
            if (Math.random() < 0.012 && shootingStars.length < 2) {
                const fromLeft = Math.random() < 0.5;
                shootingStars.push({
                    x: fromLeft ? Math.random() * w * 0.6 : w * (0.4 + Math.random() * 0.6),
                    y: Math.random() * h * 0.45,
                    vx: (fromLeft ? 1 : -1) * (6.5 + Math.random() * 4.5),
                    vy: 2.8 + Math.random() * 2.5,
                    life: 1.0,
                    decay: 0.025 + Math.random() * 0.015
                });
            }

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const s = shootingStars[i];
                s.x += s.vx;
                s.y += s.vy;
                s.life -= s.decay;
                if (s.life <= 0) {
                    shootingStars.splice(i, 1);
                }
            }

            // Update Spaceships
            for (const ship of spaceships) {
                ship.pulsePhase += 0.12;
                ship.x += ship.vx;
                ship.y += ship.vy + Math.sin(galaxyTime * 1.4 + ship.pulsePhase * 0.1) * 0.12;

                ship.trail.push({ x: ship.x, y: ship.y });
                if (ship.trail.length > 26) {
                    ship.trail.shift();
                }

                // Wrap smoothly across screen borders
                let wrapped = false;
                if (ship.x > w + pad) { ship.x = -pad; wrapped = true; }
                else if (ship.x < -pad) { ship.x = w + pad; wrapped = true; }
                if (ship.y > h + pad) { ship.y = -pad; wrapped = true; }
                else if (ship.y < -pad) { ship.y = h + pad; wrapped = true; }

                if (wrapped) {
                    ship.trail = [];
                    ship.y = h * (0.12 + Math.random() * 0.76);
                }
            }

            // Update Alien UFOs
            for (const ufo of ufos) {
                ufo.bobPhase += ufo.bobSpeed;
                ufo.beamTimer = (ufo.beamTimer + 1) % 340;
                ufo.x += ufo.vx;
                ufo.y += Math.sin(ufo.bobPhase) * 0.42;

                if (ufo.x > w + pad) {
                    ufo.x = -pad;
                    ufo.y = h * (0.15 + Math.random() * 0.7);
                } else if (ufo.x < -pad) {
                    ufo.x = w + pad;
                    ufo.y = h * (0.15 + Math.random() * 0.7);
                }
            }

            // Update Free-Floating Space Aliens
            for (const alien of spaceAliens) {
                alien.phase += 0.03;
                alien.tilt = Math.sin(alien.phase * 0.7) * 0.24;
                alien.x += alien.vx + Math.cos(alien.phase * 0.5) * 0.12;
                alien.y += alien.vy + Math.sin(alien.phase) * 0.22;

                if (alien.x > w + 60) alien.x = -60;
                else if (alien.x < -60) alien.x = w + 60;
                if (alien.y > h + 60) alien.y = -60;
                else if (alien.y < -60) alien.y = h + 60;
            }
        }

        /**
         * Draws a cruising sci-fi spaceship with engine exhaust and navigation lights
         */
        function drawSpaceship(ship) {
            const angle = Math.atan2(ship.vy, ship.vx);

            // Engine exhaust contrail
            if (ship.trail.length > 2) {
                for (let i = 1; i < ship.trail.length; i++) {
                    const ratio = i / ship.trail.length;
                    ctx.beginPath();
                    ctx.moveTo(ship.trail[i - 1].x, ship.trail[i - 1].y);
                    ctx.lineTo(ship.trail[i].x, ship.trail[i].y);
                    ctx.strokeStyle = ship.type === 'rocket'
                        ? `rgba(255, 165, 75, ${(ratio * 0.35).toFixed(3)})`
                        : `rgba(85, 215, 255, ${(ratio * 0.35).toFixed(3)})`;
                    ctx.lineWidth = ratio * 3.2 * ship.scale;
                    ctx.stroke();
                }
            }

            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(angle);
            ctx.scale(ship.scale, ship.scale);

            const flicker = 0.8 + Math.sin(ship.pulsePhase * 2.5) * 0.25;

            if (ship.type === 'interceptor') {
                // Twin cyan ion thruster flames
                ctx.fillStyle = 'rgba(56, 189, 248, 0.85)';
                ctx.beginPath();
                ctx.moveTo(-13, -4);
                ctx.lineTo(-24 * flicker, -2.5);
                ctx.lineTo(-13, -1);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-13, 1);
                ctx.lineTo(-24 * flicker, 2.5);
                ctx.lineTo(-13, 4);
                ctx.fill();

                // Swept delta wings
                ctx.fillStyle = '#64748b';
                ctx.beginPath();
                ctx.moveTo(8, 0);
                ctx.lineTo(-12, -13);
                ctx.lineTo(-9, 0);
                ctx.lineTo(-12, 13);
                ctx.closePath();
                ctx.fill();

                // Sleek metallic fuselage
                const hullGrad = ctx.createLinearGradient(-14, 0, 18, 0);
                hullGrad.addColorStop(0, '#94a3b8');
                hullGrad.addColorStop(0.6, '#e2e8f0');
                hullGrad.addColorStop(1, '#38bdf8');
                ctx.fillStyle = hullGrad;
                ctx.beginPath();
                ctx.moveTo(19, 0);
                ctx.lineTo(-8, -5.5);
                ctx.lineTo(-14, -3.5);
                ctx.lineTo(-14, 3.5);
                ctx.lineTo(-8, 5.5);
                ctx.closePath();
                ctx.fill();

                // Glowing cockpit canopy
                ctx.fillStyle = '#22d3ee';
                ctx.beginPath();
                ctx.ellipse(3, 0, 5.5, 2.3, 0, 0, Math.PI * 2);
                ctx.fill();

                // Wingtip strobe lights
                ctx.fillStyle = Math.sin(ship.pulsePhase) > 0 ? '#f43f5e' : '#38bdf8';
                ctx.beginPath();
                ctx.arc(-11, -12, 1.3, 0, Math.PI * 2);
                ctx.arc(-11, 12, 1.3, 0, Math.PI * 2);
                ctx.fill();

            } else if (ship.type === 'cruiser') {
                // Warm amber plasma engine glow
                const thrustGrad = ctx.createRadialGradient(-18, 0, 1, -22, 0, 13 * flicker);
                thrustGrad.addColorStop(0, 'rgba(255, 240, 180, 0.95)');
                thrustGrad.addColorStop(0.5, 'rgba(251, 146, 60, 0.65)');
                thrustGrad.addColorStop(1, 'rgba(251, 146, 60, 0)');
                ctx.fillStyle = thrustGrad;
                ctx.beginPath();
                ctx.arc(-21, 0, 13 * flicker, 0, Math.PI * 2);
                ctx.fill();

                // Engine nacelles
                ctx.fillStyle = '#475569';
                ctx.fillRect(-17, -9, 12, 3.5);
                ctx.fillRect(-17, 5.5, 12, 3.5);

                // Heavy starship hull
                ctx.fillStyle = '#cbd5e1';
                ctx.beginPath();
                ctx.moveTo(22, 0);
                ctx.lineTo(10, -7);
                ctx.lineTo(-15, -6.5);
                ctx.lineTo(-18, 0);
                ctx.lineTo(-15, 6.5);
                ctx.lineTo(10, 7);
                ctx.closePath();
                ctx.fill();

                // Hull accent stripe & illuminated deck windows
                ctx.fillStyle = '#6366f1';
                ctx.fillRect(-10, -2, 22, 4);

                ctx.fillStyle = '#fef08a';
                for (let wx = -6; wx <= 8; wx += 4.5) {
                    ctx.fillRect(wx, -1, 2.2, 2);
                }

            } else {
                // Retro-futuristic rocket with porthole
                ctx.fillStyle = 'rgba(251, 146, 60, 0.9)';
                ctx.beginPath();
                ctx.moveTo(-13, -3.5);
                ctx.lineTo(-24 * flicker, 0);
                ctx.lineTo(-13, 3.5);
                ctx.closePath();
                ctx.fill();

                // Red tail fins
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.moveTo(-7, -4);
                ctx.lineTo(-15, -10);
                ctx.lineTo(-13, -3);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-7, 4);
                ctx.lineTo(-15, 10);
                ctx.lineTo(-13, 3);
                ctx.closePath();
                ctx.fill();

                // Silver rocket body
                ctx.fillStyle = '#f1f5f9';
                ctx.beginPath();
                ctx.ellipse(2, 0, 15, 5.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Crimson nose cone
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.moveTo(18, 0);
                ctx.lineTo(10, -4.3);
                ctx.lineTo(10, 4.3);
                ctx.closePath();
                ctx.fill();

                // Porthole window
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(2, 0, 2.7, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            ctx.restore();
        }

        /**
         * Draws a flying saucer (UFO) with spinning neon rim lights, alien pilot, and occasional tractor beam
         */
        function drawUFO(ufo) {
            ctx.save();
            ctx.translate(ufo.x, ufo.y);
            ctx.scale(ufo.scale, ufo.scale);
            ctx.rotate(Math.sin(ufo.bobPhase) * 0.08);

            // 1. Optional Pulsing Tractor Beam
            if (ufo.beamTimer < 110) {
                const beamAlpha = Math.sin((ufo.beamTimer / 110) * Math.PI) * 0.22;
                const beamGrad = ctx.createLinearGradient(0, 6, 0, 56);
                beamGrad.addColorStop(0, `rgba(110, 231, 183, ${beamAlpha.toFixed(3)})`);
                beamGrad.addColorStop(1, 'rgba(110, 231, 183, 0)');

                ctx.fillStyle = beamGrad;
                ctx.beginPath();
                ctx.moveTo(-8, 6);
                ctx.lineTo(8, 6);
                ctx.lineTo(24, 56);
                ctx.lineTo(-24, 56);
                ctx.closePath();
                ctx.fill();
            }

            // 2. Alien Pilot Inside the Cockpit Dome
            // Alien shoulders/torso
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.ellipse(0, -3.5, 5.5, 3.2, 0, Math.PI, Math.PI * 2);
            ctx.fill();

            // Alien head
            ctx.fillStyle = ufo.alienColor;
            ctx.beginPath();
            ctx.ellipse(0, -8.5, 4.3, 5.0, 0, 0, Math.PI * 2);
            ctx.fill();

            // Little antennae
            ctx.strokeStyle = ufo.alienColor;
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(-2, -12.5);
            ctx.lineTo(-3.5, -15.5);
            ctx.moveTo(2, -12.5);
            ctx.lineTo(3.5, -15.5);
            ctx.stroke();

            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(-3.5, -15.8, 1.1, 0, Math.PI * 2);
            ctx.arc(3.5, -15.8, 1.1, 0, Math.PI * 2);
            ctx.fill();

            // Big glossy alien eyes
            ctx.fillStyle = '#090d16';
            ctx.beginPath();
            ctx.ellipse(-1.7, -8.5, 1.3, 1.9, -0.25, 0, Math.PI * 2);
            ctx.ellipse(1.7, -8.5, 1.3, 1.9, 0.25, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-2.0, -9.1, 0.45, 0, Math.PI * 2);
            ctx.arc(1.4, -9.1, 0.45, 0, Math.PI * 2);
            ctx.fill();

            // 3. Translucent Glass Cockpit Dome
            const domeGrad = ctx.createRadialGradient(-3, -12, 1, 0, -6, 13);
            domeGrad.addColorStop(0, 'rgba(224, 242, 254, 0.52)');
            domeGrad.addColorStop(0.7, 'rgba(125, 211, 252, 0.24)');
            domeGrad.addColorStop(1, 'rgba(56, 189, 248, 0.38)');
            ctx.fillStyle = domeGrad;
            ctx.beginPath();
            ctx.arc(0, -4, 11.5, Math.PI, 0);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(186, 230, 253, 0.65)';
            ctx.lineWidth = 0.9;
            ctx.stroke();

            // 4. Metallic Saucer Hull
            const saucerGrad = ctx.createLinearGradient(-22, -4, 22, 6);
            saucerGrad.addColorStop(0, '#64748b');
            saucerGrad.addColorStop(0.5, '#e2e8f0');
            saucerGrad.addColorStop(1, '#475569');

            ctx.fillStyle = saucerGrad;
            ctx.beginPath();
            ctx.ellipse(0, 0, 22, 6.2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Lower emitter pod
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.ellipse(0, 4.5, 9, 2.6, 0, 0, Math.PI);
            ctx.fill();

            // 5. Animated Rotating Rim Lights
            const lightCount = 5;
            for (let i = 0; i < lightCount; i++) {
                const lx = -14 + (i * 28) / (lightCount - 1);
                const pulse = Math.sin(galaxyTime * 7 + i * 1.3);
                ctx.fillStyle = pulse > 0 ? ufo.lightHue : '#fef08a';
                ctx.beginPath();
                ctx.arc(lx, 0.6, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        /**
         * Draws a cute zero-gravity space alien floating in a clear bubble helmet
         */
        function drawSpaceAlien(alien) {
            ctx.save();
            ctx.translate(alien.x, alien.y);
            ctx.rotate(alien.tilt);
            ctx.scale(alien.scale, alien.scale);

            // Jetpack puff
            const puffAlpha = 0.25 + Math.sin(alien.phase * 4) * 0.15;
            ctx.fillStyle = `rgba(186, 230, 253, ${puffAlpha.toFixed(2)})`;
            ctx.beginPath();
            ctx.arc(-8, 6, 3.5, 0, Math.PI * 2);
            ctx.arc(-11, 9, 2.2, 0, Math.PI * 2);
            ctx.fill();

            // Mini jetpack
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(-7.5, -1, 4, 8);

            // Space suit torso & waving arms
            ctx.fillStyle = alien.suitColor;
            ctx.beginPath();
            ctx.roundRect(-4.5, 0, 9, 9.5, 3);
            ctx.fill();

            // Waving arm
            const waveAngle = Math.sin(alien.phase * 3.2) * 0.45 - 0.6;
            ctx.save();
            ctx.translate(4.5, 2);
            ctx.rotate(waveAngle);
            ctx.strokeStyle = alien.suitColor;
            ctx.lineWidth = 2.4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(5.5, -3);
            ctx.stroke();
            ctx.fillStyle = alien.bodyColor;
            ctx.beginPath();
            ctx.arc(6, -3.3, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Little legs
            ctx.strokeStyle = alien.suitColor;
            ctx.lineWidth = 2.4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-2, 9.5);
            ctx.lineTo(-3, 14);
            ctx.moveTo(2, 9.5);
            ctx.lineTo(3, 14);
            ctx.stroke();

            // Alien head
            ctx.fillStyle = alien.bodyColor;
            ctx.beginPath();
            ctx.ellipse(0, -5.5, 4.8, 5.2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Antenna
            ctx.strokeStyle = alien.bodyColor;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(0, -10.5);
            ctx.lineTo(0, -13.5);
            ctx.stroke();
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(0, -14, 1.3, 0, Math.PI * 2);
            ctx.fill();

            // Big cute eyes
            ctx.fillStyle = '#090d16';
            ctx.beginPath();
            ctx.ellipse(-1.9, -5.5, 1.3, 1.8, -0.2, 0, Math.PI * 2);
            ctx.ellipse(1.9, -5.5, 1.3, 1.8, 0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-2.2, -6.1, 0.45, 0, Math.PI * 2);
            ctx.arc(1.6, -6.1, 0.45, 0, Math.PI * 2);
            ctx.fill();

            // Transparent glass bubble space helmet
            const helmetGrad = ctx.createRadialGradient(-2.5, -8.5, 1, 0, -6, 9);
            helmetGrad.addColorStop(0, 'rgba(255, 255, 255, 0.42)');
            helmetGrad.addColorStop(0.75, 'rgba(186, 230, 253, 0.14)');
            helmetGrad.addColorStop(1, 'rgba(125, 211, 252, 0.45)');
            ctx.fillStyle = helmetGrad;
            ctx.beginPath();
            ctx.arc(0, -6, 8.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(224, 242, 254, 0.72)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.restore();
        }

        /**
         * Renders the pre-baked galaxy canvas plus dynamic twinkling stars, shooting stars, spaceships, and aliens
         */
        function drawGalaxyBackground() {
            ctx.drawImage(bgCanvas, 0, 0);

            // Twinkling foreground stars
            for (const star of twinklingStars) {
                const alpha = 0.25 + 0.65 * (0.5 + 0.5 * Math.sin(galaxyTime * 60 * star.speed + star.phase));
                ctx.fillStyle = star.color;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Shooting stars
            for (const s of shootingStars) {
                const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 6, s.y - s.vy * 6);
                grad.addColorStop(0, `rgba(255, 255, 255, ${s.life.toFixed(2)})`);
                grad.addColorStop(1, 'rgba(125, 211, 252, 0)');
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(s.x - s.vx * 6, s.y - s.vy * 6);
                ctx.stroke();
            }

            // Cruising spaceships
            for (const ship of spaceships) {
                drawSpaceship(ship);
            }

            // Alien UFOs
            for (const ufo of ufos) {
                drawUFO(ufo);
            }

            // Floating space aliens
            for (const alien of spaceAliens) {
                drawSpaceAlien(alien);
            }
        }

        /**
         * Selects the next distinct planet type, prioritizing planets not currently active on screen
         */
        function getNextPlanetDef() {
            const activeIds = new Set(balls.map(b => b.planet.id));

            for (let offset = 0; offset < PLANET_TYPES.length; offset++) {
                const candidate = PLANET_TYPES[(planetCycleIndex + offset) % PLANET_TYPES.length];
                if (!activeIds.has(candidate.id)) {
                    return candidate;
                }
            }

            return PLANET_TYPES[planetCycleIndex % PLANET_TYPES.length];
        }

        /**
         * Updates the subtle monochrome status indicator in the header
         */
        function setStatus(text, stateClass = '') {
            if (statusEl.textContent !== text) {
                statusEl.textContent = text;
            }
            if (statusEl.className !== stateClass) {
                statusEl.className = stateClass;
            }
        }

        /**
         * Initializes orbiting accretion disk particles around the black hole
         */
        function initAccretionParticles() {
            accretionParticles = [];
            for (let i = 0; i < ACCRETION_PARTICLE_COUNT; i++) {
                const orbitRadius = EVENT_HORIZON_RADIUS + 3 + Math.random() * (SUCTION_RADIUS - EVENT_HORIZON_RADIUS - 6);
                accretionParticles.push({
                    angle: Math.random() * Math.PI * 2,
                    radius: orbitRadius,
                    baseRadius: orbitRadius,
                    size: Math.random() < 0.35 ? 1.5 : 1,
                    alpha: 0.25 + Math.random() * 0.65,
                    speed: (0.045 + Math.random() * 0.025) * (24 / orbitRadius)
                });
            }
        }

        /**
         * Spawns an expanding white gravitational shockwave/ripple ring
         */
        function spawnRipple(startRadius = EVENT_HORIZON_RADIUS, maxRadius = 95, lineWidth = 1.8) {
            ripples.push({
                radius: startRadius,
                maxRadius: maxRadius,
                alpha: 0.9,
                lineWidth: lineWidth
            });
        }

        /**
         * Dynamically resizes the canvas to fit its fluid container, rebuilds the galaxy backdrop, and centers the black hole
         */
        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            blackHole.x = canvas.width / 2;
            blackHole.y = canvas.height / 2;

            buildGalaxyBackground();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        initCosmicEntities();
        initAccretionParticles();

        // Canvas Click Handler: Launch a new distinct planet at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchPlanet(clickX, clickY);
        });

        /**
         * Spawns and launches a new planet at the specified coordinates
         */
        function launchPlanet(x, y) {
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);
            const vy = -LAUNCH_VELOCITY * Math.cos(rad);

            const planetDef = getNextPlanetDef();
            planetCycleIndex = (PLANET_TYPES.indexOf(planetDef) + 1) % PLANET_TYPES.length;
            lastEventMessage = '';

            balls.push({
                planet: planetDef,
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: planetDef.radius,
                initialRadius: planetDef.radius,
                rotation: 0.4,
                cloudRotation: 0.8,
                trail: [],
                captured: false,
                captureFrame: 0,
                captureDist: 0,
                captureAngle: 0,
                spinDirection: 1
            });

            updateStatusDisplay();
        }

        /**
         * Clears all active planets and resets simulation state
         */
        function resetSimulation() {
            balls = [];
            ripples = [];
            inSuctionZone = false;
            planetCycleIndex = 0;
            lastEventMessage = '';
            setStatus(`Ready · Next: ${PLANET_TYPES[0].name}`, '');
        }

        /**
         * Updates the header status text based on all active planets
         */
        function updateStatusDisplay() {
            const nextPlanet = getNextPlanetDef();

            if (balls.length === 0) {
                if (lastEventMessage) {
                    setStatus(`${lastEventMessage} · Next: ${nextPlanet.name}`, lastEventMessage.includes('Consumed') ? 'danger' : '');
                } else {
                    setStatus(`Ready · Next: ${nextPlanet.name}`, '');
                }
                return;
            }

            const capturedBall = balls.find(b => b.captured);
            if (capturedBall) {
                setStatus(`${capturedBall.planet.name} Sucked In (${balls.length} Active)`, 'danger');
                return;
            }

            if (inSuctionZone) {
                setStatus(`Suction Zone · ${balls.length} Active · Next: ${nextPlanet.name}`, 'danger');
                return;
            }

            if (balls.length === 1) {
                setStatus(`Orbiting: ${balls[0].planet.name} · Next: ${nextPlanet.name}`, 'active');
            } else {
                setStatus(`${balls.length} Planets Orbiting · Next: ${nextPlanet.name}`, 'active');
            }
        }

        /**
         * Updates ambient black hole rotation, accretion particles, and gravitational ripples
         */
        function updateBlackHoleEffects() {
            diskRotation += inSuctionZone ? 0.032 : 0.016;

            for (const p of accretionParticles) {
                p.angle += p.speed * (inSuctionZone ? 1.45 : 1);
                p.radius -= 0.04;
                if (p.radius <= EVENT_HORIZON_RADIUS + 1.5) {
                    p.radius = SUCTION_RADIUS - 3;
                    p.angle = Math.random() * Math.PI * 2;
                }
            }

            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.radius += 2.2;
                const progress = (r.radius - EVENT_HORIZON_RADIUS) / (r.maxRadius - EVENT_HORIZON_RADIUS);
                r.alpha = Math.max(0, 0.85 * (1 - progress));
                if (r.radius >= r.maxRadius) {
                    ripples.splice(i, 1);
                }
            }
        }

        /**
         * Updates all active planets' trajectories, axial spin, suction zone pull, and capture spirals
         */
        function updatePhysics() {
            inSuctionZone = false;

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Handle Sucked-In Capture Spiral Animation
                if (b.captured) {
                    b.captureFrame++;
                    const t = Math.min(1, b.captureFrame / CAPTURE_DURATION);

                    const currentDist = b.captureDist * Math.pow(1 - t, 1.6);
                    b.captureAngle += b.spinDirection * (0.28 + 0.35 * t);

                    b.x = blackHole.x + Math.cos(b.captureAngle) * currentDist;
                    b.y = blackHole.y + Math.sin(b.captureAngle) * currentDist;
                    b.radius = Math.max(0, b.initialRadius * (1 - t));
                    b.rotation += 0.18 * Math.sign(b.planet.spinRate || 1);
                    b.cloudRotation += 0.22;

                    b.trail.push({ x: b.x, y: b.y });
                    if (b.trail.length > TRAIL_LENGTH) {
                        b.trail.shift();
                    }

                    if (b.captureFrame >= CAPTURE_DURATION) {
                        spawnRipple(EVENT_HORIZON_RADIUS, 72, 1.2);
                        lastEventMessage = `${b.planet.name} Consumed`;
                        balls.splice(i, 1);
                    }
                    continue;
                }

                // Remove planet if it travels too far off-screen
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    lastEventMessage = `${b.planet.name} Lost in Space`;
                    balls.splice(i, 1);
                    continue;
                }

                // Distance vector from planet to black hole center
                const dx = blackHole.x - b.x;
                const dy = blackHole.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Event Horizon Check: trigger sucked-in capture animation
                if (dist < blackHole.eventHorizonRadius) {
                    b.captured = true;
                    b.captureFrame = 0;
                    b.captureDist = dist;
                    b.captureAngle = Math.atan2(b.y - blackHole.y, b.x - blackHole.x);

                    const cross = (-dx) * b.vy - (-dy) * b.vx;
                    b.spinDirection = cross >= 0 ? 1 : -1;

                    spawnRipple(EVENT_HORIZON_RADIUS, 105, 2.2);
                    continue;
                }

                const nx = dx / dist;
                const ny = dy / dist;

                let acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Inner Suction Zone Physics
                if (dist < blackHole.suctionRadius) {
                    inSuctionZone = true;

                    const suctionFactor = 1 - (dist / blackHole.suctionRadius);

                    b.rotation += b.planet.spinRate * (1 + 2.1 * suctionFactor);
                    b.cloudRotation += 0.032 + 0.06 * suctionFactor;

                    acceleration += 0.16 * suctionFactor + 0.48 * (suctionFactor * suctionFactor);

                    const tx = -ny;
                    const ty = nx;
                    const tangentialSpeed = b.vx * tx + b.vy * ty;
                    const tangentialDrag = tangentialSpeed * (0.022 * suctionFactor);

                    b.vx -= tx * tangentialDrag;
                    b.vy -= ty * tangentialDrag;
                } else {
                    b.rotation += b.planet.spinRate;
                    b.cloudRotation += 0.032;
                }

                b.vx += acceleration * nx;
                b.vy += acceleration * ny;
                b.x += b.vx;
                b.y += b.vy;

                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }

            updateStatusDisplay();
        }

        /**
         * Wraps an angle in radians to the range [-PI, PI]
         */
        function wrapLongitude(angle) {
            return ((((angle + Math.PI) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)) - Math.PI;
        }

        /**
         * Projects a spherical polygon onto the front hemisphere of a planet
         */
        function drawSphericalPolygon(points, centerLon, rotation, r, fillStyle) {
            const relCenter = wrapLongitude(centerLon + rotation);
            if (Math.cos(relCenter) <= -0.25) return;

            ctx.beginPath();
            for (let i = 0; i < points.length; i++) {
                const [lon, lat] = points[i];
                let relLon = wrapLongitude(lon + rotation);

                if (relLon > Math.PI / 2) relLon = Math.PI / 2;
                if (relLon < -Math.PI / 2) relLon = -Math.PI / 2;

                const px = r * Math.cos(lat) * Math.sin(relLon);
                const py = r * Math.sin(lat);

                if (i === 0) {
                    ctx.moveTo(px, py);
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.closePath();
            ctx.fillStyle = fillStyle;
            ctx.fill();
        }

        /**
         * Projects an elliptical storm spot or crater onto the front hemisphere with limb foreshortening
         */
        function drawSphericalSpot(lon, lat, rotation, r, rx, ry, fillStyle, strokeStyle = null) {
            const relLon = wrapLongitude(lon + rotation);
            const foreshorten = Math.cos(relLon);
            if (foreshorten <= 0.05) return;

            const px = r * Math.cos(lat) * Math.sin(relLon);
            const py = r * Math.sin(lat);

            ctx.beginPath();
            ctx.ellipse(px, py, rx * foreshorten, ry, 0, 0, Math.PI * 2);
            ctx.fillStyle = fillStyle;
            ctx.fill();

            if (strokeStyle) {
                ctx.strokeStyle = strokeStyle;
                ctx.lineWidth = Math.max(0.5, r * 0.05);
                ctx.stroke();
            }
        }

        /**
         * Draws horizontal atmospheric bands across a gas/ice giant sphere
         */
        function drawAtmosphericBands(r, bands) {
            for (const band of bands) {
                const y = band.y * r;
                const h = band.h * r;
                ctx.fillStyle = band.color;
                ctx.fillRect(-r, y - h / 2, r * 2, h);
            }
        }

        /**
         * Draws back or front half of planetary rings (Saturn / Uranus)
         */
        function drawPlanetRings(planetId, r, axialTilt, isFront) {
            ctx.save();
            ctx.rotate(axialTilt);

            const startAngle = isFront ? 0 : Math.PI;
            const endAngle = isFront ? Math.PI : Math.PI * 2;

            if (planetId === 'saturn') {
                // Outer A-ring
                ctx.beginPath();
                ctx.ellipse(0, 0, r * 2.25, r * 0.62, 0, startAngle, endAngle);
                ctx.strokeStyle = 'rgba(218, 192, 138, 0.62)';
                ctx.lineWidth = Math.max(1, r * 0.22);
                ctx.stroke();

                // Bright inner B-ring (separated by Cassini division gap)
                ctx.beginPath();
                ctx.ellipse(0, 0, r * 1.72, r * 0.47, 0, startAngle, endAngle);
                ctx.strokeStyle = 'rgba(245, 224, 172, 0.85)';
                ctx.lineWidth = Math.max(1.2, r * 0.28);
                ctx.stroke();

                // Faint inner C-ring
                ctx.beginPath();
                ctx.ellipse(0, 0, r * 1.38, r * 0.38, 0, startAngle, endAngle);
                ctx.strokeStyle = 'rgba(185, 162, 118, 0.35)';
                ctx.lineWidth = Math.max(0.7, r * 0.14);
                ctx.stroke();
            } else if (planetId === 'uranus') {
                // Delicate translucent ring system
                ctx.beginPath();
                ctx.ellipse(0, 0, r * 1.85, r * 0.48, 0, startAngle, endAngle);
                ctx.strokeStyle = 'rgba(180, 245, 250, 0.42)';
                ctx.lineWidth = Math.max(0.8, r * 0.12);
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(0, 0, r * 1.55, r * 0.40, 0, startAngle, endAngle);
                ctx.strokeStyle = 'rgba(140, 225, 235, 0.25)';
                ctx.lineWidth = Math.max(0.6, r * 0.08);
                ctx.stroke();
            }

            ctx.restore();
        }

        /**
         * Renders each planet with its unique surface details, bands, rings, lighting, and label
         */
        function drawPlanet(b) {
            const r = b.radius;
            if (r <= 0.1) return;

            const p = b.planet;

            ctx.save();
            ctx.translate(b.x, b.y);

            // 1. Soft Outer Atmospheric Glow
            const atmoGrad = ctx.createRadialGradient(0, 0, r * 0.85, 0, 0, r * 1.38);
            atmoGrad.addColorStop(0, p.glowInner);
            atmoGrad.addColorStop(0.55, p.glowMid);
            atmoGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.beginPath();
            ctx.arc(0, 0, r * 1.38, 0, Math.PI * 2);
            ctx.fillStyle = atmoGrad;
            ctx.fill();

            // 2. Back Half of Planetary Rings (for Saturn & Uranus)
            if (p.hasRings) {
                drawPlanetRings(p.id, r, p.axialTilt, false);
            }

            // 3. Clip to Planetary Sphere and Apply Axial Tilt
            ctx.save();
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.clip();

            ctx.rotate(p.axialTilt);

            // 4. Planet-Specific Base & Surface Features
            if (p.id === 'earth') {
                const oceanGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
                oceanGrad.addColorStop(0, '#38a3eb');
                oceanGrad.addColorStop(0.55, '#196ec2');
                oceanGrad.addColorStop(1, '#092c5c');
                ctx.fillStyle = oceanGrad;
                ctx.fillRect(-r, -r, r * 2, r * 2);

                for (const continent of EARTH_CONTINENTS) {
                    drawSphericalPolygon(continent.points, continent.centerLon, b.rotation, r, continent.color);
                }

                // Polar Ice Caps
                ctx.fillStyle = 'rgba(240, 248, 255, 0.9)';
                ctx.beginPath();
                ctx.ellipse(0, -r * 0.92, r * 0.45, r * 0.16, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(0, r * 0.93, r * 0.42, r * 0.15, 0, 0, Math.PI * 2);
                ctx.fill();

                // Drifting Clouds
                for (const cloud of EARTH_CLOUDS) {
                    drawSphericalPolygon(cloud.points, cloud.centerLon, b.cloudRotation, r, 'rgba(255, 255, 255, 0.42)');
                }

            } else if (p.id === 'mars') {
                const marsGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
                marsGrad.addColorStop(0, '#f07c4f');
                marsGrad.addColorStop(0.6, '#c24121');
                marsGrad.addColorStop(1, '#5e1809');
                ctx.fillStyle = marsGrad;
                ctx.fillRect(-r, -r, r * 2, r * 2);

                for (const region of MARS_REGIONS) {
                    drawSphericalPolygon(region.points, region.centerLon, b.rotation, r, region.color);
                }

                // Northern Polar Ice Cap
                ctx.fillStyle = 'rgba(255, 246, 240, 0.92)';
                ctx.beginPath();
                ctx.ellipse(0, -r * 0.92, r * 0.42, r * 0.16, 0, 0, Math.PI * 2);
                ctx.fill();

            } else if (p.id === 'jupiter') {
                ctx.fillStyle = '#d9b88f';
                ctx.fillRect(-r, -r, r * 2, r * 2);

                drawAtmosphericBands(r, [
                    { y: -0.78, h: 0.22, color: '#9c7854' },
                    { y: -0.52, h: 0.20, color: '#f0dfc8' },
                    { y: -0.28, h: 0.24, color: '#b5633c' },
                    { y: 0.0,   h: 0.24, color: '#f5e8d5' },
                    { y: 0.28,  h: 0.26, color: '#a85332' },
                    { y: 0.56,  h: 0.20, color: '#e6d0b3' },
                    { y: 0.80,  h: 0.22, color: '#8f6d4c' }
                ]);

                // Iconic Rotating Great Red Spot
                drawSphericalSpot(
                    0.5, 0.32, b.rotation, r,
                    r * 0.32, r * 0.18,
                    '#cf4629', 'rgba(245, 210, 175, 0.65)'
                );

            } else if (p.id === 'saturn') {
                ctx.fillStyle = '#e6c98a';
                ctx.fillRect(-r, -r, r * 2, r * 2);

                drawAtmosphericBands(r, [
                    { y: -0.75, h: 0.25, color: '#b89b62' },
                    { y: -0.42, h: 0.22, color: '#f5e4b8' },
                    { y: -0.10, h: 0.26, color: '#d9b673' },
                    { y: 0.22,  h: 0.24, color: '#f0dcab' },
                    { y: 0.55,  h: 0.24, color: '#c4a366' },
                    { y: 0.82,  h: 0.22, color: '#9c804c' }
                ]);

            } else if (p.id === 'neptune') {
                const nepGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
                nepGrad.addColorStop(0, '#5496ff');
                nepGrad.addColorStop(0.55, '#2256db');
                nepGrad.addColorStop(1, '#0b1e6b');
                ctx.fillStyle = nepGrad;
                ctx.fillRect(-r, -r, r * 2, r * 2);

                drawAtmosphericBands(r, [
                    { y: -0.35, h: 0.18, color: 'rgba(18, 45, 145, 0.45)' },
                    { y: 0.25,  h: 0.22, color: 'rgba(15, 38, 130, 0.45)' }
                ]);

                // Great Dark Spot & High-Altitude White Methane Streak
                drawSphericalSpot(0.2, 0.22, b.rotation, r, r * 0.28, r * 0.16, '#0c2175');
                drawSphericalSpot(0.35, -0.28, b.rotation * 1.15, r, r * 0.36, r * 0.06, 'rgba(225, 242, 255, 0.72)');

            } else if (p.id === 'venus') {
                const venGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
                venGrad.addColorStop(0, '#fff0c2');
                venGrad.addColorStop(0.55, '#e3aa4b');
                venGrad.addColorStop(1, '#855314');
                ctx.fillStyle = venGrad;
                ctx.fillRect(-r, -r, r * 2, r * 2);

                for (const swirl of VENUS_SWIRLS) {
                    drawSphericalPolygon(swirl.points, swirl.centerLon, b.rotation, r, 'rgba(176, 114, 34, 0.45)');
                }

            } else if (p.id === 'uranus') {
                const uraGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
                uraGrad.addColorStop(0, '#b8fcff');
                uraGrad.addColorStop(0.6, '#5cd0dc');
                uraGrad.addColorStop(1, '#1d6b7a');
                ctx.fillStyle = uraGrad;
                ctx.fillRect(-r, -r, r * 2, r * 2);

                drawAtmosphericBands(r, [
                    { y: -0.30, h: 0.16, color: 'rgba(210, 255, 255, 0.22)' },
                    { y: 0.28,  h: 0.18, color: 'rgba(35, 135, 150, 0.25)' }
                ]);

            } else if (p.id === 'mercury') {
                const merGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
                merGrad.addColorStop(0, '#d2d2d9');
                merGrad.addColorStop(0.6, '#8c8c94');
                merGrad.addColorStop(1, '#3d3d42');
                ctx.fillStyle = merGrad;
                ctx.fillRect(-r, -r, r * 2, r * 2);

                // Impact Craters (including Caloris Basin)
                drawSphericalSpot(-0.6, -0.25, b.rotation, r, r * 0.28, r * 0.25, '#73737a', 'rgba(220, 220, 228, 0.45)');
                drawSphericalSpot(0.5, 0.32, b.rotation, r, r * 0.20, r * 0.18, '#66666e', 'rgba(210, 210, 218, 0.35)');
                drawSphericalSpot(1.8, -0.40, b.rotation, r, r * 0.22, r * 0.20, '#6e6e75', 'rgba(215, 215, 222, 0.4)');
                drawSphericalSpot(-2.1, 0.35, b.rotation, r, r * 0.18, r * 0.16, '#63636b');

            } else if (p.id === 'pluto') {
                const pluGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
                pluGrad.addColorStop(0, '#e3d0bc');
                pluGrad.addColorStop(0.6, '#a68b72');
                pluGrad.addColorStop(1, '#4d3b2c');
                ctx.fillStyle = pluGrad;
                ctx.fillRect(-r, -r, r * 2, r * 2);

                for (const feat of PLUTO_FEATURES) {
                    drawSphericalPolygon(feat.points, feat.centerLon, b.rotation, r, feat.color);
                }
            }

            // Unrotate tilt before applying camera-relative 3D shadow terminator
            ctx.rotate(-p.axialTilt);

            // 5. 3D Spherical Shadow Terminator & Limb Highlight
            const shadowGrad = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.25, 0, 0, r);
            shadowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.12)');
            shadowGrad.addColorStop(0.65, 'rgba(0, 8, 20, 0.16)');
            shadowGrad.addColorStop(1, 'rgba(0, 4, 14, 0.74)');

            ctx.fillStyle = shadowGrad;
            ctx.fillRect(-r, -r, r * 2, r * 2);

            ctx.restore(); // End sphere clip

            // 6. Crisp Planetary Rim Border
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.strokeStyle = p.rimColor;
            ctx.lineWidth = Math.max(0.5, r * 0.075);
            ctx.stroke();

            // 7. Front Half of Planetary Rings (for Saturn & Uranus)
            if (p.hasRings) {
                drawPlanetRings(p.id, r, p.axialTilt, true);
            }

            // 8. Subtle Planet Name Label
            const scaleRatio = r / b.initialRadius;
            if (scaleRatio > 0.35) {
                ctx.font = "9px 'Courier New', monospace";
                ctx.textAlign = 'center';
                ctx.fillStyle = `rgba(255, 255, 255, ${(0.65 * scaleRatio).toFixed(2)})`;
                const labelOffset = p.hasRings ? r + 13 : r + 11;
                ctx.fillText(p.name.toUpperCase(), 0, labelOffset);
            }

            ctx.restore();
        }

        /**
         * Renders the galaxy background, aliens, spaceships, accretion disk, suction zone, planet trails, black hole singularity, and planets
         */
        function draw() {
            // 0. Draw Galaxy, Nebulae, Starfield, Spaceships, and Aliens
            drawGalaxyBackground();

            const cx = blackHole.x;
            const cy = blackHole.y;

            // 1. Draw Faint Outer Dashed Suction-Zone Danger Ring
            ctx.save();
            ctx.beginPath();
            ctx.setLineDash([4, 6]);
            ctx.lineDashOffset = -diskRotation * 24;
            ctx.arc(cx, cy, blackHole.suctionRadius, 0, Math.PI * 2);
            ctx.strokeStyle = inSuctionZone
                ? 'rgba(255, 255, 255, 0.65)'
                : 'rgba(255, 255, 255, 0.24)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();

            // 2. Draw Expanding Gravitational Shockwave Ripples
            for (const r of ripples) {
                ctx.beginPath();
                ctx.arc(cx, cy, r.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${r.alpha.toFixed(3)})`;
                ctx.lineWidth = r.lineWidth;
                ctx.stroke();
            }

            // 3. Draw Animated Rotating Accretion Disk Rings
            ctx.save();
            ctx.translate(cx, cy);

            ctx.save();
            ctx.rotate(diskRotation * 1.8);
            ctx.beginPath();
            ctx.arc(0, 0, EVENT_HORIZON_RADIUS + 6, 0, Math.PI * 1.45);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, EVENT_HORIZON_RADIUS + 6, Math.PI * 1.6, Math.PI * 1.9);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.rotate(-diskRotation * 1.15);
            ctx.beginPath();
            ctx.arc(0, 0, EVENT_HORIZON_RADIUS + 14, 0.2, Math.PI * 1.15);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, EVENT_HORIZON_RADIUS + 22, Math.PI * 0.7, Math.PI * 1.75);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.lineWidth = 0.9;
            ctx.stroke();
            ctx.restore();

            ctx.restore();

            // 4. Draw Swirling Accretion Particles
            for (const p of accretionParticles) {
                const px = cx + Math.cos(p.angle) * p.radius;
                const py = cy + Math.sin(p.angle) * p.radius;

                ctx.beginPath();
                ctx.arc(px, py, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha.toFixed(2)})`;
                ctx.fill();
            }

            // 5. Draw Each Planet's Orbital Motion Trail
            for (const b of balls) {
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = b.planet.trailColor;
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }
            }

            // 6. Draw Pitch-Black Singularity Core & Bright Glowing Photon Ring
            ctx.save();
            const coronaGrad = ctx.createRadialGradient(
                cx, cy, EVENT_HORIZON_RADIUS - 1,
                cx, cy, EVENT_HORIZON_RADIUS + 14
            );
            coronaGrad.addColorStop(0, 'rgba(255, 255, 255, 0.75)');
            coronaGrad.addColorStop(0.35, 'rgba(255, 255, 255, 0.22)');
            coronaGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.beginPath();
            ctx.arc(cx, cy, EVENT_HORIZON_RADIUS + 14, 0, Math.PI * 2);
            ctx.fillStyle = coronaGrad;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(cx, cy, EVENT_HORIZON_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 14;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            // 7. Draw All Active Planets
            for (const b of balls) {
                drawPlanet(b);
            }
        }

        function animate() {
            updatePhysics();
            updateBlackHoleEffects();
            updateCosmicEntities();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
