<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Baseline</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <button class="btn-reset" onclick="resetSimulation()">Reset</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas to launch astronauts.
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;          // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;      // Prevents infinite velocity near center
        const MAX_ASTRONAUTS = 50;         // Cap simultaneous astronauts for performance

        // STATE VARIABLES
        let astronauts = [];

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 12
        };

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Canvas Click Handler: Launch an additional astronaut at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchAstronaut(clickX, clickY);
        });

        function launchAstronaut(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Remove oldest astronaut if cap is reached
            if (astronauts.length >= MAX_ASTRONAUTS) {
                astronauts.shift();
            }

            // Append new astronaut so multiple remain active simultaneously
            astronauts.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 12,
                angle: 0,
                angularVelocity: 0.03, // Gentle zero-gravity tumble
                trail: [] // Stores history of past {x, y} coordinates
            });
        }

        function resetSimulation() {
            astronauts = [];
        }

        function updatePhysics() {
            for (let i = astronauts.length - 1; i >= 0; i--) {
                const a = astronauts[i];

                // Remove astronaut if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (a.x < -margin || a.x > canvas.width + margin || 
                    a.y < -margin || a.y > canvas.height + margin) {
                    astronauts.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - a.x;
                const dy = centralNode.y - a.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: astronaut collides with central mass
                if (dist < centralNode.radius + a.radius) {
                    astronauts.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity, position, and rotation
                a.vx += ax;
                a.vy += ay;
                a.x += a.vx;
                a.y += a.vy;
                a.angle += a.angularVelocity;

                // Record position history for line trail
                a.trail.push({ x: a.x, y: a.y });
                if (a.trail.length > TRAIL_LENGTH) {
                    a.trail.shift();
                }
            }
        }

        function drawRoundedRect(x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function drawAstronaut(x, y, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 1. Life-Support Backpack (PLSS)
            ctx.fillStyle = '#cccccc';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            drawRoundedRect(-8, -6, 5, 11, 1.5);
            ctx.fill();
            ctx.stroke();

            // 2. Legs (floating zero-G pose)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3.5;
            // Left/back leg
            ctx.beginPath();
            ctx.moveTo(-2, 5);
            ctx.lineTo(-4, 11);
            ctx.lineTo(-2, 14);
            ctx.stroke();
            // Right/front leg
            ctx.beginPath();
            ctx.moveTo(2, 5);
            ctx.lineTo(4, 10);
            ctx.lineTo(6, 13);
            ctx.stroke();

            // 3. Arms (floating outward)
            ctx.lineWidth = 3;
            // Left/back arm
            ctx.beginPath();
            ctx.moveTo(-4, -3);
            ctx.lineTo(-9, 1);
            ctx.stroke();
            // Right/front arm
            ctx.beginPath();
            ctx.moveTo(4, -3);
            ctx.lineTo(9, -6);
            ctx.stroke();

            // 4. Torso (spacesuit body)
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1;
            drawRoundedRect(-5, -5, 10, 11, 2.5);
            ctx.fill();
            ctx.stroke();

            // Chest control module
            ctx.fillStyle = '#000000';
            ctx.fillRect(-2, -2, 5, 4);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-1, -1, 1.2, 1.2);
            ctx.fillRect(1, -1, 1.2, 1.2);

            // 5. Helmet
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(0, -10, 6.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Visor
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(1.5, -10, 4.2, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Visor reflection glint
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(2.2, -10.8, 2, -Math.PI * 0.7, -Math.PI * 0.15);
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            // Clear canvas background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Central Mass Node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Center mark on node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // 2. Draw Astronauts & Trails
            for (const a of astronauts) {
                // Draw path line
                if (a.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(a.trail[0].x, a.trail[0].y);
                    for (let t = 1; t < a.trail.length; t++) {
                        ctx.lineTo(a.trail[t].x, a.trail[t].y);
                    }
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }

                // Draw astronaut figure
                drawAstronaut(a.x, a.y, a.angle);
            }
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
