<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Coaster Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Trebuchet MS', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1e1b4b 0%, #090d16 100%);
            color: #fef3c7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Amusement Park Marquee Header */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding: 10px 18px;
            background: linear-gradient(90deg, #7f1d1d 0%, #991b1b 50%, #7f1d1d 100%);
            border: 2px solid #fbbf24;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(251, 191, 36, 0.25);
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .marquee-bulb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fde047;
            box-shadow: 0 0 8px #fbbf24, 0 0 14px #f59e0b;
            animation: blink 1.2s infinite alternate;
        }

        .marquee-bulb:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes blink {
            from { opacity: 0.45; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1.1); }
        }

        h1 {
            font-size: 20px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 900;
            color: #fef08a;
            text-shadow: 2px 2px 0px #450a0a;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .ride-counter {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fde68a;
            background: rgba(0, 0, 0, 0.35);
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid rgba(251, 191, 36, 0.4);
        }

        .btn-reset {
            background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
            color: #1f2937;
            border: 2px solid #fef3c7;
            border-radius: 6px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 3px 0 #78350f;
            transition: all 0.12s ease-in-out;
        }

        .btn-reset:hover {
            background: linear-gradient(180deg, #fde047 0%, #f59e0b 100%);
            transform: translateY(-1px);
        }

        .btn-reset:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #78350f;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.75);
        }

        canvas {
            background-color: #0f172a;
            border: 3px solid #475569;
            border-radius: 8px;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 12px;
            color: #cbd5e1;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .instructions span {
            color: #fbbf24;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Marquee Header Section -->
    <div id="header">
        <div class="title-group">
            <div class="marquee-bulb"></div>
            <h1>Gravity Coaster</h1>
            <div class="marquee-bulb"></div>
        </div>
        <div class="controls-group">
            <div class="ride-counter" id="trainCounter">Active Trains: 0</div>
            <button class="btn-reset" onclick="resetSimulation()">Clear Tracks</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        <span>TICKET BOOTH OPEN:</span> Click anywhere in the twilight sky to dispatch a rollercoaster train onto the tracks.
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const trainCounterEl = document.getElementById('trainCounter');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;          // Number of historic track points stored
        const SOFTENING_FACTOR = 400;      // Prevents infinite velocity near center
        const BALL_RADIUS = 4;             // Coaster lead car boundary radius in pixels
        const LEAD_COLLISION_RADIUS = 5.5; // Lead car hitbox radius for train-to-train collisions
        const CAR_COLLISION_RADIUS = 4.5;  // Trailing car hitbox radius for train-to-train collisions
        const TRAIN_RESTITUTION = 0.95;    // Elasticity of train-to-train collisions

        // COASTER COLOR PALETTE
        const COASTER_THEMES = [
            { spine: '#ef4444', tie: '#991b1b', car: '#dc2626', stripe: '#fef08a' }, // Crimson Flyer
            { spine: '#06b6d4', tie: '#155e75', car: '#0891b2', stripe: '#ffffff' }, // Cyclone Teal
            { spine: '#f59e0b', tie: '#92400e', car: '#d97706', stripe: '#fef3c7' }, // Gold Rush
            { spine: '#ec4899', tie: '#9d174d', car: '#db2777', stripe: '#fbcfe8' }, // Neon Whip
            { spine: '#10b981', tie: '#065f46', car: '#059669', stripe: '#d1fae5' }  // Viper Green
        ];

        // STATE VARIABLES
        let balls = [];
        let sparks = [];
        let collisionRings = [];
        let stars = [];
        let themeIndex = 0;
        let wheelAngle = 0;

        // Central Gravity Node Definition (Giant Ferris Wheel Hub)
        const centralNode = {
            x: 0,
            y: 0,
            radius: 12
        };

        function generateStars() {
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 9000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height * 0.72),
                    size: Math.random() * 1.6 + 0.4,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            generateStars();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Canvas Click Handler: Dispatch coaster train at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchBall(clickX, clickY);
        });

        function updateCounter() {
            trainCounterEl.textContent = `Active Trains: ${balls.length}`;
        }

        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Clamp initial spawn inside the box boundaries
            const startX = Math.max(BALL_RADIUS, Math.min(canvas.width - BALL_RADIUS, x));
            const startY = Math.max(BALL_RADIUS, Math.min(canvas.height - BALL_RADIUS, y));

            const palette = COASTER_THEMES[themeIndex % COASTER_THEMES.length];
            themeIndex++;

            // Append new coaster train to allow multiple trains on screen simultaneously
            balls.push({
                x: startX,
                y: startY,
                vx: vx,
                vy: vy,
                radius: BALL_RADIUS,
                theme: palette,
                trail: [{ x: startX, y: startY }]
            });

            spawnSparks(startX, startY, palette.stripe, 8);
            updateCounter();
        }

        function spawnSparks(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2.5 + 0.8;
                sparks.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    color
                });
            }
        }

        function spawnCollisionRing(x, y) {
            collisionRings.push({
                x,
                y,
                radius: 4,
                life: 1.0
            });
        }

        function resetSimulation() {
            balls = [];
            sparks = [];
            collisionRings = [];
            updateCounter();
        }

        // Compute world positions and hitboxes for a train's lead car and trailing cars
        function getTrainCars(b) {
            const cars = [{
                x: b.x,
                y: b.y,
                angle: Math.atan2(b.vy, b.vx),
                radius: LEAD_COLLISION_RADIUS,
                isLead: true
            }];

            const carOffsets = [11, 21];
            let targetIdx = 0;
            let accumulatedDist = 0;

            for (let t = b.trail.length - 1; t > 0 && targetIdx < carOffsets.length; t--) {
                const pCurr = b.trail[t];
                const pPrev = b.trail[t - 1];
                const dx = pCurr.x - pPrev.x;
                const dy = pCurr.y - pPrev.y;
                const segLen = Math.hypot(dx, dy);

                if (segLen > 0.001) {
                    accumulatedDist += segLen;
                    if (accumulatedDist >= carOffsets[targetIdx]) {
                        cars.push({
                            x: pPrev.x,
                            y: pPrev.y,
                            angle: Math.atan2(dy, dx),
                            radius: CAR_COLLISION_RADIUS,
                            isLead: false
                        });
                        targetIdx++;
                    }
                }
            }

            return cars;
        }

        // Handle elastic collisions between distinct trains (across lead and trailing cars)
        function resolveTrainCollisions() {
            const count = balls.length;
            if (count < 2) return;

            const allTrainCars = balls.map(b => getTrainCars(b));

            for (let i = 0; i < count; i++) {
                for (let j = i + 1; j < count; j++) {
                    const b1 = balls[i];
                    const b2 = balls[j];
                    const cars1 = allTrainCars[i];
                    const cars2 = allTrainCars[j];

                    // Find the deepest-penetrating car contact between train i and train j
                    let deepestContact = null;
                    let maxOverlap = 0;

                    for (let c1Idx = 0; c1Idx < cars1.length; c1Idx++) {
                        const c1 = cars1[c1Idx];
                        for (let c2Idx = 0; c2Idx < cars2.length; c2Idx++) {
                            const c2 = cars2[c2Idx];
                            const dx = c1.x - c2.x;
                            const dy = c1.y - c2.y;
                            const dist = Math.hypot(dx, dy);
                            const minDist = c1.radius + c2.radius;
                            const overlap = minDist - dist;

                            if (overlap > maxOverlap) {
                                maxOverlap = overlap;
                                deepestContact = { c1, c2, dx, dy, dist };
                            }
                        }
                    }

                    if (deepestContact) {
                        const { c1, c2, dx, dy, dist } = deepestContact;
                        let nx = 1;
                        let ny = 0;
                        if (dist > 0.0001) {
                            nx = dx / dist;
                            ny = dy / dist;
                        }

                        // Separate overlapping trains equally along the collision normal
                        const separation = maxOverlap * 0.5;
                        b1.x += nx * separation;
                        b1.y += ny * separation;
                        b2.x -= nx * separation;
                        b2.y -= ny * separation;

                        // Relative velocity along the collision normal
                        const dvx = b1.vx - b2.vx;
                        const dvy = b1.vy - b2.vy;
                        const velAlongNormal = dvx * nx + dvy * ny;

                        // Apply elastic impulse if trains are moving toward each other
                        if (velAlongNormal < 0) {
                            const impulse = -(1 + TRAIN_RESTITUTION) * velAlongNormal * 0.5;
                            b1.vx += impulse * nx;
                            b1.vy += impulse * ny;
                            b2.vx -= impulse * nx;
                            b2.vy -= impulse * ny;

                            const contactX = (c1.x + c2.x) * 0.5;
                            const contactY = (c1.y + c2.y) * 0.5;
                            spawnSparks(contactX, contactY, b1.theme.stripe, 6);
                            spawnSparks(contactX, contactY, b2.theme.stripe, 6);
                            spawnCollisionRing(contactX, contactY);
                        }
                    }
                }
            }
        }

        function updatePhysics() {
            wheelAngle += 0.012;

            // Update celebratory & collision sparks
            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.x += s.vx;
                s.y += s.vy;
                s.vy += 0.05;
                s.life -= 0.04;
                if (s.life <= 0) {
                    sparks.splice(i, 1);
                }
            }

            // Update expanding collision shockwave rings
            for (let i = collisionRings.length - 1; i >= 0; i--) {
                const r = collisionRings[i];
                r.radius += 1.6;
                r.life -= 0.06;
                if (r.life <= 0) {
                    collisionRings.splice(i, 1);
                }
            }

            // 1. Apply central gravity and integrate train positions
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: train docks into the central Ferris wheel station
                if (dist < centralNode.radius + b.radius) {
                    spawnSparks(b.x, b.y, '#fde047', 16);
                    balls.splice(i, 1);
                    updateCounter();
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;
            }

            // 2. Resolve collisions between trains
            resolveTrainCollisions();

            // 3. Enforce park boundary wall bounces and record coaster track history
            for (let i = 0; i < balls.length; i++) {
                const b = balls[i];

                // Bounce off the left and right walls of the park
                if (b.x - b.radius < 0) {
                    b.x = b.radius;
                    b.vx = -b.vx;
                    spawnSparks(b.x, b.y, '#ffffff', 5);
                } else if (b.x + b.radius > canvas.width) {
                    b.x = canvas.width - b.radius;
                    b.vx = -b.vx;
                    spawnSparks(b.x, b.y, '#ffffff', 5);
                }

                // Bounce off the top and bottom walls of the park
                if (b.y - b.radius < 0) {
                    b.y = b.radius;
                    b.vy = -b.vy;
                    spawnSparks(b.x, b.y, '#ffffff', 5);
                } else if (b.y + b.radius > canvas.height) {
                    b.y = canvas.height - b.radius;
                    b.vy = -b.vy;
                    spawnSparks(b.x, b.y, '#ffffff', 5);
                }

                // Record position history for coaster track
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }
        }

        function drawParkBackground() {
            // Twilight carnival sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#090d1f');
            skyGrad.addColorStop(0.55, '#1e1b4b');
            skyGrad.addColorStop(0.85, '#4c1d4b');
            skyGrad.addColorStop(1, '#7c2d12');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle coaster blueprint grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Twinkling evening stars
            const time = Date.now() * 0.003;
            for (const st of stars) {
                const alpha = 0.35 + 0.55 * Math.sin(time + st.phase);
                ctx.fillStyle = `rgba(254, 249, 195, ${alpha.toFixed(2)})`;
                ctx.beginPath();
                ctx.arc(st.x, st.y, st.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Distant theme park ground & carnival tent silhouettes
            const groundY = canvas.height - 16;
            ctx.fillStyle = '#070a12';
            ctx.fillRect(0, groundY, canvas.width, 16);

            // Circus tent silhouette on left
            ctx.beginPath();
            ctx.moveTo(40, groundY);
            ctx.lineTo(85, groundY - 26);
            ctx.lineTo(130, groundY);
            ctx.closePath();
            ctx.fill();

            // Distant drop tower silhouette on right
            const towerX = canvas.width - 90;
            ctx.fillRect(towerX, groundY - 65, 6, 65);
            ctx.fillRect(towerX - 5, groundY - 52, 16, 4);

            // Warm string lights along the midway ground
            for (let x = 16; x < canvas.width; x += 28) {
                ctx.fillStyle = (x % 56 === 16) ? 'rgba(251, 191, 36, 0.55)' : 'rgba(248, 113, 113, 0.55)';
                ctx.beginPath();
                ctx.arc(x, groundY - 2, 1.8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawCentralFerrisHub() {
            const cx = centralNode.x;
            const cy = centralNode.y;
            const r = centralNode.radius;

            // A-Frame support legs reaching toward the park ground
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx - 26, canvas.height - 16);
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + 26, canvas.height - 16);
            ctx.stroke();

            // Warm carnival aura around the central station
            const glow = ctx.createRadialGradient(cx, cy, r * 0.4, cx, cy, r * 2.6);
            glow.addColorStop(0, 'rgba(251, 191, 36, 0.45)');
            glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(cx, cy, r * 2.6, 0, Math.PI * 2);
            ctx.fill();

            // Rotating spokes
            const numSpokes = 8;
            ctx.strokeStyle = '#fde68a';
            ctx.lineWidth = 1.2;
            for (let i = 0; i < numSpokes; i++) {
                const ang = wheelAngle + (i * Math.PI * 2) / numSpokes;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r);
                ctx.stroke();
            }

            // Outer wheel rim
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Glowing rim bulbs
            for (let i = 0; i < numSpokes; i++) {
                const ang = wheelAngle + (i * Math.PI * 2) / numSpokes;
                const bx = cx + Math.cos(ang) * r;
                const by = cy + Math.sin(ang) * r;
                ctx.beginPath();
                ctx.arc(bx, by, 1.8, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            // Central hub cap
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function drawCoasterTrack(b) {
            const trail = b.trail;
            if (trail.length < 2) return;

            // 1. Vertical Steel Support Pillars (periodic along track)
            let distSincePillar = 0;
            for (let t = 1; t < trail.length; t++) {
                const p1 = trail[t - 1];
                const p2 = trail[t];
                const segLen = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                distSincePillar += segLen;

                if (distSincePillar >= 70) {
                    distSincePillar = 0;
                    const ageRatio = t / trail.length;
                    ctx.strokeStyle = `rgba(148, 163, 184, ${(0.16 * ageRatio).toFixed(3)})`;
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(p2.x, p2.y);
                    ctx.lineTo(p2.x, canvas.height - 16);
                    ctx.stroke();
                }
            }

            // 2. Main Tubular Coaster Spine
            ctx.beginPath();
            ctx.moveTo(trail[0].x, trail[0].y);
            for (let t = 1; t < trail.length; t++) {
                ctx.lineTo(trail[t].x, trail[t].y);
            }
            ctx.strokeStyle = b.theme.spine;
            ctx.lineWidth = 3.2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            // 3. Track Cross-Ties (Sleepers)
            let distSinceTie = 0;
            ctx.strokeStyle = b.theme.tie;
            ctx.lineWidth = 1.6;
            for (let t = 1; t < trail.length; t++) {
                const p1 = trail[t - 1];
                const p2 = trail[t];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const segLen = Math.hypot(dx, dy);

                if (segLen > 0.001) {
                    distSinceTie += segLen;
                    if (distSinceTie >= 9) {
                        distSinceTie = 0;
                        // Unit normal perpendicular to track direction
                        const nx = -dy / segLen;
                        const ny = dx / segLen;
                        ctx.beginPath();
                        ctx.moveTo(p2.x - nx * 4, p2.y - ny * 4);
                        ctx.lineTo(p2.x + nx * 4, p2.y + ny * 4);
                        ctx.stroke();
                    }
                }
            }

            // 4. Gleaming Top Steel Rail Highlight
            ctx.beginPath();
            ctx.moveTo(trail[0].x, trail[0].y);
            for (let t = 1; t < trail.length; t++) {
                ctx.lineTo(trail[t].x, trail[t].y);
            }
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function drawSingleCar(x, y, angle, theme, isLead) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Headlight beam on lead car
            if (isLead) {
                const beam = ctx.createLinearGradient(4, 0, 26, 0);
                beam.addColorStop(0, 'rgba(254, 240, 138, 0.45)');
                beam.addColorStop(1, 'rgba(254, 240, 138, 0)');
                ctx.fillStyle = beam;
                ctx.beginPath();
                ctx.moveTo(4, -2);
                ctx.lineTo(26, -8);
                ctx.lineTo(26, 8);
                ctx.lineTo(4, 2);
                ctx.closePath();
                ctx.fill();
            }

            // Coaster car body
            const w = isLead ? 12 : 9;
            const h = isLead ? 7 : 6;
            ctx.fillStyle = theme.car;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;

            ctx.beginPath();
            ctx.roundRect(-w / 2, -h / 2, w, h, isLead ? [2, 4, 4, 2] : 2);
            ctx.fill();
            ctx.stroke();

            // Racing stripe
            ctx.fillStyle = theme.stripe;
            ctx.fillRect(-w / 2 + 1.5, -1, w - 3, 2);

            // Tiny passenger head dot
            ctx.fillStyle = '#fef3c7';
            ctx.beginPath();
            ctx.arc(-1, 0, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawCoasterTrain(b) {
            const cars = getTrainCars(b);

            // Draw trailing cars first so the lead car renders cleanly on top
            for (let c = cars.length - 1; c >= 0; c--) {
                const car = cars[c];
                drawSingleCar(car.x, car.y, car.angle, b.theme, car.isLead);
            }
        }

        function drawSparks() {
            for (const s of sparks) {
                ctx.fillStyle = s.color;
                ctx.globalAlpha = Math.max(0, s.life);
                ctx.beginPath();
                ctx.arc(s.x, s.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            for (const r of collisionRings) {
                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 1.5;
                ctx.globalAlpha = Math.max(0, r.life * 0.75);
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.globalAlpha = 1;
        }

        function draw() {
            // 1. Twilight amusement park background
            drawParkBackground();

            // 2. Central Ferris wheel station
            drawCentralFerrisHub();

            // 3. Coaster tracks & multi-car trains
            for (const b of balls) {
                drawCoasterTrack(b);
            }
            for (const b of balls) {
                drawCoasterTrain(b);
            }

            // 4. Launch, collision & station arrival sparks
            drawSparks();
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
