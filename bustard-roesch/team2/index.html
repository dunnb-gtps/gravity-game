<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Simulation - Jungle Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #07140e;
            color: #e8f5ee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #35684e;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            color: #d8f3dc;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
        }

        .btn-reset {
            background: rgba(13, 38, 27, 0.75);
            color: #d8f3dc;
            border: 1px solid #52b788;
            border-radius: 4px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #52b788;
            color: #07140e;
        }

        .btn-reset:active {
            transform: scale(0.97);
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
        }

        canvas {
            background-color: #081c15;
            border: 1px solid #35684e;
            border-radius: 6px;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #8cb89f;
            text-align: center;
            letter-spacing: 0.4px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <button class="btn-reset" onclick="resetSimulation()">Reset</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas to launch a ball — the guy in the middle will shoot it with bananas!
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Offscreen canvas to cache the detailed procedural jungle scene for smooth 60fps rendering
        const bgCanvas = document.createElement('canvas');
        const bgCtx = bgCanvas.getContext('2d');

        // SIMULATION CONSTANTS (Preserved from baseline)
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;          // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;      // Prevents infinite velocity near center

        // STATE VARIABLES
        let balls = [];
        let bananas = [];
        let impactEffects = [];
        let fireflies = [];
        let vines = [];
        let monkeys = [];
        let animTime = 0;

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 12
        };

        // Central Banana Gunner Aiming & Recoil State
        const guyState = {
            facing: 1,
            aimAngle: -0.14,
            recoil: 0,
            muzzleFlash: 0,
            fireCooldown: 0
        };

        // Deterministic PRNG (Mulberry32) so jungle foliage stays consistent across resizes
        function createSeededRandom(seed) {
            return function() {
                let t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        // Evaluate exact point (x, y) along a stored cubic Bezier vine at parameter t in [0, 1]
        function getPointOnVine(vine, t) {
            const u = 1 - t;
            const x = u * u * u * vine.p0.x +
                      3 * u * u * t * vine.p1.x +
                      3 * u * t * t * vine.p2.x +
                      t * t * t * vine.p3.x;
            const y = u * u * u * vine.p0.y +
                      3 * u * u * t * vine.p1.y +
                      3 * u * t * t * vine.p2.y +
                      t * t * t * vine.p3.y;
            return { x, y };
        }

        // Initialize 4 expressive monkeys attached to well-spaced left & right canopy vines
        function initMonkeys(width, height) {
            if (vines.length === 0) {
                monkeys = [];
                return;
            }

            const rand = createSeededRandom(73519);

            const monkeySpecs = [
                { targetNormX: 0.13, pose: 'one-arm',     facing: 1,  tAttach: 0.72, furMain: '#5c3820', furDark: '#3d2312', furLight: '#7a4d2e', skin: '#e8be96', skinShade: '#cfa074' },
                { targetNormX: 0.26, pose: 'upside-down', facing: 1,  tAttach: 0.75, furMain: '#6b4226', furDark: '#472a16', furLight: '#8a5937', skin: '#edd0b0', skinShade: '#d4af87' },
                { targetNormX: 0.74, pose: 'two-arm',     facing: -1, tAttach: 0.74, furMain: '#54321c', furDark: '#361e0f', furLight: '#734729', skin: '#e6ba91', skinShade: '#c9986b' },
                { targetNormX: 0.87, pose: 'one-arm',     facing: -1, tAttach: 0.70, furMain: '#663e22', furDark: '#422613', furLight: '#855331', skin: '#ebc7a4', skinShade: '#cfa67e' }
            ];

            const scale = Math.max(0.72, Math.min(1.0, Math.min(width, height) / 600));
            const usedVineIndices = new Set();
            const existingStates = monkeys;
            monkeys = [];

            monkeySpecs.forEach((spec, idx) => {
                let bestVine = null;
                let bestDist = Infinity;

                for (const vine of vines) {
                    if (usedVineIndices.has(vine.index)) continue;
                    if (vine.normX < 0.08 || vine.normX > 0.92) continue;
                    if (vine.normX > 0.34 && vine.normX < 0.66) continue;

                    const d = Math.abs(vine.normX - spec.targetNormX);
                    if (d < bestDist) {
                        bestDist = d;
                        bestVine = vine;
                    }
                }

                if (!bestVine) return;
                usedVineIndices.add(bestVine.index);

                const anchor = getPointOnVine(bestVine, spec.tAttach);
                const prev = existingStates[idx];

                monkeys.push({
                    vineIndex: bestVine.index,
                    anchorX: anchor.x,
                    anchorY: anchor.y,
                    pose: spec.pose,
                    facing: spec.facing,
                    scale: scale,
                    furMain: spec.furMain,
                    furDark: spec.furDark,
                    furLight: spec.furLight,
                    skin: spec.skin,
                    skinShade: spec.skinShade,
                    phase: prev ? prev.phase : rand() * Math.PI * 2,
                    swaySpeed: 0.028 + rand() * 0.01,
                    swayAmp: 0.048 + rand() * 0.022,
                    tailSpeed: 0.045 + rand() * 0.015,
                    actionSpeed: 0.075 + rand() * 0.02,
                    currentAngle: 0,
                    blinkTimer: prev ? prev.blinkTimer : Math.floor(60 + rand() * 180),
                    blinkDuration: 10,
                    blinkProgress: 0,
                    gazeX: prev ? prev.gazeX : 0,
                    gazeY: prev ? prev.gazeY : 0
                });
            });
        }

        // Initialize drifting jungle fireflies / forest dust motes
        function initFireflies(width, height) {
            const rand = createSeededRandom(90210);
            const count = 34;
            fireflies = [];

            for (let i = 0; i < count; i++) {
                fireflies.push({
                    x: rand() * width,
                    y: rand() * height,
                    baseX: rand() * width,
                    baseY: rand() * height,
                    radius: 1.1 + rand() * 1.6,
                    speedX: (rand() - 0.5) * 0.28,
                    speedY: -0.08 - rand() * 0.22,
                    phase: rand() * Math.PI * 2,
                    pulseSpeed: 0.02 + rand() * 0.03,
                    swayAmp: 12 + rand() * 24,
                    swayFreq: 0.006 + rand() * 0.01,
                    isWarmGold: rand() > 0.35
                });
            }
        }

        // Helper: Draw a curved tropical palm frond with radiating leaflets
        function drawPalmFrond(targetCtx, startX, startY, ctrlX, ctrlY, endX, endY, leafletCount, maxLen, color, highlightColor) {
            targetCtx.save();

            targetCtx.beginPath();
            targetCtx.moveTo(startX, startY);
            targetCtx.quadraticCurveTo(ctrlX, ctrlY, endX, endY);
            targetCtx.strokeStyle = highlightColor || color;
            targetCtx.lineWidth = 2.2;
            targetCtx.stroke();

            for (let i = 1; i < leafletCount; i++) {
                const t = i / leafletCount;
                const invT = 1 - t;

                const px = invT * invT * startX + 2 * invT * t * ctrlX + t * t * endX;
                const py = invT * invT * startY + 2 * invT * t * ctrlY + t * t * endY;

                const tx = 2 * invT * (ctrlX - startX) + 2 * t * (endX - ctrlX);
                const ty = 2 * invT * (ctrlY - startY) + 2 * t * (endY - ctrlY);
                const angle = Math.atan2(ty, tx);

                const profile = Math.sin(t * Math.PI);
                const len = maxLen * (0.25 + 0.85 * profile);

                for (const side of [-1, 1]) {
                    const leafAngle = angle + side * (1.05 - t * 0.25);
                    const tipX = px + Math.cos(leafAngle) * len;
                    const tipY = py + Math.sin(leafAngle) * len + len * 0.18;
                    const midX = (px + tipX) * 0.5 + Math.cos(leafAngle - side * 0.4) * (len * 0.14);
                    const midY = (py + tipY) * 0.5 + Math.sin(leafAngle - side * 0.4) * (len * 0.14);

                    targetCtx.beginPath();
                    targetCtx.moveTo(px, py);
                    targetCtx.quadraticCurveTo(midX, midY, tipX, tipY);
                    targetCtx.quadraticCurveTo(
                        (px + tipX) * 0.5 - Math.cos(leafAngle - side * 0.4) * (len * 0.08),
                        (py + tipY) * 0.5 - Math.sin(leafAngle - side * 0.4) * (len * 0.08),
                        px,
                        py
                    );
                    targetCtx.fillStyle = color;
                    targetCtx.fill();
                }
            }

            targetCtx.restore();
        }

        // Helper: Draw a broad tropical Monstera leaf with natural splits
        function drawMonsteraLeaf(targetCtx, baseX, baseY, angle, size, fillColor, veinColor) {
            targetCtx.save();
            targetCtx.translate(baseX, baseY);
            targetCtx.rotate(angle);

            targetCtx.beginPath();
            targetCtx.moveTo(0, 0);
            targetCtx.quadraticCurveTo(size * 0.05, -size * 0.25, 0, -size * 0.45);
            targetCtx.strokeStyle = veinColor;
            targetCtx.lineWidth = Math.max(2, size * 0.03);
            targetCtx.stroke();

            targetCtx.translate(0, -size * 0.42);
            targetCtx.beginPath();
            targetCtx.moveTo(0, 0);

            targetCtx.bezierCurveTo(-size * 0.45, size * 0.15, -size * 0.62, -size * 0.32, -size * 0.48, -size * 0.52);
            targetCtx.lineTo(-size * 0.22, -size * 0.46);
            targetCtx.lineTo(-size * 0.44, -size * 0.60);
            targetCtx.bezierCurveTo(-size * 0.40, -size * 0.76, -size * 0.34, -size * 0.84, -size * 0.18, -size * 0.78);
            targetCtx.lineTo(-size * 0.30, -size * 0.90);
            targetCtx.quadraticCurveTo(-size * 0.14, -size * 1.12, 0, -size * 1.22);
            targetCtx.quadraticCurveTo(size * 0.14, -size * 1.12, size * 0.30, -size * 0.90);
            targetCtx.lineTo(size * 0.18, -size * 0.78);
            targetCtx.bezierCurveTo(size * 0.34, -size * 0.84, size * 0.40, -size * 0.76, size * 0.44, -size * 0.60);
            targetCtx.lineTo(size * 0.22, -size * 0.46);
            targetCtx.lineTo(size * 0.48, -size * 0.52);
            targetCtx.bezierCurveTo(size * 0.62, -size * 0.32, size * 0.45, size * 0.15, 0, 0);

            targetCtx.fillStyle = fillColor;
            targetCtx.fill();

            targetCtx.beginPath();
            targetCtx.moveTo(0, -size * 0.04);
            targetCtx.lineTo(0, -size * 1.12);
            targetCtx.strokeStyle = veinColor;
            targetCtx.lineWidth = 1.4;
            targetCtx.stroke();

            targetCtx.restore();
        }

        // Helper: Draw a hanging liana vine with pairs of tropical leaves and return its exact cubic Bezier curve
        function drawHangingVine(targetCtx, anchorX, length, sway, leafDensity, vineColor, leafColor, leafHighlight) {
            targetCtx.save();

            const cp1X = anchorX + sway;
            const cp1Y = length * 0.35;
            const cp2X = anchorX - sway * 0.8;
            const cp2Y = length * 0.72;
            const endX = anchorX + sway * 0.4;
            const endY = length;

            targetCtx.beginPath();
            targetCtx.moveTo(anchorX, -5);
            targetCtx.bezierCurveTo(cp1X, cp1Y, cp2X, cp2Y, endX, endY);
            targetCtx.strokeStyle = vineColor;
            targetCtx.lineWidth = 2.2;
            targetCtx.stroke();

            for (let i = 1; i <= leafDensity; i++) {
                const t = i / (leafDensity + 0.5);
                const u = 1 - t;

                const vx = u * u * u * anchorX +
                           3 * u * u * t * cp1X +
                           3 * u * t * t * cp2X +
                           t * t * t * endX;
                const vy = u * u * u * (-5) +
                           3 * u * u * t * cp1Y +
                           3 * u * t * t * cp2Y +
                           t * t * t * endY;

                const side = (i % 2 === 0) ? 1 : -1;
                const leafLen = 13 + Math.sin(t * Math.PI) * 9;
                const leafWid = leafLen * 0.45;
                const leafAngle = side * (0.55 + (i % 3) * 0.15);

                targetCtx.save();
                targetCtx.translate(vx, vy);
                targetCtx.rotate(leafAngle);

                targetCtx.beginPath();
                targetCtx.moveTo(0, 0);
                targetCtx.quadraticCurveTo(side * leafWid, leafLen * 0.45, 0, leafLen);
                targetCtx.quadraticCurveTo(-side * leafWid, leafLen * 0.45, 0, 0);
                targetCtx.fillStyle = (i % 3 === 0) ? leafHighlight : leafColor;
                targetCtx.fill();

                targetCtx.restore();
            }

            targetCtx.restore();

            return {
                p0: { x: anchorX, y: -5 },
                p1: { x: cp1X, y: cp1Y },
                p2: { x: cp2X, y: cp2Y },
                p3: { x: endX, y: endY }
            };
        }

        // Helper: Draw a framing jungle tree trunk with bark texture & buttress roots
        function drawFramingTrunk(targetCtx, isLeft, w, h, rand) {
            targetCtx.save();
            const trunkWidth = Math.max(36, w * 0.055);
            const baseX = isLeft ? 0 : w;
            const dir = isLeft ? 1 : -1;

            targetCtx.beginPath();
            targetCtx.moveTo(baseX, 0);
            targetCtx.lineTo(baseX + dir * trunkWidth * 1.15, 0);
            targetCtx.bezierCurveTo(
                baseX + dir * trunkWidth * 0.85, h * 0.35,
                baseX + dir * trunkWidth * 1.05, h * 0.68,
                baseX + dir * trunkWidth * 1.9, h
            );
            targetCtx.lineTo(baseX, h);
            targetCtx.closePath();

            const trunkGrad = targetCtx.createLinearGradient(
                baseX, 0,
                baseX + dir * trunkWidth * 1.8, 0
            );
            trunkGrad.addColorStop(0, '#040e0a');
            trunkGrad.addColorStop(0.65, '#081b14');
            trunkGrad.addColorStop(1, '#123326');
            targetCtx.fillStyle = trunkGrad;
            targetCtx.fill();

            targetCtx.strokeStyle = 'rgba(45, 106, 79, 0.25)';
            targetCtx.lineWidth = 1.5;
            for (let b = 0; b < 6; b++) {
                const offset = (0.2 + b * 0.13) * trunkWidth;
                targetCtx.beginPath();
                targetCtx.moveTo(baseX + dir * offset, 0);
                targetCtx.bezierCurveTo(
                    baseX + dir * (offset - 4 + rand() * 8), h * 0.35,
                    baseX + dir * (offset + 5), h * 0.72,
                    baseX + dir * (offset * 1.45), h
                );
                targetCtx.stroke();
            }

            targetCtx.restore();
        }

        // Render the complete multi-layered procedural jungle background to bgCanvas
        function renderJungleBackground() {
            const w = bgCanvas.width;
            const h = bgCanvas.height;
            if (w <= 0 || h <= 0) return;

            const rand = createSeededRandom(42719);
            bgCtx.clearRect(0, 0, w, h);

            // 1. Deep Misty Rainforest Canopy Gradient Backdrop
            const skyGrad = bgCtx.createLinearGradient(0, 0, 0, h);
            skyGrad.addColorStop(0.0, '#061711');
            skyGrad.addColorStop(0.28, '#0d2b20');
            skyGrad.addColorStop(0.58, '#163d2e');
            skyGrad.addColorStop(0.85, '#0c261c');
            skyGrad.addColorStop(1.0, '#05120d');
            bgCtx.fillStyle = skyGrad;
            bgCtx.fillRect(0, 0, w, h);

            const canopyGlow = bgCtx.createRadialGradient(
                w * 0.48, h * 0.22, w * 0.02,
                w * 0.48, h * 0.35, w * 0.55
            );
            canopyGlow.addColorStop(0, 'rgba(82, 183, 136, 0.16)');
            canopyGlow.addColorStop(0.5, 'rgba(45, 106, 79, 0.08)');
            canopyGlow.addColorStop(1, 'rgba(8, 28, 21, 0)');
            bgCtx.fillStyle = canopyGlow;
            bgCtx.fillRect(0, 0, w, h);

            // 2. Distant Misty Jungle Tree Trunks & Layered Canopy Silhouettes
            bgCtx.save();
            const distantTrunkCount = 11;
            for (let i = 0; i < distantTrunkCount; i++) {
                const tx = (w / (distantTrunkCount - 1)) * i + (rand() - 0.5) * 35;
                const tw = 12 + rand() * 22;
                bgCtx.fillStyle = i % 2 === 0
                    ? 'rgba(10, 34, 25, 0.48)'
                    : 'rgba(17, 50, 37, 0.35)';
                bgCtx.fillRect(tx - tw * 0.5, 0, tw, h);
            }

            bgCtx.fillStyle = 'rgba(11, 37, 27, 0.65)';
            bgCtx.beginPath();
            bgCtx.moveTo(0, h);
            for (let x = 0; x <= w + 60; x += 45) {
                const moundY = h * 0.76 - Math.sin(x * 0.008) * 28 - rand() * 24;
                bgCtx.lineTo(x, moundY);
            }
            bgCtx.lineTo(w, h);
            bgCtx.closePath();
            bgCtx.fill();
            bgCtx.restore();

            // 3. Diagonal Shafts of Filtered Rainforest Sunlight (God Rays)
            bgCtx.save();
            const rays = [
                { topX: w * 0.22, topW: w * 0.07, botX: w * 0.44, botW: w * 0.16, alpha: 0.045 },
                { topX: w * 0.42, topW: w * 0.09, botX: w * 0.68, botW: w * 0.20, alpha: 0.055 },
                { topX: w * 0.63, topW: w * 0.05, botX: w * 0.86, botW: w * 0.13, alpha: 0.035 }
            ];
            for (const ray of rays) {
                const rayGrad = bgCtx.createLinearGradient(ray.topX, 0, ray.botX, h * 0.85);
                rayGrad.addColorStop(0, `rgba(183, 228, 199, ${ray.alpha * 1.4})`);
                rayGrad.addColorStop(0.55, `rgba(149, 213, 178, ${ray.alpha})`);
                rayGrad.addColorStop(1, 'rgba(149, 213, 178, 0)');

                bgCtx.beginPath();
                bgCtx.moveTo(ray.topX - ray.topW * 0.5, 0);
                bgCtx.lineTo(ray.topX + ray.topW * 0.5, 0);
                bgCtx.lineTo(ray.botX + ray.botW * 0.5, h);
                bgCtx.lineTo(ray.botX - ray.botW * 0.5, h);
                bgCtx.closePath();
                bgCtx.fillStyle = rayGrad;
                bgCtx.fill();
            }
            bgCtx.restore();

            const mistGrad = bgCtx.createLinearGradient(0, h * 0.45, 0, h * 0.92);
            mistGrad.addColorStop(0, 'rgba(116, 198, 157, 0)');
            mistGrad.addColorStop(0.55, 'rgba(116, 198, 157, 0.055)');
            mistGrad.addColorStop(1, 'rgba(8, 28, 21, 0.25)');
            bgCtx.fillStyle = mistGrad;
            bgCtx.fillRect(0, h * 0.45, w, h * 0.47);

            // 4. Mid-ground Palm Fronds & Broad Monstera Leaves in Corners
            drawPalmFrond(
                bgCtx,
                -10, h * 0.14,
                w * 0.11, h * 0.06,
                w * 0.23, h * 0.18,
                16, 44,
                '#143b2c', '#245c45'
            );
            drawPalmFrond(
                bgCtx,
                w + 10, h * 0.12,
                w * 0.88, h * 0.05,
                w * 0.76, h * 0.17,
                16, 44,
                '#143b2c', '#245c45'
            );

            const leafScale = Math.min(w, h) * 0.23;
            drawMonsteraLeaf(bgCtx, w * 0.07, h + 10, 0.42, leafScale * 1.1, '#123829', '#256149');
            drawMonsteraLeaf(bgCtx, w * 0.16, h + 14, 0.78, leafScale * 0.85, '#1b4d39', '#327a5d');
            drawMonsteraLeaf(bgCtx, w * 0.93, h + 10, -0.45, leafScale * 1.12, '#123829', '#256149');
            drawMonsteraLeaf(bgCtx, w * 0.84, h + 14, -0.82, leafScale * 0.88, '#1b4d39', '#327a5d');

            // 5. Left & Right Framing Jungle Tree Trunks
            drawFramingTrunk(bgCtx, true, w, h, rand);
            drawFramingTrunk(bgCtx, false, w, h, rand);

            // 6. Upper Canopy Foliage Border & Hanging Liana Vines
            bgCtx.save();
            const clusterStep = 44;
            for (let cx = -20; cx <= w + 40; cx += clusterStep) {
                const rad = 34 + rand() * 24;
                const cy = -8 + rand() * 16;
                bgCtx.beginPath();
                bgCtx.arc(cx, cy, rad, 0, Math.PI * 2);
                bgCtx.fillStyle = rand() > 0.45 ? '#071b13' : '#0d2b1f';
                bgCtx.fill();
            }
            bgCtx.restore();

            vines = [];
            const vineCount = Math.max(9, Math.floor(w / 85));
            for (let v = 0; v < vineCount; v++) {
                const normX = (v + 0.5) / vineCount;
                const vx = normX * w + (rand() - 0.5) * 18;
                const edgeFactor = Math.abs(normX - 0.5) * 2;
                const maxVineLen = h * (0.11 + edgeFactor * 0.24);
                const vineLen = maxVineLen * (0.65 + rand() * 0.45);
                const sway = (rand() - 0.5) * 34;
                const leaves = Math.max(4, Math.floor(vineLen / 18));

                const bezierData = drawHangingVine(
                    bgCtx,
                    vx,
                    vineLen,
                    sway,
                    leaves,
                    '#174231',
                    '#1e543f',
                    '#2f7a5c'
                );

                vines.push({
                    index: v,
                    normX: normX,
                    anchorX: vx,
                    length: vineLen,
                    sway: sway,
                    p0: bezierData.p0,
                    p1: bezierData.p1,
                    p2: bezierData.p2,
                    p3: bezierData.p3
                });
            }

            // 7. Lush Forest Floor Ferns & Undergrowth along the Bottom Edge
            const fernCount = Math.max(12, Math.floor(w / 68));
            for (let f = 0; f < fernCount; f++) {
                const fx = (f / (fernCount - 1)) * w + (rand() - 0.5) * 22;
                const lean = (rand() - 0.5) * 1.1;
                const fernH = 38 + rand() * 44;
                const endX = fx + Math.sin(lean) * fernH * 1.15;
                const endY = h - Math.cos(lean) * fernH;
                const ctrlX = fx + Math.sin(lean) * fernH * 0.45;
                const ctrlY = h - fernH * 0.65;

                drawPalmFrond(
                    bgCtx,
                    fx, h + 4,
                    ctrlX, ctrlY,
                    endX, endY,
                    11, 20 + rand() * 10,
                    f % 2 === 0 ? '#0b261c' : '#143d2d',
                    '#245c45'
                );
            }

            const floorVignette = bgCtx.createLinearGradient(0, h - 42, 0, h);
            floorVignette.addColorStop(0, 'rgba(4, 14, 10, 0)');
            floorVignette.addColorStop(1, 'rgba(4, 14, 10, 0.82)');
            bgCtx.fillStyle = floorVignette;
            bgCtx.fillRect(0, h - 42, w, 42);

            const centerContrast = bgCtx.createRadialGradient(
                w * 0.5, h * 0.5, Math.min(w, h) * 0.05,
                w * 0.5, h * 0.5, Math.min(w, h) * 0.44
            );
            centerContrast.addColorStop(0, 'rgba(5, 18, 13, 0.34)');
            centerContrast.addColorStop(1, 'rgba(5, 18, 13, 0)');
            bgCtx.fillStyle = centerContrast;
            bgCtx.fillRect(0, 0, w, h);
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            bgCanvas.width = canvas.width;
            bgCanvas.height = canvas.height;

            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            renderJungleBackground();
            initMonkeys(canvas.width, canvas.height);
            initFireflies(canvas.width, canvas.height);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Compute the exact world-space position of the banana gun muzzle
        function getGunMuzzleWorldPos() {
            const bob = Math.sin(animTime * 0.08) * 1.1;
            const gx = 21.2;
            const gy = -5.5;

            const armX = 10.5 - guyState.recoil + gx;
            const armY = 0.5 + gy;

            const cosA = Math.cos(guyState.aimAngle);
            const sinA = Math.sin(guyState.aimAngle);
            const rotX = armX * cosA - armY * sinA;
            const rotY = armX * sinA + armY * cosA;

            const bodyX = 2 + rotX;
            const bodyY = -2.5 + rotY + bob;

            return {
                x: centralNode.x + guyState.facing * bodyX,
                y: centralNode.y + bodyY
            };
        }

        // Predict future ball position under gravity so the banana hits the moving target
        function computeInterceptPoint(b, mx, my) {
            const bananaSpeed = 13.5;
            let simX = b.x;
            let simY = b.y;
            let simVx = b.vx;
            let simVy = b.vy;

            let bestX = b.x;
            let bestY = b.y;
            let bestT = 1;

            for (let t = 1; t <= 85; t++) {
                const dx = centralNode.x - simX;
                const dy = centralNode.y - simY;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                if (dist < centralNode.radius + b.radius) {
                    break;
                }

                const acc = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);
                simVx += acc * (dx / dist);
                simVy += acc * (dy / dist);
                simX += simVx;
                simY += simVy;

                const travelDist = Math.hypot(simX - mx, simY - my);
                if (travelDist <= bananaSpeed * t) {
                    bestX = simX;
                    bestY = simY;
                    bestT = t;
                    break;
                }

                bestX = simX;
                bestY = simY;
                bestT = t;
            }

            const finalDist = Math.hypot(bestX - mx, bestY - my) || 1;
            const speed = Math.max(10.5, Math.min(18.5, finalDist / bestT));

            return {
                targetX: bestX,
                targetY: bestY,
                vx: ((bestX - mx) / finalDist) * speed,
                vy: ((bestY - my) / finalDist) * speed,
                speed: speed
            };
        }

        // Aim the central guy's banana gun and shoot a spinning banana at the ball
        function fireBananaAtBall(b) {
            if (!b) return;

            const roughMuzzle = getGunMuzzleWorldPos();
            const initialIntercept = computeInterceptPoint(b, roughMuzzle.x, roughMuzzle.y);

            // Snap facing & aim angle toward the target intercept point
            const dx = initialIntercept.targetX - centralNode.x;
            const dy = initialIntercept.targetY - centralNode.y;
            guyState.facing = dx < 0 ? -1 : 1;
            const rawAngle = Math.atan2(dy, Math.max(Math.abs(dx), 10));
            guyState.aimAngle = Math.max(-Math.PI * 0.44, Math.min(Math.PI * 0.44, rawAngle));

            // Recompute exact muzzle position using updated aim angle
            const muzzle = getGunMuzzleWorldPos();
            const intercept = computeInterceptPoint(b, muzzle.x, muzzle.y);
            const shotAngle = Math.atan2(intercept.vy, intercept.vx);

            // Gun recoil kick, muzzle flash, and fire cooldown
            guyState.recoil = 4.2;
            guyState.muzzleFlash = 1.0;
            guyState.fireCooldown = 26;

            bananas.push({
                x: muzzle.x,
                y: muzzle.y,
                vx: intercept.vx,
                vy: intercept.vy,
                speed: intercept.speed,
                angle: shotAngle,
                spinSpeed: (guyState.facing >= 0 ? 1 : -1) * 0.34,
                radius: 7,
                trail: []
            });

            // Subtle muzzle pop sparkles
            for (let p = 0; p < 5; p++) {
                const pAngle = shotAngle + (Math.random() - 0.5) * 0.9;
                const pSpeed = 1.8 + Math.random() * 2.6;
                impactEffects.push({
                    x: muzzle.x,
                    y: muzzle.y,
                    vx: Math.cos(pAngle) * pSpeed,
                    vy: Math.sin(pAngle) * pSpeed,
                    life: 1.0,
                    decay: 0.075 + Math.random() * 0.04,
                    size: 1.8 + Math.random() * 1.5,
                    color: p % 2 === 0 ? '#fef08a' : '#86efac',
                    type: 'spark'
                });
            }
        }

        // Spawn a lively banana splat / peel burst when a banana hits the ball
        function spawnBananaImpact(x, y, bnVx, bnVy, isPop) {
            const labels = ['BONK!', 'SPLAT!', 'POW!', 'PEEL!'];
            const label = isPop ? 'BANANA BOOM!' : labels[Math.floor(Math.random() * labels.length)];

            // Expanding golden shockwave ring
            impactEffects.push({
                x: x,
                y: y,
                radius: 4,
                maxRadius: isPop ? 42 : 24,
                life: 1.0,
                decay: isPop ? 0.045 : 0.065,
                color: isPop ? '#fde047' : '#fef08a',
                type: 'ring'
            });

            // Floating comic impact text
            impactEffects.push({
                x: x,
                y: y - 10,
                vx: (Math.random() - 0.5) * 0.6,
                vy: -1.15,
                life: 1.0,
                decay: 0.028,
                text: label,
                color: isPop ? '#fde047' : '#fffbeb',
                type: 'text'
            });

            // Tumbling banana peel strips
            const peelCount = isPop ? 4 : 2;
            for (let i = 0; i < peelCount; i++) {
                const a = Math.random() * Math.PI * 2;
                const spd = 1.8 + Math.random() * 2.6;
                impactEffects.push({
                    x: x,
                    y: y,
                    vx: Math.cos(a) * spd + bnVx * 0.12,
                    vy: Math.sin(a) * spd - 1.5,
                    angle: Math.random() * Math.PI * 2,
                    spin: (Math.random() - 0.5) * 0.3,
                    life: 1.0,
                    decay: 0.028 + Math.random() * 0.015,
                    type: 'peel'
                });
            }

            // Golden & rainbow burst sparkles
            const sparkCount = isPop ? 18 : 9;
            for (let s = 0; s < sparkCount; s++) {
                const a = (Math.PI * 2 * s) / sparkCount + (Math.random() - 0.5) * 0.4;
                const spd = (isPop ? 2.4 : 1.6) + Math.random() * 3.0;
                impactEffects.push({
                    x: x,
                    y: y,
                    vx: Math.cos(a) * spd,
                    vy: Math.sin(a) * spd,
                    life: 1.0,
                    decay: 0.038 + Math.random() * 0.025,
                    size: 2.0 + Math.random() * 2.2,
                    color: isPop
                        ? `hsl(${(s * 35) % 360}, 95%, 65%)`
                        : (s % 2 === 0 ? '#ffe135' : '#ffffff'),
                    type: 'spark'
                });
            }
        }

        // Canvas Click Handler: Launch ball at click position (or shoot existing ball if clicked directly)
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            if (balls.length > 0) {
                const existing = balls[0];
                if (Math.hypot(clickX - existing.x, clickY - existing.y) <= 26) {
                    fireBananaAtBall(existing);
                    return;
                }
            }

            launchBall(clickX, clickY);
        });

        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Overwrite existing array to strictly maintain a single ball on screen
            balls = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4,
                hue: 0,
                hits: 0,
                hitFlash: 0,
                trail: []
            }];

            // Immediately shoot a banana from the guy in the middle at the newly clicked ball
            fireBananaAtBall(balls[0]);
        }

        function resetSimulation() {
            balls = [];
            bananas = [];
            impactEffects = [];
            guyState.recoil = 0;
            guyState.muzzleFlash = 0;
            guyState.fireCooldown = 0;
        }

        function updateFireflies() {
            animTime += 1;
            for (const f of fireflies) {
                f.baseY += f.speedY;
                f.baseX += f.speedX;
                f.x = f.baseX + Math.sin(animTime * f.swayFreq + f.phase) * f.swayAmp;
                f.y = f.baseY;

                if (f.y < -10) {
                    f.baseY = canvas.height + 10;
                    f.baseX = Math.random() * canvas.width;
                }
                if (f.baseX < -20) f.baseX = canvas.width + 20;
                if (f.baseX > canvas.width + 20) f.baseX = -20;
            }
        }

        // Update pendulum sway, natural blinking, and subtle gaze tracking for all monkeys
        function updateMonkeys() {
            for (const m of monkeys) {
                m.currentAngle = Math.sin(animTime * m.swaySpeed + m.phase) * m.swayAmp;

                if (m.blinkProgress > 0) {
                    m.blinkProgress += 1;
                    if (m.blinkProgress >= m.blinkDuration) {
                        m.blinkProgress = 0;
                        m.blinkTimer = 150 + Math.floor(Math.random() * 210);
                    }
                } else {
                    m.blinkTimer -= 1;
                    if (m.blinkTimer <= 0) {
                        m.blinkProgress = 1;
                    }
                }

                let localHeadX = 0;
                let localHeadY = 16;
                if (m.pose === 'one-arm') {
                    localHeadX = m.facing * 2.5;
                    localHeadY = 14.5;
                } else if (m.pose === 'two-arm') {
                    localHeadX = 0;
                    localHeadY = 11.5;
                } else if (m.pose === 'upside-down') {
                    localHeadX = 0;
                    localHeadY = 35.5;
                }

                const cosA = Math.cos(m.currentAngle);
                const sinA = Math.sin(m.currentAngle);
                const headWorldX = m.anchorX + (localHeadX * cosA - localHeadY * sinA) * m.scale;
                const headWorldY = m.anchorY + (localHeadX * sinA + localHeadY * cosA) * m.scale;

                let targetGazeX = m.facing * 0.35;
                let targetGazeY = 0.25;

                if (balls.length > 0) {
                    const b = balls[0];
                    const wx = b.x - headWorldX;
                    const wy = b.y - headWorldY;
                    const dist = Math.hypot(wx, wy) || 1;

                    const lx = (wx * cosA + wy * sinA) / dist;
                    const ly = (-wx * sinA + wy * cosA) / dist;

                    targetGazeX = lx * 1.35;
                    targetGazeY = ly * 1.25;
                }

                m.gazeX += (targetGazeX - m.gazeX) * 0.14;
                m.gazeY += (targetGazeY - m.gazeY) * 0.14;
            }
        }

        // Update central banana gunner aim, recoil recovery, and continuous shots
        function updateBananaGunner() {
            guyState.recoil *= 0.78;
            if (guyState.recoil < 0.05) guyState.recoil = 0;

            guyState.muzzleFlash = Math.max(0, guyState.muzzleFlash - 0.18);

            if (balls.length > 0) {
                const b = balls[0];
                const muzzle = getGunMuzzleWorldPos();
                const intercept = computeInterceptPoint(b, muzzle.x, muzzle.y);
                const dx = intercept.targetX - centralNode.x;
                const dy = intercept.targetY - centralNode.y;

                guyState.facing = dx < 0 ? -1 : 1;
                const rawAngle = Math.atan2(dy, Math.max(Math.abs(dx), 10));
                const clampedAngle = Math.max(-Math.PI * 0.44, Math.min(Math.PI * 0.44, rawAngle));
                guyState.aimAngle += (clampedAngle - guyState.aimAngle) * 0.28;

                if (guyState.fireCooldown > 0) {
                    guyState.fireCooldown -= 1;
                } else {
                    fireBananaAtBall(b);
                }
            } else {
                guyState.aimAngle += (-0.14 - guyState.aimAngle) * 0.08;
                guyState.fireCooldown = 0;
            }
        }

        // Update flying banana projectiles and check collisions with the active ball
        function updateBananas() {
            for (let i = bananas.length - 1; i >= 0; i--) {
                const bn = bananas[i];

                // Subtle terminal guidance when nearing the orbiting ball so hits feel crisp
                if (balls.length > 0) {
                    const target = balls[0];
                    const toX = target.x - bn.x;
                    const toY = target.y - bn.y;
                    const dist = Math.hypot(toX, toY);

                    if (dist > 0 && dist < 150) {
                        const desiredVx = (toX / dist) * bn.speed;
                        const desiredVy = (toY / dist) * bn.speed;
                        bn.vx += (desiredVx - bn.vx) * 0.11;
                        bn.vy += (desiredVy - bn.vy) * 0.11;
                        const curSpd = Math.hypot(bn.vx, bn.vy) || 1;
                        bn.vx = (bn.vx / curSpd) * bn.speed;
                        bn.vy = (bn.vy / curSpd) * bn.speed;
                    }
                }

                bn.x += bn.vx;
                bn.y += bn.vy;
                bn.angle += bn.spinSpeed;

                bn.trail.push({ x: bn.x, y: bn.y });
                if (bn.trail.length > 8) {
                    bn.trail.shift();
                }

                // Check collision against active ball
                if (balls.length > 0) {
                    const b = balls[0];
                    const dist = Math.hypot(b.x - bn.x, b.y - bn.y);
                    if (dist <= b.radius + bn.radius + 2) {
                        b.hits = (b.hits || 0) + 1;
                        b.hitFlash = 1.0;

                        // Playful velocity nudge from banana impact
                        b.vx += (bn.vx / bn.speed) * 0.75;
                        b.vy += (bn.vy / bn.speed) * 0.75;

                        const isPop = b.hits >= 4;
                        spawnBananaImpact(b.x, b.y, bn.vx, bn.vy, isPop);

                        bananas.splice(i, 1);

                        if (isPop) {
                            balls.splice(0, 1);
                        }
                        continue;
                    }
                }

                // Clean up off-screen bananas
                const margin = 120;
                if (bn.x < -margin || bn.x > canvas.width + margin ||
                    bn.y < -margin || bn.y > canvas.height + margin) {
                    bananas.splice(i, 1);
                }
            }
        }

        // Update banana splat particles, peel strips, shockwave rings, and pop text
        function updateImpactEffects() {
            for (let i = impactEffects.length - 1; i >= 0; i--) {
                const eff = impactEffects[i];
                eff.life -= eff.decay;
                if (eff.life <= 0) {
                    impactEffects.splice(i, 1);
                    continue;
                }

                if (eff.type === 'ring') {
                    eff.radius += (eff.maxRadius - eff.radius) * 0.22;
                } else if (eff.type === 'text') {
                    eff.x += eff.vx;
                    eff.y += eff.vy;
                } else if (eff.type === 'peel') {
                    eff.vy += 0.14;
                    eff.x += eff.vx;
                    eff.y += eff.vy;
                    eff.angle += eff.spin;
                } else if (eff.type === 'spark') {
                    eff.vx *= 0.94;
                    eff.vy *= 0.94;
                    eff.x += eff.vx;
                    eff.y += eff.vy;
                }
            }
        }

        function updatePhysics() {
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                if (b.hitFlash > 0) {
                    b.hitFlash = Math.max(0, b.hitFlash - 0.12);
                }

                // Remove ball if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin ||
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    balls.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Record position history for rainbow line trail
                b.hue = (b.hue + 2.4) % 360;
                b.trail.push({ x: b.x, y: b.y, hue: b.hue });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }
        }

        function drawFireflies() {
            for (const f of fireflies) {
                const pulse = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(animTime * f.pulseSpeed + f.phase));
                const glowRadius = f.radius * 4.5;

                const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, glowRadius);
                if (f.isWarmGold) {
                    grad.addColorStop(0, `rgba(255, 238, 136, ${pulse})`);
                    grad.addColorStop(0.45, `rgba(217, 237, 146, ${pulse * 0.45})`);
                    grad.addColorStop(1, 'rgba(217, 237, 146, 0)');
                } else {
                    grad.addColorStop(0, `rgba(183, 228, 199, ${pulse})`);
                    grad.addColorStop(0.45, `rgba(116, 198, 157, ${pulse * 0.4})`);
                    grad.addColorStop(1, 'rgba(116, 198, 157, 0)');
                }

                ctx.beginPath();
                ctx.arc(f.x, f.y, glowRadius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
            }
        }

        // Helper: Draw expressive monkey face (upright or inverted) with blinking & gaze tracking
        function drawMonkeyHead(m, cx, cy, upsideDown) {
            const dir = upsideDown ? -1 : 1;
            const blinkFactor = m.blinkProgress > 0
                ? Math.sin((m.blinkProgress / m.blinkDuration) * Math.PI)
                : 0;

            ctx.save();
            ctx.translate(cx, cy);

            for (const side of [-1, 1]) {
                const earX = side * 9.2;
                const earY = -0.5 * dir;

                ctx.beginPath();
                ctx.arc(earX, earY, 3.8, 0, Math.PI * 2);
                ctx.fillStyle = m.furMain;
                ctx.fill();
                ctx.strokeStyle = m.furDark;
                ctx.lineWidth = 0.9;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(earX, earY, 2.2, 0, Math.PI * 2);
                ctx.fillStyle = m.skin;
                ctx.fill();
            }

            ctx.beginPath();
            ctx.arc(0, 0, 8.2, 0, Math.PI * 2);
            ctx.fillStyle = m.furMain;
            ctx.fill();
            ctx.strokeStyle = m.furDark;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = m.furDark;
            ctx.beginPath();
            ctx.moveTo(-2.5, -7.6 * dir);
            ctx.quadraticCurveTo(-1.5, -11.5 * dir, 0.2, -10.8 * dir);
            ctx.quadraticCurveTo(1.5, -12.0 * dir, 2.8, -7.6 * dir);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = m.skin;
            ctx.beginPath();
            ctx.arc(-2.6, -1.6 * dir, 3.6, 0, Math.PI * 2);
            ctx.arc(2.6, -1.6 * dir, 3.6, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(0, 2.4 * dir, 5.5, 4.1, 0, 0, Math.PI * 2);
            ctx.fillStyle = m.skin;
            ctx.fill();
            ctx.strokeStyle = m.skinShade;
            ctx.lineWidth = 0.8;
            ctx.stroke();

            const eyeOffsetX = 2.6;
            const eyeY = -1.6 * dir;

            for (const side of [-1, 1]) {
                const ex = side * eyeOffsetX;

                if (blinkFactor > 0.55) {
                    ctx.beginPath();
                    ctx.arc(ex, eyeY + 0.3 * dir, 1.9, upsideDown ? 0.15 : Math.PI + 0.15, upsideDown ? Math.PI - 0.15 : Math.PI * 2 - 0.15);
                    ctx.strokeStyle = m.furDark;
                    ctx.lineWidth = 1.25;
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(ex, eyeY, 2.25, 0, Math.PI * 2);
                    ctx.fillStyle = '#fffdf7';
                    ctx.fill();

                    const px = ex + Math.max(-1.0, Math.min(1.0, m.gazeX * 0.75));
                    const py = eyeY + Math.max(-1.0, Math.min(1.0, m.gazeY * 0.75));
                    ctx.beginPath();
                    ctx.arc(px, py, 1.35, 0, Math.PI * 2);
                    ctx.fillStyle = '#1b110a';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(px - 0.45, py - 0.45, 0.45, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                }
            }

            ctx.fillStyle = m.furDark;
            ctx.beginPath();
            ctx.ellipse(-1.1, 1.5 * dir, 0.65, 0.45, 0, 0, Math.PI * 2);
            ctx.ellipse(1.1, 1.5 * dir, 0.65, 0.45, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            if (!upsideDown) {
                ctx.arc(0, 2.8, 2.8, 0.18 * Math.PI, 0.82 * Math.PI);
            } else {
                ctx.arc(0, -2.8, 2.8, 1.18 * Math.PI, 1.82 * Math.PI);
            }
            ctx.strokeStyle = m.furDark;
            ctx.lineWidth = 1.15;
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.restore();
        }

        function drawGrippingHand(m, hx, hy) {
            ctx.save();
            ctx.translate(hx, hy);

            ctx.beginPath();
            ctx.arc(0, 1.2, 2.8, 0, Math.PI * 2);
            ctx.fillStyle = m.skin;
            ctx.fill();
            ctx.strokeStyle = m.furDark;
            ctx.lineWidth = 0.8;
            ctx.stroke();

            ctx.fillStyle = m.skinShade;
            for (let k = -1; k <= 1; k++) {
                ctx.beginPath();
                ctx.arc(k * 1.4, -0.4, 1.05, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawOneArmMonkey(m) {
            const f = m.facing;
            const tailWag = Math.sin(animTime * m.tailSpeed + m.phase) * 3.8;
            const scratchWave = Math.sin(animTime * m.actionSpeed + m.phase);

            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(f * 3.5, 31);
            ctx.bezierCurveTo(
                f * 15, 34 + tailWag * 0.4,
                f * 20, 22 + tailWag,
                f * 14, 16 + tailWag * 1.2
            );
            ctx.bezierCurveTo(
                f * 10, 13 + tailWag * 1.2,
                f * 11, 19 + tailWag * 1.1,
                f * 14.5, 19.5 + tailWag * 1.1
            );
            ctx.strokeStyle = m.furDark;
            ctx.lineWidth = 3.2;
            ctx.stroke();

            ctx.strokeStyle = m.furMain;
            ctx.lineWidth = 1.9;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(f * 1.2, 32);
            ctx.quadraticCurveTo(f * -1.5, 39, f * 0.8, 44.5);
            ctx.strokeStyle = m.furDark;
            ctx.lineWidth = 4.2;
            ctx.stroke();

            ctx.fillStyle = m.skin;
            ctx.beginPath();
            ctx.ellipse(f * 1.5, 45.2, 2.7, 1.6, f * 0.25, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(f * 4.5, 31.5);
            ctx.quadraticCurveTo(f * 8.5, 37.5, f * 5.8, 43.2);
            ctx.strokeStyle = m.furMain;
            ctx.lineWidth = 4.4;
            ctx.stroke();

            ctx.fillStyle = m.skin;
            ctx.beginPath();
            ctx.ellipse(f * 6.5, 44.0, 2.8, 1.6, f * -0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(f * 2.8, 24.5);
            ctx.rotate(f * -0.1);

            ctx.beginPath();
            ctx.ellipse(0, 0, 6.8, 8.8, 0, 0, Math.PI * 2);
            ctx.fillStyle = m.furMain;
            ctx.fill();
            ctx.strokeStyle = m.furDark;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(f * 0.8, 0.5, 4.2, 6.2, 0, 0, Math.PI * 2);
            ctx.fillStyle = m.skin;
            ctx.fill();
            ctx.restore();

            ctx.beginPath();
            ctx.moveTo(0, 1.5);
            ctx.quadraticCurveTo(f * -1.2, 9.5, f * 0.2, 18.5);
            ctx.strokeStyle = m.furDark;
            ctx.lineWidth = 4.6;
            ctx.stroke();

            ctx.strokeStyle = m.furMain;
            ctx.lineWidth = 3.2;
            ctx.stroke();

            drawGrippingHand(m, 0, 0);
            drawMonkeyHead(m, f * 3.2, 13.5, false);

            const elbowX = f * 9.5;
            const elbowY = 17.5 + scratchWave * 1.4;
            const handX = f * 7.8 + scratchWave * 1.1;
            const handY = 7.2 + Math.abs(scratchWave) * 1.3;

            ctx.beginPath();
            ctx.moveTo(f * 6.5, 19.5);
            ctx.quadraticCurveTo(elbowX, elbowY, handX, handY);
            ctx.strokeStyle = m.furDark;
            ctx.lineWidth = 4.2;
            ctx.stroke();

            ctx.strokeStyle = m.furMain;
            ctx.lineWidth = 2.8;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(handX, handY, 2.3, 0, Math.PI * 2);
            ctx.fillStyle = m.skin;
            ctx.fill();
            ctx.strokeStyle = m.furDark;
            ctx.lineWidth = 0.75;
            ctx.stroke();

            ctx.restore();
        }

        function drawTwoArmMonkey(m) {
            const tailWag = Math.sin(animTime * m.tailSpeed + m.phase) * 4.2;
            const legKick = Math.sin(animTime * (m.swaySpeed * 1.5) + m.phase) * 2.2;

            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const tailDir = m.facing;
            ctx.beginPath();
            ctx.moveTo(tailDir * 4, 28);
            ctx.bezierCurveTo(
                tailDir * 15, 29 + tailWag * 0.4,
                tailDir * 19, 17 + tailWag,
                tailDir * 13, 13 + tailWag * 1.2
            );
            ctx.bezierCurveTo(
                tailDir * 9.5, 10.5 + tailWag * 1.2,
                tailDir * 10.5, 16 + tailWag * 1.1,
                tailDir * 13.8, 16.5 + tailWag * 1.1
            );
            ctx.strokeStyle = m.furDark;
            ctx.lineWidth = 3.2;
            ctx.stroke();
            ctx.strokeStyle = m.furMain;
            ctx.lineWidth = 1.9;
            ctx.stroke();

            for (const side of [-1, 1]) {
                const hipX = side * 3.4;
                const kneeX = side * 4.6 + legKick * 0.5;
                const footX = side * 3.5 + legKick;
                const footY = 41.5 + (side === 1 ? 1.2 : -0.8);

                ctx.beginPath();
                ctx.moveTo(hipX, 29.5);
                ctx.quadraticCurveTo(kneeX, 35.5, footX, footY);
                ctx.strokeStyle = side === -1 ? m.furDark : m.furMain;
                ctx.lineWidth = 4.2;
                ctx.stroke();

                ctx.fillStyle = m.skin;
                ctx.beginPath();
                ctx.ellipse(footX + side * 0.6, footY + 0.8, 2.6, 1.5, side * 0.25, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.beginPath();
            ctx.ellipse(0, 22.5, 6.8, 8.6, 0, 0, Math.PI * 2);
            ctx.fillStyle = m.furMain;
            ctx.fill();
            ctx.strokeStyle = m.furDark;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, 23.0, 4.3, 6.0, 0, 0, Math.PI * 2);
            ctx.fillStyle = m.skin;
            ctx.fill();

            for (const side of [-1, 1]) {
                const handX = side * 7.5;
                const handY = side * 0.8;
                const shoulderX = side * 5.8;
                const shoulderY = 17.0;

                ctx.beginPath();
                ctx.moveTo(handX, handY + 1);
                ctx.quadraticCurveTo(side * 8.2, 9.0, shoulderX, shoulderY);
                ctx.strokeStyle = m.furDark;
                ctx.lineWidth = 4.5;
                ctx.stroke();

                ctx.strokeStyle = m.furMain;
                ctx.lineWidth = 3.1;
                ctx.stroke();

                drawGrippingHand(m, handX, handY);
            }

            drawMonkeyHead(m, 0, 11.5, false);

            ctx.restore();
        }

        function drawUpsideDownMonkey(m) {
            const armIdle = Math.sin(animTime * m.actionSpeed + m.phase) * 1.6;
            const tailTipWag = Math.sin(animTime * m.tailSpeed + m.phase) * 2.5;

            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.strokeStyle = m.furDark;
            ctx.lineWidth = 3.2;
            for (let c = -1; c <= 1; c++) {
                ctx.beginPath();
                ctx.arc(0, c * 2.6, 3.2, Math.PI * 0.5, Math.PI * 1.5);
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.moveTo(0, 2.5);
            ctx.quadraticCurveTo(-2.5, 8.5, 0, 14.5);
            ctx.strokeStyle = m.furDark;
            ctx.lineWidth = 3.8;
            ctx.stroke();
            ctx.strokeStyle = m.furMain;
            ctx.lineWidth = 2.4;
            ctx.stroke();

            for (let c = -1; c <= 1; c++) {
                ctx.beginPath();
                ctx.arc(0, c * 2.6, 3.2, -Math.PI * 0.5, Math.PI * 0.5);
                ctx.strokeStyle = m.furDark;
                ctx.lineWidth = 3.4;
                ctx.stroke();
                ctx.strokeStyle = m.furMain;
                ctx.lineWidth = 2.0;
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.moveTo(0, -3.5);
            ctx.quadraticCurveTo(4.5, -7.5 + tailTipWag * 0.4, 2.2, -10.5 + tailTipWag);
            ctx.strokeStyle = m.furMain;
            ctx.lineWidth = 2.0;
            ctx.stroke();

            for (const side of [-1, 1]) {
                ctx.beginPath();
                ctx.moveTo(side * 3.8, 15.5);
                ctx.quadraticCurveTo(side * 9.5, 12.5, side * 6.5, 8.2);
                ctx.strokeStyle = side === -1 ? m.furDark : m.furMain;
                ctx.lineWidth = 4.0;
                ctx.stroke();

                ctx.fillStyle = m.skin;
                ctx.beginPath();
                ctx.ellipse(side * 6.2, 7.6, 2.4, 1.4, side * -0.4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.beginPath();
            ctx.ellipse(0, 21.5, 6.6, 8.4, 0, 0, Math.PI * 2);
            ctx.fillStyle = m.furMain;
            ctx.fill();
            ctx.strokeStyle = m.furDark;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, 21.2, 4.2, 5.8, 0, 0, Math.PI * 2);
            ctx.fillStyle = m.skin;
            ctx.fill();

            drawMonkeyHead(m, 0, 34.5, true);

            for (const side of [-1, 1]) {
                const shoulderX = side * 6.0;
                const shoulderY = 26.5;
                const elbowX = side * 10.5;
                const elbowY = 33.5 + armIdle * 0.5;
                const handX = side * 5.2;
                const handY = 39.5 + armIdle * 0.3;

                ctx.beginPath();
                ctx.moveTo(shoulderX, shoulderY);
                ctx.quadraticCurveTo(elbowX, elbowY, handX, handY);
                ctx.strokeStyle = m.furDark;
                ctx.lineWidth = 4.1;
                ctx.stroke();
                ctx.strokeStyle = m.furMain;
                ctx.lineWidth = 2.7;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(handX, handY, 2.1, 0, Math.PI * 2);
                ctx.fillStyle = m.skin;
                ctx.fill();
            }

            ctx.restore();
        }

        function drawMonkeys() {
            for (const m of monkeys) {
                ctx.save();
                ctx.translate(m.anchorX, m.anchorY);
                ctx.rotate(m.currentAngle);
                ctx.scale(m.scale, m.scale);

                if (m.pose === 'one-arm') {
                    drawOneArmMonkey(m);
                } else if (m.pose === 'two-arm') {
                    drawTwoArmMonkey(m);
                } else if (m.pose === 'upside-down') {
                    drawUpsideDownMonkey(m);
                }

                ctx.restore();
            }
        }

        // Draw the central guy holding and firing his banana gun

                ctx.translate(22.2, -5.5);

                ctx.beginPath();

                    const r = k % 2 === 0 ? fSize : fSize * 0.4;
                    const a = (k * Math.PI) / 4;
                    if (k === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                    else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                ctx.arc(22.4, -5.6, 1.6, 0, Math.PI * 2);

            }

            ctx.restore();
            ctx.restore();
            ctx.restore();
            ctx.restore();
        }

        // Draw spinning banana projectiles and their golden motion trails
        function drawBananas() {
            for (const bn of bananas) {
                // Golden motion swoosh behind each flying banana
                if (bn.trail.length > 1) {
                    ctx.save();
                    ctx.lineCap = 'round';
                    for (let t = 1; t < bn.trail.length; t++) {
                        const prev = bn.trail[t - 1];
                        const curr = bn.trail[t];
                        const alpha = (t / bn.trail.length) * 0.45;
                        ctx.beginPath();
                        ctx.moveTo(prev.x, prev.y);
                        ctx.lineTo(curr.x, curr.y);
                        ctx.strokeStyle = `rgba(254, 240, 138, ${alpha})`;
                        ctx.lineWidth = (t / bn.trail.length) * 3.2;
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                // Draw spinning curved banana
                ctx.save();
                ctx.translate(bn.x, bn.y);
                ctx.rotate(bn.angle);

                // Crescent banana silhouette
                ctx.beginPath();
                ctx.moveTo(-8.5, -2.5);
                ctx.quadraticCurveTo(0, -6.5, 8.5, -2.5);
                ctx.quadraticCurveTo(9.5, -1.2, 8.2, 0.2);
                ctx.quadraticCurveTo(0, -1.6, -8.2, 0.2);
                ctx.quadraticCurveTo(-9.5, -1.2, -8.5, -2.5);
                ctx.closePath();
                ctx.fillStyle = '#ffe135';
                ctx.fill();
                ctx.strokeStyle = '#9a6b00';
                ctx.lineWidth = 0.9;
                ctx.stroke();

                // Inner golden shading
                ctx.beginPath();
                ctx.moveTo(-6.5, -1.2);
                ctx.quadraticCurveTo(0, -3.2, 6.5, -1.2);
                ctx.strokeStyle = '#eab308';
                ctx.lineWidth = 1.1;
                ctx.stroke();

                // Bright highlight ridge
                ctx.beginPath();
                ctx.moveTo(-5.8, -2.8);
                ctx.quadraticCurveTo(0, -5.0, 5.8, -2.8);
                ctx.strokeStyle = '#fef9c3';
                ctx.lineWidth = 0.9;
                ctx.stroke();

                // Dark brown stem & blossom ends
                ctx.fillStyle = '#4a2e14';
                ctx.beginPath();
                ctx.arc(-8.6, -1.3, 1.2, 0, Math.PI * 2);
                ctx.arc(8.6, -1.3, 1.1, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // Draw banana impact shockwaves, peel strips, sparkles, and comic pop labels
        function drawImpactEffects() {
            for (const eff of impactEffects) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, eff.life);

                if (eff.type === 'ring') {
                    ctx.beginPath();
                    ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = eff.color;
                    ctx.lineWidth = 2.2 * eff.life;
                    ctx.stroke();
                } else if (eff.type === 'spark') {
                    ctx.beginPath();
                    ctx.arc(eff.x, eff.y, eff.size * eff.life, 0, Math.PI * 2);
                    ctx.fillStyle = eff.color;
                    ctx.fill();
                } else if (eff.type === 'peel') {
                    ctx.translate(eff.x, eff.y);
                    ctx.rotate(eff.angle);
                    ctx.beginPath();
                    ctx.moveTo(-5, 0);
                    ctx.quadraticCurveTo(0, -4, 5, 0);
                    ctx.quadraticCurveTo(0, -1.5, -5, 0);
                    ctx.fillStyle = '#ffe135';
                    ctx.fill();
                    ctx.strokeStyle = '#854d0e';
                    ctx.lineWidth = 0.7;
                    ctx.stroke();
                } else if (eff.type === 'text') {
                    ctx.font = 'bold 12px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#1b110a';
                    ctx.fillText(eff.text, eff.x + 1, eff.y + 1);
                    ctx.fillStyle = eff.color;
                    ctx.fillText(eff.text, eff.x, eff.y);
                }

                ctx.restore();
            }
        }

        function draw() {
            // 0. Draw cached procedural jungle background (including liana vines)
            ctx.drawImage(bgCanvas, 0, 0);

            // 1. Draw Animated Monkeys Hanging from Vines
            drawMonkeys();

            // 2. Subtle drifting jungle fireflies
            drawFireflies();

            // 3. Draw Central Character (Guy with a Banana Gun)
            drawBananaGunGuy(centralNode.x, centralNode.y);

            // 4. Draw Ball & Rainbow Trail
            for (const b of balls) {
                if (b.trail.length > 1) {
                    ctx.save();
                    ctx.lineWidth = 1.75;
                    ctx.lineCap = 'round';
                    for (let t = 1; t < b.trail.length; t++) {
                        const prev = b.trail[t - 1];
                        const curr = b.trail[t];
                        ctx.beginPath();
                        ctx.moveTo(prev.x, prev.y);
                        ctx.lineTo(curr.x, curr.y);
                        ctx.strokeStyle = `hsl(${curr.hue}, 95%, 62%)`;
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                // Subtle soft halo around ball (pulses golden when hit by a banana)
                const haloRadius = b.radius * (2.2 + (b.hitFlash || 0) * 1.6);
                ctx.beginPath();
                ctx.arc(b.x, b.y, haloRadius, 0, Math.PI * 2);
                ctx.fillStyle = (b.hitFlash || 0) > 0.1
                    ? `rgba(255, 225, 53, ${0.35 + b.hitFlash * 0.45})`
                    : 'rgba(216, 243, 220, 0.25)';
                ctx.fill();

                // Draw ball object
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius + (b.hitFlash || 0) * 1.4, 0, Math.PI * 2);
                ctx.fillStyle = (b.hitFlash || 0) > 0.2 ? '#fef08a' : '#ffffff';
                ctx.fill();
            }

            // 5. Draw Spinning Bananas & Impact Splats
            drawBananas();
            drawImpactEffects();
        }

        function animate() {
            updateFireflies();
            updateMonkeys();
            updatePhysics();
            updateBananaGunner();
            updateBananas();
            updateImpactEffects();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
