<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Baseline - Dancing Astronaut</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background: radial-gradient(ellipse at top, #091024 0%, #02040a 70%, #010206 100%);
            color: #e6eefc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(148, 184, 255, 0.35);
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            color: #f0f6ff;
            text-shadow: 0 0 12px rgba(125, 211, 252, 0.35);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dance-badge {
            background: rgba(147, 51, 234, 0.25);
            border: 1px solid rgba(192, 132, 252, 0.5);
            color: #e9d5ff;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 4px;
            text-shadow: 0 0 8px rgba(192, 132, 252, 0.5);
            animation: pulseGlow 2s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { border-color: rgba(192, 132, 252, 0.5); box-shadow: 0 0 6px rgba(192, 132, 252, 0.3); }
            50% { border-color: rgba(236, 72, 153, 0.8); box-shadow: 0 0 14px rgba(236, 72, 153, 0.6); }
        }

        .btn-reset {
            background: rgba(10, 18, 38, 0.65);
            color: #e6eefc;
            border: 1px solid rgba(148, 184, 255, 0.55);
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #e6eefc;
            color: #02040a;
            border-color: #ffffff;
            box-shadow: 0 0 14px rgba(148, 184, 255, 0.5);
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #02040a;
            border: 1px solid rgba(148, 184, 255, 0.4);
            box-shadow: 0 0 30px rgba(8, 16, 40, 0.85), inset 0 0 24px rgba(15, 28, 64, 0.4);
            border-radius: 4px;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #7c8fb5;
            text-align: center;
            letter-spacing: 0.4px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <div class="header-controls">
            <div id="danceBadge" class="dance-badge">DANCE: DISCO INFERNO</div>
            <button class="btn-reset" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas to launch a dancing astronaut into orbit!
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Offscreen canvas for static deep-space backdrop (nebulae, dust band, distant planet)
        const bgCanvas = document.createElement('canvas');
        const bgCtx = bgCanvas.getContext('2d');

        // SIMULATION CONSTANTS (Preserved 100% from baseline)
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;         // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center

        // SPACE THEME CONSTANTS
        const STAR_COUNT = 200;
        const STAR_PALETTE = [
            '#ffffff', // Pure white
            '#ffffff',
            '#dbeafe', // Pale blue-white
            '#bfdbfe', // Cool blue-white
            '#fef3c7', // Warm pale gold
            '#fde68a'  // Soft amber starlight
        ];

        // DANCE ROUTINE DEFINITIONS
        const DANCE_MOVES = [
            { name: "DISCO INFERNO", duration: 240 },
            { name: "FUNKY HIGH-KNEE PUMP", duration: 240 },
            { name: "ZERO-G TWIRL & WAVE", duration: 240 },
            { name: "COSMIC MOONWALK SHUFFLE", duration: 240 }
        ];

        // EARTH CONTINENT & CLOUD DATA (Longitude, Latitude in degrees)
        const EARTH_CONTINENTS = [
            {
                // North America
                color: '#22c55e',
                coords: [
                    [-136, 58], [-115, 64], [-85, 62], [-66, 46],
                    [-78, 28], [-92, 16], [-105, 22], [-122, 38]
                ]
            },
            {
                // Greenland
                color: '#d1fae5',
                coords: [
                    [-52, 62], [-44, 78], [-22, 76], [-34, 62]
                ]
            },
            {
                // South America
                color: '#16a34a',
                coords: [
                    [-76, 10], [-54, 4], [-36, -8], [-46, -26],
                    [-66, -50], [-74, -36], [-80, -6]
                ]
            },
            {
                // Africa
                color: '#4ade80',
                coords: [
                    [-16, 16], [-6, 35], [28, 32], [48, 10],
                    [38, -16], [20, -34], [12, -14], [4, 5], [-12, 6]
                ]
            },
            {
                // Europe
                color: '#22c55e',
                coords: [
                    [-9, 38], [4, 52], [28, 64], [52, 58],
                    [44, 42], [22, 38], [6, 43]
                ]
            },
            {
                // Asia
                color: '#16a34a',
                coords: [
                    [54, 62], [95, 68], [138, 60], [132, 34],
                    [106, 14], [80, 10], [62, 24], [52, 42]
                ]
            },
            {
                // Australia
                color: '#84cc16',
                coords: [
                    [115, -20], [136, -13], [151, -26], [144, -38],
                    [118, -34]
                ]
            }
        ];

        const EARTH_CLOUDS = [
            [[-120, 32], [-95, 38], [-72, 30], [-92, 24]],
            [[-45, 48], [-15, 54], [15, 48], [-12, 42]],
            [[45, 22], [78, 28], [108, 20], [75, 14]],
            [[-65, -22], [-35, -18], [-12, -26], [-42, -30]],
            [[85, -32], [120, -28], [148, -36], [116, -40]]
        ];

        // STATE VARIABLES
        let astronauts = [];
        let stars = [];
        let shootingStars = [];
        let musicNotes = [];
        let nextShootingStarTimer = 180;
        let animationTime = 0;
        let noteSpawnTimer = 0;

        // Central Gravity Node Definition (Earth)
        const centralNode = {
            x: 0,
            y: 0,
            radius: 12
        };

        /**
         * Initializes procedural twinkling stars across multiple depth layers
         * adapted to the current canvas dimensions.
         */
        function initStarfield(width, height) {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                const layerRoll = Math.random();
                const layer = layerRoll < 0.55 ? 0 : (layerRoll < 0.88 ? 1 : 2);

                let radius, baseAlpha;
                if (layer === 0) {
                    radius = 0.6 + Math.random() * 0.45;
                    baseAlpha = 0.28 + Math.random() * 0.32;
                } else if (layer === 1) {
                    radius = 1.05 + Math.random() * 0.55;
                    baseAlpha = 0.48 + Math.random() * 0.35;
                } else {
                    radius = 1.6 + Math.random() * 0.6;
                    baseAlpha = 0.72 + Math.random() * 0.28;
                }

                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: radius,
                    color: STAR_PALETTE[Math.floor(Math.random() * STAR_PALETTE.length)],
                    baseAlpha: baseAlpha,
                    phase: Math.random() * Math.PI * 2,
                    twinkleSpeed: 0.015 + Math.random() * 0.035,
                    hasGlint: layer === 2 && radius >= 1.78
                });
            }
        }

        /**
         * Pre-renders the deep-space gradient, multi-layered nebulae, cosmic dust band,
         * and a distant ringed planet onto an offscreen canvas for smooth 60fps rendering.
         */
        function renderStaticSpaceBackdrop(width, height) {
            bgCanvas.width = width;
            bgCanvas.height = height;

            if (width <= 0 || height <= 0) return;

            // 1. Deep Cosmic Gradient (#02040a -> #080d1e -> #03050c)
            const baseGrad = bgCtx.createLinearGradient(0, 0, width, height);
            baseGrad.addColorStop(0, '#02040a');
            baseGrad.addColorStop(0.5, '#080d1e');
            baseGrad.addColorStop(1, '#03050c');
            bgCtx.fillStyle = baseGrad;
            bgCtx.fillRect(0, 0, width, height);

            // Subtle deep atmospheric vignette/core depth
            const centerDepth = bgCtx.createRadialGradient(
                width * 0.5, height * 0.5, width * 0.05,
                width * 0.5, height * 0.5, Math.max(width, height) * 0.75
            );
            centerDepth.addColorStop(0, 'rgba(14, 24, 52, 0.28)');
            centerDepth.addColorStop(1, 'rgba(1, 2, 6, 0.45)');
            bgCtx.fillStyle = centerDepth;
            bgCtx.fillRect(0, 0, width, height);

            // 2. Layered Soft Radial Nebula Clouds
            bgCtx.save();
            bgCtx.globalCompositeOperation = 'screen';

            const nebulae = [
                { x: width * 0.22, y: height * 0.30, r: Math.max(width, height) * 0.42, inner: 'rgba(49, 46, 129, 0.13)', mid: 'rgba(30, 27, 75, 0.05)' },
                { x: width * 0.78, y: height * 0.68, r: Math.max(width, height) * 0.46, inner: 'rgba(29, 78, 216, 0.11)', mid: 'rgba(23, 37, 84, 0.04)' },
                { x: width * 0.68, y: height * 0.24, r: Math.max(width, height) * 0.34, inner: 'rgba(91, 33, 182, 0.08)', mid: 'rgba(59, 7, 100, 0.03)' },
                { x: width * 0.34, y: height * 0.76, r: Math.max(width, height) * 0.36, inner: 'rgba(15, 118, 110, 0.075)', mid: 'rgba(17, 94, 89, 0.025)' },
                { x: width * 0.52, y: height * 0.48, r: Math.max(width, height) * 0.30, inner: 'rgba(37, 99, 235, 0.06)', mid: 'rgba(15, 23, 42, 0.01)' }
            ];

            for (const neb of nebulae) {
                const grad = bgCtx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.r);
                grad.addColorStop(0, neb.inner);
                grad.addColorStop(0.55, neb.mid);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                bgCtx.fillStyle = grad;
                bgCtx.fillRect(0, 0, width, height);
            }

            // 3. Subtle Cosmic Dust Band
            bgCtx.save();
            bgCtx.translate(width * 0.5, height * 0.5);
            bgCtx.rotate(-0.42);
            const bandHeight = Math.min(width, height) * 0.26;
            const bandLength = Math.hypot(width, height) * 1.1;
            const dustGrad = bgCtx.createLinearGradient(0, -bandHeight, 0, bandHeight);
            dustGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
            dustGrad.addColorStop(0.35, 'rgba(99, 130, 195, 0.035)');
            dustGrad.addColorStop(0.5, 'rgba(147, 197, 253, 0.055)');
            dustGrad.addColorStop(0.65, 'rgba(99, 130, 195, 0.035)');
            dustGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            bgCtx.fillStyle = dustGrad;
            bgCtx.fillRect(-bandLength * 0.5, -bandHeight, bandLength, bandHeight * 2);

            for (let i = 0; i < 260; i++) {
                const dx = (Math.random() - 0.5) * bandLength;
                const spread = (Math.random() + Math.random() - 1) * bandHeight * 0.75;
                const speckAlpha = 0.06 + Math.random() * 0.14;
                bgCtx.fillStyle = `rgba(195, 218, 255, ${speckAlpha})`;
                bgCtx.fillRect(dx, spread, 0.8, 0.8);
            }
            bgCtx.restore();
            bgCtx.restore();

            // 4. Subtle Distant Ringed Planet in upper-left background
            drawDistantRingedPlanet(bgCtx, width, height);
        }

        /**
         * Renders a faint, atmospheric ringed gas giant in the far distance.
         */
        function drawDistantRingedPlanet(targetCtx, width, height) {
            const planetX = width * 0.16;
            const planetY = height * 0.21;
            const planetRadius = Math.max(15, Math.min(width, height) * 0.036);
            const ringTilt = -0.36;

            targetCtx.save();
            targetCtx.translate(planetX, planetY);
            targetCtx.globalAlpha = 0.34;

            const halo = targetCtx.createRadialGradient(0, 0, planetRadius * 0.8, 0, 0, planetRadius * 2.4);
            halo.addColorStop(0, 'rgba(125, 165, 235, 0.18)');
            halo.addColorStop(1, 'rgba(125, 165, 235, 0)');
            targetCtx.fillStyle = halo;
            targetCtx.beginPath();
            targetCtx.arc(0, 0, planetRadius * 2.4, 0, Math.PI * 2);
            targetCtx.fill();

            // Back half of rings
            targetCtx.save();
            targetCtx.rotate(ringTilt);
            targetCtx.strokeStyle = 'rgba(165, 195, 240, 0.32)';
            targetCtx.lineWidth = planetRadius * 0.14;
            targetCtx.beginPath();
            targetCtx.ellipse(0, 0, planetRadius * 2.25, planetRadius * 0.55, 0, Math.PI, Math.PI * 2);
            targetCtx.stroke();

            targetCtx.strokeStyle = 'rgba(120, 155, 215, 0.22)';
            targetCtx.lineWidth = planetRadius * 0.07;
            targetCtx.beginPath();
            targetCtx.ellipse(0, 0, planetRadius * 2.55, planetRadius * 0.63, 0, Math.PI, Math.PI * 2);
            targetCtx.stroke();
            targetCtx.restore();

            // Planet sphere
            const bodyGrad = targetCtx.createRadialGradient(
                planetRadius * 0.38, planetRadius * 0.32, planetRadius * 0.1,
                0, 0, planetRadius
            );
            bodyGrad.addColorStop(0, '#7c9bd1');
            bodyGrad.addColorStop(0.55, '#2b3d63');
            bodyGrad.addColorStop(1, '#090e1c');

            targetCtx.fillStyle = bodyGrad;
            targetCtx.beginPath();
            targetCtx.arc(0, 0, planetRadius, 0, Math.PI * 2);
            targetCtx.fill();

            // Front half of rings
            targetCtx.save();
            targetCtx.rotate(ringTilt);
            targetCtx.strokeStyle = 'rgba(175, 205, 248, 0.38)';
            targetCtx.lineWidth = planetRadius * 0.14;
            targetCtx.beginPath();
            targetCtx.ellipse(0, 0, planetRadius * 2.25, planetRadius * 0.55, 0, 0, Math.PI);
            targetCtx.stroke();

            targetCtx.strokeStyle = 'rgba(125, 160, 220, 0.25)';
            targetCtx.lineWidth = planetRadius * 0.07;
            targetCtx.beginPath();
            targetCtx.ellipse(0, 0, planetRadius * 2.55, planetRadius * 0.63, 0, 0, Math.PI);
            targetCtx.stroke();
            targetCtx.restore();

            targetCtx.restore();
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            // Rebuild space backdrop and adapt starfield to new dimensions
            renderStaticSpaceBackdrop(canvas.width, canvas.height);
            initStarfield(canvas.width, canvas.height);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Canvas Click Handler: Directly launch astronaut at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchAstronaut(clickX, clickY);
        });

        function launchAstronaut(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Overwrite existing array to strictly maintain a single astronaut on screen
            astronauts = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4, // Preserved exact baseline collision radius
                hue: 0,
                angle: -0.15,
                angularVelocity: 0.015,
                trail: [{ x: x, y: y, hue: 0 }]
            }];
        }

        function resetSimulation() {
            astronauts = [];
            musicNotes = [];
        }

        function spawnMusicNote(x, y, hue) {
            const symbols = ['♪', '♫', '♩', '♬'];
            const symbol = symbols[Math.floor(Math.random() * symbols.length)];
            const angle = Math.random() * Math.PI * 2;
            const speed = 0.8 + Math.random() * 1.4;

            musicNotes.push({
                x: x + (Math.random() - 0.5) * 12,
                y: y - 10 + (Math.random() - 0.5) * 8,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 0.8,
                symbol: symbol,
                hue: hue,
                size: 14 + Math.random() * 8,
                rotation: (Math.random() - 0.5) * 0.4,
                rotSpeed: (Math.random() - 0.5) * 0.05,
                life: 0,
                maxLife: 50 + Math.floor(Math.random() * 25)
            });
        }

        function updateBackgroundEffects() {
            animationTime += 1;

            // Update Dance move HUD indicator
            const currentMoveIdx = Math.floor(animationTime / 240) % DANCE_MOVES.length;
            const badge = document.getElementById('danceBadge');
            if (badge) {
                badge.textContent = `DANCE: ${DANCE_MOVES[currentMoveIdx].name}`;
            }

            // Periodic subtle shooting star spawn
            nextShootingStarTimer--;
            if (nextShootingStarTimer <= 0 && canvas.width > 0 && canvas.height > 0) {
                const startX = Math.random() * canvas.width * 0.85;
                const startY = Math.random() * canvas.height * 0.45;
                const angle = (20 + Math.random() * 25) * (Math.PI / 180);
                const speed = 7 + Math.random() * 5;

                shootingStars.push({
                    x: startX,
                    y: startY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    length: 45 + Math.random() * 45,
                    life: 0,
                    maxLife: 36 + Math.floor(Math.random() * 20)
                });

                nextShootingStarTimer = 260 + Math.floor(Math.random() * 320);
            }

            // Update active shooting stars
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const s = shootingStars[i];
                s.x += s.vx;
                s.y += s.vy;
                s.life++;
                if (s.life >= s.maxLife) {
                    shootingStars.splice(i, 1);
                }
            }

            // Update active musical notes
            for (let i = musicNotes.length - 1; i >= 0; i--) {
                const n = musicNotes[i];
                n.x += n.vx;
                n.y += n.vy;
                n.rotation += n.rotSpeed;
                n.life++;
                if (n.life >= n.maxLife) {
                    musicNotes.splice(i, 1);
                }
            }
        }

        function updatePhysics() {
            for (let i = astronauts.length - 1; i >= 0; i--) {
                const astro = astronauts[i];

                // Remove astronaut if it travels too far off-screen
                const margin = 500;
                if (astro.x < -margin || astro.x > canvas.width + margin || 
                    astro.y < -margin || astro.y > canvas.height + margin) {
                    astronauts.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - astro.x;
                const dy = centralNode.y - astro.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: astronaut reaches central mass
                if (dist < centralNode.radius + astro.radius) {
                    astronauts.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity, position, and zero-G tumble rotation
                astro.vx += ax;
                astro.vy += ay;
                astro.x += astro.vx;
                astro.y += astro.vy;
                astro.angle += astro.angularVelocity;

                // Advance rainbow hue and record position history for line trail
                astro.hue = (astro.hue + 4.5) % 360;
                astro.trail.push({ x: astro.x, y: astro.y, hue: astro.hue });
                if (astro.trail.length > TRAIL_LENGTH) {
                    astro.trail.shift();
                }

                // Spawn dance musical notes periodically from astronaut
                noteSpawnTimer++;
                if (noteSpawnTimer % 12 === 0) {
                    spawnMusicNote(astro.x, astro.y, astro.hue);
                }
            }
        }

        function drawRoundedRect(targetCtx, x, y, width, height, radius) {
            targetCtx.beginPath();
            targetCtx.moveTo(x + radius, y);
            targetCtx.lineTo(x + width - radius, y);
            targetCtx.quadraticCurveTo(x + width, y, x + width, y + radius);
            targetCtx.lineTo(x + width, y + height - radius);
            targetCtx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            targetCtx.lineTo(x + radius, y + height);
            targetCtx.quadraticCurveTo(x, y + height, x, y + height - radius);
            targetCtx.lineTo(x, y + radius);
            targetCtx.quadraticCurveTo(x, y, x + radius, y);
            targetCtx.closePath();
        }

        /**
         * Renders an articulated, beat-synced dancing astronaut in zero gravity.
         * Smoothly cycles through disco pointing, funky arm pumping with high knees,
         * hands-up zero-G twirling, and moonwalk shuffles with body bounce & head bobbing.
         */
        function drawAstronaut(astro) {
            ctx.save();
            ctx.translate(astro.x, astro.y);

            // Compute Beat & Dance Choreography Angles
            const beatRate = 0.22; // Rhythmic tempo
            const danceTime = animationTime * beatRate;
            const moveIdx = Math.floor(animationTime / 240) % 4;
            
            // Continuous grooving rhythms
            const beatBounce = Math.sin(danceTime * 2) * 2.2;
            const headBob = Math.cos(danceTime * 2) * 0.18;
            const hipSway = Math.sin(danceTime) * 3;

            // Articulated joint rotation variables
            let torsoRoll = Math.sin(danceTime) * 0.1;
            let headTilt = headBob;

            // Left & Right Arm joint parameters: { upperArmAngle, forearmAngle }
            let leftArm = { upper: 0.8, forearm: -0.4 };
            let rightArm = { upper: -0.8, forearm: 0.4 };

            // Left & Right Leg joint parameters: { thighAngle, kneeAngle }
            let leftLeg = { thigh: 0.3, knee: 0.2 };
            let rightLeg = { thigh: -0.3, knee: 0.4 };

            if (moveIdx === 0) {
                // MOVE 0: DISCO INFERNO (Diagonal High Point & Low Stance)
                const pointCycle = Math.sin(danceTime * 2);
                rightArm.upper = -2.2 + pointCycle * 0.25; // Pointing high right!
                rightArm.forearm = -0.1;

                leftArm.upper = 0.9 + Math.cos(danceTime * 2) * 0.2; // Left hand on hip/side
                leftArm.forearm = -1.2;

                torsoRoll = pointCycle * 0.15;
                headTilt = -0.35 + Math.sin(danceTime * 2) * 0.12;

                leftLeg.thigh = 0.6 + Math.sin(danceTime * 2) * 0.2;
                leftLeg.knee = 0.5;
                rightLeg.thigh = -0.4 - Math.cos(danceTime * 2) * 0.15;
                rightLeg.knee = 0.3;

            } else if (moveIdx === 1) {
                // MOVE 1: FUNKY HIGH-KNEE ARM PUMP
                const pump = Math.sin(danceTime * 2.5);
                rightArm.upper = -1.4 + pump * 0.9;
                rightArm.forearm = -0.8;

                leftArm.upper = -1.4 - pump * 0.9;
                leftArm.forearm = -0.8;

                // Alternating high knee steps
                rightLeg.thigh = 0.2 - pump * 0.8;
                rightLeg.knee = 0.9;
                leftLeg.thigh = 0.2 + pump * 0.8;
                leftLeg.knee = 0.9;

                headTilt = pump * 0.2;
                torsoRoll = -pump * 0.12;

            } else if (moveIdx === 2) {
                // MOVE 2: ZERO-G TWIRL & HANDS-UP CELEBRATION WAVE
                const waveLeft = Math.sin(danceTime * 3) * 0.5;
                const waveRight = Math.cos(danceTime * 3) * 0.5;

                leftArm.upper = -2.4 + waveLeft;
                leftArm.forearm = -0.4;

                rightArm.upper = -2.4 - waveRight;
                rightArm.forearm = -0.4;

                // Floating loose zero-G legs
                leftLeg.thigh = 0.5 + Math.sin(danceTime) * 0.3;
                leftLeg.knee = 0.6;
                rightLeg.thigh = -0.5 - Math.cos(danceTime) * 0.3;
                rightLeg.knee = 0.4;

                torsoRoll = Math.sin(danceTime * 1.5) * 0.28;
                headTilt = Math.cos(danceTime * 2) * 0.22;

            } else if (moveIdx === 3) {
                // MOVE 3: COSMIC MOONWALK SHUFFLE
                const shuffle = Math.sin(danceTime * 2.2);

                // Arms grooving smoothly back and forth
                leftArm.upper = 0.4 + shuffle * 0.5;
                leftArm.forearm = -0.5;
                rightArm.upper = -0.4 - shuffle * 0.5;
                rightArm.forearm = -0.5;

                // Moonwalk sliding legs
                leftLeg.thigh = -0.2 - shuffle * 0.6;
                leftLeg.knee = shuffle > 0 ? 0.9 : 0.1;
                rightLeg.thigh = -0.2 + shuffle * 0.6;
                rightLeg.knee = shuffle <= 0 ? 0.9 : 0.1;

                torsoRoll = -0.2; // Leaning back moonwalk style
                headTilt = 0.18 + Math.sin(danceTime * 2) * 0.1;
            }

            // Apply base orbital rotation plus body dance bounce & roll
            ctx.rotate(astro.angle + torsoRoll);
            ctx.translate(hipSway * 0.5, beatBounce);

            // 1. Luminous Rainbow Aura matching trajectory trail
            const auraGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 24);
            auraGrad.addColorStop(0, `hsla(${astro.hue}, 100%, 70%, 0.45)`);
            auraGrad.addColorStop(1, `hsla(${astro.hue}, 100%, 55%, 0)`);
            ctx.fillStyle = auraGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 24, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Helper function to draw articulated 2-segment limbs (arm or leg)
            function drawArticulatedLimb(startX, startY, angle1, length1, angle2, length2, thickness, baseColor, jointColor, isGloveOrBoot) {
                const elbowX = startX + Math.cos(angle1) * length1;
                const elbowY = startY + Math.sin(angle1) * length1;
                const endX = elbowX + Math.cos(angle1 + angle2) * length2;
                const endY = elbowY + Math.sin(angle1 + angle2) * length2;

                // Limb shadow / outline
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = thickness + 1.6;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(elbowX, elbowY);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                // Limb primary suit fabric
                ctx.strokeStyle = baseColor;
                ctx.lineWidth = thickness;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(elbowX, elbowY);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                // Joint patch ring
                ctx.fillStyle = '#64748b';
                ctx.beginPath();
                ctx.arc(elbowX, elbowY, thickness * 0.55, 0, Math.PI * 2);
                ctx.fill();

                // Boot or Glove Tip
                if (isGloveOrBoot === 'boot') {
                    ctx.strokeStyle = '#475569';
                    ctx.lineWidth = thickness * 1.1;
                    ctx.beginPath();
                    ctx.moveTo(endX, endY);
                    ctx.lineTo(endX + Math.cos(angle1 + angle2) * 3.5, endY + Math.sin(angle1 + angle2) * 3.5);
                    ctx.stroke();
                } else if (isGloveOrBoot === 'glove') {
                    ctx.fillStyle = jointColor || '#475569';
                    ctx.beginPath();
                    ctx.arc(endX, endY, thickness * 0.65, 0, Math.PI * 2);
                    ctx.fill();
                }

                return { endX, endY };
            }

            // 2. BACK LEG (Layered behind torso)
            drawArticulatedLimb(
                -2, 4.5,
                Math.PI / 2 + leftLeg.thigh, 7.5,
                leftLeg.knee, 7.5,
                4.2, '#cbd5e1', '#475569', 'boot'
            );

            // 3. BACK ARM (Layered behind torso)
            drawArticulatedLimb(
                -3.5, -3,
                leftArm.upper, 6.5,
                leftArm.forearm, 6.5,
                3.6, '#cbd5e1', '#38bdf8', 'glove'
            );

            // 4. PLSS Life-Support Backpack & Telemetry Antenna
            // Antenna with pulsing LED
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(-8.5, -6.5);
            ctx.lineTo(-8.5, -12);
            ctx.stroke();

            const ledPulse = Math.sin(danceTime * 4) > 0 ? '#38bdf8' : '#ef4444';
            ctx.fillStyle = ledPulse;
            ctx.beginPath();
            ctx.arc(-8.5, -12.3, 1.3, 0, Math.PI * 2);
            ctx.fill();

            // Backpack body
            drawRoundedRect(ctx, -11, -6.5, 6.5, 13, 2);
            ctx.fillStyle = '#e2e8f0';
            ctx.fill();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 0.9;
            ctx.stroke();

            // Backpack telemetry status light
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(-9, -4, 2.4, 1.5);

            // 5. Spacesuit Torso
            drawRoundedRect(ctx, -5, -5.5, 10, 12, 4);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 0.9;
            ctx.stroke();

            // Waist Belt
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.moveTo(-4.5, 3.4);
            ctx.lineTo(4.5, 3.4);
            ctx.stroke();

            // Chest Control Module (DCM) with rhythmically blinking buttons
            drawRoundedRect(ctx, -0.3, -3.2, 4.5, 4.8, 1);
            ctx.fillStyle = '#cbd5e1';
            ctx.fill();
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 0.7;
            ctx.stroke();

            // Tiny control buttons (Blinking on beat)
            ctx.fillStyle = Math.sin(danceTime * 3) > 0 ? '#ef4444' : '#991b1b';
            ctx.fillRect(0.6, -2.1, 1.3, 1.3);
            ctx.fillStyle = Math.sin(danceTime * 3) <= 0 ? '#0ea5e9' : '#0369a1';
            ctx.fillRect(2.3, -2.1, 1.3, 1.3);

            // 6. FRONT LEG & SPACE BOOT (Layered in front of torso)
            drawArticulatedLimb(
                1.5, 4.8,
                Math.PI / 2 + rightLeg.thigh, 8,
                rightLeg.knee, 8,
                4.6, '#ffffff', '#334155', 'boot'
            );

            // 7. Helmet & Gold Reflective Visor (with head bobbing/tilt)
            ctx.save();
            ctx.translate(0.4, -11);
            ctx.rotate(headTilt);

            // Neck ring
            ctx.fillStyle = '#64748b';
            ctx.beginPath();
            ctx.ellipse(0, 5.4, 4.6, 1.3, 0, 0, Math.PI * 2);
            ctx.fill();

            // Helmet shell gradient
            const helmetGrad = ctx.createRadialGradient(-1.8, -2, 1.5, 0, 0, 7.5);
            helmetGrad.addColorStop(0, '#ffffff');
            helmetGrad.addColorStop(0.75, '#f1f5f9');
            helmetGrad.addColorStop(1, '#cbd5e1');

            ctx.fillStyle = helmetGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 7.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 0.9;
            ctx.stroke();

            // Gold-tinted reflective visor
            const visorGrad = ctx.createLinearGradient(-1, -4.5, 5.5, 4.5);
            visorGrad.addColorStop(0, '#fde047');
            visorGrad.addColorStop(0.45, '#f59e0b');
            visorGrad.addColorStop(1, '#78350f');

            ctx.fillStyle = visorGrad;
            ctx.beginPath();
            ctx.ellipse(2.1, 0, 4.6, 4.9, -0.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 0.7;
            ctx.stroke();

            // Visor specular glass reflection
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.88)';
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.arc(1.9, -0.2, 3.2, -2.3, -1.15);
            ctx.stroke();

            ctx.restore(); // Restore helmet tilt transform

            // 8. FRONT ARM & GLOVE (Layered in front for depth)
            drawArticulatedLimb(
                -0.5, -2.8,
                rightArm.upper, 7,
                rightArm.forearm, 7,
                4.2, '#ffffff', '#38bdf8', 'glove'
            );

            ctx.restore();
        }

        function drawSpaceEnvironment() {
            // Blit pre-rendered deep space, nebulae, dust band, and distant planet
            ctx.drawImage(bgCanvas, 0, 0);

            // Render twinkling starfield
            for (const star of stars) {
                const twinkle = 0.65 + 0.35 * Math.sin(animationTime * star.twinkleSpeed + star.phase);
                const alpha = star.baseAlpha * twinkle;

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();

                // Subtle 4-point diffraction sparkle glint on brightest stars
                if (star.hasGlint && twinkle > 0.78) {
                    const glintSize = star.radius * 3.2 * twinkle;
                    ctx.strokeStyle = star.color;
                    ctx.lineWidth = 0.65;
                    ctx.globalAlpha = alpha * 0.55;
                    ctx.beginPath();
                    ctx.moveTo(star.x - glintSize, star.y);
                    ctx.lineTo(star.x + glintSize, star.y);
                    ctx.moveTo(star.x, star.y - glintSize);
                    ctx.lineTo(star.x, star.y + glintSize);
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Render occasional subtle shooting stars
            for (const s of shootingStars) {
                const progress = s.life / s.maxLife;
                const fade = Math.sin(progress * Math.PI);
                const speed = Math.hypot(s.vx, s.vy);
                const tailX = s.x - (s.vx / speed) * s.length;
                const tailY = s.y - (s.vy / speed) * s.length;

                const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
                grad.addColorStop(0, `rgba(224, 242, 254, ${0.55 * fade})`);
                grad.addColorStop(0.35, `rgba(147, 197, 253, ${0.22 * fade})`);
                grad.addColorStop(1, 'rgba(147, 197, 253, 0)');

                ctx.save();
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();
                ctx.restore();
            }

            // Render floating musical notes particle effect
            for (const n of musicNotes) {
                const progress = n.life / n.maxLife;
                const alpha = Math.sin((1 - progress) * Math.PI);

                ctx.save();
                ctx.translate(n.x, n.y);
                ctx.rotate(n.rotation);
                ctx.font = `bold ${n.size}px sans-serif`;
                ctx.fillStyle = `hsla(${n.hue}, 100%, 75%, ${alpha})`;
                ctx.shadowColor = `hsl(${n.hue}, 100%, 60%)`;
                ctx.shadowBlur = 8;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(n.symbol, 0, 0);
                ctx.restore();
            }
        }

        /**
         * Projects a geographic polygon onto the visible front hemisphere of Earth
         * with smooth horizon clamping so continents rotate naturally around the globe.
         */
        function drawSphericalPolygon(coords, radius, rotationRad) {
            const projected = [];
            let hasVisiblePoint = false;

            for (let i = 0; i < coords.length; i++) {
                const lon = (coords[i][0] * Math.PI) / 180 + rotationRad;
                const lat = (coords[i][1] * Math.PI) / 180;

                const cosLat = Math.cos(lat);
                const x3d = cosLat * Math.sin(lon);
                const y3d = -Math.sin(lat);
                const z3d = cosLat * Math.cos(lon);

                if (z3d > 0) {
                    hasVisiblePoint = true;
                    projected.push({ x: radius * x3d, y: radius * y3d });
                } else {
                    const limbDist = Math.hypot(x3d, y3d) || 1;
                    projected.push({
                        x: radius * (x3d / limbDist),
                        y: radius * (y3d / limbDist)
                    });
                }
            }

            if (!hasVisiblePoint) return;

            ctx.beginPath();
            ctx.moveTo(projected[0].x, projected[0].y);
            for (let i = 1; i < projected.length; i++) {
                ctx.lineTo(projected[i].x, projected[i].y);
            }
            ctx.closePath();
            ctx.fill();
        }

        /**
         * Renders Planet Earth at the central gravity node with sunlit oceans,
         * rotating continents, polar ice caps, clouds, and an atmospheric blue limb.
         */
        function drawEarth() {
            const x = centralNode.x;
            const y = centralNode.y;
            const r = centralNode.radius;

            // 1. Blue Rayleigh Atmospheric Glow & Subtle Gravitational Ring
            const pulse = 1 + 0.04 * Math.sin(animationTime * 0.04);
            const atmoRadius = r * 3.2 * pulse;
            const atmoGrad = ctx.createRadialGradient(x, y, r * 0.85, x, y, atmoRadius);
            atmoGrad.addColorStop(0, 'rgba(56, 189, 248, 0.44)');
            atmoGrad.addColorStop(0.38, 'rgba(37, 99, 235, 0.16)');
            atmoGrad.addColorStop(1, 'rgba(29, 78, 216, 0)');

            ctx.beginPath();
            ctx.arc(x, y, atmoRadius, 0, Math.PI * 2);
            ctx.fillStyle = atmoGrad;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x, y, r * 2.1, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(125, 211, 252, 0.14)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // 2. Earth Globe (Clipped to exact 12px radius)
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-0.22); // Realistic ~12.6° axial tilt

            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.clip();

            // Ocean sphere base gradient (sunlit from upper-left)
            const oceanGrad = ctx.createRadialGradient(
                -r * 0.35, -r * 0.35, r * 0.1,
                0, 0, r * 1.15
            );
            oceanGrad.addColorStop(0, '#38bdf8');
            oceanGrad.addColorStop(0.45, '#1d4ed8');
            oceanGrad.addColorStop(0.85, '#1e3a8a');
            oceanGrad.addColorStop(1, '#09132e');

            ctx.fillStyle = oceanGrad;
            ctx.fillRect(-r, -r, r * 2, r * 2);

            // Rotating Continents
            const earthRotation = animationTime * 0.0055;
            for (const continent of EARTH_CONTINENTS) {
                ctx.fillStyle = continent.color;
                drawSphericalPolygon(continent.coords, r, earthRotation);
            }

            // Polar Ice Caps (North & South)
            ctx.fillStyle = 'rgba(240, 249, 255, 0.85)';
            ctx.fillRect(-r, -r, r * 2, r * 0.22);
            ctx.fillRect(-r, r * 0.78, r * 2, r * 0.24);

            // Drifting Cloud Wisps (rotating slightly faster than surface)
            const cloudRotation = animationTime * 0.0072;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.38)';
            for (const cloud of EARTH_CLOUDS) {
                drawSphericalPolygon(cloud, r, cloudRotation);
            }

            // Day/Night Terminator & 3D Spherical Shadow
            const shadowGrad = ctx.createRadialGradient(
                -r * 0.42, -r * 0.42, r * 0.35,
                r * 0.15, r * 0.15, r * 1.15
            );
            shadowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.12)');
            shadowGrad.addColorStop(0.55, 'rgba(2, 6, 23, 0.08)');
            shadowGrad.addColorStop(0.85, 'rgba(2, 6, 23, 0.55)');
            shadowGrad.addColorStop(1, 'rgba(1, 4, 16, 0.82)');

            ctx.fillStyle = shadowGrad;
            ctx.fillRect(-r, -r, r * 2, r * 2);

            // Thin Blue Atmospheric Rim Highlight
            ctx.strokeStyle = 'rgba(125, 211, 252, 0.75)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(0, 0, r - 0.4, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            // 0. Draw Deep Space Background, Nebulae, Stars, Shooting Stars & Musical Notes
            drawSpaceEnvironment();

            // 1. Draw Central Gravity Node as Planet Earth
            drawEarth();

            // 2. Draw Dancing Astronaut & Luminous Rainbow Trajectory Trail
            for (const astro of astronauts) {
                if (astro.trail.length > 1) {
                    ctx.save();
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    // Outer soft rainbow luminous glow along trajectory
                    ctx.lineWidth = 3.4;
                    for (let t = 1; t < astro.trail.length; t++) {
                        const p0 = astro.trail[t - 1];
                        const p1 = astro.trail[t];
                        ctx.beginPath();
                        ctx.moveTo(p0.x, p0.y);
                        ctx.lineTo(p1.x, p1.y);
                        ctx.strokeStyle = `hsla(${p1.hue}, 100%, 55%, 0.32)`;
                        ctx.stroke();
                    }

                    // Crisp high-contrast inner rainbow trajectory path
                    ctx.lineWidth = 1.4;
                    for (let t = 1; t < astro.trail.length; t++) {
                        const p0 = astro.trail[t - 1];
                        const p1 = astro.trail[t];
                        ctx.beginPath();
                        ctx.moveTo(p0.x, p0.y);
                        ctx.lineTo(p1.x, p1.y);
                        ctx.strokeStyle = `hsl(${p1.hue}, 100%, 68%)`;
                        ctx.stroke();
                    }

                    ctx.restore();
                }

                // Draw articulated dancing astronaut at current orbital position
                drawAstronaut(astro);
            }
        }

        function animate() {
            updateBackgroundEffects();
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            animate();
        };
    </script>
