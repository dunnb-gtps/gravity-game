<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Simulation</title>
    <style>
        /* Global Reset & Typography */
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        /* Main Viewport Layout with Pastel Gradient Background */
        body {
            background: linear-gradient(135deg, #ffd1dc 0%, #bae1ff 50%, #b2f0e8 100%);
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1e293b;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Speed Slider Control */
        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #speedSlider {
            -webkit-appearance: none;
            appearance: none;
            width: 160px;
            height: 6px;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid #1e293b;
            outline: none;
            cursor: pointer;
        }

        #speedSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px #1e293b;
            cursor: grab;
            transition: transform 0.1s ease-in-out;
        }

        #speedSlider::-webkit-slider-thumb:active {
            cursor: grabbing;
            transform: scale(1.15);
        }

        #speedSlider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px #1e293b;
            cursor: grab;
            transition: transform 0.1s ease-in-out;
        }

        #speedSlider::-moz-range-thumb:active {
            cursor: grabbing;
            transform: scale(1.15);
        }

        #speedValue {
            min-width: 38px;
            text-align: right;
        }

        /* Ball Color Picker Controls */
        .color-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .color-btn {
            background: rgba(255, 255, 255, 0.35);
            color: #1e293b;
            border: 1px solid #1e293b;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }

        .color-btn.active {
            background: #1e293b;
            color: #ffffff;
        }

        .swatch-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1.5px solid #1e293b;
            cursor: pointer;
            transition: transform 0.12s ease-in-out, box-shadow 0.12s ease-in-out;
        }

        .swatch-btn:hover {
            transform: scale(1.12);
        }

        .swatch-btn.active {
            transform: scale(1.15);
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 3.5px #1e293b;
        }

        /* Reset Button Styling */
        .btn-reset {
            background: rgba(255, 255, 255, 0.35);
            color: #1e293b;
            border: 1px solid #1e293b;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #1e293b;
            color: #ffffff;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background: linear-gradient(135deg, #ffd1dc 0%, #bae1ff 50%, #b2f0e8 100%);
            border: 1px solid #1e293b;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        /* Footer Instructions */
        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #334155;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>

        <!-- Velocity Control Bar -->
        <div class="speed-control">
            <label for="speedSlider">Speed:</label>
            <input type="range" id="speedSlider" min="0" max="15" step="0.1" value="5">
            <span id="speedValue">5.0</span>
        </div>

        <!-- Pastel Ball Color Selector -->
        <div class="color-control" role="group" aria-label="Ball Color Selection">
            <span>Ball:</span>
            <button type="button" class="color-btn active" data-mode="cycle" onclick="setColorMode('cycle', this)">Cycle</button>
            <button type="button" class="swatch-btn" style="background: #ff9ebb;" title="Pastel Pink" aria-label="Pastel Pink" onclick="setColorMode(0, this)"></button>
            <button type="button" class="swatch-btn" style="background: #8ecae6;" title="Pastel Blue" aria-label="Pastel Blue" onclick="setColorMode(1, this)"></button>
            <button type="button" class="swatch-btn" style="background: #80ded9;" title="Pastel Teal" aria-label="Pastel Teal" onclick="setColorMode(2, this)"></button>
        </div>

        <!-- Simulation Reset Trigger -->
        <button class="btn-reset" onclick="resetSimulation()">Reset</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <!-- Usage Guidance -->
    <div class="instructions">
        Adjust the speed bar above, pick a pastel ball color (or Cycle), and click anywhere on the canvas to launch balls.
    </div>

    <script>
        // DOM Element References
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;         // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center

        // PASTEL BALL PALETTE (Pink, Blue, Teal)
        const BALL_COLORS = [
            { name: 'Pastel Pink', fill: '#ff9ebb' },
            { name: 'Pastel Blue', fill: '#8ecae6' },
            { name: 'Pastel Teal', fill: '#80ded9' }
        ];

        // STATE VARIABLES
        let launchVelocity = parseFloat(speedSlider.value); // Adjustable velocity on click
        let balls = [];
        let colorMode = 'cycle'; // 'cycle' or palette index (0, 1, 2)
        let colorIndex = 0;

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 12
        };

        /**
         * Switches between cycling through pastel colors or locking a single color.
         */
        function setColorMode(mode, btnEl) {
            colorMode = mode;
            document.querySelectorAll('.color-btn, .swatch-btn').forEach(el => {
                el.classList.remove('active');
            });
            btnEl.classList.add('active');
        }

        /**
         * Updates the displayed velocity value and fills the slider track
         * with deep slate up to the current thumb position.
         */
        function updateSpeedUI() {
            launchVelocity = parseFloat(speedSlider.value);
            speedValue.textContent = launchVelocity.toFixed(1);

            const min = parseFloat(speedSlider.min);
            const max = parseFloat(speedSlider.max);
            const percent = ((launchVelocity - min) / (max - min)) * 100;
            speedSlider.style.background = `linear-gradient(to right, #1e293b 0%, #1e293b ${percent}%, rgba(255, 255, 255, 0.55) ${percent}%, rgba(255, 255, 255, 0.55) 100%)`;
        }

        speedSlider.addEventListener('input', updateSpeedUI);
        updateSpeedUI();

        /**
         * Resizes the HTML5 canvas to match its responsive container
         * and recenters the central gravity node.
         */
        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        /**
         * Canvas Click Handler: Launches a ball directly at the clicked coordinates.
         */
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchBall(clickX, clickY);
        });

        /**
         * Initializes an orbiting pastel projectile at (x, y) using the
         * current launchVelocity and FIXED_LAUNCH_ANGLE.
         */
        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = launchVelocity * Math.sin(rad);  // sin(90°) = 1  -> vx = launchVelocity
            const vy = -launchVelocity * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Select pastel color (either cycling Pink -> Blue -> Teal or fixed selection)
            let chosenColor;
            if (colorMode === 'cycle') {
                chosenColor = BALL_COLORS[colorIndex].fill;
                colorIndex = (colorIndex + 1) % BALL_COLORS.length;
            } else {
                chosenColor = BALL_COLORS[colorMode].fill;
            }

            balls.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 6,
                color: chosenColor,
                trail: [] // Stores history of past {x, y} coordinates
            });
        }

        /**
         * Clears active projectiles from the simulation canvas.
         */
        function resetSimulation() {
            balls = [];
            colorIndex = 0;
        }

        /**
         * Advances projectile kinematics using softened inverse-square gravity
         * and removes projectiles that collide with the central mass or leave bounds.
         */
        function updatePhysics() {
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove ball if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin ||
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    balls.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }
        }

        /**
         * Renders the pastel gradient backdrop, central gravity node,
         * trajectory paths, and active pastel projectiles.
         */
        function draw() {
            // Paint diagonal pastel gradient across the canvas
            const bgGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            bgGradient.addColorStop(0, '#ffd1dc');   // Pastel Pink
            bgGradient.addColorStop(0.5, '#bae1ff'); // Pastel Blue
            bgGradient.addColorStop(1, '#b2f0e8');   // Pastel Teal
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Central Mass Node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#1e293b';
            ctx.fill();

            // Center mark on node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // 2. Draw Balls & Trails
            for (const b of balls) {
                // Draw path line with subtle slate casing and pastel core
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.strokeStyle = 'rgba(30, 41, 59, 0.45)';
                    ctx.lineWidth = 2.6;
                    ctx.stroke();

                    ctx.strokeStyle = b.color;
                    ctx.lineWidth = 1.6;
                    ctx.stroke();
                }

                // Draw pastel ball object with crisp slate border
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = '#1e293b';
                ctx.stroke();
            }
        }

        /**
         * Main animation loop driven by requestAnimationFrame.
         */
        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
