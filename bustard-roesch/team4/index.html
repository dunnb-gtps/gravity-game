<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Simulation</title>
    <style>
        /* Global Reset & Typography */
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        /* Main Viewport Layout with Pastel Gradient Background */
        body {
            background: linear-gradient(135deg, #ffd1dc 0%, #bae1ff 50%, #b2f0e8 100%);
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1e293b;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Speed Slider Control */
        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #speedSlider {
            -webkit-appearance: none;
            appearance: none;
            width: 160px;
            height: 6px;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid #1e293b;
            outline: none;
            cursor: pointer;
        }

        #speedSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px #1e293b;
            cursor: grab;
            transition: transform 0.1s ease-in-out;
        }

        #speedSlider::-webkit-slider-thumb:active {
            cursor: grabbing;
            transform: scale(1.15);
        }

        #speedSlider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px #1e293b;
            cursor: grab;
            transition: transform 0.1s ease-in-out;
        }

        #speedSlider::-moz-range-thumb:active {
            cursor: grabbing;
            transform: scale(1.15);
        }

        #speedValue {
            min-width: 38px;
            text-align: right;
        }

        /* Star Color Picker Controls */
        .color-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .color-btn {
            background: rgba(255, 255, 255, 0.35);
            color: #1e293b;
            border: 1px solid #1e293b;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }

        .color-btn.active {
            background: #1e293b;
            color: #ffffff;
        }

        .swatch-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1.5px solid #1e293b;
            cursor: pointer;
            transition: transform 0.12s ease-in-out, box-shadow 0.12s ease-in-out;
        }

        .swatch-btn:hover {
            transform: scale(1.12);
        }

        .swatch-btn.active {
            transform: scale(1.15);
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 3.5px #1e293b;
        }

        /* Reset Button Styling */
        .btn-reset {
            background: rgba(255, 255, 255, 0.35);
            color: #1e293b;
            border: 1px solid #1e293b;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #1e293b;
            color: #ffffff;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background: linear-gradient(135deg, #ffd1dc 0%, #bae1ff 50%, #b2f0e8 100%);
            border: 1px solid #1e293b;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        /* Footer Instructions */
        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #334155;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>

        <!-- Velocity Control Bar -->
        <div class="speed-control">
            <label for="speedSlider">Speed:</label>
            <input type="range" id="speedSlider" min="0" max="15" step="0.1" value="5">
            <span id="speedValue">5.0</span>
        </div>

        <!-- Pink & Blue Star Color Selector -->
        <div class="color-control" role="group" aria-label="Star Color Selection">
            <span>Stars:</span>
            <button type="button" class="color-btn active" data-mode="cycle" onclick="setColorMode('cycle', this)">Cycle</button>
            <button type="button" class="swatch-btn" style="background: #ff9ebb;" title="Pastel Pink" aria-label="Pastel Pink" onclick="setColorMode(0, this)"></button>
            <button type="button" class="swatch-btn" style="background: #8ecae6;" title="Pastel Blue" aria-label="Pastel Blue" onclick="setColorMode(1, this)"></button>
        </div>

        <!-- Simulation Reset Trigger -->
        <button class="btn-reset" onclick="resetSimulation()">Reset</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <!-- Usage Guidance -->
    <div class="instructions">
        Adjust the speed bar above, pick a pink or blue star (or Cycle), and click anywhere on the canvas to orbit the dancing pup.
    </div>

    <script>
        // DOM Element References
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;         // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center

        // PINK & BLUE STAR PALETTE
        const STAR_COLORS = [
            { name: 'Pastel Pink', fill: '#ff9ebb' },
            { name: 'Pastel Blue', fill: '#8ecae6' }
        ];

        // PINK & BLUE PARTY LIGHT PALETTES
        const PARTY_LIGHT_PALETTES = {
            pink: [
                { core: '#fff0f6', mid: '#ff85ab', glow: 'rgba(255, 107, 157, 0.45)' },
                { core: '#ffe3ec', mid: '#ff6b9d', glow: 'rgba(255, 77, 148, 0.42)' },
                { core: '#ffffff', mid: '#ff9ebb', glow: 'rgba(255, 133, 171, 0.48)' }
            ],
            blue: [
                { core: '#f0f9ff', mid: '#60b5e5', glow: 'rgba(56, 189, 248, 0.45)' },
                { core: '#e0f2fe', mid: '#38bdf8', glow: 'rgba(59, 158, 255, 0.42)' },
                { core: '#ffffff', mid: '#8ecae6', glow: 'rgba(96, 181, 229, 0.48)' }
            ]
        };

        // STATE VARIABLES
        let launchVelocity = parseFloat(speedSlider.value); // Adjustable velocity on click
        let stars = [];
        let ambientStars = [];
        let partyLights = [];
        let colorMode = 'cycle'; // 'cycle' or palette index (0, 1)
        let colorIndex = 0;

        // Central Gravity Node Definition (Sized to match the dancing pastel pink dog)
        const centralNode = {
            x: 0,
            y: 0,
            radius: 25
        };

        /**
         * Switches between cycling through pink & blue or locking a single color.
         */
        function setColorMode(mode, btnEl) {
            colorMode = mode;
            document.querySelectorAll('.color-btn, .swatch-btn').forEach(el => {
                el.classList.remove('active');
            });
            btnEl.classList.add('active');
        }

        /**
         * Updates the displayed velocity value and fills the slider track
         * with deep slate up to the current thumb position.
         */
        function updateSpeedUI() {
            launchVelocity = parseFloat(speedSlider.value);
            speedValue.textContent = launchVelocity.toFixed(1);

            const min = parseFloat(speedSlider.min);
            const max = parseFloat(speedSlider.max);
            const percent = ((launchVelocity - min) / (max - min)) * 100;
            speedSlider.style.background = `linear-gradient(to right, #1e293b 0%, #1e293b ${percent}%, rgba(255, 255, 255, 0.55) ${percent}%, rgba(255, 255, 255, 0.55) 100%)`;
        }

        speedSlider.addEventListener('input', updateSpeedUI);
        updateSpeedUI();

        /**
         * Populates subtle twinkling pink and blue stars across the background sky.
         */
        function generateAmbientStars() {
            const count = Math.max(24, Math.floor((canvas.width * canvas.height) / 18000));
            const pinkShades = ['#ff85ab', '#ff9ebb'];
            const blueShades = ['#60b5e5', '#8ecae6'];

            ambientStars = [];
            for (let i = 0; i < count; i++) {
                const isPink = i % 2 === 0;
                const palette = isPink ? pinkShades : blueShades;
                ambientStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    outerRadius: 3.5 + Math.random() * 3.5,
                    innerRadius: 1.4 + Math.random() * 1.3,
                    color: palette[Math.floor(Math.random() * palette.length)],
                    twinkleSpeed: 0.002 + Math.random() * 0.003,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        /**
         * Populates luminous pink and blue party light particles that sprinkle
         * continuously from top to bottom everywhere across the canvas.
         */
        function generatePartyLights() {
            const count = Math.max(95, Math.floor((canvas.width * canvas.height) / 6800));
            const styles = ['orb', 'sparkle', 'droplet'];

            partyLights = [];
            for (let i = 0; i < count; i++) {
                const isPink = i % 2 === 0;
                const paletteGroup = isPink ? PARTY_LIGHT_PALETTES.pink : PARTY_LIGHT_PALETTES.blue;
                const tone = paletteGroup[Math.floor(Math.random() * paletteGroup.length)];
                const depth = 0.45 + Math.random() * 0.85; // Controls size, glow, and sprinkle speed
                const radius = 2.0 + depth * 2.8;

                partyLights.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vy: 0.55 + depth * 1.35,
                    swayAmp: 0.25 + Math.random() * 0.75,
                    swaySpeed: 0.0014 + Math.random() * 0.0026,
                    twinkleSpeed: 0.0035 + Math.random() * 0.0055,
                    phase: Math.random() * Math.PI * 2,
                    radius: radius,
                    glowRadius: radius * (3.2 + Math.random() * 1.6),
                    tone: tone,
                    style: styles[i % styles.length],
                    layer: depth > 0.92 ? 'front' : 'back'
                });
            }
        }

        /**
         * Resizes the HTML5 canvas to match its responsive container
         * and recenters the central gravity node.
         */
        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            generateAmbientStars();
            generatePartyLights();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        /**
         * Canvas Click Handler: Launches a star directly at the clicked coordinates.
         */
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchStar(clickX, clickY);
        });

        /**
         * Initializes an orbiting pink or blue star at (x, y) using the
         * current launchVelocity and FIXED_LAUNCH_ANGLE.
         */
        function launchStar(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = launchVelocity * Math.sin(rad);  // sin(90°) = 1  -> vx = launchVelocity
            const vy = -launchVelocity * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Select pink or blue color (either cycling Pink -> Blue or fixed selection)
            let chosenColor;
            if (colorMode === 'cycle') {
                chosenColor = STAR_COLORS[colorIndex].fill;
                colorIndex = (colorIndex + 1) % STAR_COLORS.length;
            } else {
                chosenColor = STAR_COLORS[colorMode].fill;
            }

            stars.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 7,
                rotation: Math.random() * Math.PI * 2,
                spin: (Math.random() < 0.5 ? -1 : 1) * 0.035,
                color: chosenColor,
                trail: [] // Stores history of past {x, y} coordinates
            });
        }

        /**
         * Clears active orbiting stars from the simulation canvas.
         */
        function resetSimulation() {
            stars = [];
            colorIndex = 0;
        }

        /**
         * Advances star kinematics using softened inverse-square gravity
         * and removes stars that collide with the central dog or leave bounds.
         */
        function updatePhysics() {
            for (let i = stars.length - 1; i >= 0; i--) {
                const s = stars[i];

                // Remove star if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (s.x < -margin || s.x > canvas.width + margin ||
                    s.y < -margin || s.y > canvas.height + margin) {
                    stars.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - s.x;
                const dy = centralNode.y - s.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: star collides with central dancing dog
                if (dist < centralNode.radius + s.radius) {
                    stars.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity, position, and gentle spin
                s.vx += ax;
                s.vy += ay;
                s.x += s.vx;
                s.y += s.vy;
                s.rotation += s.spin;

                // Record position history for line trail
                s.trail.push({ x: s.x, y: s.y });
                if (s.trail.length > TRAIL_LENGTH) {
                    s.trail.shift();
                }
            }
        }

        /**
         * Updates the downward sprinkling motion and gentle flutter of all party lights.
         */
        function updatePartyLights(timestamp) {
            for (const p of partyLights) {
                p.y += p.vy;
                p.x += Math.sin(timestamp * p.swaySpeed + p.phase) * p.swayAmp;

                // Wrap smoothly back to the top when sprinkling past the bottom edge
                if (p.y - p.glowRadius > canvas.height) {
                    p.y = -p.glowRadius;
                    p.x = Math.random() * canvas.width;
                }

                // Keep horizontal drift wrapped seamlessly across left/right edges
                if (p.x < -p.glowRadius) {
                    p.x = canvas.width + p.glowRadius;
                } else if (p.x > canvas.width + p.glowRadius) {
                    p.x = -p.glowRadius;
                }
            }
        }

        /**
         * Traces a symmetrical multi-pointed star path at (cx, cy).
         */
        function traceStarPath(cx, cy, spikes, outerRadius, innerRadius, rotation = 0) {
            let rot = (Math.PI / 2) * 3 + rotation;
            const step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(
                cx + Math.cos(rot) * outerRadius,
                cy + Math.sin(rot) * outerRadius
            );

            for (let i = 0; i < spikes; i++) {
                rot += step;
                ctx.lineTo(
                    cx + Math.cos(rot) * innerRadius,
                    cy + Math.sin(rot) * innerRadius
                );
                rot += step;
                ctx.lineTo(
                    cx + Math.cos(rot) * outerRadius,
                    cy + Math.sin(rot) * outerRadius
                );
            }
            ctx.closePath();
        }

        /**
         * Renders soft sweeping pink and blue overhead party light cones
         * showering down from the top edge of the canvas.
         */
        function drawPartyLightBeams(timestamp) {
            const beamCount = 6;
            const spacing = canvas.width / (beamCount - 1);

            for (let i = 0; i < beamCount; i++) {
                const isPink = i % 2 === 0;
                const originX = i * spacing;
                const sway = Math.sin(timestamp * 0.0012 + i * 1.15) * (canvas.width * 0.09);
                const targetX = originX + sway;
                const topWidth = 24;
                const bottomWidth = canvas.width * 0.24;

                const beamGrad = ctx.createLinearGradient(originX, 0, targetX, canvas.height * 0.92);
                if (isPink) {
                    beamGrad.addColorStop(0, 'rgba(255, 107, 157, 0.24)');
                    beamGrad.addColorStop(0.55, 'rgba(255, 158, 187, 0.10)');
                    beamGrad.addColorStop(1, 'rgba(255, 158, 187, 0)');
                } else {
                    beamGrad.addColorStop(0, 'rgba(56, 189, 248, 0.24)');
                    beamGrad.addColorStop(0.55, 'rgba(142, 202, 230, 0.10)');
                    beamGrad.addColorStop(1, 'rgba(142, 202, 230, 0)');
                }

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(originX - topWidth, 0);
                ctx.lineTo(originX + topWidth, 0);
                ctx.lineTo(targetX + bottomWidth, canvas.height * 0.92);
                ctx.lineTo(targetX - bottomWidth, canvas.height * 0.92);
                ctx.closePath();
                ctx.fillStyle = beamGrad;
                ctx.fill();
                ctx.restore();
            }
        }

        /**
         * Renders the sprinkling pink and blue party lights for the requested depth layer.
         */
        function drawPartyLights(timestamp, targetLayer) {
            for (const p of partyLights) {
                if (p.layer !== targetLayer) continue;

                const pulse = 0.55 + 0.45 * Math.sin(timestamp * p.twinkleSpeed + p.phase);
                const alpha = (targetLayer === 'front' ? 0.88 : 0.72) * pulse;

                ctx.save();
                ctx.globalAlpha = alpha;

                // Soft radiant party-light bokeh halo
                const haloGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.glowRadius);
                haloGrad.addColorStop(0, p.tone.core);
                haloGrad.addColorStop(0.35, p.tone.glow);
                haloGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.glowRadius, 0, Math.PI * 2);
                ctx.fillStyle = haloGrad;
                ctx.fill();

                // Crisp luminous center depending on particle style
                if (p.style === 'sparkle') {
                    traceStarPath(p.x, p.y, 4, p.radius * 1.45, p.radius * 0.42, timestamp * 0.001 + p.phase);
                    ctx.fillStyle = p.tone.core;
                    ctx.fill();
                } else if (p.style === 'droplet') {
                    ctx.beginPath();
                    ctx.ellipse(p.x, p.y, p.radius * 0.65, p.radius * 1.35, 0, 0, Math.PI * 2);
                    ctx.fillStyle = p.tone.mid;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(p.x, p.y - p.radius * 0.25, p.radius * 0.35, 0, Math.PI * 2);
                    ctx.fillStyle = p.tone.core;
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius * 0.85, 0, Math.PI * 2);
                    ctx.fillStyle = p.tone.mid;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius * 0.45, 0, Math.PI * 2);
                    ctx.fillStyle = p.tone.core;
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        /**
         * Renders twinkling pink and blue stars across the background sky.
         */
        function drawAmbientStars(timestamp) {
            for (const st of ambientStars) {
                const twinkle = 0.45 + 0.45 * Math.sin(timestamp * st.twinkleSpeed + st.phase);
                ctx.save();
                ctx.globalAlpha = twinkle;
                traceStarPath(st.x, st.y, 4, st.outerRadius, st.innerRadius, 0);
                ctx.fillStyle = st.color;
                ctx.fill();
                ctx.lineWidth = 0.8;
                ctx.strokeStyle = 'rgba(30, 41, 59, 0.35)';
                ctx.stroke();
                ctx.restore();
            }
        }

        /**
         * Renders the dancing pastel pink puppy at the center of the gravity field.
         */
        function drawDancingDog(x, y, timestamp) {
            const t = timestamp * 0.0055;
            const beat = Math.abs(Math.sin(t * 2));      // Rhythmic two-step bounce
            const sway = Math.sin(t * 2);                // Side-to-side hip & body groove
            const bounceY = -beat * 6;
            const squashX = 1 + (0.5 - beat) * 0.14;
            const squashY = 1 - (0.5 - beat) * 0.14;
            const bodyTilt = sway * 0.15;

            const furMain = '#ffadc6';     // Pastel pink coat
            const furAccent = '#ff85ab';   // Deeper pastel pink ears, paws, tail
            const furCream = '#fff0f5';    // Soft blush cream belly & muzzle
            const ink = '#1e293b';         // Crisp slate outline matching UI

            // Ground shadow that scales inversely with hop height
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(x, y + 25, 16 - beat * 3.5, 4.5 - beat * 1, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(30, 41, 59, 0.18)';
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.translate(x + sway * 3, y + bounceY);
            ctx.rotate(bodyTilt);
            ctx.scale(squashX, squashY);

            // 1. Wagging Tail
            const tailWag = Math.sin(t * 9) * 0.65;
            ctx.save();
            ctx.translate(10, 9);
            ctx.rotate(tailWag);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(12, -8, 10, -15);
            ctx.quadraticCurveTo(4, -14, 0, -4);
            ctx.closePath();
            ctx.fillStyle = furAccent;
            ctx.fill();
            ctx.lineWidth = 1.6;
            ctx.strokeStyle = ink;
            ctx.stroke();
            ctx.restore();

            // 2. Back Dancing Feet (alternating tippy-taps)
            const leftFootLift = Math.max(0, Math.sin(t * 4)) * -4;
            const rightFootLift = Math.max(0, -Math.sin(t * 4)) * -4;

            ctx.fillStyle = furAccent;
            ctx.strokeStyle = ink;
            ctx.lineWidth = 1.6;

            // Left foot
            ctx.beginPath();
            ctx.ellipse(-7, 18 + leftFootLift, 5, 3.5, -0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Right foot
            ctx.beginPath();
            ctx.ellipse(7, 18 + rightFootLift, 5, 3.5, 0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 3. Torso
            ctx.beginPath();
            ctx.ellipse(0, 6, 12.5, 13.5, 0, 0, Math.PI * 2);
            ctx.fillStyle = furMain;
            ctx.fill();
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = ink;
            ctx.stroke();

            // Cream Belly Patch
            ctx.beginPath();
            ctx.ellipse(0, 8, 7.5, 9, 0, 0, Math.PI * 2);
            ctx.fillStyle = furCream;
            ctx.fill();

            // 4. Head Group (tilts & bounces with floppy ears)
            ctx.save();
            ctx.translate(0, -11);
            ctx.rotate(Math.sin(t * 2 + 0.5) * 0.14);

            // Floppy Left Ear
            const leftEarFlap = Math.sin(t * 4 - 0.4) * 0.32 + beat * 0.25;
            ctx.save();
            ctx.translate(-12, -5);
            ctx.rotate(leftEarFlap);
            ctx.beginPath();
            ctx.ellipse(-3, 8, 5, 10, 0.25, 0, Math.PI * 2);
            ctx.fillStyle = furAccent;
            ctx.fill();
            ctx.lineWidth = 1.6;
            ctx.strokeStyle = ink;
            ctx.stroke();
            ctx.restore();

            // Floppy Right Ear
            const rightEarFlap = -Math.sin(t * 4 - 0.4) * 0.32 - beat * 0.25;
            ctx.save();
            ctx.translate(12, -5);
            ctx.rotate(rightEarFlap);
            ctx.beginPath();
            ctx.ellipse(3, 8, 5, 10, -0.25, 0, Math.PI * 2);
            ctx.fillStyle = furAccent;
            ctx.fill();
            ctx.lineWidth = 1.6;
            ctx.strokeStyle = ink;
            ctx.stroke();
            ctx.restore();

            // Puppy Head Base
            ctx.beginPath();
            ctx.ellipse(0, 0, 14.5, 12.5, 0, 0, Math.PI * 2);
            ctx.fillStyle = furMain;
            ctx.fill();
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = ink;
            ctx.stroke();

            // Muzzle Patch
            ctx.beginPath();
            ctx.ellipse(0, 4, 7.5, 5.5, 0, 0, Math.PI * 2);
            ctx.fillStyle = furCream;
            ctx.fill();

            // Rosy Cheeks
            ctx.fillStyle = 'rgba(255, 107, 157, 0.55)';
            ctx.beginPath();
            ctx.arc(-8.5, 3, 2.6, 0, Math.PI * 2);
            ctx.arc(8.5, 3, 2.6, 0, Math.PI * 2);
            ctx.fill();

            // Happy Dancing Eyes (^ ^)
            ctx.strokeStyle = ink;
            ctx.lineWidth = 1.8;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(-5.5, -1.5, 2.4, Math.PI * 1.1, Math.PI * 1.9);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(5.5, -1.5, 2.4, Math.PI * 1.1, Math.PI * 1.9);
            ctx.stroke();

            // Little Pink Tongue
            const tongueBob = Math.max(0, Math.sin(t * 4)) * 1.4;
            ctx.beginPath();
            ctx.arc(0, 6.2 + tongueBob * 0.4, 2.3, 0, Math.PI);
            ctx.fillStyle = '#ff6b9d';
            ctx.fill();
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = ink;
            ctx.stroke();

            // Cute Muzzle Smile & Button Nose
            ctx.beginPath();
            ctx.arc(-2, 4.8, 2, 0, Math.PI * 0.85);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(2, 4.8, 2, Math.PI * 0.15, Math.PI);
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, 2.4, 2.6, 1.9, 0, 0, Math.PI * 2);
            ctx.fillStyle = ink;
            ctx.fill();

            ctx.restore(); // End Head Group

            // 5. Front Dancing Paws (alternating disco/boogie wave)
            const leftPawY = Math.sin(t * 4) * 4.5;
            const rightPawY = -Math.sin(t * 4) * 4.5;

            ctx.fillStyle = furAccent;
            ctx.strokeStyle = ink;
            ctx.lineWidth = 1.6;

            // Left front paw
            ctx.beginPath();
            ctx.ellipse(-13.5, 3 + leftPawY, 4.2, 3.2, -0.45, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Right front paw
            ctx.beginPath();
            ctx.ellipse(13.5, 3 + rightPawY, 4.2, 3.2, 0.45, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.restore(); // End Dog Body Transform

            // 6. Subtle Floating Music Notes around the dancing pup
            ctx.save();
            ctx.fillStyle = ink;
            ctx.font = 'bold 12px "Courier New", monospace';
            const note1Y = -28 - ((t * 10) % 14);
            const note1Alpha = 1 - (((t * 10) % 14) / 14);
            ctx.globalAlpha = note1Alpha * 0.75;
            ctx.fillText('♪', x - 24 + Math.sin(t * 3) * 3, y + note1Y);

            const note2Y = -26 - (((t * 10) + 7) % 14);
            const note2Alpha = 1 - ((((t * 10) + 7) % 14) / 14);
            ctx.globalAlpha = note2Alpha * 0.75;
            ctx.fillText('♫', x + 18 + Math.cos(t * 3) * 3, y + note2Y);
            ctx.restore();
        }

        /**
         * Renders the pastel gradient backdrop, pink & blue party lights,
         * twinkling stars, central dancing pink dog, trajectory paths, and orbiting stars.
         */
        function draw(timestamp = 0) {
            // Paint diagonal pastel gradient across the canvas
            const bgGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            bgGradient.addColorStop(0, '#ffd1dc');   // Pastel Pink
            bgGradient.addColorStop(0.5, '#bae1ff'); // Pastel Blue
            bgGradient.addColorStop(1, '#b2f0e8');   // Pastel Teal
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Soft Overhead Pink & Blue Party Light Beams
            drawPartyLightBeams(timestamp);

            // 2. Draw Ambient Twinkling Pink & Blue Background Stars
            drawAmbientStars(timestamp);

            // 3. Draw Back Layer of Sprinkling Pink & Blue Party Lights
            drawPartyLights(timestamp, 'back');

            // 4. Draw Central Dancing Pastel Pink Dog
            drawDancingDog(centralNode.x, centralNode.y, timestamp);

            // 5. Draw Orbiting Pink & Blue Stars & Trails
            for (const s of stars) {
                // Draw path line with subtle slate casing and pastel core
                if (s.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(s.trail[0].x, s.trail[0].y);
                    for (let t = 1; t < s.trail.length; t++) {
                        ctx.lineTo(s.trail[t].x, s.trail[t].y);
                    }
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.strokeStyle = 'rgba(30, 41, 59, 0.45)';
                    ctx.lineWidth = 2.6;
                    ctx.stroke();

                    ctx.strokeStyle = s.color;
                    ctx.lineWidth = 1.6;
                    ctx.stroke();
                }

                // Draw 5-pointed pink or blue star with crisp slate border
                traceStarPath(s.x, s.y, 5, 9, 4.2, s.rotation);
                ctx.fillStyle = s.color;
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = '#1e293b';
                ctx.stroke();
            }

            // 6. Draw Foreground Layer of Sprinkling Pink & Blue Party Lights
            drawPartyLights(timestamp, 'front');
        }

        /**
         * Main animation loop driven by requestAnimationFrame.
         */
        function animate(timestamp) {
            updatePhysics();
            updatePartyLights(timestamp);
            draw(timestamp);
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            requestAnimationFrame(animate);
        };
    </script>
</body>
