            let historyIdx = 0;
            let accumulatedDist = 0;

            for (let segIdx = 1; segIdx < count; segIdx++) {
                const targetDist = segIdx * spacing;

                while (historyIdx < snake.spineHistory.length - 1) {
                    const p0 = snake.spineHistory[historyIdx];
                    const p1 = snake.spineHistory[historyIdx + 1];
                    const segLen = Math.hypot(p1.x - p0.x, p1.y - p0.y);

                    if (accumulatedDist + segLen >= targetDist && segLen > 0.0001) {
                        const t = (targetDist - accumulatedDist) / segLen;
                        newSegments.push({
                            x: lerp(p0.x, p1.x, t),
                            y: lerp(p0.y, p1.y, t),
                            radius: getSegmentRadius(segIdx, count)
                        });
                        break;
                    }

                    accumulatedDist += segLen;
                    historyIdx++;
                }

                // Fallback if history is shorter than targetDist
                if (newSegments.length <= segIdx) {
                    const lastPt = snake.spineHistory[snake.spineHistory.length - 1] || { x: snake.x, y: snake.y };
                    newSegments.push({
                        x: lastPt.x,
                        y: lastPt.y,
                        radius: getSegmentRadius(segIdx, count)
                    });
                }
            }

            snake.segments = newSegments;

            // Prune excess spine history beyond the tail to prevent memory growth
            const maxKeepIndex = Math.min(snake.spineHistory.length, historyIdx + 12);
            if (snake.spineHistory.length > maxKeepIndex) {
                snake.spineHistory.length = maxKeepIndex;
            }
        }

        function getSegmentRadius(index, totalCount) {
            const base = snake.headRadius + (snake.bitePulse > 0 ? Math.sin(snake.bitePulse * Math.PI) * 2.5 : 0);
            if (index === 0) return base;

            // Smooth anatomical taper from neck down to a pointed tail tip
            const t = index / Math.max(1, totalCount - 1);
            const neckFactor = index === 1 ? 0.92 : 1.0;
            const taper = Math.pow(1 - t, 0.72);
            return Math.max(1.8, base * neckFactor * (0.2 + 0.8 * taper));
        }

        function spawnShockwave(x, y) {
            shockwaves.push({
                x: x,
                y: y,
                radius: snake.headRadius * 0.8,
                maxRadius: 48 + snake.headRadius * 1.4,
                alpha: 0.95,
                lineWidth: 2.2
            });
            // Subtle secondary inner ring for crisp visual feedback
            shockwaves.push({
                x: x,
                y: y,
                radius: snake.headRadius * 0.4,
                maxRadius: 28 + snake.headRadius,
                alpha: 0.65,
                lineWidth: 1.0
            });
        }

        function updateSnake() {
            const manualAngle = getManualTargetAngle();
            let targetAngle;

            if (manualAngle !== null) {
                manualTimer = MANUAL_OVERRIDE_DURATION;
                targetAngle = manualAngle;
            } else if (manualTimer > 0) {
                manualTimer--;
                // Maintain current heading while coasting in manual override until timer expires
                targetAngle = snake.angle;
                if (manualTimer === 0) {
                    updateHUD();
                }
            } else {
                targetAngle = computeAutonomousTargetAngle();
            }

            // Smoothly interpolate snake heading toward targetAngle
            const angleDiff = normalizeAngle(targetAngle - snake.angle);
            const turnStep = Math.max(-SNAKE_TURN_RATE, Math.min(SNAKE_TURN_RATE, angleDiff));
            snake.angle = normalizeAngle(snake.angle + turnStep);

            // Adjust speed: faster when hunting an active ball or manually steering
            const targetSpeed = (balls.length > 0 || manualTimer > 0) ? SNAKE_HUNT_SPEED : SNAKE_BASE_SPEED;
            snake.speed = lerp(snake.speed, targetSpeed, 0.08);

            // Advance head position
            snake.x += Math.cos(snake.angle) * snake.speed;
            snake.y += Math.sin(snake.angle) * snake.speed;

            // Soft clamp inside canvas bounds when manually steered so snake cannot get lost offscreen
            const boundPad = snake.headRadius + 4;
            if (snake.x < boundPad) {
                snake.x = boundPad;
                snake.angle = normalizeAngle(Math.PI - snake.angle);
            } else if (snake.x > canvas.width - boundPad) {
                snake.x = canvas.width - boundPad;
                snake.angle = normalizeAngle(Math.PI - snake.angle);
            }
            if (snake.y < boundPad) {
                snake.y = boundPad;
                snake.angle = normalizeAngle(-snake.angle);
            } else if (snake.y > canvas.height - boundPad) {
                snake.y = canvas.height - boundPad;
                snake.angle = normalizeAngle(-snake.angle);
            }

            // Record head breadcrumb at front of spine history
            snake.spineHistory.unshift({ x: snake.x, y: snake.y });

            // Decay bite pulse animation
            if (snake.bitePulse > 0) {
                snake.bitePulse = Math.max(0, snake.bitePulse - 0.07);
            }

            // Recompute evenly-spaced tapered body segments
            computeSnakeSegments();
        }

        // =========================================================================
        // PHYSICS & COLLISION UPDATE
        // =========================================================================
        function updatePhysics() {
            frameTick++;
            updateSnake();

            // Update balls (gravity, central node collision, and snake bite collision)
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove ball if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin ||
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    updateHUD();
                    continue;
                }

                // 1. Check if Snake eats the ball
                const dxSnake = b.x - snake.x;
                const dySnake = b.y - snake.y;
                const distSnake = Math.hypot(dxSnake, dySnake);
                const biteReach = snake.headRadius + b.radius + 3;

                if (distSnake <= biteReach) {
                    // Trigger bite shockwave at ball coordinates
                    spawnShockwave(b.x, b.y);

                    // Grow snake in both segment length and thickness
                    ballsEaten++;
                    snake.segmentCount += SEGMENTS_PER_BALL;
                    snake.headRadius = Math.min(MAX_HEAD_RADIUS, snake.headRadius + THICKNESS_PER_BALL);
                    snake.bitePulse = 1.0;

                    balls.splice(i, 1);
                    updateHUD();
                    continue;
                }

                // 2. Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    centralNode.radius += GROWTH_PER_BALL;
                    balls.splice(i, 1);
                    updateHUD();
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }

            // Update expanding bite shockwaves
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.radius += (sw.maxRadius - sw.radius) * 0.16 + 0.8;
                sw.alpha -= 0.038;
                if (sw.alpha <= 0) {
                    shockwaves.splice(i, 1);
                }
            }
        }

        // =========================================================================
        // RENDERING
        // =========================================================================
        function drawSnake() {
            if (snake.segments.length === 0) return;

            // Draw from tail to head so the head renders cleanly on top
            for (let i = snake.segments.length - 1; i >= 0; i--) {
                const seg = snake.segments[i];
                const isBlue = i % 2 === 1;

                ctx.beginPath();
                ctx.arc(seg.x, seg.y, seg.radius, 0, Math.PI * 2);
                ctx.fillStyle = isBlue ? '#1da1f2' : '#2ecc71';
                ctx.fill();

                // Subtle dark hairline separation on segments for crisp definition
                ctx.strokeStyle = '#031209';
                ctx.lineWidth = 0.9;
                ctx.stroke();
            }

            // Draw directional eyes on the head (segment 0)
            const head = snake.segments[0];
            const cosA = Math.cos(snake.angle);
            const sinA = Math.sin(snake.angle);
            const perpX = -sinA;
            const perpY = cosA;

            const forwardOffset = head.radius * 0.36;
            const sideOffset = head.radius * 0.44;
            const eyeRadius = Math.max(1.6, head.radius * 0.22);

            // Look slightly toward active ball if present
            let lookOffsetX = cosA * (eyeRadius * 0.28);
            let lookOffsetY = sinA * (eyeRadius * 0.28);
            if (balls.length > 0) {
                const toBallAngle = Math.atan2(balls[0].y - head.y, balls[0].x - head.x);
                lookOffsetX = Math.cos(toBallAngle) * (eyeRadius * 0.32);
                lookOffsetY = Math.sin(toBallAngle) * (eyeRadius * 0.32);
            }

            for (const side of [-1, 1]) {
                const eyeX = head.x + cosA * forwardOffset + perpX * sideOffset * side;
                const eyeY = head.y + sinA * forwardOffset + perpY * sideOffset * side;

                // Dark eye socket against the head
                ctx.beginPath();
                ctx.arc(eyeX, eyeY, eyeRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#031209';
                ctx.fill();

                // Crisp white directional glint/pupil
                ctx.beginPath();
                ctx.arc(eyeX + lookOffsetX, eyeY + lookOffsetY, Math.max(0.7, eyeRadius * 0.38), 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }
        }

        function drawShockwaves() {
            for (const sw of shockwaves) {
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, sw.alpha)})`;
                ctx.lineWidth = sw.lineWidth;
                ctx.stroke();
            }
        }

        function draw() {
            // 0. Draw Layered Atmospheric Jungle Background & Wildlife
            drawJungleBackground();

            // 1. Draw Central Mass Node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Center mark on node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#031209';
            ctx.fill();

            // 2. Draw Ball & Trail
            for (const b of balls) {
                // Draw path line
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }

                // Draw ball object
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            // 3. Draw Snake & Bite Shockwaves
            drawSnake();
            drawShockwaves();
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
