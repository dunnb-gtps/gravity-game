<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Simulation - Serpent Predator</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #030e08;
            color: #e8f5ec;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #2b593e;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            color: #f0faf3;
            text-shadow: 0 0 12px rgba(74, 175, 114, 0.25);
        }

        /* HUD Counters */
        #stats {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .stat-item {
            border: 1px solid #1e422d;
            padding: 3px 10px;
            background-color: #05160d;
            color: #b4d6c0;
        }

        .stat-value {
            font-weight: bold;
            color: #ffffff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #mode-badge {
            font-size: 11px;
            letter-spacing: 1px;
            padding: 5px 10px;
            border: 1px solid #2b593e;
            background-color: #05160d;
            color: #9ec7ad;
            text-transform: uppercase;
        }

        #mode-badge.manual {
            border-color: #a8e6be;
            color: #031209;
            background-color: #a8e6be;
            font-weight: bold;
        }

        .btn-reset {
            background: rgba(6, 24, 14, 0.75);
            color: #e8f5ec;
            border: 1px solid #488561;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #a8e6be;
            border-color: #a8e6be;
            color: #031209;
        }

        .btn-reset:active {
            transform: scale(0.97);
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        canvas {
            background-color: #020c06;
            border: 1px solid #2b593e;
            box-shadow: 0 0 32px rgba(4, 22, 12, 0.9);
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #6a997c;
            text-align: center;
            line-height: 1.4;
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }
            h1 {
                font-size: 15px;
            }
            #stats {
                font-size: 11px;
                gap: 8px;
            }
            .btn-reset {
                padding: 5px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <div class="header-left">
            <h1>Gravity Simulation</h1>
            <div id="stats">
                <span class="stat-item">Balls Eaten: <span id="eatenCount" class="stat-value">0</span></span>
                <span class="stat-item">Snake Length: <span id="snakeLengthCount" class="stat-value">14</span></span>
            </div>
        </div>
        <div class="header-right">
            <span id="mode-badge">AI: Hunt</span>
            <button class="btn-reset" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas to launch a ball. Use WASD or Arrow keys to manually steer the snake.
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Offscreen canvas for caching static rainforest backdrop & perimeter botanicals
        const bgCacheCanvas = document.createElement('canvas');
        const bgCacheCtx = bgCacheCanvas.getContext('2d');

        // HUD DOM References
        const eatenCountEl = document.getElementById('eatenCount');
        const snakeLengthEl = document.getElementById('snakeLengthCount');
        const modeBadgeEl = document.getElementById('mode-badge');

        // =========================================================================
        // SIMULATION CONSTANTS (Preserving Baseline Physics)
        // =========================================================================
        const GRAVITY_CONSTANT = 1800;      // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;           // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;       // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;            // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;        // Prevents infinite velocity near center
        const INITIAL_NODE_RADIUS = 12;      // Starting radius of the central absorber
        const GROWTH_PER_BALL = 4;           // Central node radius increase if it absorbs a ball

        // =========================================================================
        // SNAKE CONSTANTS
        // =========================================================================
        const INITIAL_SNAKE_SEGMENTS = 14;   // Starting segment count
        const SEGMENTS_PER_BALL = 5;         // Additional segments gained per ball eaten
        const INITIAL_HEAD_RADIUS = 7.5;     // Starting thickness (head radius in px)
        const THICKNESS_PER_BALL = 0.85;     // Thickness gained per ball eaten
        const MAX_HEAD_RADIUS = 22;          // Maximum head radius cap
        const SNAKE_BASE_SPEED = 3.8;        // Base cruising speed
        const SNAKE_HUNT_SPEED = 4.9;        // Boosted speed while actively chasing a ball
        const SNAKE_TURN_RATE = 0.085;       // Maximum angular turn rate per frame (radians)
        const MANUAL_OVERRIDE_DURATION = 150; // Frames (~2.5s) after key release before AI resumes

        // =========================================================================
        // STATE VARIABLES
        // =========================================================================
        let balls = [];
        let shockwaves = [];
        let ballsEaten = 0;
        let frameTick = 0;

        // Procedural Jungle Environment Collections
        let jungleSunRays = [];
        let jungleVines = [];
        let jungleFireflies = [];

        // Background Jungle Wildlife Collections
        let canopyBranches = [];
        let jungleToucans = [];
        let jungleSloth = null;
        let jungleMonkey = null;
        let jungleFlyingBirds = [];
        let jungleButterflies = [];
        let jungleFrogs = [];

        // Keyboard input tracking for optional manual steering
        const activeKeys = new Set();
        let manualTimer = 0;

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: INITIAL_NODE_RADIUS
        };

        // Snake Entity Definition
        const snake = {
            x: 0,
            y: 0,
            angle: 0,
            speed: SNAKE_BASE_SPEED,
            segmentCount: INITIAL_SNAKE_SEGMENTS,
            headRadius: INITIAL_HEAD_RADIUS,
            spineHistory: [],     // High-resolution path points for smooth arc-length body placement
            segments: [],         // Computed evenly-spaced { x, y, radius } points
            bitePulse: 0,         // Visual pulse timer when eating a ball
            orbitDirection: 1     // 1 = clockwise, -1 = counter-clockwise
        };

        // =========================================================================
        // UTILITY & MATH HELPERS
        // =========================================================================
        function normalizeAngle(angle) {
            while (angle > Math.PI) angle -= Math.PI * 2;
            while (angle < -Math.PI) angle += Math.PI * 2;
            return angle;
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function evalQuadBezier(p0, p1, p2, t) {
            const invT = 1 - t;
            return {
                x: invT * invT * p0.x + 2 * invT * t * p1.x + t * t * p2.x,
                y: invT * invT * p0.y + 2 * invT * t * p1.y + t * t * p2.y
            };
        }

        // Seeded PRNG so jungle foliage & silhouettes remain coherent across resizes
        function createSeededRandom(seed) {
            let s = seed >>> 0;
            return function() {
                s += 0x6D2B79F5;
                let t = Math.imul(s ^ (s >>> 15), 1 | s);
                t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function updateHUD() {
            eatenCountEl.textContent = ballsEaten;
            snakeLengthEl.textContent = snake.segmentCount;

            if (manualTimer > 0) {
                modeBadgeEl.textContent = 'Manual Steer';
                modeBadgeEl.classList.add('manual');
            } else {
                modeBadgeEl.textContent = balls.length > 0 ? 'AI: Hunting' : 'AI: Orbiting';
                modeBadgeEl.classList.remove('manual');
            }
        }

        // =========================================================================
        // JUNGLE ENVIRONMENT GENERATION & CACHED LAYER RENDERING
        // =========================================================================
        function drawPalmFrond(targetCtx, baseX, baseY, angle, length, curve, leafletCount, color) {
            targetCtx.save();
            targetCtx.strokeStyle = color;
            targetCtx.fillStyle = color;
            targetCtx.lineCap = 'round';

            const tipX = baseX + Math.cos(angle) * length;
            const tipY = baseY + Math.sin(angle) * length;
            const ctrlX = (baseX + tipX) * 0.5 - Math.sin(angle) * curve;
            const ctrlY = (baseY + tipY) * 0.5 + Math.cos(angle) * curve;

            // Central rachis stem
            targetCtx.lineWidth = Math.max(1.5, length * 0.016);
            targetCtx.beginPath();
            targetCtx.moveTo(baseX, baseY);
            targetCtx.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY);
            targetCtx.stroke();

            // Individual pointed palm leaflets along the curve
            for (let i = 2; i <= leafletCount; i++) {
                const t = i / (leafletCount + 1);
                const invT = 1 - t;
                const px = invT * invT * baseX + 2 * invT * t * ctrlX + t * t * tipX;
                const py = invT * invT * baseY + 2 * invT * t * ctrlY + t * t * tipY;

                // Tangent vector along quadratic curve
                const tx = 2 * invT * (ctrlX - baseX) + 2 * t * (tipX - ctrlX);
                const ty = 2 * invT * (ctrlY - baseY) + 2 * t * (tipY - ctrlY);
                const tangentAngle = Math.atan2(ty, tx);

                const leafletLen = length * 0.24 * Math.sin(t * Math.PI * 0.88 + 0.15);
                const leafletWidth = Math.max(1.8, leafletLen * 0.14);

                for (const side of [-1, 1]) {
                    const leafAngle = tangentAngle + side * (0.68 - t * 0.18);
                    const lx = px + Math.cos(leafAngle) * leafletLen;
                    const ly = py + Math.sin(leafAngle) * leafletLen;
                    const midX = (px + lx) * 0.5 - Math.sin(leafAngle) * leafletWidth * side;
                    const midY = (py + ly) * 0.5 + Math.cos(leafAngle) * leafletWidth * side;

                    targetCtx.beginPath();
                    targetCtx.moveTo(px, py);
                    targetCtx.quadraticCurveTo(midX, midY, lx, ly);
                    targetCtx.quadraticCurveTo(
                        (px + lx) * 0.5 + Math.sin(leafAngle) * (leafletWidth * 0.35) * side,
                        (py + ly) * 0.5 - Math.cos(leafAngle) * (leafletWidth * 0.35) * side,
                        px,
                        py
                    );
                    targetCtx.fill();
                }
            }

            targetCtx.restore();
        }

        function drawFernFrond(targetCtx, baseX, baseY, angle, length, curve, pinnaePairs, color) {
            targetCtx.save();
            targetCtx.strokeStyle = color;
            targetCtx.fillStyle = color;
            targetCtx.lineCap = 'round';

            const tipX = baseX + Math.cos(angle) * length;
            const tipY = baseY + Math.sin(angle) * length;
            const ctrlX = (baseX + tipX) * 0.5 - Math.sin(angle) * curve;
            const ctrlY = (baseY + tipY) * 0.5 + Math.cos(angle) * curve;

            // Fern stem
            targetCtx.lineWidth = Math.max(1.2, length * 0.014);
            targetCtx.beginPath();
            targetCtx.moveTo(baseX, baseY);
            targetCtx.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY);
            targetCtx.stroke();

            // Dense alternating fern pinnae
            for (let i = 1; i <= pinnaePairs; i++) {
                const t = i / (pinnaePairs + 1);
                const invT = 1 - t;
                const px = invT * invT * baseX + 2 * invT * t * ctrlX + t * t * tipX;
                const py = invT * invT * baseY + 2 * invT * t * ctrlY + t * t * tipY;

                const tx = 2 * invT * (ctrlX - baseX) + 2 * t * (tipX - ctrlX);
                const ty = 2 * invT * (ctrlY - baseY) + 2 * t * (tipY - ctrlY);
                const tangentAngle = Math.atan2(ty, tx);

                const bladeLen = length * 0.16 * Math.sin(t * Math.PI * 0.92 + 0.12);
                const bladeW = Math.max(2.2, bladeLen * 0.36);

                for (const side of [-1, 1]) {
                    const bAngle = tangentAngle + side * 0.92;
                    const bx = px + Math.cos(bAngle) * bladeLen;
                    const by = py + Math.sin(bAngle) * bladeLen;

                    targetCtx.beginPath();
                    targetCtx.ellipse(
                        (px + bx) * 0.5,
                        (py + by) * 0.5,
                        bladeLen * 0.52,
                        bladeW * 0.45,
                        bAngle,
                        0,
                        Math.PI * 2
                    );
                    targetCtx.fill();
                }
            }

            targetCtx.restore();
        }

        function drawMonsteraLeaf(targetCtx, stemX, stemY, angle, size, fillColor, veinColor) {
            targetCtx.save();
            targetCtx.translate(stemX, stemY);
            targetCtx.rotate(angle);

            // Petiole stem
            targetCtx.strokeStyle = fillColor;
            targetCtx.lineWidth = Math.max(2, size * 0.045);
            targetCtx.lineCap = 'round';
            targetCtx.beginPath();
            targetCtx.moveTo(0, 0);
            targetCtx.lineTo(size * 0.35, 0);
            targetCtx.stroke();

            // Heart-shaped tropical leaf blade with natural fenestration notches
            const startX = size * 0.3;
            const leafLen = size * 0.95;
            const maxHalfW = size * 0.46;

            targetCtx.fillStyle = fillColor;
            targetCtx.beginPath();
            targetCtx.moveTo(startX, 0);

            // Upper lobe & edge with 3 fenestration indentations
            targetCtx.bezierCurveTo(
                startX - size * 0.12, -maxHalfW * 0.75,
                startX + leafLen * 0.18, -maxHalfW * 1.05,
                startX + leafLen * 0.34, -maxHalfW * 0.92
            );
            // Notch 1
            targetCtx.lineTo(startX + leafLen * 0.36, -maxHalfW * 0.48);
            targetCtx.lineTo(startX + leafLen * 0.43, -maxHalfW * 0.86);
            // Notch 2
            targetCtx.quadraticCurveTo(
                startX + leafLen * 0.54, -maxHalfW * 0.80,
                startX + leafLen * 0.60, -maxHalfW * 0.72
            );
            targetCtx.lineTo(startX + leafLen * 0.58, -maxHalfW * 0.36);
            targetCtx.lineTo(startX + leafLen * 0.67, -maxHalfW * 0.64);
            // Taper to pointed leaf apex
            targetCtx.quadraticCurveTo(
                startX + leafLen * 0.86, -maxHalfW * 0.40,
                startX + leafLen, 0
            );

            // Lower edge mirrored with fenestration notches
            targetCtx.quadraticCurveTo(
                startX + leafLen * 0.86, maxHalfW * 0.40,
                startX + leafLen * 0.67, maxHalfW * 0.64
            );
            targetCtx.lineTo(startX + leafLen * 0.58, maxHalfW * 0.36);
            targetCtx.lineTo(startX + leafLen * 0.60, maxHalfW * 0.72);
            targetCtx.quadraticCurveTo(
                startX + leafLen * 0.54, maxHalfW * 0.80,
                startX + leafLen * 0.43, maxHalfW * 0.86
            );
            targetCtx.lineTo(startX + leafLen * 0.36, maxHalfW * 0.48);
            targetCtx.lineTo(startX + leafLen * 0.34, maxHalfW * 0.92);
            targetCtx.bezierCurveTo(
                startX + leafLen * 0.18, maxHalfW * 1.05,
                startX - size * 0.12, maxHalfW * 0.75,
                startX, 0
            );
            targetCtx.closePath();
            targetCtx.fill();

            // Subtle midrib & lateral veins
            targetCtx.strokeStyle = veinColor;
            targetCtx.lineWidth = Math.max(1, size * 0.015);
            targetCtx.beginPath();
            targetCtx.moveTo(startX, 0);
            targetCtx.lineTo(startX + leafLen * 0.9, 0);
            for (const frac of [0.25, 0.48, 0.72]) {
                const vx = startX + leafLen * frac;
                const vw = maxHalfW * (0.72 - frac * 0.45);
                targetCtx.moveTo(vx, 0);
                targetCtx.lineTo(vx + leafLen * 0.08, -vw);
                targetCtx.moveTo(vx, 0);
                targetCtx.lineTo(vx + leafLen * 0.08, vw);
            }
            targetCtx.stroke();

            targetCtx.restore();
        }

        function drawCanopyBranch(targetCtx, branch, scale) {
            const { p0, p1, p2, baseThickness } = branch;
            targetCtx.save();
            targetCtx.fillStyle = '#04190d';
            targetCtx.strokeStyle = '#0a2f1a';
            targetCtx.lineWidth = 1.2;

            // Tapered quadratic branch polygon
            const steps = 16;
            const upperPts = [];
            const lowerPts = [];

            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const pt = evalQuadBezier(p0, p1, p2, t);
                const halfT = Math.max(1.5, baseThickness * (1 - t * 0.72) * 0.5);
                upperPts.push({ x: pt.x, y: pt.y - halfT });
                lowerPts.unshift({ x: pt.x, y: pt.y + halfT });
            }

            targetCtx.beginPath();
            targetCtx.moveTo(upperPts[0].x, upperPts[0].y);
            for (let i = 1; i < upperPts.length; i++) {
                targetCtx.lineTo(upperPts[i].x, upperPts[i].y);
            }
            for (let i = 0; i < lowerPts.length; i++) {
                targetCtx.lineTo(lowerPts[i].x, lowerPts[i].y);
            }
            targetCtx.closePath();
            targetCtx.fill();

            // Subtle mossy top highlight along branch upper edge
            targetCtx.beginPath();
            targetCtx.moveTo(upperPts[0].x, upperPts[0].y);
            for (let i = 1; i < upperPts.length; i++) {
                targetCtx.lineTo(upperPts[i].x, upperPts[i].y);
            }
            targetCtx.stroke();

            // Small offshoot twig near branch tip
            const twigAnchor = evalQuadBezier(p0, p1, p2, 0.78);
            const dir = p2.x > p0.x ? 1 : -1;
            targetCtx.strokeStyle = '#04190d';
            targetCtx.lineWidth = 2.2 * scale;
            targetCtx.lineCap = 'round';
            targetCtx.beginPath();
            targetCtx.moveTo(twigAnchor.x, twigAnchor.y);
            targetCtx.quadraticCurveTo(
                twigAnchor.x + dir * 18 * scale,
                twigAnchor.y - 12 * scale,
                twigAnchor.x + dir * 32 * scale,
                twigAnchor.y - 18 * scale
            );
            targetCtx.stroke();

            targetCtx.restore();
        }

        function buildStaticJungleCache() {
            const w = canvas.width;
            const h = canvas.height;
            if (w <= 0 || h <= 0) return;

            bgCacheCanvas.width = w;
            bgCacheCanvas.height = h;
            const rand = createSeededRandom(4219);

            // 1. Deep Rainforest Canopy Gradient (#020c06 -> #092617 -> #031109)
            const bgGrad = bgCacheCtx.createLinearGradient(0, 0, 0, h);
            bgGrad.addColorStop(0.0, '#020c06');
            bgGrad.addColorStop(0.38, '#061d11');
            bgGrad.addColorStop(0.75, '#092617');
            bgGrad.addColorStop(1.0, '#031008');
            bgCacheCtx.fillStyle = bgGrad;
            bgCacheCtx.fillRect(0, 0, w, h);

            // Subtle radial canopy glow near upper-center filtering through leaves
            const canopyGlow = bgCacheCtx.createRadialGradient(
                w * 0.48, h * 0.12, w * 0.02,
                w * 0.5, h * 0.45, Math.max(w, h) * 0.75
            );
            canopyGlow.addColorStop(0.0, 'rgba(26, 98, 58, 0.22)');
            canopyGlow.addColorStop(0.55, 'rgba(10, 42, 24, 0.08)');
            canopyGlow.addColorStop(1.0, 'rgba(1, 8, 4, 0.42)');
            bgCacheCtx.fillStyle = canopyGlow;
            bgCacheCtx.fillRect(0, 0, w, h);

            // 2. Distant Shadow-Green Rainforest Tree Trunks (Background Depth Layer)
            const trunkCount = Math.max(7, Math.floor(w / 120));
            for (let i = 0; i < trunkCount; i++) {
                const isMidground = i % 2 === 0;
                const tx = (i / (trunkCount - 1 || 1)) * w + (rand() - 0.5) * 65;
                const trunkW = isMidground ? (18 + rand() * 24) : (10 + rand() * 14);
                const lean = (rand() - 0.5) * 26;

                bgCacheCtx.save();
                bgCacheCtx.fillStyle = isMidground
                    ? 'rgba(4, 21, 12, 0.55)'
                    : 'rgba(8, 34, 19, 0.34)';

                bgCacheCtx.beginPath();
                // Slight root flare at bottom
                bgCacheCtx.moveTo(tx - trunkW * 0.75, h);
                bgCacheCtx.quadraticCurveTo(tx - trunkW * 0.45, h * 0.85, tx - trunkW * 0.42 + lean * 0.5, h * 0.5);
                bgCacheCtx.lineTo(tx - trunkW * 0.36 + lean, 0);
                bgCacheCtx.lineTo(tx + trunkW * 0.36 + lean, 0);
                bgCacheCtx.lineTo(tx + trunkW * 0.42 + lean * 0.5, h * 0.5);
                bgCacheCtx.quadraticCurveTo(tx + trunkW * 0.45, h * 0.85, tx + trunkW * 0.75, h);
                bgCacheCtx.closePath();
                bgCacheCtx.fill();

                // Faint mossy bark highlight on sunlit left side of trunk
                bgCacheCtx.strokeStyle = 'rgba(24, 78, 46, 0.14)';
                bgCacheCtx.lineWidth = 1.5;
                bgCacheCtx.beginPath();
                bgCacheCtx.moveTo(tx - trunkW * 0.35 + lean, 0);
                bgCacheCtx.lineTo(tx - trunkW * 0.42, h);
                bgCacheCtx.stroke();
                bgCacheCtx.restore();
            }

            // 3. Soft Atmospheric Mist Band near Forest Floor
            const mistGrad = bgCacheCtx.createLinearGradient(0, h * 0.72, 0, h);
            mistGrad.addColorStop(0, 'rgba(14, 52, 31, 0)');
            mistGrad.addColorStop(1, 'rgba(12, 46, 27, 0.28)');
            bgCacheCtx.fillStyle = mistGrad;
            bgCacheCtx.fillRect(0, h * 0.72, w, h * 0.28);

            // 4. Upper Canopy Mossy Branches (Anchors for Background Wildlife)
            const scale = Math.max(0.65, Math.min(1.25, Math.min(w, h) / 680));
            canopyBranches = [
                // Upper-left bough (hosts perched toucan & hanging sloth)
                {
                    p0: { x: -12, y: h * 0.19 },
                    p1: { x: w * 0.12, y: h * 0.16 },
                    p2: { x: w * 0.24, y: h * 0.20 },
                    baseThickness: 15 * scale
                },
                // Upper-right bough (hosts perched toucan & swinging monkey)
                {
                    p0: { x: w + 12, y: h * 0.17 },
                    p1: { x: w * 0.88, y: h * 0.14 },
                    p2: { x: w * 0.75, y: h * 0.18 },
                    baseThickness: 15 * scale
                }
            ];

            for (const branch of canopyBranches) {
                drawCanopyBranch(bgCacheCtx, branch, scale);
            }

            // 5. Corner & Perimeter Tropical Foliage (Framing edges without obstructing play area)
            // Bottom-Left Corner Cluster
            drawPalmFrond(bgCacheCtx, -10, h + 10, -0.58, 175 * scale, -24 * scale, 13, '#04190e');
            drawPalmFrond(bgCacheCtx, -12, h - 25, -0.24, 155 * scale, 18 * scale, 11, '#051f11');
            drawMonsteraLeaf(bgCacheCtx, -8, h - 5, -0.45, 115 * scale, '#062213', '#0b351e');
            drawFernFrond(bgCacheCtx, 18, h + 8, -1.15, 135 * scale, -18 * scale, 14, '#082b18');
            drawFernFrond(bgCacheCtx, 42, h + 10, -0.78, 120 * scale, 15 * scale, 12, '#0a331d');

            // Bottom-Right Corner Cluster
            drawPalmFrond(bgCacheCtx, w + 10, h + 10, -Math.PI + 0.56, 180 * scale, 24 * scale, 13, '#04190e');
            drawPalmFrond(bgCacheCtx, w + 12, h - 28, -Math.PI + 0.22, 150 * scale, -18 * scale, 11, '#051f11');
            drawMonsteraLeaf(bgCacheCtx, w + 8, h - 5, -Math.PI + 0.44, 118 * scale, '#062213', '#0b351e');
            drawFernFrond(bgCacheCtx, w - 20, h + 8, -Math.PI + 1.12, 135 * scale, 18 * scale, 14, '#082b18');
            drawFernFrond(bgCacheCtx, w - 45, h + 10, -Math.PI + 0.76, 115 * scale, -14 * scale, 12, '#0a331d');

            // Top-Left Upper Canopy Cluster
            drawPalmFrond(bgCacheCtx, -12, -8, 0.42, 165 * scale, 20 * scale, 12, '#04170c');
            drawMonsteraLeaf(bgCacheCtx, -6, 6, 0.52, 102 * scale, '#051e10', '#0a311c');
            drawFernFrond(bgCacheCtx, 14, -8, 1.05, 115 * scale, 14 * scale, 12, '#072716');

            // Top-Right Upper Canopy Cluster
            drawPalmFrond(bgCacheCtx, w + 12, -8, Math.PI - 0.42, 165 * scale, -20 * scale, 12, '#04170c');
            drawMonsteraLeaf(bgCacheCtx, w + 6, 6, Math.PI - 0.52, 102 * scale, '#051e10', '#0a311c');
            drawFernFrond(bgCacheCtx, w - 14, -8, Math.PI - 1.05, 115 * scale, -14 * scale, 12, '#072716');

            // Subtle Mid-Side Perimeter Ferns (tucked neatly at left & right edges)
            drawFernFrond(bgCacheCtx, -8, h * 0.48, 0.25, 95 * scale, 14 * scale, 10, '#051d10');
            drawFernFrond(bgCacheCtx, w + 8, h * 0.52, Math.PI - 0.25, 95 * scale, -14 * scale, 10, '#051d10');

            // Subtle Canopy Fringe along the very top border
            const canopyClumps = Math.ceil(w / 55);
            for (let c = 0; c <= canopyClumps; c++) {
                const cx = (c / canopyClumps) * w;
                const cr = (24 + rand() * 26) * scale;
                bgCacheCtx.fillStyle = c % 2 === 0 ? '#031209' : '#04180d';
                bgCacheCtx.beginPath();
                bgCacheCtx.arc(cx, -cr * 0.25, cr, 0, Math.PI * 2);
                bgCacheCtx.fill();
            }

            // Soft edge vignette to keep focus anchored on the central gravity arena
            const vignette = bgCacheCtx.createRadialGradient(
                w * 0.5, h * 0.5, Math.min(w, h) * 0.28,
                w * 0.5, h * 0.5, Math.max(w, h) * 0.72
            );
            vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vignette.addColorStop(1, 'rgba(1, 7, 4, 0.45)');
            bgCacheCtx.fillStyle = vignette;
            bgCacheCtx.fillRect(0, 0, w, h);
        }

        // =========================================================================
        // BACKGROUND JUNGLE WILDLIFE INITIALIZATION & RENDERING
        // =========================================================================
        function initJungleAnimals(w, h, rand) {
            const scale = Math.max(0.65, Math.min(1.25, Math.min(w, h) / 680));

            // 1. Perched Canopy Toucans on upper left & right branches
            jungleToucans = [];
            if (canopyBranches.length >= 2) {
                const leftAnchor = evalQuadBezier(canopyBranches[0].p0, canopyBranches[0].p1, canopyBranches[0].p2, 0.34);
                const rightAnchor = evalQuadBezier(canopyBranches[1].p0, canopyBranches[1].p1, canopyBranches[1].p2, 0.30);

                jungleToucans.push({
                    x: leftAnchor.x,
                    y: leftAnchor.y - 3 * scale,
                    facing: 1,
                    scale: scale * 0.95,
                    phase: rand() * Math.PI * 2,
                    lookTimer: 120 + Math.floor(rand() * 140),
                    headTilt: 0,
                    targetHeadTilt: 0,
                    blinkTimer: 90
                });

                jungleToucans.push({
                    x: rightAnchor.x,
                    y: rightAnchor.y - 3 * scale,
                    facing: -1,
                    scale: scale * 0.9,
                    phase: rand() * Math.PI * 2,
                    lookTimer: 180 + Math.floor(rand() * 140),
                    headTilt: 0,
                    targetHeadTilt: 0,
                    blinkTimer: 150
                });
            }

            // 2. Hanging Canopy Sloth on the upper-left bough
            if (canopyBranches.length >= 1) {
                const slothAnchor = evalQuadBezier(canopyBranches[0].p0, canopyBranches[0].p1, canopyBranches[0].p2, 0.72);
                jungleSloth = {
                    x: slothAnchor.x,
                    y: slothAnchor.y + 3 * scale,
                    scale: scale * 0.95,
                    phase: rand() * Math.PI * 2
                };
            }

            // 3. Playful Jungle Monkey swinging on a vine from the upper-right bough
            if (canopyBranches.length >= 2) {
                const monkeyAnchor = evalQuadBezier(canopyBranches[1].p0, canopyBranches[1].p1, canopyBranches[1].p2, 0.74);
                jungleMonkey = {
                    anchorX: monkeyAnchor.x,
                    anchorY: monkeyAnchor.y + 2 * scale,
                    vineLength: 42 * scale,
                    scale: scale * 1.32,
                    phase: rand() * Math.PI * 2,
                    blinkTimer: 110,
                    headAngle: 0
                };
            }

            // 4. Gliding / Flapping Rainforest Canopy Birds
            jungleFlyingBirds = [];
            const birdCount = 3;
            for (let i = 0; i < birdCount; i++) {
                const dir = i % 2 === 0 ? 1 : -1;
                const depthScale = (0.55 + i * 0.16) * scale;
                jungleFlyingBirds.push({
                    x: rand() * w,
                    y: h * (0.12 + i * 0.085) + (rand() - 0.5) * 18,
                    baseY: h * (0.12 + i * 0.085),
                    dir: dir,
                    speed: (0.48 + i * 0.16) * (0.85 + rand() * 0.3),
                    scale: depthScale,
                    flapSpeed: 0.11 + rand() * 0.04,
                    phase: rand() * Math.PI * 2,
                    glideCooldown: Math.floor(rand() * 180),
                    isGliding: false
                });
            }

            // 5. Iridescent Rainforest Butterflies (Morpho / Swallowtail silhouettes)
            jungleButterflies = [];
            const butterflyCount = Math.max(5, Math.floor(w / 180));
            const palettes = [
                { wing: 'rgba(56, 178, 145, 0.32)', trim: 'rgba(145, 240, 195, 0.45)' },
                { wing: 'rgba(65, 165, 190, 0.30)', trim: 'rgba(155, 225, 245, 0.42)' },
                { wing: 'rgba(155, 185, 72, 0.28)', trim: 'rgba(220, 242, 130, 0.40)' }
            ];
            for (let i = 0; i < butterflyCount; i++) {
                const pal = palettes[i % palettes.length];
                // Keep butterflies primarily in upper/outer canopy zones so center stays clean
                const edgeBiasX = i % 2 === 0 ? w * (0.12 + rand() * 0.25) : w * (0.63 + rand() * 0.25);
                jungleButterflies.push({
                    x: edgeBiasX,
                    y: h * (0.18 + rand() * 0.58),
                    vx: (rand() - 0.5) * 0.55,
                    vy: (rand() - 0.5) * 0.35,
                    size: (6.5 + rand() * 3.5) * scale,
                    flapSpeed: 0.22 + rand() * 0.08,
                    phase: rand() * Math.PI * 2,
                    wanderTimer: 40 + Math.floor(rand() * 90),
                    palette: pal
                });
            }

            // 6. Rainforest Tree Frogs perched on lower corner monstera & fern leaves
            jungleFrogs = [];
            const leftPerches = [
                { x: 58 * scale, y: h - 38 * scale, facing: 1 },
                { x: 96 * scale, y: h - 54 * scale, facing: 1 }
            ];
            const rightPerches = [
                { x: w - 60 * scale, y: h - 40 * scale, facing: -1 },
                { x: w - 98 * scale, y: h - 56 * scale, facing: -1 }
            ];

            jungleFrogs.push({
                perches: leftPerches,
                perchIdx: 0,
                x: leftPerches[0].x,
                y: leftPerches[0].y,
                startX: leftPerches[0].x,
                startY: leftPerches[0].y,
                targetX: leftPerches[0].x,
                targetY: leftPerches[0].y,
                facing: 1,
                scale: scale * 0.9,
                hopProgress: 0,
                isHopping: false,
                hopCooldown: 180 + Math.floor(rand() * 180),
                phase: rand() * Math.PI * 2,
                blinkTimer: 100
            });

            jungleFrogs.push({
                perches: rightPerches,
                perchIdx: 0,
                x: rightPerches[0].x,
                y: rightPerches[0].y,
                startX: rightPerches[0].x,
                startY: rightPerches[0].y,
                targetX: rightPerches[0].x,
                targetY: rightPerches[0].y,
                facing: -1,
                scale: scale * 0.9,
                hopProgress: 0,
                isHopping: false,
                hopCooldown: 260 + Math.floor(rand() * 180),
                phase: rand() * Math.PI * 2,
                blinkTimer: 140
            });
        }

        function drawJungleToucans() {
            for (const t of jungleToucans) {
                t.lookTimer--;
                if (t.lookTimer <= 0) {
                    t.lookTimer = 140 + ((frameTick * 17) % 160);
                    t.targetHeadTilt = t.targetHeadTilt === 0 ? (Math.sin(frameTick) > 0 ? 0.16 : -0.14) : 0;
                }
                t.headTilt = lerp(t.headTilt, t.targetHeadTilt, 0.06);

                if (t.blinkTimer > 0) {
                    t.blinkTimer--;
                } else if (t.blinkTimer <= -8) {
                    t.blinkTimer = 150 + ((frameTick * 13) % 140);
                } else {
                    t.blinkTimer--;
                }

                const breathe = Math.sin(frameTick * 0.045 + t.phase) * 0.8;
                const s = t.scale;

                ctx.save();
                ctx.translate(t.x, t.y + breathe * 0.35);
                ctx.scale(t.facing * s, s);

                // Tail feathers extending downward behind branch
                ctx.fillStyle = '#03150b';
                ctx.beginPath();
                ctx.moveTo(-6, -2);
                ctx.lineTo(-17, 18);
                ctx.lineTo(-11, 20);
                ctx.lineTo(-2, 0);
                ctx.closePath();
                ctx.fill();

                // Perched body silhouette
                ctx.fillStyle = '#041a0e';
                ctx.strokeStyle = '#0e3b22';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(-2, -9, 8.5, 11.5, -0.25, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Subtle folded wing contour
                ctx.strokeStyle = '#0c351e';
                ctx.beginPath();
                ctx.arc(-3, -8, 6.5, 0.3, Math.PI * 1.15);
                ctx.stroke();

                // Head & iconic curved toucan bill (articulated tilt)
                ctx.save();
                ctx.translate(2, -18);
                ctx.rotate(t.headTilt);

                // Subtle muted yellow-green throat bib
                ctx.fillStyle = 'rgba(135, 185, 92, 0.22)';
                ctx.beginPath();
                ctx.arc(1.5, 3.5, 4.8, -0.4, Math.PI * 0.85);
                ctx.fill();

                // Head
                ctx.fillStyle = '#041a0e';
                ctx.beginPath();
                ctx.arc(0, 0, 6.2, 0, Math.PI * 2);
                ctx.fill();

                // Iconic large curved toucan beak in muted twilight amber-gold
                ctx.fillStyle = 'rgba(182, 146, 56, 0.34)';
                ctx.beginPath();
                ctx.moveTo(4.5, -3.5);
                ctx.quadraticCurveTo(18, -4.5, 22, 1.5);
                ctx.quadraticCurveTo(14, 2.5, 4.5, 2.2);
                ctx.closePath();
                ctx.fill();

                // Dark tip on beak
                ctx.fillStyle = '#03130a';
                ctx.beginPath();
                ctx.arc(20.2, 0.6, 2.1, -0.8, 1.2);
                ctx.fill();

                // Eye (blinks periodically)
                if (t.blinkTimer > 0) {
                    ctx.fillStyle = 'rgba(175, 225, 185, 0.45)';
                    ctx.beginPath();
                    ctx.arc(1.8, -1.2, 1.4, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
                ctx.restore();
            }
        }

        function drawJungleSloth() {
            if (!jungleSloth) return;
            const s = jungleSloth.scale;
            const sway = Math.sin(frameTick * 0.022 + jungleSloth.phase) * 0.065;
            const headTurn = Math.sin(frameTick * 0.015 + jungleSloth.phase * 1.7) * 0.14;

            ctx.save();
            ctx.translate(jungleSloth.x, jungleSloth.y);
            ctx.rotate(sway);
            ctx.scale(s, s);

            ctx.fillStyle = '#04190d';
            ctx.strokeStyle = '#0c341d';
            ctx.lineWidth = 1.1;

            // Back hanging arm gripping branch
            ctx.lineWidth = 4.2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#03150b';
            ctx.beginPath();
            ctx.moveTo(-11, 14);
            ctx.quadraticCurveTo(-13, 6, -9, -1);
            ctx.stroke();

            // Front hanging arm gripping branch
            ctx.strokeStyle = '#051d10';
            ctx.beginPath();
            ctx.moveTo(8, 14);
            ctx.quadraticCurveTo(11, 6, 8, -1);
            ctx.stroke();

            // Curved hammock torso suspended under branch
            ctx.fillStyle = '#041a0e';
            ctx.strokeStyle = '#0d3920';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(-1, 16, 13, 7.5, -0.08, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Round sloth head nestled near front shoulder
            ctx.save();
            ctx.translate(11, 13);
            ctx.rotate(headTurn);
            ctx.fillStyle = '#051e10';
            ctx.beginPath();
            ctx.arc(0, 0, 5.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Soft pale-moss face mask
            ctx.fillStyle = 'rgba(130, 185, 145, 0.20)';
            ctx.beginPath();
            ctx.arc(1.2, 0.3, 3.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.restore();
        }

        function drawJungleMonkey() {
            if (!jungleMonkey) return;
            const m = jungleMonkey;
            const s = m.scale;

            // Gentle pendulum swing on hanging jungle vine
            const swingAngle = Math.sin(frameTick * 0.028 + m.phase) * 0.16;
            const gripX = m.anchorX - Math.sin(swingAngle) * m.vineLength;
            const gripY = m.anchorY + Math.cos(swingAngle) * m.vineLength;
            const tailWave = Math.sin(frameTick * 0.045 + m.phase) * 0.28;
            const armWave = Math.sin(frameTick * 0.055 + m.phase * 1.4) * 0.18;

            if (m.blinkTimer > 0) {
                m.blinkTimer--;
            } else if (m.blinkTimer <= -7) {
                m.blinkTimer = 135 + ((frameTick * 19) % 140);
            } else {
                m.blinkTimer--;
            }

            // Track active ball or snake subtly with head tilt
            const focusTarget = balls.length > 0 ? balls[0] : snake;
            const rawLook = Math.atan2(focusTarget.y - (gripY + 12 * s), focusTarget.x - gripX);
            const desiredTilt = Math.max(-0.22, Math.min(0.22, normalizeAngle(rawLook - Math.PI) * 0.25));
            m.headAngle = lerp(m.headAngle, desiredTilt, 0.06);

            // 1. Draw the hanging vine from canopy branch down through the monkey's grip
            ctx.save();
            ctx.strokeStyle = '#0e4225';
            ctx.lineWidth = 2.6 * (s / 1.32);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(m.anchorX, m.anchorY);
            ctx.quadraticCurveTo(
                (m.anchorX + gripX) * 0.5 + swingAngle * 14,
                (m.anchorY + gripY) * 0.5,
                gripX,
                gripY
            );
            // Trailing vine tail below hand
            ctx.quadraticCurveTo(
                gripX - swingAngle * 10,
                gripY + 14 * s,
                gripX - swingAngle * 18,
                gripY + 26 * s
            );
            ctx.stroke();

            // Small vine leaf near top anchor
            ctx.fillStyle = '#12522f';
            ctx.beginPath();
            ctx.ellipse(m.anchorX + 4 * s, m.anchorY + 11 * s, 5 * s, 2.2 * s, 0.55, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 2. Draw Monkey Body & Face anchored at the gripping hand (gripX, gripY)
            const furMain = '#633d22';
            const furDark = '#472a16';
            const furHighlight = '#7c4f2e';
            const skinTan = '#d4a674';
            const skinShadow = '#b88754';
            const outlineColor = '#180d06';

            ctx.save();
            ctx.translate(gripX, gripY);
            ctx.rotate(swingAngle * 0.85);
            ctx.scale(s, s);

            // Long curled prehensile tail curving behind the monkey
            ctx.save();
            ctx.strokeStyle = furDark;
            ctx.lineWidth = 3.2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(6, 26);
            ctx.bezierCurveTo(
                18, 28 + tailWave * 8,
                25, 16 + tailWave * 10,
                21, 5 + tailWave * 6
            );
            ctx.bezierCurveTo(
                18, -2 + tailWave * 5,
                11, 0 + tailWave * 4,
                13, 6 + tailWave * 4
            );
            ctx.stroke();
            ctx.restore();

            // Back leg (bent slightly behind torso)
            ctx.strokeStyle = furDark;
            ctx.lineWidth = 4.2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(4, 27);
            ctx.lineTo(10, 34);
            ctx.lineTo(6, 41);
            ctx.stroke();

            // Back foot
            ctx.fillStyle = skinShadow;
            ctx.beginPath();
            ctx.ellipse(4.5, 41.5, 3.2, 1.8, -0.2, 0, Math.PI * 2);
            ctx.fill();

            // Torso
            ctx.fillStyle = furMain;
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.ellipse(0, 21, 8.2, 10.5, -0.12, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Warm tan belly patch
            ctx.fillStyle = skinTan;
            ctx.beginPath();
            ctx.ellipse(-2.2, 21.5, 4.8, 7.2, -0.12, 0, Math.PI * 2);
            ctx.fill();

            // Front leg (bent forward playfully)
            ctx.strokeStyle = furMain;
            ctx.lineWidth = 4.4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(-2, 28);
            ctx.lineTo(-9, 34);
            ctx.lineTo(-5, 41);
            ctx.stroke();

            // Front foot
            ctx.fillStyle = skinTan;
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.ellipse(-6.5, 41.5, 3.4, 1.9, 0.25, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Raised right arm reaching up to hold the vine
            ctx.strokeStyle = furMain;
            ctx.lineWidth = 4.0;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(2, 14);
            ctx.quadraticCurveTo(4, 7, 0, 0);
            ctx.stroke();

            // Gripping hand wrapped around the vine at (0, 0)
            ctx.fillStyle = skinTan;
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.arc(0, 0, 2.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Left balance arm reaching outward toward the left
            ctx.save();
            ctx.translate(-5, 16);
            ctx.rotate(armWave);
            ctx.strokeStyle = furHighlight;
            ctx.lineWidth = 3.8;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(-7, -2, -13, -7);
            ctx.stroke();

            // Open monkey hand
            ctx.fillStyle = skinTan;
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.arc(-13.5, -7.5, 2.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            // Monkey Head & Expressive Face
            ctx.save();
            ctx.translate(-2.5, 10.5);
            ctx.rotate(m.headAngle);

            // Far ear (left)
            ctx.fillStyle = furDark;
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(-7.8, -0.5, 3.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = skinShadow;
            ctx.beginPath();
            ctx.arc(-7.8, -0.5, 1.8, 0, Math.PI * 2);
            ctx.fill();

            // Near ear (right)
            ctx.fillStyle = furMain;
            ctx.beginPath();
            ctx.arc(6.8, -0.2, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = skinTan;
            ctx.beginPath();
            ctx.arc(6.8, -0.2, 2.0, 0, Math.PI * 2);
            ctx.fill();

            // Main rounded head
            ctx.fillStyle = furMain;
            ctx.beginPath();
            ctx.arc(0, 0, 7.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Playful hair tuft on crown
            ctx.strokeStyle = furHighlight;
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(-1, -7.2);
            ctx.quadraticCurveTo(-2.5, -10.5, -4.5, -9.8);
            ctx.moveTo(0.5, -7.3);
            ctx.quadraticCurveTo(1.5, -10.6, 3.2, -9.5);
            ctx.stroke();

            // Heart-shaped tan eye mask
            ctx.fillStyle = skinTan;
            ctx.beginPath();
            ctx.arc(-3.1, -1.2, 3.1, 0, Math.PI * 2);
            ctx.arc(1.2, -1.2, 3.1, 0, Math.PI * 2);
            ctx.fill();

            // Rounded lower muzzle & cheeks
            ctx.beginPath();
            ctx.ellipse(-1.0, 2.4, 5.2, 3.8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Subtle smile line & tiny nostrils
            ctx.strokeStyle = '#5e391e';
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.arc(-1.2, 2.6, 2.6, 0.25, Math.PI - 0.35);
            ctx.stroke();

            ctx.fillStyle = '#472a16';
            ctx.beginPath();
            ctx.arc(-2.3, 1.3, 0.65, 0, Math.PI * 2);
            ctx.arc(-0.4, 1.3, 0.65, 0, Math.PI * 2);
            ctx.fill();

            // Eyes (with crisp white catchlight or closed blink arc)
            if (m.blinkTimer > 0) {
                for (const ex of [-3.3, 0.9]) {
                    ctx.fillStyle = '#140a04';
                    ctx.beginPath();
                    ctx.arc(ex, -1.3, 1.35, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(ex - 0.4, -1.7, 0.48, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                ctx.strokeStyle = '#140a04';
                ctx.lineWidth = 1.1;
                for (const ex of [-3.3, 0.9]) {
                    ctx.beginPath();
                    ctx.arc(ex, -1.4, 1.2, 0.15, Math.PI - 0.15);
                    ctx.stroke();
                }
            }

            ctx.restore();
            ctx.restore();
        }

        function drawJungleFlyingBirds() {
            const w = canvas.width;
            for (const b of jungleFlyingBirds) {
                b.x += b.speed * b.dir;

                // Alternate between active flapping and serene soaring glides
                if (b.glideCooldown > 0) {
                    b.glideCooldown--;
                } else {
                    b.isGliding = !b.isGliding;
                    b.glideCooldown = b.isGliding ? 75 : 130;
                }

                const bob = Math.sin(frameTick * 0.03 + b.phase) * 6;
                b.y = b.baseY + bob;

                // Wrap smoothly across horizontal screen edges
                if (b.dir === 1 && b.x > w + 50) {
                    b.x = -50;
                } else if (b.dir === -1 && b.x < -50) {
                    b.x = w + 50;
                }

                const flapRaw = b.isGliding
                    ? 0.22
                    : Math.sin(frameTick * b.flapSpeed + b.phase);
                const wingTipY = -flapRaw * 13;
                const wingMidY = -flapRaw * 7;

                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.scale(b.dir * b.scale, b.scale);

                // Far wing (slightly darker for depth)
                ctx.strokeStyle = '#03140a';
                ctx.lineWidth = 2.2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(1, -1);
                ctx.quadraticCurveTo(-2, wingMidY * 0.85 - 2, -9, wingTipY * 0.85 - 2);
                ctx.stroke();

                // Streamlined bird body & tail
                ctx.fillStyle = '#041c0f';
                ctx.beginPath();
                ctx.moveTo(10, 0); // beak tip
                ctx.quadraticCurveTo(4, -3.5, -4, -2);
                ctx.lineTo(-14, -4); // tail upper
                ctx.lineTo(-12, 1);  // tail lower
                ctx.lineTo(-4, 2);
                ctx.quadraticCurveTo(3, 3, 10, 0);
                ctx.closePath();
                ctx.fill();

                // Near articulated wing
                ctx.strokeStyle = '#0b381f';
                ctx.fillStyle = '#052212';
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(2, 0);
                ctx.quadraticCurveTo(-2, wingMidY, -11, wingTipY);
                ctx.quadraticCurveTo(-5, wingMidY * 0.45 + 1.5, -2, 1);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }
        }

        function drawJungleButterflies() {
            const w = canvas.width;
            const h = canvas.height;

            for (const bf of jungleButterflies) {
                bf.wanderTimer--;
                if (bf.wanderTimer <= 0) {
                    bf.wanderTimer = 55 + ((frameTick * 11) % 95);
                    bf.vx += (Math.sin(frameTick * 0.13 + bf.phase) * 0.32);
                    bf.vy += (Math.cos(frameTick * 0.17 + bf.phase) * 0.25);

                    // Clamp velocity for delicate, unhurried flutter
                    bf.vx = Math.max(-0.65, Math.min(0.65, bf.vx));
                    bf.vy = Math.max(-0.45, Math.min(0.45, bf.vy));
                }

                // Gentle attraction away from dead-center arena so butterflies stay atmospheric
                const dxCenter = bf.x - centralNode.x;
                const dyCenter = bf.y - centralNode.y;
                const distCenter = Math.hypot(dxCenter, dyCenter) || 1;
                const avoidR = Math.min(w, h) * 0.26;
                if (distCenter < avoidR) {
                    bf.vx += (dxCenter / distCenter) * 0.025;
                    bf.vy += (dyCenter / distCenter) * 0.025;
                }

                bf.x += bf.vx;
                bf.y += bf.vy + Math.sin(frameTick * bf.flapSpeed + bf.phase) * 0.32;

                // Keep comfortably within canopy bounds
                if (bf.x < 24) bf.vx = Math.abs(bf.vx) + 0.1;
                if (bf.x > w - 24) bf.vx = -Math.abs(bf.vx) - 0.1;
                if (bf.y < 24) bf.vy = Math.abs(bf.vy) + 0.08;
                if (bf.y > h * 0.85) bf.vy = -Math.abs(bf.vy) - 0.08;

                // 3D wing-beat foreshortening factor
                const flapScale = 0.22 + 0.78 * Math.abs(Math.cos(frameTick * bf.flapSpeed + bf.phase));
                const heading = Math.atan2(bf.vy, bf.vx) * 0.25;
                const sz = bf.size;

                ctx.save();
                ctx.translate(bf.x, bf.y);
                ctx.rotate(heading);

                // Paired upper & lower wings
                for (const side of [-1, 1]) {
                    ctx.save();
                    ctx.scale(side * flapScale, 1);

                    // Forewing
                    ctx.fillStyle = bf.palette.wing;
                    ctx.strokeStyle = bf.palette.trim;
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(sz * 0.4, -sz * 0.95, sz * 1.15, -sz * 0.75, sz * 0.95, -sz * 0.05);
                    ctx.quadraticCurveTo(sz * 0.45, sz * 0.12, 0, 0);
                    ctx.fill();
                    ctx.stroke();

                    // Hindwing
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(sz * 0.75, sz * 0.05, sz * 0.85, sz * 0.75, sz * 0.25, sz * 0.82);
                    ctx.quadraticCurveTo(sz * 0.05, sz * 0.45, 0, 0);
                    ctx.fill();
                    ctx.stroke();

                    ctx.restore();
                }

                // Tiny thorax body
                ctx.fillStyle = '#041a0e';
                ctx.beginPath();
                ctx.ellipse(0, 0, 0.9, sz * 0.36, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        function drawJungleFrogs() {
            for (const frog of jungleFrogs) {
                if (frog.isHopping) {
                    frog.hopProgress += 0.042;
                    if (frog.hopProgress >= 1) {
                        frog.hopProgress = 0;
                        frog.isHopping = false;
                        frog.x = frog.targetX;
                        frog.y = frog.targetY;
                        frog.hopCooldown = 220 + ((frameTick * 23) % 240);
                    } else {
                        const t = frog.hopProgress;
                        const arcHeight = Math.sin(t * Math.PI) * 18 * frog.scale;
                        frog.x = lerp(frog.startX, frog.targetX, t);
                        frog.y = lerp(frog.startY, frog.targetY, t) - arcHeight;
                    }
                } else {
                    frog.hopCooldown--;
                    if (frog.hopCooldown <= 0 && frog.perches.length > 1) {
                        const nextIdx = (frog.perchIdx + 1) % frog.perches.length;
                        const dest = frog.perches[nextIdx];
                        frog.startX = frog.x;
                        frog.startY = frog.y;
                        frog.targetX = dest.x;
                        frog.targetY = dest.y;
                        frog.perchIdx = nextIdx;
                        frog.isHopping = true;
                        frog.hopProgress = 0;
                    }
                }

                if (frog.blinkTimer > 0) {
                    frog.blinkTimer--;
                } else if (frog.blinkTimer <= -6) {
                    frog.blinkTimer = 120 + ((frameTick * 13) % 130);
                } else {
                    frog.blinkTimer--;
                }

                const throatPulse = Math.max(0, Math.sin(frameTick * 0.11 + frog.phase)) * 1.4;
                const s = frog.scale;

                ctx.save();
                ctx.translate(frog.x, frog.y);
                ctx.scale(frog.facing * s, s);

                // Folded hind leg
                ctx.fillStyle = '#062614';
                ctx.strokeStyle = '#114528';
                ctx.lineWidth = 0.9;
                ctx.beginPath();
                ctx.ellipse(-4, -2.5, 4.5, 2.6, -0.45, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Tree frog body
                ctx.fillStyle = '#08301a';
                ctx.beginPath();
                ctx.ellipse(0, -4.5, 6.2, 3.8, -0.22, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Vocal throat sac breathing pulse
                if (!frog.isHopping) {
                    ctx.fillStyle = 'rgba(90, 175, 115, 0.25)';
                    ctx.beginPath();
                    ctx.arc(4.2, -3.5 + throatPulse * 0.4, 2.0 + throatPulse * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Front leg supporting posture
                ctx.strokeStyle = '#0d3d22';
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(3.5, -3.5);
                ctx.lineTo(5.5, 0);
                ctx.stroke();

                // Prominent tree-frog eye bulge with muted ruby-amber iris
                ctx.fillStyle = '#08301a';
                ctx.beginPath();
                ctx.arc(4.5, -7.5, 2.2, 0, Math.PI * 2);
                ctx.fill();

                if (frog.blinkTimer > 0) {
                    ctx.fillStyle = 'rgba(205, 115, 75, 0.52)';
                    ctx.beginPath();
                    ctx.arc(4.8, -7.5, 1.3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function drawJungleAnimals() {
            drawJungleFlyingBirds();
            drawJungleToucans();
            drawJungleSloth();
            drawJungleMonkey();
            drawJungleButterflies();
            drawJungleFrogs();
        }

        function initJungleEnvironment() {
            const w = canvas.width;
            const h = canvas.height;
            if (w <= 0 || h <= 0) return;

            buildStaticJungleCache();

            const rand = createSeededRandom(9081);

            // Populate background rainforest animals
            initJungleAnimals(w, h, rand);

            // 1. Dappled Sunlight Rays filtering diagonally from top canopy
            jungleSunRays = [];
            const rayCount = 5;
            for (let i = 0; i < rayCount; i++) {
                jungleSunRays.push({
                    topX: w * (0.14 + (i / (rayCount - 1)) * 0.68) + (rand() - 0.5) * 40,
                    topWidth: 26 + rand() * 44,
                    bottomWidth: 95 + rand() * 120,
                    slant: 90 + rand() * 110,
                    baseAlpha: 0.022 + rand() * 0.024,
                    speed: 0.012 + rand() * 0.012,
                    phase: rand() * Math.PI * 2
                });
            }

            // 2. Gently Swaying Hanging Vines & Leaves from top edge
            jungleVines = [];
            const vineCount = Math.max(12, Math.floor(w / 62));
            for (let i = 0; i < vineCount; i++) {
                const normX = (i + 0.5) / vineCount;
                const vx = normX * w + (rand() - 0.5) * 28;
                // Shorter near the upper-middle so vines frame the top without cluttering gameplay
                const centerDist = Math.abs(normX - 0.5) * 2; // 0 at center, 1 at edges
                const maxLen = h * (0.11 + centerDist * 0.16) + rand() * (h * 0.07);
                const segments = Math.max(5, Math.floor(maxLen / 18));

                const leaves = [];
                for (let s = 1; s < segments; s++) {
                    if (rand() > 0.22) {
                        leaves.push({
                            segFraction: s / segments,
                            side: (s % 2 === 0 ? 1 : -1) * (rand() > 0.15 ? 1 : -1),
                            size: 5.5 + rand() * 5.5,
                            tilt: 0.45 + rand() * 0.45,
                            shade: rand() > 0.5 ? '#0b3820' : '#0f4729'
                        });
                    }
                }

                jungleVines.push({
                    x: vx,
                    length: maxLen,
                    segments: segments,
                    thickness: 1.1 + rand() * 1.1,
                    swayAmp: 6 + rand() * 11,
                    swaySpeed: 0.018 + rand() * 0.014,
                    phase: rand() * Math.PI * 2,
                    color: rand() > 0.5 ? '#082c19' : '#0b3820',
                    leaves: leaves
                });
            }

            // 3. Drifting Bioluminescent Fireflies / Spores
            jungleFireflies = [];
            const fireflyCount = Math.max(24, Math.floor((w * h) / 22000));
            for (let i = 0; i < fireflyCount; i++) {
                const isGold = rand() > 0.42;
                jungleFireflies.push({
                    x: rand() * w,
                    y: rand() * h,
                    vx: (rand() - 0.5) * 0.32,
                    vy: -0.08 - rand() * 0.22,
                    radius: 1.1 + rand() * 1.5,
                    glowRadius: 6 + rand() * 8,
                    pulseSpeed: 0.025 + rand() * 0.035,
                    phase: rand() * Math.PI * 2,
                    driftFreq: 0.01 + rand() * 0.015,
                    colorRGB: isGold ? '205, 245, 130' : '115, 240, 170'
                });
            }
        }

        function drawJungleBackground() {
            const w = canvas.width;
            const h = canvas.height;

            // 1. Blit cached deep emerald canopy, tree silhouettes, branches & corner foliage
            if (bgCacheCanvas.width > 0 && bgCacheCanvas.height > 0) {
                ctx.drawImage(bgCacheCanvas, 0, 0);
            } else {
                ctx.fillStyle = '#031109';
                ctx.fillRect(0, 0, w, h);
            }

            // 2. Render Dappled Sunlight Shafts filtering from top canopy
            for (let i = 0; i < jungleSunRays.length; i++) {
                const ray = jungleSunRays[i];
                const pulse = 0.72 + 0.28 * Math.sin(frameTick * ray.speed + ray.phase);
                const alpha = ray.baseAlpha * pulse;
                const swayShift = Math.sin(frameTick * ray.speed * 0.7 + ray.phase) * 14;

                const x0 = ray.topX + swayShift;
                const x1 = x0 + ray.topWidth;
                const bx0 = x0 + ray.slant - ray.bottomWidth * 0.35;
                const bx1 = x1 + ray.slant + ray.bottomWidth * 0.65;

                const rayGrad = ctx.createLinearGradient(x0, 0, bx0 + ray.bottomWidth * 0.5, h * 0.88);
                rayGrad.addColorStop(0.0, `rgba(130, 230, 165, ${alpha * 1.35})`);
                rayGrad.addColorStop(0.55, `rgba(95, 205, 140, ${alpha * 0.65})`);
                rayGrad.addColorStop(1.0, 'rgba(60, 160, 100, 0)');

                ctx.fillStyle = rayGrad;
                ctx.beginPath();
                ctx.moveTo(x0, 0);
                ctx.lineTo(x1, 0);
                ctx.lineTo(bx1, h * 0.9);
                ctx.lineTo(bx0, h * 0.9);
                ctx.closePath();
                ctx.fill();
            }

            // 3. Render Animated Background Jungle Wildlife (Toucans, Sloth, Monkey, Birds, Butterflies, Frogs)
            drawJungleAnimals();

            // 4. Render Gently Swaying Hanging Vines & Teardrop Leaves
            for (let i = 0; i < jungleVines.length; i++) {
                const vine = jungleVines[i];
                const primaryWave = Math.sin(frameTick * vine.swaySpeed + vine.phase);
                const secondaryWave = Math.sin(frameTick * vine.swaySpeed * 1.7 + vine.phase * 1.3) * 0.25;

                ctx.strokeStyle = vine.color;
                ctx.lineWidth = vine.thickness;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(vine.x, 0);

                for (let s = 1; s <= vine.segments; s++) {
                    const t = s / vine.segments;
                    const bend = (primaryWave + secondaryWave * t) * vine.swayAmp * (t * t);
                    const px = vine.x + bend;
                    const py = vine.length * t;
                    ctx.lineTo(px, py);
                }
                ctx.stroke();

                // Draw teardrop leaves attached along the swaying vine
                for (let l = 0; l < vine.leaves.length; l++) {
                    const leaf = vine.leaves[l];
                    const t = leaf.segFraction;
                    const bend = (primaryWave + secondaryWave * t) * vine.swayAmp * (t * t);
                    const lx = vine.x + bend;
                    const ly = vine.length * t;

                    // Local tangent slope for natural leaf orientation
                    const slopeDx = (primaryWave + secondaryWave * t) * vine.swayAmp * 2 * t * (1 / Math.max(1, vine.length));
                    const stemAngle = Math.PI / 2 - Math.atan(slopeDx);
                    const leafAngle = stemAngle - leaf.side * leaf.tilt;

                    ctx.save();
                    ctx.translate(lx, ly);
                    ctx.rotate(leafAngle);
                    ctx.fillStyle = leaf.shade;

                    const len = leaf.size;
                    const wid = len * 0.44;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(len * 0.45, -wid, len, 0);
                    ctx.quadraticCurveTo(len * 0.45, wid, 0, 0);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // 5. Render Drifting Bioluminescent Fireflies / Jungle Spores
            for (let i = 0; i < jungleFireflies.length; i++) {
                const f = jungleFireflies[i];

                // Gentle organic drift
                f.x += f.vx + Math.sin(frameTick * f.driftFreq + f.phase) * 0.22;
                f.y += f.vy + Math.cos(frameTick * f.driftFreq * 0.8 + f.phase) * 0.12;

                // Softly wrap around canvas boundaries
                if (f.y < -15) {
                    f.y = h + 15;
                    f.x = (f.x + w * 0.37) % w;
                }
                if (f.x < -15) f.x = w + 15;
                if (f.x > w + 15) f.x = -15;

                const twinkle = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(frameTick * f.pulseSpeed + f.phase));

                // Soft outer bioluminescent halo
                const halo = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.glowRadius);
                halo.addColorStop(0, `rgba(${f.colorRGB}, ${0.32 * twinkle})`);
                halo.addColorStop(1, `rgba(${f.colorRGB}, 0)`);
                ctx.fillStyle = halo;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.glowRadius, 0, Math.PI * 2);
                ctx.fill();

                // Crisp luminous core
                ctx.fillStyle = `rgba(${f.colorRGB}, ${0.78 * twinkle})`;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // =========================================================================
        // INITIALIZATION & RESIZING
        // =========================================================================
        function initSnake() {
            const orbitR = Math.min(canvas.width, canvas.height) * 0.24 || 130;
            snake.x = centralNode.x;
            snake.y = centralNode.y - orbitR;
            snake.angle = 0; // Moving right initially in a clockwise orbit
            snake.speed = SNAKE_BASE_SPEED;
            snake.segmentCount = INITIAL_SNAKE_SEGMENTS;
            snake.headRadius = INITIAL_HEAD_RADIUS;
            snake.bitePulse = 0;
            snake.orbitDirection = 1;

            // Pre-populate spine history behind the head so the snake spawns fully extended
            const spacing = getSegmentSpacing();
            const totalHistoryLength = (snake.segmentCount + 5) * spacing;
            snake.spineHistory = [];
            for (let d = 0; d <= totalHistoryLength; d += 2) {
                snake.spineHistory.push({
                    x: snake.x - d,
                    y: snake.y
                });
            }
            computeSnakeSegments();
        }

        function getSegmentSpacing() {
            // Spacing scales proportionally with thickness so segments overlap cleanly without gaps
            return Math.max(5.5, snake.headRadius * 0.85);
        }

        function resizeCanvas() {
            const prevCenterX = centralNode.x;
            const prevCenterY = centralNode.y;

            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            // Rebuild cached jungle canopy, foliage, wildlife, vines & fireflies for the new dimensions
            initJungleEnvironment();

            // Shift snake & history relative to the new center if already initialized
            if (snake.spineHistory.length > 0 && (prevCenterX !== 0 || prevCenterY !== 0)) {
                const dx = centralNode.x - prevCenterX;
                const dy = centralNode.y - prevCenterY;
                snake.x += dx;
                snake.y += dy;
                for (let i = 0; i < snake.spineHistory.length; i++) {
                    snake.spineHistory[i].x += dx;
                    snake.spineHistory[i].y += dy;
                }
                computeSnakeSegments();
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        initSnake();
        updateHUD();

        // =========================================================================
        // INPUT HANDLING (Canvas Click & WASD / Arrow Keys)
        // =========================================================================
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchBall(clickX, clickY);
        });

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
                // Prevent page scrolling with arrow keys
                if (key.startsWith('arrow')) e.preventDefault();
                activeKeys.add(key);
                manualTimer = MANUAL_OVERRIDE_DURATION;
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            activeKeys.delete(key);
        });

        window.addEventListener('blur', () => {
            activeKeys.clear();
        });

        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Overwrite existing array to strictly maintain a single ball on screen
            balls = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4,
                trail: [] // Stores history of past {x, y} coordinates
            }];
            updateHUD();
        }

        function resetSimulation() {
            balls = [];
            shockwaves = [];
            ballsEaten = 0;
            manualTimer = 0;
            activeKeys.clear();
            centralNode.radius = INITIAL_NODE_RADIUS;
            initSnake();
            updateHUD();
        }

        // =========================================================================
        // SNAKE KINEMATICS, AI & STEERING
        // =========================================================================
        function getManualTargetAngle() {
            let inputX = 0;
            let inputY = 0;

            if (activeKeys.has('w') || activeKeys.has('arrowup')) inputY -= 1;
            if (activeKeys.has('s') || activeKeys.has('arrowdown')) inputY += 1;
            if (activeKeys.has('a') || activeKeys.has('arrowleft')) inputX -= 1;
            if (activeKeys.has('d') || activeKeys.has('arrowright')) inputX += 1;

            if (inputX === 0 && inputY === 0) {
                return null;
            }
            return Math.atan2(inputY, inputX);
        }

        function computeAutonomousTargetAngle() {
            const dxCenter = centralNode.x - snake.x;
            const dyCenter = centralNode.y - snake.y;
            const distCenter = Math.hypot(dxCenter, dyCenter) || 1;
            const angleToCenter = Math.atan2(dyCenter, dxCenter);

            // Safe buffer around the central gravity node so the snake avoids plunging into it
            const safeNodeRadius = centralNode.radius + snake.headRadius + 38;

            let desiredVx = 0;
            let desiredVy = 0;

            if (balls.length > 0) {
                // HUNTING MODE: Predict ball's near-future position and intercept
                const targetBall = balls[0];
                const distToBall = Math.hypot(targetBall.x - snake.x, targetBall.y - snake.y);
                const leadFrames = Math.min(18, distToBall / (SNAKE_HUNT_SPEED * 1.4));

                const interceptX = targetBall.x + targetBall.vx * leadFrames;
                const interceptY = targetBall.y + targetBall.vy * leadFrames;

                const huntAngle = Math.atan2(interceptY - snake.y, interceptX - snake.x);
                desiredVx += Math.cos(huntAngle) * 1.3;
                desiredVy += Math.sin(huntAngle) * 1.3;
            } else {
                // ORBITAL PATROL MODE: Smoothly orbit the central gravity node
                const preferredOrbit = Math.max(
                    safeNodeRadius + 35,
                    Math.min(canvas.width, canvas.height) * 0.25
                );
                const radialError = distCenter - preferredOrbit;
                const tangentAngle = angleToCenter + (Math.PI / 2) * snake.orbitDirection;

                // Tangential orbit velocity + radial spring correction + gentle organic wave
                const wave = Math.sin(frameTick * 0.04) * 0.28;
                const radialPull = Math.max(-0.9, Math.min(0.9, radialError * 0.015));

                desiredVx += Math.cos(tangentAngle + wave) + Math.cos(angleToCenter) * radialPull;
                desiredVy += Math.sin(tangentAngle + wave) + Math.sin(angleToCenter) * radialPull;
            }

            // CENTRAL-NODE AVOIDANCE: Strong tangential + outward deflection if too close to center
            if (distCenter < safeNodeRadius) {
                const urgency = (safeNodeRadius - distCenter) / safeNodeRadius;
                const awayAngle = angleToCenter + Math.PI;
                // Add tangential slide so the snake curves smoothly around the node rather than stalling
                const cross = Math.cos(snake.angle) * dyCenter - Math.sin(snake.angle) * dxCenter;
                const slideDir = cross >= 0 ? -1 : 1;
                const slideAngle = angleToCenter + (Math.PI / 2) * slideDir;

                desiredVx += (Math.cos(awayAngle) * 1.6 + Math.cos(slideAngle) * 1.2) * (1 + urgency * 2.5);
                desiredVy += (Math.sin(awayAngle) * 1.6 + Math.sin(slideAngle) * 1.2) * (1 + urgency * 2.5);
            }

            // ARENA EDGE AVOIDANCE: Keep the snake comfortably inside the visible canvas
            const edgeMargin = 45 + snake.headRadius;
            if (snake.x < edgeMargin) desiredVx += (edgeMargin - snake.x) * 0.08;
            if (snake.x > canvas.width - edgeMargin) desiredVx -= (snake.x - (canvas.width - edgeMargin)) * 0.08;
            if (snake.y < edgeMargin) desiredVy += (edgeMargin - snake.y) * 0.08;
            if (snake.y > canvas.height - edgeMargin) desiredVy -= (snake.y - (canvas.height - edgeMargin)) * 0.08;

            return Math.atan2(desiredVy, desiredVx);
        }

        function computeSnakeSegments() {
            const spacing = getSegmentSpacing();
            const count = snake.segmentCount;
            const newSegments = [];

            // Head is always at index 0
            newSegments.push({
                x: snake.x,
                y: snake.y,
                radius: getSegmentRadius(0, count)
            });

            // Walk along spineHistory accumulating exact arc-length distances
