<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Header Controls Toolbar */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #ffffff;
            padding: 4px 8px;
            background: #000000;
            height: 30px;
        }

        .control-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #cccccc;
            white-space: nowrap;
        }

        .control-select {
            background: #000000;
            color: #ffffff;
            border: none;
            outline: none;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            padding-right: 4px;
        }

        .control-select option {
            background: #000000;
            color: #ffffff;
        }

        /* Compact Monospace Color Pickers */
        .color-picker {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 20px;
            height: 18px;
            padding: 0;
            border: 1px solid #ffffff;
            background: transparent;
            cursor: pointer;
        }

        .color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker::-webkit-color-swatch {
            border: none;
        }

        .color-picker::-moz-color-swatch {
            border: none;
        }

        .btn-control,
        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 0 12px;
            height: 30px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
            white-space: nowrap;
        }

        .btn-reset {
            padding: 0 16px;
            font-size: 14px;
        }

        .btn-control:hover,
        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #simCanvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        /* Full-Screen Non-Blocking Overlay Canvas for Cute Pop-Up Animals */
        #animalOverlayCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
            background: transparent;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }

        @media (max-width: 680px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 15px;
            }

            .control-group {
                padding: 3px 6px;
                height: 28px;
            }

            .btn-control,
            .btn-reset {
                height: 28px;
                font-size: 11px;
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>

        <!-- Custom Background & Simulation Controls -->
        <div class="controls-bar">
            <div class="control-group" title="Choose a Stylized or Animated Background">
                <label for="bgPreset" class="control-label">BG:</label>
                <select id="bgPreset" class="control-select" aria-label="Background Preset">
                    <option value="void">Void Black (Default)</option>
                    <option value="spacetime">Spacetime Grid</option>
                    <option value="starfield">Deep Starfield</option>
                    <option value="nebula">Cosmic Nebula</option>
                    <option value="cyber">Cyber Grid</option>
                    <option value="blueprint">Physics Blueprint</option>
                    <option value="custom-gradient" hidden>Custom Gradient</option>
                    <option value="custom-image" hidden>Custom Image</option>
                </select>
            </div>

            <div class="control-group" title="Choose Multi-Ball Visual Style">
                <label for="ballStyle" class="control-label">Balls:</label>
                <select id="ballStyle" class="control-select" aria-label="Ball Color Style">
                    <option value="prism">Prism Glow</option>
                    <option value="classic">Classic White</option>
                </select>
            </div>

            <div class="control-group" title="Adjust Core and Edge Colors for Custom Gradient">
                <label for="coreColor" class="control-label">Core</label>
                <input type="color" id="coreColor" class="color-picker" value="#16213e" aria-label="Core Background Color">
                <label for="edgeColor" class="control-label">Edge</label>
                <input type="color" id="edgeColor" class="color-picker" value="#000000" aria-label="Edge Background Color">
            </div>

            <button type="button" class="btn-control" id="uploadBgBtn" title="Upload a Custom Background Image">Upload BG</button>
            <input type="file" id="bgImageInput" accept="image/*" hidden>

            <button type="button" class="btn-control" onclick="launchSwarm()" title="Launch a Harmonic Multi-Ball Formation">Swarm</button>
            <button type="button" class="btn-reset" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions" id="statusBar">
        Click anywhere to pop up a cute animal & launch orbiting balls — or drag to stream balls.
    </div>

    <!-- Full-Screen Overlay Canvas for Pop-Up Cute Animals & Sparkles -->
    <canvas id="animalOverlayCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Full-Screen Animal Pop-Up Overlay Canvas
        const animalCanvas = document.getElementById('animalOverlayCanvas');
        const animalCtx = animalCanvas.getContext('2d');

        // UI Elements
        const bgPresetSelect = document.getElementById('bgPreset');
        const ballStyleSelect = document.getElementById('ballStyle');
        const coreColorInput = document.getElementById('coreColor');
        const edgeColorInput = document.getElementById('edgeColor');
        const uploadBgBtn = document.getElementById('uploadBgBtn');
        const bgImageInput = document.getElementById('bgImageInput');
        const statusBar = document.getElementById('statusBar');

        // SIMULATION CONSTANTS (Preserved Exact Physics Values)
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;        // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;    // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;         // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center
        const MAX_BALLS = 60;             // Maximum simultaneous orbiting balls

        // ANIMAL POP-UP CONSTANTS
        const MAX_POPUP_ANIMALS = 18;
        const MAX_ANIMAL_SPARKLES = 280;
        const SPARKLE_COLORS = [
            '#ffd447',
            '#ff7eb3',
            '#5ce1e6',
            '#c084fc',
            '#64ffda',
            '#ff9f43',
            '#ffffff'
        ];

        // Harmonious luminous palette for multi-ball trails
        const PRISM_PALETTE = [
            '#ffffff',
            '#5ce1e6',
            '#c084fc',
            '#ff7eb3',
            '#64ffda',
            '#ffd166',
            '#60a5fa',
            '#fb923c',
            '#a3e635',
            '#f472b6'
        ];

        // STATE VARIABLES
        let balls = [];
        let ripples = [];
        let launchCounter = 0;
        let ballColorMode = 'prism';      // 'prism' | 'classic'
        let bgMode = 'void';              // 'void' | 'spacetime' | 'starfield' | 'nebula' | 'cyber' | 'blueprint' | 'custom-gradient' | 'custom-image'
        let customCoreColor = coreColorInput.value;
        let customEdgeColor = edgeColorInput.value;
        let customBgImage = null;
        let animTime = 0;
        let lastFrameTime = 0;
        let starExcitedTimer = 0;         // Boosts bounce/celebration when a ball is absorbed

        // Cute Pop-Up Animals & Celebratory Sparkles State
        let popupAnimals = [];
        let animalSparkles = [];
        let animalRings = [];
        let lastAnimalIndex = -1;

        // Pointer drag-launch tracking
        let isPointerDown = false;
        let lastSpawnTime = 0;
        let lastSpawnX = 0;
        let lastSpawnY = 0;

        // Central Gravity Node Definition (Dancing Star)
        const centralNode = {
            x: 0,
            y: 0,
            radius: 14
        };

        // Pre-generated procedural stars for Deep Starfield preset (normalized coordinates)
        const starfieldData = Array.from({ length: 190 }, (_, idx) => {
            const layer = idx % 3;
            const hues = ['#ffffff', '#cfe4ff', '#ffe9cc', '#b8f2ff'];
            return {
                nx: ((idx * 73.137) % 100) / 100,
                ny: ((idx * 41.913 + Math.sin(idx) * 19 + 100) % 100) / 100,
                size: layer === 0 ? 0.8 : layer === 1 ? 1.4 : 2.1,
                baseAlpha: layer === 0 ? 0.35 : layer === 1 ? 0.62 : 0.88,
                twinkleSpeed: 1.2 + (idx % 7) * 0.45,
                phase: idx * 1.7,
                color: hues[idx % hues.length],
                hasGlint: layer === 2 && idx % 4 === 0
            };
        });

        // Helper for transient status feedback
        let statusTimeout = null;
        function updateDefaultStatus() {
            if (statusTimeout) return;
            if (balls.length === 0) {
                statusBar.textContent = 'Click anywhere to pop up a cute animal & launch orbiting balls — or drag to stream balls.';
            } else {
                const label = balls.length === 1 ? '1 ball in orbit' : `${balls.length} balls in orbit`;
                statusBar.textContent = `${label} — Click anywhere to pop up an animal & add more.`;
            }
        }

        function showStatusMessage(message, durationMs = 3200) {
            statusBar.textContent = message;
            if (statusTimeout) clearTimeout(statusTimeout);
            statusTimeout = setTimeout(() => {
                statusTimeout = null;
                updateDefaultStatus();
            }, durationMs);
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            // Resize full-viewport animal pop-up overlay canvas with DPR crispness
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            animalCanvas.width = Math.floor(window.innerWidth * dpr);
            animalCanvas.height = Math.floor(window.innerHeight * dpr);
            animalCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Background & Visual Style Event Listeners
        bgPresetSelect.addEventListener('change', (e) => {
            bgMode = e.target.value;
        });

        ballStyleSelect.addEventListener('change', (e) => {
            ballColorMode = e.target.value;
        });

        function applyCustomGradient() {
            customCoreColor = coreColorInput.value;
            customEdgeColor = edgeColorInput.value;
            bgMode = 'custom-gradient';
            bgPresetSelect.value = 'custom-gradient';
        }

        coreColorInput.addEventListener('input', applyCustomGradient);
        edgeColorInput.addEventListener('input', applyCustomGradient);

        uploadBgBtn.addEventListener('click', () => {
            bgImageInput.click();
        });

        bgImageInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showStatusMessage('Please select a valid image file.');
                bgImageInput.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    customBgImage = img;
                    bgMode = 'custom-image';
                    bgPresetSelect.value = 'custom-image';
                    showStatusMessage(`Loaded custom background: ${file.name}`);
                };
                img.onerror = () => {
                    showStatusMessage('Could not decode the selected image.');
                };
                img.src = event.target.result;
            };
            reader.onerror = () => {
                showStatusMessage('Failed to read the selected file.');
            };
            reader.readAsDataURL(file);
            bgImageInput.value = '';
        });

        // Global Screen Click Listener: Pop up a random cute animated animal anywhere on the screen
        window.addEventListener('pointerdown', (e) => {
            if (e.button !== undefined && e.button !== 0) return;
            spawnPopupAnimal(e.clientX, e.clientY);
        });

        // Pointer Handlers on Simulation Canvas: Click for single launch, drag for multi-ball stream
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (e.button !== undefined && e.button !== 0) return;
            const { x, y } = getCanvasCoords(e);
            isPointerDown = true;
            lastSpawnTime = performance.now();
            lastSpawnX = x;
            lastSpawnY = y;
            launchBall(x, y);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isPointerDown) return;
            const { x, y } = getCanvasCoords(e);
            const now = performance.now();
            const movedDist = Math.hypot(x - lastSpawnX, y - lastSpawnY);

            if (now - lastSpawnTime >= 85 && movedDist >= 16) {
                lastSpawnTime = now;
                lastSpawnX = x;
                lastSpawnY = y;
                launchBall(x, y);
            }
        });

        window.addEventListener('pointerup', () => {
            isPointerDown = false;
        });

        canvas.addEventListener('pointercancel', () => {
            isPointerDown = false;
        });

        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            const color = PRISM_PALETTE[launchCounter % PRISM_PALETTE.length];
            launchCounter++;

            if (balls.length >= MAX_BALLS) {
                balls.shift();
            }

            balls.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4,
                color: color,
                trail: [{ x: x, y: y }]
            });

            updateDefaultStatus();
        }

        function launchSwarm() {
            const count = 8;
            const maxSpan = Math.min(canvas.height * 0.36, 210);
            const minSpan = 55;

            for (let i = 0; i < count; i++) {
                const t = i / (count - 1);
                const offset = minSpan + t * (maxSpan - minSpan);
                const side = i % 2 === 0 ? -1 : 1;
                const xOffset = (i - (count - 1) / 2) * 14;
                launchBall(centralNode.x + xOffset, centralNode.y + side * offset);
            }
        }

        function resetSimulation() {
            balls = [];
            ripples = [];
            launchCounter = 0;
            starExcitedTimer = 0;
            updateDefaultStatus();
        }

        /* =========================================================
           CUTE ANIMATED ANIMAL SPECIES DEFINITIONS & RENDERERS
           ========================================================= */

        function drawAnimalEyes(c, leftX, rightX, eyeY, eyeR, age, happyEyes = false) {
            const blinkCycle = (age * 1.15) % 2.4;
            const isBlinking = blinkCycle > 2.22 && blinkCycle < 2.36;

            c.strokeStyle = '#231712';
            c.fillStyle = '#231712';
            c.lineWidth = 2;
            c.lineCap = 'round';

            if (happyEyes || isBlinking) {
                c.beginPath();
                c.arc(leftX, eyeY + 1, eyeR * 1.15, Math.PI * 1.12, Math.PI * 1.88);
                c.stroke();

                c.beginPath();
                c.arc(rightX, eyeY + 1, eyeR * 1.15, Math.PI * 1.12, Math.PI * 1.88);
                c.stroke();
            } else {
                c.beginPath();
                c.arc(leftX, eyeY, eyeR, 0, Math.PI * 2);
                c.arc(rightX, eyeY, eyeR, 0, Math.PI * 2);
                c.fill();

                // Main glossy catchlight
                c.fillStyle = '#ffffff';
                c.beginPath();
                c.arc(leftX - eyeR * 0.34, eyeY - eyeR * 0.34, eyeR * 0.38, 0, Math.PI * 2);
                c.arc(rightX - eyeR * 0.34, eyeY - eyeR * 0.34, eyeR * 0.38, 0, Math.PI * 2);
                c.fill();

                // Tiny secondary sparkle
                c.beginPath();
                c.arc(leftX + eyeR * 0.3, eyeY + eyeR * 0.28, eyeR * 0.18, 0, Math.PI * 2);
                c.arc(rightX + eyeR * 0.3, eyeY + eyeR * 0.28, eyeR * 0.18, 0, Math.PI * 2);
                c.fill();
            }
        }

        function drawRosyCheeks(c, leftX, rightX, cheekY, rx = 4.6, ry = 2.7, color = 'rgba(255, 118, 138, 0.55)') {
            c.fillStyle = color;
            c.beginPath();
            c.ellipse(leftX, cheekY, rx, ry, 0, 0, Math.PI * 2);
            c.ellipse(rightX, cheekY, rx, ry, 0, 0, Math.PI * 2);
            c.fill();
        }

        function drawCuteWMouth(c, cx, cy, size = 3.2) {
            c.strokeStyle = '#2b1b14';
            c.lineWidth = 1.7;
            c.lineCap = 'round';
            c.beginPath();
            c.arc(cx - size, cy, size, 0.08 * Math.PI, 0.92 * Math.PI);
            c.stroke();
            c.beginPath();
            c.arc(cx + size, cy, size, 0.08 * Math.PI, 0.92 * Math.PI);
            c.stroke();
        }

        const ANIMAL_SPECIES = [
            {
                name: 'Fennec Fox',
                accent: '#ff9f43',
                draw(c, t) {
                    const earWiggle = Math.sin(t * 10) * 0.09;

                    // Giant Fennec Ears
                    for (const side of [-1, 1]) {
                        c.save();
                        c.translate(side * 12, -10);
                        c.rotate(side * (0.42 + earWiggle));

                        c.fillStyle = '#f7a440';
                        c.strokeStyle = '#5c3412';
                        c.lineWidth = 1.8;
                        c.beginPath();
                        c.moveTo(-8, 4);
                        c.quadraticCurveTo(-7, -22, 0, -28);
                        c.quadraticCurveTo(7, -22, 8, 4);
                        c.closePath();
                        c.fill();
                        c.stroke();

                        c.fillStyle = '#ffe5d4';
                        c.beginPath();
                        c.moveTo(-4.5, 2);
                        c.quadraticCurveTo(-4, -15, 0, -21);
                        c.quadraticCurveTo(4, -15, 4.5, 2);
                        c.closePath();
                        c.fill();
                        c.restore();
                    }

                    // Fox Head & Fluffy Cheeks
                    c.fillStyle = '#ffab4c';
                    c.strokeStyle = '#5c3412';
                    c.lineWidth = 2;
                    c.beginPath();
                    c.moveTo(0, -17);
                    c.quadraticCurveTo(20, -16, 23, 2);
                    c.quadraticCurveTo(21, 16, 0, 18);
                    c.quadraticCurveTo(-21, 16, -23, 2);
                    c.quadraticCurveTo(-20, -16, 0, -17);
                    c.closePath();
                    c.fill();
                    c.stroke();

                    // Cream Cheek & Muzzle Mask
                    c.fillStyle = '#fff6e6';
                    c.beginPath();
                    c.moveTo(-21, 2);
                    c.quadraticCurveTo(-11, -1, 0, 2);
                    c.quadraticCurveTo(11, -1, 21, 2);
                    c.quadraticCurveTo(19, 15, 0, 17);
                    c.quadraticCurveTo(-19, 15, -21, 2);
                    c.closePath();
                    c.fill();

                    drawRosyCheeks(c, -12, 12, 6.5);
                    drawAnimalEyes(c, -8.5, 8.5, 0, 3.3, t);

                    // Button Nose & Smile
                    c.fillStyle = '#2b1b14';
                    c.beginPath();
                    c.ellipse(0, 5.2, 2.8, 2.1, 0, 0, Math.PI * 2);
                    c.fill();
                    drawCuteWMouth(c, 0, 7.6, 2.8);
                }
            },
            {
                name: 'Axolotl',
                accent: '#ff7096',
                draw(c, t) {
                    const gillWave = Math.sin(t * 9) * 0.12;

                    // 3 Pairs of Feathery Gills
                    for (const side of [-1, 1]) {
                        const angles = [-0.45, 0, 0.45];
                        const yOffsets = [-9, -1, 7];
                        for (let i = 0; i < 3; i++) {
                            c.save();
                            c.translate(side * 19, yOffsets[i]);
                            c.rotate(side * (angles[i] + gillWave * (i % 2 === 0 ? 1 : -1)));
                            c.fillStyle = '#ff477e';
                            c.strokeStyle = '#7a1c3b';
                            c.lineWidth = 1.5;
                            c.beginPath();
                            c.ellipse(side * 6, 0, 7.5, 3.3, 0, 0, Math.PI * 2);
                            c.fill();
                            c.stroke();
                            c.restore();
                        }
                    }

                    // Tiny Stubby Hands
                    c.fillStyle = '#ffb3c6';
                    c.strokeStyle = '#7a1c3b';
                    c.lineWidth = 1.7;
                    c.beginPath();
                    c.ellipse(-13, 16, 4.5, 3, -0.4 + Math.sin(t * 11) * 0.25, 0, Math.PI * 2);
                    c.ellipse(13, 16, 4.5, 3, 0.4 - Math.sin(t * 11) * 0.25, 0, Math.PI * 2);
                    c.fill();
                    c.stroke();

                    // Pastel Pink Rounded Head
                    c.fillStyle = '#ffc2d1';
                    c.strokeStyle = '#7a1c3b';
                    c.lineWidth = 2;
                    c.beginPath();
                    c.ellipse(0, 0, 21, 17.5, 0, 0, Math.PI * 2);
                    c.fill();
                    c.stroke();

                    // Soft Forehead Highlight
                    c.fillStyle = 'rgba(255, 255, 255, 0.45)';
                    c.beginPath();
                    c.ellipse(0, -10, 10, 4, 0, 0, Math.PI * 2);
                    c.fill();

                    drawRosyCheeks(c, -12, 12, 4.8, 4.8, 2.8, 'rgba(255, 71, 126, 0.45)');
                    drawAnimalEyes(c, -9.5, 9.5, -1, 3.1, t);

                    // Wide Cheerful Axolotl Smile
                    c.strokeStyle = '#591128';
                    c.lineWidth = 1.8;
                    c.lineCap = 'round';
                    c.beginPath();
                    c.arc(0, 3.5, 5.2, 0.12 * Math.PI, 0.88 * Math.PI);
                    c.stroke();
                }
            },
            {
                name: 'Red Panda',
                accent: '#e15f41',
                draw(c, t) {
                    // Striped Fluffy Tail Peeking on Right
                    c.save();
                    c.translate(15, 11);
                    c.rotate(0.45 + Math.sin(t * 8) * 0.14);
                    c.fillStyle = '#d95338';
                    c.strokeStyle = '#4a1c11';
                    c.lineWidth = 1.8;
                    c.beginPath();
                    c.ellipse(8, 0, 12, 6.5, 0, 0, Math.PI * 2);
                    c.fill();
                    c.stroke();
                    c.fillStyle = '#ffbe76';

        function spawnPopupAnimal(clientX, clientY) {
            // Pick a random animal species, avoiding repeating the immediate previous species
            let idx = Math.floor(Math.random() * ANIMAL_SPECIES.length);
            if (ANIMAL_SPECIES.length > 1 && idx === lastAnimalIndex) {
                idx = (idx + 1 + Math.floor(Math.random() * (ANIMAL_SPECIES.length - 1))) % ANIMAL_SPECIES.length;
            }
            lastAnimalIndex = idx;
            const species = ANIMAL_SPECIES[idx];

            // Clamp resting anchor inside viewport bounds so animal + badge never clip off-screen
            const marginX = 64;
            const marginTop = 64;
            const marginBottom = 72;
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            const anchorX = Math.max(marginX, Math.min(vw - marginX, clientX));
            const anchorY = Math.max(marginTop, Math.min(vh - marginBottom, clientY));

            if (popupAnimals.length >= MAX_POPUP_ANIMALS) {
                popupAnimals.shift();
            }

            popupAnimals.push({
                speciesIndex: idx,
                x: clientX,
                y: clientY,
                anchorX: anchorX,
                anchorY: anchorY,
                age: 0,
                lifetime: 2.55,
                // Underdamped spring oscillator for elastic pop-up scale
                scale: 0.06,
                scaleVel: 14.5,
                // Vertical bounce spring
                jumpOffset: 16,
                jumpVel: -155,
                // Playful initial wiggle direction
                wiggleDir: Math.random() < 0.5 ? -1 : 1
            });

            // Expanding celebratory ring at the exact click point
            animalRings.push({
                x: clientX,
                y: clientY,
                radius: 6,
                maxRadius: 56,
                alpha: 0.85,
                color: species.accent
            });

            // Celebratory sparkles burst at the exact click point
            const sparkleCount = 16;
            for (let i = 0; i < sparkleCount; i++) {
                if (animalSparkles.length >= MAX_ANIMAL_SPARKLES) {
                    animalSparkles.shift();
                }
                const angle = (Math.PI * 2 * i) / sparkleCount + (Math.random() - 0.5) * 0.35;
                const speed = 55 + Math.random() * 115;
                const shapes = ['star', 'star', 'circle', 'heart'];
                animalSparkles.push({
                    x: clientX,
                    y: clientY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 35,
                    size: 2.6 + Math.random() * 3.4,
                    color: i % 3 === 0 ? species.accent : SPARKLE_COLORS[i % SPARKLE_COLORS.length],
                    shape: shapes[i % shapes.length],
                    age: 0,
                    lifetime: 0.65 + Math.random() * 0.45,
                    spin: (Math.random() - 0.5) * 8,
                    angle: Math.random() * Math.PI * 2
                });
            }
        }

        function updatePopupAnimals(dt) {
            // Update animals
            for (let i = popupAnimals.length - 1; i >= 0; i--) {
                const a = popupAnimals[i];
                a.age += dt;

                if (a.age >= a.lifetime) {
                    popupAnimals.splice(i, 1);
                    continue;
                }

                // Smoothly glide toward safe viewport anchor if clicked right on a screen border
                const followRate = Math.min(1, dt * 14);
                a.x += (a.anchorX - a.x) * followRate;
                a.y += (a.anchorY - a.y) * followRate;

                const timeRemaining = a.lifetime - a.age;

                if (timeRemaining < 0.28) {
                    // Cute pop-out shrink at end of lifetime
                    const tOut = 1 - timeRemaining / 0.28;
                    const anticipation = tOut < 0.25 ? 1 + (tOut / 0.25) * 0.12 : 1.12 * (1 - (tOut - 0.25) / 0.75);
                    a.scale = Math.max(0, anticipation);
                } else {
                    // Elastic spring physics toward target scale = 1.0
                    const stiffness = 215;
                    const damping = 13.5;
                    const force = (1.0 - a.scale) * stiffness;
                    a.scaleVel = (a.scaleVel + force * dt) * Math.exp(-damping * dt);
                    a.scale += a.scaleVel * dt;
                }

                // Vertical hop spring toward resting offset = 0
                const jumpForce = (0 - a.jumpOffset) * 190;
                a.jumpVel = (a.jumpVel + jumpForce * dt) * Math.exp(-12 * dt);
                a.jumpOffset += a.jumpVel * dt;
            }

            // Update celebratory rings
            for (let r = animalRings.length - 1; r >= 0; r--) {
                const ring = animalRings[r];
                ring.radius += dt * 125;
                ring.alpha -= dt * 1.9;
                if (ring.alpha <= 0 || ring.radius >= ring.maxRadius) {
                    animalRings.splice(r, 1);
                }
            }

            // Update celebratory sparkles
            for (let s = animalSparkles.length - 1; s >= 0; s--) {
                const sp = animalSparkles[s];
                sp.age += dt;
                if (sp.age >= sp.lifetime) {
                    animalSparkles.splice(s, 1);
                    continue;
                }
                sp.vx *= Math.exp(-2.8 * dt);
                sp.vy = sp.vy * Math.exp(-2.4 * dt) + 125 * dt;
                sp.x += sp.vx * dt;
                sp.y += sp.vy * dt;
                sp.angle += sp.spin * dt;
            }
        }

        function drawMiniHeart(c, size, color) {
            c.fillStyle = color;
            c.beginPath();
            c.moveTo(0, size * 0.35);
            c.bezierCurveTo(-size, -size * 0.45, -size * 0.5, -size * 1.15, 0, -size * 0.45);
            c.bezierCurveTo(size * 0.5, -size * 1.15, size, -size * 0.45, 0, size * 0.35);
            c.closePath();
            c.fill();
        }

        function drawMiniStar(c, size, color) {
            c.fillStyle = color;
            c.beginPath();
            c.moveTo(0, -size);
            c.quadraticCurveTo(0, 0, size, 0);
            c.quadraticCurveTo(0, 0, 0, size);
            c.quadraticCurveTo(0, 0, -size, 0);
            c.quadraticCurveTo(0, 0, 0, -size);
            c.closePath();
            c.fill();
        }

        function drawSpeciesBadge(c, name, accentColor) {
            c.font = 'bold 11px "Courier New", Courier, monospace';
            const textWidth = c.measureText(name).width;
            const padLeft = 18;
            const padRight = 10;
            const badgeW = textWidth + padLeft + padRight;
            const badgeH = 22;
            const badgeX = -badgeW / 2;
            const badgeY = 30;

            // Pill shadow
            c.save();
            c.shadowColor = 'rgba(0, 0, 0, 0.65)';
            c.shadowBlur = 8;
            c.shadowOffsetY = 2;

            // High-contrast dark translucent pill
            c.fillStyle = 'rgba(10, 14, 24, 0.9)';
            c.beginPath();
            c.roundRect(badgeX, badgeY, badgeW, badgeH, 11);
            c.fill();
            c.restore();

            // Luminous species accent border
            c.strokeStyle = accentColor;
            c.lineWidth = 1.5;
            c.beginPath();
            c.roundRect(badgeX, badgeY, badgeW, badgeH, 11);
            c.stroke();

            // Glowing accent dot
            c.fillStyle = accentColor;
            c.beginPath();
            c.arc(badgeX + 10, badgeY + badgeH / 2, 3.2, 0, Math.PI * 2);
            c.fill();

            // Crisp white species label
            c.fillStyle = '#ffffff';
            c.textAlign = 'left';
            c.textBaseline = 'middle';
            c.fillText(name, badgeX + padLeft, badgeY + badgeH / 2 + 0.5);
        }

        function renderPopupAnimals() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            animalCtx.clearRect(0, 0, vw, vh);

            if (popupAnimals.length === 0 && animalSparkles.length === 0 && animalRings.length === 0) {
                return;
            }

            // 1. Draw celebratory click rings
            for (const ring of animalRings) {
                animalCtx.save();
                animalCtx.globalAlpha = Math.max(0, ring.alpha);
                animalCtx.strokeStyle = ring.color;
                animalCtx.lineWidth = 2;
                animalCtx.beginPath();
                animalCtx.arc(ring.x, ring.y, ring.radius, 0, Math.PI * 2);
                animalCtx.stroke();
                animalCtx.restore();
            }

            // 2. Draw celebratory sparkles
            for (const sp of animalSparkles) {
                const progress = sp.age / sp.lifetime;
                const alpha = Math.max(0, 1 - progress * progress);
                const twinkleScale = 0.75 + 0.35 * Math.sin(sp.age * 22);

                animalCtx.save();
                animalCtx.translate(sp.x, sp.y);
                animalCtx.rotate(sp.angle);
                animalCtx.scale(twinkleScale, twinkleScale);
                animalCtx.globalAlpha = alpha;

                if (sp.shape === 'star') {
                    drawMiniStar(animalCtx, sp.size * 1.45, sp.color);
                } else if (sp.shape === 'heart') {
                    drawMiniHeart(animalCtx, sp.size * 1.25, sp.color);
                } else {
                    animalCtx.fillStyle = sp.color;
                    animalCtx.beginPath();
                    animalCtx.arc(0, 0, sp.size * 0.75, 0, Math.PI * 2);
                    animalCtx.fill();
                }
                animalCtx.restore();
            }

            // 3. Draw cute animated animals & species label badges
            for (const a of popupAnimals) {
                const species = ANIMAL_SPECIES[a.speciesIndex];
                const drawY = a.y + a.jumpOffset;

                // Playful energetic initial wiggle + gentle ongoing happy sway
                const initialWiggle = Math.sin(a.age * 17) * 0.25 * Math.exp(-a.age * 2.5);
                const idleSway = Math.sin(a.age * 5.8) * 0.065;
                const rotation = a.wiggleDir * (initialWiggle + idleSway);

                const timeRemaining = a.lifetime - a.age;
                const alpha = timeRemaining < 0.2 ? Math.max(0, timeRemaining / 0.2) : 1;

                animalCtx.save();
                animalCtx.translate(a.x, drawY);
                animalCtx.scale(a.scale, a.scale);
                animalCtx.globalAlpha = alpha;

                // Soft ambient glow behind the animal
                const aura = animalCtx.createRadialGradient(0, 0, 4, 0, 0, 34);
                aura.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
                aura.addColorStop(1, 'rgba(255, 255, 255, 0)');
                animalCtx.fillStyle = aura;
                animalCtx.beginPath();
                animalCtx.arc(0, 0, 34, 0, Math.PI * 2);
                animalCtx.fill();

                // Draw wiggling animal character
                animalCtx.save();
                animalCtx.rotate(rotation);
                species.draw(animalCtx, a.age);
                animalCtx.restore();

                // Draw crisp species label badge underneath
                drawSpeciesBadge(animalCtx, species.name, species.accent);

                animalCtx.restore();
            }
        }

        function updatePhysics(dt) {
            let countChanged = false;

            // Decay celebratory star pulse smoothly
            if (starExcitedTimer > 0) {
                starExcitedTimer = Math.max(0, starExcitedTimer - dt * 1.45);
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove ball if it travels too far off-screen
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin ||
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    countChanged = true;
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central star
                if (dist < centralNode.radius + b.radius) {
                    ripples.push({
                        radius: centralNode.radius,
                        alpha: 0.75,
                        color: ballColorMode === 'prism' ? b.color : '#ffffff'
                    });
                    starExcitedTimer = 1.0;
                    balls.splice(i, 1);
                    countChanged = true;
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }

            // Update central mass absorption ripples
            for (let r = ripples.length - 1; r >= 0; r--) {
                ripples[r].radius += 1.4;
                ripples[r].alpha -= 0.025;
                if (ripples[r].alpha <= 0) {
                    ripples.splice(r, 1);
                }
            }

            if (countChanged) {
                updateDefaultStatus();
            }
        }

        /* =========================================================
           CUSTOM BACKGROUND RENDERERS
           ========================================================= */

        function drawVoidBackground(w, h) {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, w, h);
        }

        function drawSpacetimeGrid(w, h, t) {
            ctx.fillStyle = '#030509';
            ctx.fillRect(0, 0, w, h);

            const wellGlow = ctx.createRadialGradient(
                centralNode.x, centralNode.y, 8,
                centralNode.x, centralNode.y, Math.min(w, h) * 0.45
            );
            wellGlow.addColorStop(0, 'rgba(90, 175, 255, 0.16)');
            wellGlow.addColorStop(0.5, 'rgba(40, 90, 170, 0.05)');
            wellGlow.addColorStop(1, 'rgba(3, 5, 9, 0)');
            ctx.fillStyle = wellGlow;
            ctx.fillRect(0, 0, w, h);

            const spacing = 36;
            const cols = Math.ceil(w / spacing) + 3;
            const rows = Math.ceil(h / spacing) + 3;
            const offsetX = (w % spacing) / 2 - spacing;
            const offsetY = (h % spacing) / 2 - spacing;

            const grid = [];
            for (let r = 0; r < rows; r++) {
                const rowPts = [];
                for (let c = 0; c < cols; c++) {
                    const gx = offsetX + c * spacing;
                    const gy = offsetY + r * spacing;

                    const dx = centralNode.x - gx;
                    const dy = centralNode.y - gy;
                    const dist = Math.hypot(dx, dy);

                    const pulse = 1 + 0.05 * Math.sin(t * 2.2 - dist * 0.025);
                    const pull = dist > 1 ? Math.min(dist * 0.72, (2400 / (dist + 42)) * pulse) : 0;

                    rowPts.push({
                        x: gx + (dx / (dist || 1)) * pull,
                        y: gy + (dy / (dist || 1)) * pull,
                        dist
                    });
                }
                grid.push(rowPts);
            }

            ctx.lineWidth = 1;

            for (let r = 0; r < rows; r++) {
                ctx.beginPath();
                for (let c = 0; c < cols; c++) {
                    const pt = grid[r][c];
                    if (c === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                }
                ctx.strokeStyle = 'rgba(130, 195, 255, 0.18)';
                ctx.stroke();
            }

            for (let c = 0; c < cols; c++) {
                ctx.beginPath();
                for (let r = 0; r < rows; r++) {
                    const pt = grid[r][c];
                    if (r === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                }
                ctx.strokeStyle = 'rgba(130, 195, 255, 0.18)';
                ctx.stroke();
            }

            ctx.save();
            ctx.setLineDash([4, 6]);
            for (let radius = 85; radius <= 340; radius += 85) {
                ctx.beginPath();
                ctx.arc(centralNode.x, centralNode.y, radius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(180, 225, 255, 0.16)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawDeepStarfield(w, h, t) {
            ctx.fillStyle = '#020308';
            ctx.fillRect(0, 0, w, h);

            const dust = ctx.createLinearGradient(0, h, w, 0);
            dust.addColorStop(0, 'rgba(15, 25, 55, 0.05)');
            dust.addColorStop(0.5, 'rgba(38, 56, 105, 0.16)');
            dust.addColorStop(1, 'rgba(15, 25, 55, 0.05)');
            ctx.fillStyle = dust;
            ctx.fillRect(0, 0, w, h);

            for (let i = 0; i < starfieldData.length; i++) {
                const s = starfieldData[i];
                const sx = s.nx * w;
                const sy = s.ny * h;
                const twinkle = Math.sin(t * s.twinkleSpeed + s.phase) * 0.25;
                const alpha = Math.max(0.1, Math.min(1, s.baseAlpha + twinkle));

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = s.color;
                ctx.beginPath();
                ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
                ctx.fill();

                if (s.hasGlint) {
                    ctx.strokeStyle = s.color;
                    ctx.lineWidth = 0.7;
                    ctx.beginPath();
                    ctx.moveTo(sx - 5, sy);
                    ctx.lineTo(sx + 5, sy);
                    ctx.moveTo(sx, sy - 5);
                    ctx.lineTo(sx, sy + 5);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        function drawCosmicNebula(w, h, t) {
            ctx.fillStyle = '#04030c';
            ctx.fillRect(0, 0, w, h);

            const maxDim = Math.max(w, h);
            const clouds = [
                {
                    x: w * 0.35 + Math.cos(t * 0.35) * (w * 0.14),
                    y: h * 0.42 + Math.sin(t * 0.28) * (h * 0.12),
                    r: maxDim * 0.52,
                    inner: 'rgba(24, 72, 175, 0.36)',
                    mid: 'rgba(16, 44, 118, 0.16)'
                },
                {
                    x: w * 0.66 + Math.sin(t * 0.31) * (w * 0.15),
                    y: h * 0.56 + Math.cos(t * 0.26) * (h * 0.14),
                    r: maxDim * 0.48,
                    inner: 'rgba(116, 38, 178, 0.32)',
                    mid: 'rgba(68, 22, 112, 0.14)'
                },
                {
                    x: w * 0.5 + Math.sin(t * 0.22 + 1.4) * (w * 0.18),
                    y: h * 0.35 + Math.cos(t * 0.33 + 0.8) * (h * 0.12),
                    r: maxDim * 0.42,
                    inner: 'rgba(12, 148, 178, 0.24)',
                    mid: 'rgba(10, 86, 115, 0.1)'
                }
            ];

            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            for (const c of clouds) {
                const grad = ctx.createRadialGradient(c.x, c.y, 10, c.x, c.y, c.r);
                grad.addColorStop(0, c.inner);
                grad.addColorStop(0.55, c.mid);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
            }
            ctx.restore();

            for (let i = 0; i < 65; i++) {
                const s = starfieldData[i];
                ctx.fillStyle = `rgba(255, 255, 255, ${0.25 + 0.2 * Math.sin(t * 1.8 + s.phase)})`;
                ctx.fillRect(s.nx * w, s.ny * h, 1.2, 1.2);
            }
        }

        function drawCyberGrid(w, h, t) {
            ctx.fillStyle = '#05020e';
            ctx.fillRect(0, 0, w, h);

            const cyberGlow = ctx.createRadialGradient(
                centralNode.x, centralNode.y, 20,
                centralNode.x, centralNode.y, Math.max(w, h) * 0.65
            );
            cyberGlow.addColorStop(0, 'rgba(0, 243, 255, 0.12)');
            cyberGlow.addColorStop(0.6, 'rgba(130, 0, 110, 0.08)');
            cyberGlow.addColorStop(1, 'rgba(5, 2, 14, 0.4)');
            ctx.fillStyle = cyberGlow;
            ctx.fillRect(0, 0, w, h);

            const subStep = 22;
            ctx.strokeStyle = 'rgba(255, 0, 170, 0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = (w / 2) % subStep; x < w; x += subStep) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
            }
            for (let y = (h / 2) % subStep; y < h; y += subStep) {
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
            }
            ctx.stroke();

            const majorStep = 66;
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.22)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = (w / 2) % majorStep; x < w; x += majorStep) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
            }
            for (let y = (h / 2) % majorStep; y < h; y += majorStep) {
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
            }
            ctx.stroke();

            const maxPulseR = Math.min(w, h) * 0.48;
            const pulseR = ((t * 55) % maxPulseR);
            const pulseAlpha = (1 - pulseR / maxPulseR) * 0.28;
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, pulseR, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(0, 243, 255, ${pulseAlpha.toFixed(3)})`;
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function drawPhysicsBlueprint(w, h) {
            ctx.fillStyle = '#071324';
            ctx.fillRect(0, 0, w, h);

            const minor = 20;
            ctx.strokeStyle = 'rgba(120, 190, 255, 0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = centralNode.x % minor; x < w; x += minor) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
            }
            for (let y = centralNode.y % minor; y < h; y += minor) {
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
            }
            ctx.stroke();

            const major = 100;
            ctx.strokeStyle = 'rgba(135, 205, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = centralNode.x % major; x < w; x += major) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
            }
            for (let y = centralNode.y % major; y < h; y += major) {
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
            }
            ctx.stroke();

            ctx.strokeStyle = 'rgba(170, 225, 255, 0.34)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, centralNode.y);
            ctx.lineTo(w, centralNode.y);
            ctx.moveTo(centralNode.x, 0);
            ctx.lineTo(centralNode.x, h);
            ctx.stroke();

            ctx.font = '10px "Courier New", monospace';
            ctx.fillStyle = 'rgba(175, 225, 255, 0.55)';
            const ringRadii = [80, 160, 240, 320];
            for (const r of ringRadii) {
                ctx.beginPath();
                ctx.arc(centralNode.x, centralNode.y, r, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(150, 215, 255, 0.25)';
                ctx.stroke();

                ctx.fillText(`R=${r}`, centralNode.x + r + 4, centralNode.y - 4);
            }

            const outerR = 240;
            ctx.strokeStyle = 'rgba(175, 225, 255, 0.35)';
            for (let deg = 0; deg < 360; deg += 15) {
                const rad = (deg * Math.PI) / 180;
                const innerTick = deg % 45 === 0 ? outerR - 8 : outerR - 4;
                ctx.beginPath();
                ctx.moveTo(centralNode.x + Math.cos(rad) * innerTick, centralNode.y + Math.sin(rad) * innerTick);
                ctx.lineTo(centralNode.x + Math.cos(rad) * outerR, centralNode.y + Math.sin(rad) * outerR);
                ctx.stroke();
            }
        }

        function drawCustomGradient(w, h) {
            if (customCoreColor.toLowerCase() === customEdgeColor.toLowerCase()) {
                ctx.fillStyle = customCoreColor;
                ctx.fillRect(0, 0, w, h);
                return;
            }

            const outerRadius = Math.hypot(w, h) * 0.55;
            const grad = ctx.createRadialGradient(
                centralNode.x, centralNode.y, 12,
                centralNode.x, centralNode.y, outerRadius
            );
            grad.addColorStop(0, customCoreColor);
            grad.addColorStop(1, customEdgeColor);

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
        }

        function drawCustomImage(w, h) {
            if (!customBgImage) {
                drawVoidBackground(w, h);
                return;
            }

            const imgW = customBgImage.naturalWidth || customBgImage.width;
            const imgH = customBgImage.naturalHeight || customBgImage.height;
            const scale = Math.max(w / imgW, h / imgH);
            const drawW = imgW * scale;
            const drawH = imgH * scale;
            const drawX = (w - drawW) / 2;
            const drawY = (h - drawH) / 2;

            ctx.drawImage(customBgImage, drawX, drawY, drawW, drawH);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.36)';
            ctx.fillRect(0, 0, w, h);

            const vignette = ctx.createRadialGradient(
                centralNode.x, centralNode.y, Math.min(w, h) * 0.2,
                centralNode.x, centralNode.y, Math.hypot(w, h) * 0.55
            );
            vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vignette.addColorStop(1, 'rgba(0, 0, 0, 0.42)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, w, h);
        }

        function drawBackground() {
            const w = canvas.width;
            const h = canvas.height;

            switch (bgMode) {
                case 'spacetime':
                    drawSpacetimeGrid(w, h, animTime);
                    break;
                case 'starfield':
                    drawDeepStarfield(w, h, animTime);
                    break;
                case 'nebula':
                    drawCosmicNebula(w, h, animTime);
                    break;
                case 'cyber':
                    drawCyberGrid(w, h, animTime);
                    break;
                case 'blueprint':
                    drawPhysicsBlueprint(w, h);
                    break;
                case 'custom-gradient':
                    drawCustomGradient(w, h);
                    break;
                case 'custom-image':
                    drawCustomImage(w, h);
                    break;
                case 'void':
                default:
                    drawVoidBackground(w, h);
                    break;
            }
        }

        /* =========================================================
           DANCING CENTRAL STAR RENDERER
           ========================================================= */

        function drawSparkleGlint(cx, cy, size, alpha, color) {
            if (size <= 0.2 || alpha <= 0.02) return;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.quadraticCurveTo(0, 0, size, 0);
            ctx.quadraticCurveTo(0, 0, 0, size);
            ctx.quadraticCurveTo(0, 0, -size, 0);
            ctx.quadraticCurveTo(0, 0, 0, -size);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawDancingStar(cx, cy, baseRadius, t) {
            // Steady rhythmic dance beat
            const beatPhase = t * 5.2;
            const bounce = Math.pow(Math.abs(Math.sin(beatPhase)), 0.85);

            // Celebratory boost when an orbiting ball is absorbed
            const exciteWave = starExcitedTimer > 0
                ? Math.sin(starExcitedTimer * Math.PI)
                : 0;
            const exciteScale = 1 + 0.22 * exciteWave;

            // Vertical hop + squash-and-stretch synced to the beat
            const bounceOffsetY = -bounce * 5.2 - exciteWave * 5.5;
            const stretch = (bounce - 0.45) * 0.22;
            const scaleX = (1 - stretch) * exciteScale;
            const scaleY = (1 + stretch) * exciteScale;

            // Alternating left-right dance sway
            const swayAngle = Math.sin(beatPhase * 0.5) * 0.26 +
                (starExcitedTimer > 0 ? Math.sin(t * 26) * 0.14 * starExcitedTimer : 0);

            const outerR = baseRadius * 1.48;
            const innerR = outerR * 0.48;

            // 1. Soft Ambient Golden Halo around the Star
            const haloRadius = outerR * (2.15 + 0.2 * bounce + 0.45 * exciteWave);
            const haloGrad = ctx.createRadialGradient(
                cx, cy + bounceOffsetY * 0.6, outerR * 0.25,
                cx, cy + bounceOffsetY * 0.6, haloRadius
            );
            haloGrad.addColorStop(0, `rgba(255, 224, 102, ${(0.34 + 0.22 * exciteWave).toFixed(3)})`);
            haloGrad.addColorStop(0.55, `rgba(255, 175, 40, ${(0.12 + 0.1 * exciteWave).toFixed(3)})`);
            haloGrad.addColorStop(1, 'rgba(255, 159, 28, 0)');

            ctx.save();
            ctx.fillStyle = haloGrad;
            ctx.beginPath();
            ctx.arc(cx, cy + bounceOffsetY * 0.6, haloRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 2. Orbiting Sparkle Glints
            const sparkleCount = 5;
            for (let i = 0; i < sparkleCount; i++) {
                const orbitAngle = t * 1.45 + (i * Math.PI * 2) / sparkleCount;
                const orbitDist = outerR * 1.45 + Math.sin(t * 3.2 + i * 1.9) * 3.5 + exciteWave * 7;
                const sx = cx + Math.cos(orbitAngle) * orbitDist;
                const sy = cy + bounceOffsetY * 0.5 + Math.sin(orbitAngle) * orbitDist * 0.85;
                const twinkle = 0.5 + 0.5 * Math.sin(t * 5.5 + i * 2.3);
                const sparkleSize = (2.1 + twinkle * 2.2) * (1 + 0.35 * exciteWave);
                const sparkleColor = i % 2 === 0 ? '#fffbe0' : '#ffd447';
                drawSparkleGlint(sx, sy, sparkleSize, 0.35 + twinkle * 0.6, sparkleColor);
            }

            // 3. Transform into Dancing Star Local Space
            ctx.save();
            ctx.translate(cx, cy + bounceOffsetY);
            ctx.rotate(swayAngle);
            ctx.scale(scaleX, scaleY);

            // Build 5-pointed star path with gently wiggling star tips
            const points = 5;
            const totalVertices = points * 2;
            ctx.beginPath();
            for (let i = 0; i < totalVertices; i++) {
                const isTip = i % 2 === 0;
                const tipIndex = Math.floor(i / 2);
                const baseAngle = -Math.PI / 2 + (i * Math.PI) / points;

                const angleWiggle = isTip
                    ? Math.sin(t * 6.8 + tipIndex * 1.45) * 0.085
                    : Math.sin(t * 6.8 + tipIndex * 1.45 + 0.7) * 0.03;

                const radiusWiggle = isTip
                    ? 1 + Math.sin(t * 7.4 + tipIndex * 2.1) * 0.075
                    : 1 + Math.cos(t * 6.4 + i * 1.2) * 0.04;

                const r = (isTip ? outerR : innerR) * radiusWiggle;
                const theta = baseAngle + angleWiggle;
                const vx = Math.cos(theta) * r;
                const vy = Math.sin(theta) * r;

                if (i === 0) ctx.moveTo(vx, vy);
                else ctx.lineTo(vx, vy);
            }
            ctx.closePath();

            // Warm golden radial gradient & soft golden glow
            const starGrad = ctx.createRadialGradient(
                0, -outerR * 0.14, outerR * 0.06,
                0, 0, outerR * 1.12
            );
            starGrad.addColorStop(0, '#fffbe0');
            starGrad.addColorStop(0.55, '#ffd447');
            starGrad.addColorStop(1, '#ff9f1c');

            ctx.shadowColor = starExcitedTimer > 0
                ? 'rgba(255, 232, 120, 0.92)'
                : 'rgba(255, 195, 55, 0.68)';
            ctx.shadowBlur = starExcitedTimer > 0 ? 20 : 13;

            ctx.fillStyle = starGrad;
            ctx.fill();

            // Softly rounded warm rim so tips look friendly and expressive
            ctx.shadowBlur = 0;
            ctx.lineJoin = 'round';
            ctx.lineWidth = 2.2;
            ctx.strokeStyle = '#ff9f1c';
            ctx.stroke();

            // 4. Cute Expressive Smiling Face with Occasional Blink
            const faceColor = '#3b1d06';
            const blinkCycle = t % 3.5;
            const isBlinking = blinkCycle > 3.26 && blinkCycle < 3.42;
            const isJoyfulEyes = starExcitedTimer > 0.25;

            // Rosy cheeks
            ctx.fillStyle = 'rgba(255, 105, 97, 0.52)';
            ctx.beginPath();
            ctx.ellipse(-6.2, 1.8, 2.2, 1.3, 0, 0, Math.PI * 2);
            ctx.ellipse(6.2, 1.8, 2.2, 1.3, 0, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.strokeStyle = faceColor;
            ctx.fillStyle = faceColor;
            ctx.lineWidth = 1.55;
            ctx.lineCap = 'round';

            if (isJoyfulEyes) {
                // Happy celebratory ^ ^ arcs
                ctx.beginPath();
                ctx.arc(-3.8, -0.6, 2.1, Math.PI * 1.12, Math.PI * 1.88);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(3.8, -0.6, 2.1, Math.PI * 1.12, Math.PI * 1.88);
                ctx.stroke();
            } else if (isBlinking) {
                // Cute closed blinking lids
                ctx.beginPath();
                ctx.arc(-3.8, -1.6, 2.0, 0.12 * Math.PI, 0.88 * Math.PI);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(3.8, -1.6, 2.0, 0.12 * Math.PI, 0.88 * Math.PI);
                ctx.stroke();
            } else {
                // Open expressive eyes with tiny white catchlights
                ctx.beginPath();
                ctx.ellipse(-3.8, -1.2, 1.45, 1.85, 0, 0, Math.PI * 2);
                ctx.ellipse(3.8, -1.2, 1.45, 1.85, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-4.25, -1.85, 0.62, 0, Math.PI * 2);
                ctx.arc(3.35, -1.85, 0.62, 0, Math.PI * 2);
                ctx.fill();
            }

            // Smiling Mouth
            ctx.strokeStyle = faceColor;
            ctx.lineWidth = 1.5;
            if (starExcitedTimer > 0.15) {
                // Open cheering grin on absorption boost
                ctx.beginPath();
                ctx.arc(0, 1.5, 2.9, 0.08 * Math.PI, 0.92 * Math.PI);
                ctx.closePath();
                ctx.fillStyle = '#d9483b';
                ctx.fill();
                ctx.stroke();
            } else {
                // Sweet curved smile
                ctx.beginPath();
                ctx.arc(0, 1.3, 2.8, 0.15 * Math.PI, 0.85 * Math.PI);
                ctx.stroke();
            }

            ctx.restore();
        }

        function draw() {
            drawBackground();

            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 1. Draw Absorption Ripples around Central Star
            for (const rip of ripples) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, rip.alpha);
                ctx.beginPath();
                ctx.arc(centralNode.x, centralNode.y, rip.radius, 0, Math.PI * 2);
                ctx.strokeStyle = rip.color;
                ctx.lineWidth = 1.4;
                ctx.stroke();
                ctx.restore();
            }

            // 2. Draw Dancing Central Golden Star
            drawDancingStar(centralNode.x, centralNode.y, centralNode.radius, animTime);

            // 3. Draw All Active Balls & Tapered Ribbon Trails
            const trailSegments = 6;
            for (const b of balls) {
                const activeColor = ballColorMode === 'prism' ? b.color : '#ffffff';
                const len = b.trail.length;

                if (len > 1) {
                    const chunkSize = Math.max(1, Math.floor((len - 1) / trailSegments));
                    for (let s = 0; s < trailSegments; s++) {
                        const startIdx = s * chunkSize;
                        if (startIdx >= len - 1) break;
                        const endIdx = s === trailSegments - 1 ? len - 1 : Math.min(len - 1, (s + 1) * chunkSize);
                        const progress = (s + 1) / trailSegments;

                        ctx.beginPath();
                        ctx.moveTo(b.trail[startIdx].x, b.trail[startIdx].y);
                        for (let t = startIdx + 1; t <= endIdx; t++) {
                            ctx.lineTo(b.trail[t].x, b.trail[t].y);
                        }
                        ctx.globalAlpha = 0.08 + 0.84 * (progress * progress);
                        ctx.strokeStyle = activeColor;
                        ctx.lineWidth = 0.75 + 0.85 * progress;
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                }

                // Draw ball object with luminous aura
                ctx.shadowColor = activeColor;
                ctx.shadowBlur = ballColorMode === 'prism' ? 8 : 4;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = activeColor;
                ctx.fill();

                // Crisp bright core on colored balls
                if (ballColorMode === 'prism' && activeColor !== '#ffffff') {
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius * 0.48, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                }

                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        function animate(timestamp) {
            const now = (timestamp || 0) * 0.001;
            const dt = lastFrameTime ? Math.min(0.05, now - lastFrameTime) : 0.016;
            lastFrameTime = now;
            animTime = now;

            updatePhysics(dt);
            updatePopupAnimals(dt);
            draw();
            renderPopupAnimals();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            requestAnimationFrame(animate);
        };
    </script>
</body>
