<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Baseline</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        #eaten-counter {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #4ade80;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <div class="header-controls">
            <span id="eaten-counter">EATEN: 0</span>
            <button class="btn-reset" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas to launch a ball. Watch out for the alligator!
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const eatenCounterEl = document.getElementById('eaten-counter');

        // SIMULATION CONSTANTS (Preserved from baseline)
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;         // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center

        // ALLIGATOR CONSTANTS
        const GATOR_PATROL_SPEED = 2.2;
        const GATOR_CHASE_SPEED = 4.4;
        const GATOR_LUNGE_SPEED = 5.9;
        const GATOR_LUNGE_DIST = 90;
        const GATOR_JAW_OPEN_DIST = 180;
        const GATOR_MOUTH_OFFSET = 28;
        const GATOR_BITE_RADIUS = 19;
        const CENTER_AVOID_RADIUS = 62;

        // STATE VARIABLES
        let balls = [];
        let eatenCount = 0;
        let chompParticles = [];
        let chompTexts = [];
        let chompRings = [];

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 12
        };

        // Top-Down Vector Alligator State
        const alligator = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            angle: 0,
            speed: GATOR_PATROL_SPEED,
            swimPhase: 0,
            patrolAngle: -Math.PI * 0.75,
            jawOpen: 0,          // 0 = closed, 1 = wide open
            snapTimer: 0,        // Countdown frames after a bite snap
            isLunging: false,
            eyeLookAngle: 0
        };

        /**
         * Places the alligator at its initial outer patrol position and resets animation state.
         */
        function initAlligator() {
            alligator.patrolAngle = -Math.PI * 0.75;
            const rx = Math.max(80, canvas.width * 0.35);
            const ry = Math.max(60, canvas.height * 0.33);

            alligator.x = centralNode.x + Math.cos(alligator.patrolAngle) * rx;
            alligator.y = centralNode.y + Math.sin(alligator.patrolAngle) * ry;

            // Tangent angle along counter-clockwise/clockwise elliptical patrol
            const tx = -Math.sin(alligator.patrolAngle) * rx;
            const ty = Math.cos(alligator.patrolAngle) * ry;
            alligator.angle = Math.atan2(ty, tx);
            alligator.speed = GATOR_PATROL_SPEED;
            alligator.vx = Math.cos(alligator.angle) * alligator.speed;
            alligator.vy = Math.sin(alligator.angle) * alligator.speed;
            alligator.swimPhase = 0;
            alligator.jawOpen = 0;
            alligator.snapTimer = 0;
            alligator.isLunging = false;
            alligator.eyeLookAngle = 0;
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            const hadDimensions = canvas.width > 0 && canvas.height > 0;

            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            if (!hadDimensions) {
                initAlligator();
            } else {
                // Keep alligator comfortably within resized bounds
                const pad = 40;
                alligator.x = Math.max(pad, Math.min(canvas.width - pad, alligator.x));
                alligator.y = Math.max(pad, Math.min(canvas.height - pad, alligator.y));
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Canvas Click Handler: Directly launch ball at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchBall(clickX, clickY);
        });

        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Overwrite existing array to strictly maintain a single ball on screen
            balls = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4,
                trail: [] // Stores history of past {x, y} coordinates
            }];
        }

        function updateEatenUI() {
            eatenCounterEl.textContent = `EATEN: ${eatenCount}`;
        }

        function resetSimulation() {
            balls = [];
            eatenCount = 0;
            chompParticles = [];
            chompTexts = [];
            chompRings = [];
            updateEatenUI();
            initAlligator();
        }

        /**
         * Normalizes an angle difference to the range [-PI, PI].
         */
        function normalizeAngle(angle) {
            while (angle > Math.PI) angle -= Math.PI * 2;
            while (angle < -Math.PI) angle += Math.PI * 2;
            return angle;
        }

        /**
         * Spawns arcade bite particles, a shockwave ring, and floating "CHOMP!" text.
         */
        function triggerChomp(x, y) {
            eatenCount++;
            updateEatenUI();

            // Snap jaws shut
            alligator.jawOpen = 0;
            alligator.snapTimer = 18;
            alligator.isLunging = false;

            // Burst of crisp white and emerald green geometric particles
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.35;
                const speed = 1.8 + Math.random() * 4.2;
                chompParticles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 2 + Math.random() * 3,
                    color: i % 2 === 0 ? '#ffffff' : '#4ade80',
                    alpha: 1.0,
                    decay: 0.025 + Math.random() * 0.02,
                    isTriangle: i % 3 === 0,
                    rot: Math.random() * Math.PI * 2
                });
            }

            // Crisp expanding bite ring
            chompRings.push({
                x: x,
                y: y,
                radius: 6,
                maxRadius: 38,
                alpha: 0.95
            });

            // Floating "CHOMP!" text
            chompTexts.push({
                x: x,
                y: y - 14,
                vy: -1.1,
                alpha: 1.0
            });
        }

        /**
         * Updates alligator patrolling, predictive ball hunting, obstacle avoidance,
         * jaw animation, and eating collision detection.
         */
        function updateAlligator() {
            const hasBall = balls.length > 0;
            let desiredAngle = alligator.angle;
            let targetSpeed = GATOR_PATROL_SPEED;
            let turnRate = 0.065;
            let targetJawOpen = 0;

            // Current mouth world position
            const mouthX = alligator.x + Math.cos(alligator.angle) * GATOR_MOUTH_OFFSET;
            const mouthY = alligator.y + Math.sin(alligator.angle) * GATOR_MOUTH_OFFSET;

            if (hasBall) {
                const ball = balls[0];
                const dxMouth = ball.x - mouthX;
                const dyMouth = ball.y - mouthY;
                const distToMouth = Math.hypot(dxMouth, dyMouth);

                // Check if alligator's open mouth reaches the ball
                if (distToMouth <= GATOR_BITE_RADIUS + ball.radius) {
                    balls.splice(0, 1);
                    triggerChomp(ball.x, ball.y);
                    return;
                }

                // Predictive intercept point blending current position & velocity
                const leadFrames = Math.min(distToMouth / GATOR_CHASE_SPEED, 26);
                const blendFactor = Math.min(distToMouth / 130, 1.0); // Aim directly at ball when very close
                const interceptX = ball.x + ball.vx * leadFrames * 0.72 * blendFactor;
                const interceptY = ball.y + ball.vy * leadFrames * 0.72 * blendFactor;

                desiredAngle = Math.atan2(interceptY - alligator.y, interceptX - alligator.x);

                // Lunge boost when within 90px
                if (distToMouth <= GATOR_LUNGE_DIST) {
                    alligator.isLunging = true;
                    targetSpeed = GATOR_LUNGE_SPEED;
                    turnRate = 0.115;
                } else {
                    alligator.isLunging = false;
                    targetSpeed = GATOR_CHASE_SPEED;
                    turnRate = 0.09;
                }

                // Open jaws progressively wider within 180px
                if (distToMouth < GATOR_JAW_OPEN_DIST && alligator.snapTimer <= 0) {
                    const proximity = 1 - (distToMouth / GATOR_JAW_OPEN_DIST);
                    targetJawOpen = Math.min(1, Math.pow(proximity, 0.75) * 1.15);
                }

                // Subtle eye tracking toward the ball in local head space
                const angleToBall = Math.atan2(ball.y - alligator.y, ball.x - alligator.x);
                const relEye = normalizeAngle(angleToBall - alligator.angle);
                alligator.eyeLookAngle = Math.max(-0.45, Math.min(0.45, relEye));
            } else {
                // Patrol smoothly along an outer ellipse around the canvas
                alligator.isLunging = false;
                alligator.eyeLookAngle *= 0.9;

                const rx = Math.max(90, canvas.width * 0.36);
                const ry = Math.max(70, canvas.height * 0.34);

                // Advance patrol parametric angle based on current position + lookahead
                const currentParam = Math.atan2(
                    (alligator.y - centralNode.y) / ry,
                    (alligator.x - centralNode.x) / rx
                );
                const lookAheadParam = currentParam + 0.28;
                const patrolTargetX = centralNode.x + Math.cos(lookAheadParam) * rx;
                const patrolTargetY = centralNode.y + Math.sin(lookAheadParam) * ry;

                desiredAngle = Math.atan2(patrolTargetY - alligator.y, patrolTargetX - alligator.x);
                targetSpeed = GATOR_PATROL_SPEED;
                turnRate = 0.055;

                // Subtle idle breathing jaw motion when not snapping
                if (alligator.snapTimer <= 0) {
                    targetJawOpen = 0.08 + 0.07 * Math.sin(alligator.swimPhase * 0.35);
                }
            }

            // Smoothly steer around the central gravity node so the alligator never gets stuck on it
            const lookAheadDist = 26;
            const probeX = alligator.x + Math.cos(alligator.angle) * lookAheadDist;
            const probeY = alligator.y + Math.sin(alligator.angle) * lookAheadDist;
            const dxCenter = probeX - centralNode.x;
            const dyCenter = probeY - centralNode.y;
            const distCenter = Math.hypot(dxCenter, dyCenter);

            if (distCenter < CENTER_AVOID_RADIUS) {
                const awayAngle = Math.atan2(dyCenter, dxCenter);
                // Choose tangential direction (left or right of center) closest to current heading
                const tangent1 = awayAngle + Math.PI * 0.5;
                const tangent2 = awayAngle - Math.PI * 0.5;
                const diff1 = Math.abs(normalizeAngle(tangent1 - alligator.angle));
                const diff2 = Math.abs(normalizeAngle(tangent2 - alligator.angle));
                const bestTangent = diff1 < diff2 ? tangent1 : tangent2;

                // Blend outward push with tangential glide
                const avoidWeight = Math.min(1, (CENTER_AVOID_RADIUS - distCenter) / 28);
                const steerAroundAngle = Math.atan2(
                    Math.sin(bestTangent) * 0.8 + Math.sin(awayAngle) * 0.45,
                    Math.cos(bestTangent) * 0.8 + Math.cos(awayAngle) * 0.45
                );
                const blendDiff = normalizeAngle(steerAroundAngle - desiredAngle);
                desiredAngle = normalizeAngle(desiredAngle + blendDiff * avoidWeight);
                turnRate = Math.max(turnRate, 0.13);
            }

            // Soft boundary steering to keep alligator inside the arena
            const wallMargin = 42;
            let wallSteerX = 0;
            let wallSteerY = 0;
            if (alligator.x < wallMargin) wallSteerX += (wallMargin - alligator.x) / wallMargin;
            if (alligator.x > canvas.width - wallMargin) wallSteerX -= (alligator.x - (canvas.width - wallMargin)) / wallMargin;
            if (alligator.y < wallMargin) wallSteerY += (wallMargin - alligator.y) / wallMargin;
            if (alligator.y > canvas.height - wallMargin) wallSteerY -= (alligator.y - (canvas.height - wallMargin)) / wallMargin;

            if (wallSteerX !== 0 || wallSteerY !== 0) {
                const wallAngle = Math.atan2(wallSteerY, wallSteerX);
                const wallDiff = normalizeAngle(wallAngle - desiredAngle);
                desiredAngle = normalizeAngle(desiredAngle + wallDiff * 0.65);
                turnRate = Math.max(turnRate, 0.12);
            }

            // Smooth angular turn toward desiredAngle
            const angleDiff = normalizeAngle(desiredAngle - alligator.angle);
            if (Math.abs(angleDiff) <= turnRate) {
                alligator.angle = desiredAngle;
            } else {
                alligator.angle = normalizeAngle(alligator.angle + Math.sign(angleDiff) * turnRate);
            }

            // Smooth speed acceleration/deceleration
            alligator.speed += (targetSpeed - alligator.speed) * 0.14;
            alligator.vx = Math.cos(alligator.angle) * alligator.speed;
            alligator.vy = Math.sin(alligator.angle) * alligator.speed;

            alligator.x += alligator.vx;
            alligator.y += alligator.vy;

            // Advance swim cycle proportional to movement speed
            alligator.swimPhase += 0.08 + alligator.speed * 0.045;

            // Update jaw opening / snap animation
            if (alligator.snapTimer > 0) {
                alligator.snapTimer--;
                alligator.jawOpen += (0 - alligator.jawOpen) * 0.55;
            } else {
                alligator.jawOpen += (targetJawOpen - alligator.jawOpen) * 0.22;
            }
        }

        /**
         * Updates chomp particles, shockwave rings, and floating text effects.
         */
        function updateEffects() {
            for (let i = chompParticles.length - 1; i >= 0; i--) {
                const p = chompParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.93;
                p.vy *= 0.93;
                p.rot += 0.12;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    chompParticles.splice(i, 1);
                }
            }

            for (let i = chompRings.length - 1; i >= 0; i--) {
                const r = chompRings[i];
                r.radius += (r.maxRadius - r.radius) * 0.2;
                r.alpha -= 0.055;
                if (r.alpha <= 0) {
                    chompRings.splice(i, 1);
                }
            }

            for (let i = chompTexts.length - 1; i >= 0; i--) {
                const t = chompTexts[i];
                t.y += t.vy;
                t.alpha -= 0.022;
                if (t.alpha <= 0) {
                    chompTexts.splice(i, 1);
                }
            }
        }

        function updatePhysics() {
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove ball if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    balls.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }

            updateAlligator();
            updateEffects();
        }

        /**
         * Renders the top-down articulated vector alligator with undulating tail,
         * alternating paddling legs, dorsal scutes, and hinged jaws with white teeth.
         */
        function drawAlligator() {
            ctx.save();
            ctx.translate(alligator.x, alligator.y);
            ctx.rotate(alligator.angle);

            const bodyFill = '#0a2e16';
            const accentStroke = '#4ade80';
            const darkCavity = '#041209';
            const swayAmp = alligator.isLunging ? 0.26 : 0.19;

            // 1. PADDLING LEGS (Drawn beneath torso)
            const legConfigs = [
                { x: 6,  side: -1, phaseOffset: 0 },            // Front Left
                { x: 6,  side: 1,  phaseOffset: Math.PI },      // Front Right
                { x: -13, side: -1, phaseOffset: Math.PI },     // Back Left
                { x: -13, side: 1,  phaseOffset: 0 }            // Back Right
            ];

            for (const leg of legConfigs) {
                const swing = Math.sin(alligator.swimPhase + leg.phaseOffset) * 0.45;
                ctx.save();
                ctx.translate(leg.x, leg.side * 8);
                ctx.rotate(leg.side * (0.45 + swing));

                // Upper & lower limb polygon
                ctx.beginPath();
                ctx.moveTo(0, -2.5 * leg.side);
                ctx.lineTo(6, 7 * leg.side);
                ctx.lineTo(1, 13 * leg.side);
                ctx.lineTo(-4, 12 * leg.side);
                ctx.lineTo(0, 6 * leg.side);
                ctx.lineTo(-3, 0);
                ctx.closePath();
                ctx.fillStyle = bodyFill;
                ctx.fill();
                ctx.strokeStyle = accentStroke;
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // 3 Webbed Claws
                ctx.beginPath();
                ctx.moveTo(1, 13 * leg.side);
                ctx.lineTo(3, 16 * leg.side);
                ctx.moveTo(-1.5, 12.5 * leg.side);
                ctx.lineTo(-1.5, 16.5 * leg.side);
                ctx.moveTo(-4, 12 * leg.side);
                ctx.lineTo(-6, 15 * leg.side);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.restore();
            }

            // 2. ARTICULATED UNDULATING TAIL (5 tapered segments with dorsal scutes)
            const segLengths = [12, 11, 10, 9, 9];
            const segStartWidths = [7.5, 6.2, 4.9, 3.6, 2.3];
            const segEndWidths = [6.2, 4.9, 3.6, 2.3, 0.4];

            ctx.save();
            ctx.translate(-20, 0); // Tail attachment at rear of torso

            for (let i = 0; i < segLengths.length; i++) {
                const len = segLengths[i];
                const w1 = segStartWidths[i];
                const w2 = segEndWidths[i];
                const segSway = Math.sin(alligator.swimPhase - (i + 1) * 0.65) * swayAmp * (1 + i * 0.14);

                ctx.rotate(segSway);

                // Tapered tail segment body
                ctx.beginPath();
                ctx.moveTo(0, -w1);
                ctx.lineTo(-len, -w2);
                ctx.lineTo(-len, w2);
                ctx.lineTo(0, w1);
                ctx.closePath();
                ctx.fillStyle = bodyFill;
                ctx.fill();
                ctx.strokeStyle = accentStroke;
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // Dorsal scute ridge along segment center
                ctx.beginPath();
                ctx.moveTo(-2, 0);
                ctx.lineTo(-len * 0.55, -1.6);
                ctx.lineTo(-len + 1.5, 0);
                ctx.lineTo(-len * 0.55, 1.6);
                ctx.closePath();
                ctx.fillStyle = accentStroke;
                ctx.fill();

                ctx.translate(-len, 0);
            }
            ctx.restore();

            // 3. ARMORED TORSO WITH DORSAL RIDGES
            ctx.beginPath();
            ctx.moveTo(14, -7.5);
            ctx.lineTo(4, -10.5);
            ctx.lineTo(-11, -10);
            ctx.lineTo(-20, -7.5);
            ctx.lineTo(-20, 7.5);
            ctx.lineTo(-11, 10);
            ctx.lineTo(4, 10.5);
            ctx.lineTo(14, 7.5);
            ctx.closePath();
            ctx.fillStyle = bodyFill;
            ctx.fill();
            ctx.strokeStyle = accentStroke;
            ctx.lineWidth = 1.4;
            ctx.stroke();

            // Armored dorsal scute plates along torso spine
            const scutePositions = [7, 0, -7, -14];
            for (const sx of scutePositions) {
                ctx.beginPath();
                ctx.moveTo(sx + 2.5, 0);
                ctx.lineTo(sx, -2.5);
                ctx.lineTo(sx - 2.5, 0);
                ctx.lineTo(sx, 2.5);
                ctx.closePath();
                ctx.fillStyle = accentStroke;
                ctx.fill();

                // Side armor ribs
                ctx.beginPath();
                ctx.moveTo(sx, -5);
                ctx.lineTo(sx - 1.5, -7.5);
                ctx.moveTo(sx, 5);
                ctx.lineTo(sx - 1.5, 7.5);
                ctx.strokeStyle = accentStroke;
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // 4. ARTICULATED HEAD & JAWS
            const jaw = alligator.jawOpen;
            const lowerSnoutLen = 36 + jaw * 6;
            const upperSnoutLen = 35 - jaw * 2.5;
            const jawFlare = jaw * 4.2;

            // 4a. Lower Jaw & Open Maw Cavity (Visible when jaws open)
            if (jaw > 0.03) {
                ctx.beginPath();
                ctx.moveTo(13, -7.5 - jawFlare * 0.4);
                ctx.lineTo(25, -6.5 - jawFlare);
                ctx.lineTo(lowerSnoutLen, -3.5 - jawFlare * 0.5);
                ctx.lineTo(lowerSnoutLen + 2, 0);
                ctx.lineTo(lowerSnoutLen, 3.5 + jawFlare * 0.5);
                ctx.lineTo(25, 6.5 + jawFlare);
                ctx.lineTo(13, 7.5 + jawFlare * 0.4);
                ctx.closePath();
                ctx.fillStyle = darkCavity;
                ctx.fill();
                ctx.strokeStyle = accentStroke;
                ctx.lineWidth = 1.4;
                ctx.stroke();

                // Inner throat / tongue geometric detail
                ctx.beginPath();
                ctx.moveTo(15, -3);
                ctx.lineTo(26, -2.2 - jawFlare * 0.35);
                ctx.lineTo(30, 0);
                ctx.lineTo(26, 2.2 + jawFlare * 0.35);
                ctx.lineTo(15, 3);
                ctx.closePath();
                ctx.fillStyle = '#143d22';
                ctx.fill();

                // Sharp White Lower Jaw Teeth (Pointing inward into the open mouth)
                const toothCount = 5;
                ctx.fillStyle = '#ffffff';
                for (let t = 0; t < toothCount; t++) {
                    const frac = (t + 0.5) / toothCount;
                    const tx = 18 + frac * (lowerSnoutLen - 20);
                    const edgeY = (6.3 + jawFlare) * (1 - frac * 0.48);
                    const toothLen = 2.6 + jaw * 1.4;

                    // Left side lower tooth
                    ctx.beginPath();
                    ctx.moveTo(tx - 1.3, -edgeY);
                    ctx.lineTo(tx, -edgeY + toothLen);
                    ctx.lineTo(tx + 1.3, -edgeY);
                    ctx.closePath();
                    ctx.fill();

                    // Right side lower tooth
                    ctx.beginPath();
                    ctx.moveTo(tx - 1.3, edgeY);
                    ctx.lineTo(tx, edgeY - toothLen);
                    ctx.lineTo(tx + 1.3, edgeY);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            // 4b. Upper Jaw / Cranium
            ctx.beginPath();
            ctx.moveTo(12, -8);
            ctx.lineTo(21, -7.2);
            ctx.lineTo(upperSnoutLen, -3.4);
            ctx.lineTo(upperSnoutLen + 2, 0);
            ctx.lineTo(upperSnoutLen, 3.4);
            ctx.lineTo(21, 7.2);
            ctx.lineTo(12, 8);
            ctx.closePath();
            ctx.fillStyle = bodyFill;
            ctx.fill();
            ctx.strokeStyle = accentStroke;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Upper Jaw Teeth (Peeking out along snout edges, flaring outward when open)
            const upperTeeth = 4;
            ctx.fillStyle = '#ffffff';
            for (let t = 0; t < upperTeeth; t++) {
                const frac = (t + 0.4) / upperTeeth;
                const tx = 20 + frac * (upperSnoutLen - 22);
                const edgeY = 7.0 * (1 - frac * 0.48);
                const toothOut = 1.6 + jaw * 1.6;

                // Left upper tooth
                ctx.beginPath();
                ctx.moveTo(tx - 1.1, -edgeY);
                ctx.lineTo(tx, -edgeY - toothOut);
                ctx.lineTo(tx + 1.1, -edgeY);
                ctx.closePath();
                ctx.fill();

                // Right upper tooth
                ctx.beginPath();
                ctx.moveTo(tx - 1.1, edgeY);
                ctx.lineTo(tx, edgeY + toothOut);
                ctx.lineTo(tx + 1.1, edgeY);
                ctx.closePath();
                ctx.fill();
            }

            // Snout center ridge & nostrils
            ctx.beginPath();
            ctx.moveTo(19, 0);
            ctx.lineTo(upperSnoutLen - 3, 0);
            ctx.strokeStyle = accentStroke;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = accentStroke;
            ctx.beginPath();
            ctx.arc(upperSnoutLen - 2.5, -1.7, 1.1, 0, Math.PI * 2);
            ctx.arc(upperSnoutLen - 2.5, 1.7, 1.1, 0, Math.PI * 2);
            ctx.fill();

            // 4c. Eyes with White Sclera & Vertical Slit Pupils
            const eyeOffsets = [-5.8, 5.8];
            for (const ey of eyeOffsets) {
                ctx.save();
                ctx.translate(16.5, ey);

                // Raised emerald eye socket ring
                ctx.beginPath();
                ctx.arc(0, 0, 3.4, 0, Math.PI * 2);
                ctx.fillStyle = bodyFill;
                ctx.fill();
                ctx.strokeStyle = accentStroke;
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // White eye
                ctx.beginPath();
                ctx.arc(0.3, 0, 2.2, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                // Slit pupil tracking target direction
                ctx.rotate(alligator.eyeLookAngle);
                ctx.beginPath();
                ctx.ellipse(0.5, 0, 1.5, 0.55, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();

                ctx.restore();
            }

            ctx.restore();
        }

        /**
         * Renders chomp shockwave rings, burst particles, and floating "CHOMP!" text.
         */
        function drawEffects() {
            // Shockwave rings
            for (const r of chompRings) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(74, 222, 128, ${r.alpha})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();
            }

            // Chomp burst particles
            for (const p of chompParticles) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;

                if (p.isTriangle) {
                    ctx.beginPath();
                    ctx.moveTo(0, -p.size);
                    ctx.lineTo(p.size, p.size);
                    ctx.lineTo(-p.size, p.size);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                }
                ctx.restore();
            }

            // Floating "CHOMP!" text
            for (const t of chompTexts) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, t.alpha);
                ctx.font = "bold 14px 'Courier New', Courier, monospace";
                ctx.textAlign = 'center';
                ctx.fillStyle = '#4ade80';
                ctx.fillText('CHOMP!', t.x, t.y);
                ctx.restore();
            }
        }

        function draw() {
            // Clear canvas background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Central Mass Node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Center mark on node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // 2. Draw Ball & Trail
            for (const b of balls) {
                // Draw path line
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }

                // Draw ball object
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            // 3. Draw Alligator & Bite Effects
            drawAlligator();
            drawEffects();
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
