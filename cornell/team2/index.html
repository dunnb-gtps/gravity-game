<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Simulation - Sun & Earth</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <button class="btn-reset" onclick="resetSimulation()">Reset</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas to launch Earth.
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;        // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;    // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;         // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center
        const EARTH_RADIUS = 9;           // Visual and collision radius of planet Earth
        const ASTRONAUT_HEIGHT_CM = 8;    // Physical target height of background astronaut (8 cm)

        // STATE VARIABLES
        let bodies = [];

        // Central Sun Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 12,
            phase: 0
        };

        // Background Floating Astronaut State
        const astronaut = {
            x: 0,
            y: 0,
            vx: 0.24,
            vy: 0.12,
            heightPx: 302.36, // Calibrated dynamically to exact 8 cm in CSS pixels
            phase: 0,
            initialized: false
        };

        /**
         * Measures exact CSS pixels corresponding to a physical centimeter value.
         */
        function getCentimetersInPixels(cm) {
            const probe = document.createElement('div');
            probe.style.position = 'absolute';
            probe.style.visibility = 'hidden';
            probe.style.height = cm + 'cm';
            probe.style.width = '0';
            probe.style.pointerEvents = 'none';
            document.body.appendChild(probe);
            const measuredPx = probe.getBoundingClientRect().height;
            document.body.removeChild(probe);
            return measuredPx > 0 ? measuredPx : (cm * 96) / 2.54;
        }

        /**
         * Resizes the canvas to match its responsive container, centers the Sun,
         * and calibrates the 8 cm background astronaut dimensions.
         */
        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            // Recenter Sun dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            // Calibrate exact 8 cm height in screen pixels
            astronaut.heightPx = getCentimetersInPixels(ASTRONAUT_HEIGHT_CM);

            if (!astronaut.initialized) {
                astronaut.x = canvas.width * 0.25;
                astronaut.y = canvas.height * 0.5;
                astronaut.initialized = true;
            } else {
                const padX = astronaut.heightPx * 0.35;
                const padY = astronaut.heightPx * 0.52;
                astronaut.x = Math.max(padX, Math.min(canvas.width - padX, astronaut.x));
                astronaut.y = Math.max(padY, Math.min(canvas.height - padY, astronaut.y));
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Canvas Click Handler: Directly launch Earth at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchEarth(clickX, clickY);
        });

        /**
         * Launches a single planet Earth body from the specified canvas coordinates.
         */
        function launchEarth(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Overwrite existing array to strictly maintain a single Earth on screen
            bodies = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: EARTH_RADIUS,
                rotation: 0, // Horizontal rotation phase for spinning continents/clouds
                trail: []    // Stores history of past {x, y} coordinates
            }];
        }

        /**
         * Clears the active Earth body from the simulation.
         */
        function resetSimulation() {
            bodies = [];
        }

        /**
         * Updates background astronaut zero-gravity drift, solar animation,
         * orbital kinematics, gravity acceleration, and Earth's axial spin.
         */
        function updatePhysics() {
            // Advance solar corona & surface animation phase
            centralNode.phase += 0.03;

            // Update background astronaut zero-gravity drift
            astronaut.phase += 0.018;
            astronaut.x += astronaut.vx;
            astronaut.y += astronaut.vy;

            const marginX = Math.min(canvas.width * 0.22, astronaut.heightPx * 0.36);
            const marginY = Math.min(canvas.height * 0.45, astronaut.heightPx * 0.52);

            if (astronaut.x < marginX) {
                astronaut.x = marginX;
                astronaut.vx = Math.abs(astronaut.vx);
            } else if (astronaut.x > canvas.width - marginX) {
                astronaut.x = canvas.width - marginX;
                astronaut.vx = -Math.abs(astronaut.vx);
            }

            if (astronaut.y < marginY) {
                astronaut.y = marginY;
                astronaut.vy = Math.abs(astronaut.vy);
            } else if (astronaut.y > canvas.height - marginY) {
                astronaut.y = canvas.height - marginY;
                astronaut.vy = -Math.abs(astronaut.vy);
            }

            for (let i = bodies.length - 1; i >= 0; i--) {
                const earth = bodies[i];

                // Remove Earth if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (earth.x < -margin || earth.x > canvas.width + margin ||
                    earth.y < -margin || earth.y > canvas.height + margin) {
                    bodies.splice(i, 1);
                    continue;
                }

                // Distance vector to central Sun
                const dx = centralNode.x - earth.x;
                const dy = centralNode.y - earth.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: Earth collides with the Sun
                if (dist < centralNode.radius + earth.radius) {
                    bodies.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                earth.vx += ax;
                earth.vy += ay;
                earth.x += earth.vx;
                earth.y += earth.vy;

                // Advance gentle axial rotation for spinning globe effect
                earth.rotation += 0.14;

                // Record position history for line trail
                earth.trail.push({ x: earth.x, y: earth.y });
                if (earth.trail.length > TRAIL_LENGTH) {
                    earth.trail.shift();
                }
            }
        }

        /**
         * Helper to draw a rounded rectangle in normalized astronaut space.
         */
        function drawRoundedRect(x, y, w, h, r) {
            const radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + w - radius, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
            ctx.lineTo(x + w, y + h - radius);
            ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
            ctx.lineTo(x + radius, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        /**
         * Helper to draw an articulated spacesuit limb segment with rounded caps,
         * 3D shading, and joint ring accents.
         */
        function drawSuitLimb(x1, y1, x2, y2, thickness, baseColor, shadowColor) {
            const angle = Math.atan2(y2 - y1, x2 - x1);
            const nx = -Math.sin(angle) * (thickness * 0.5);
            const ny = Math.cos(angle) * (thickness * 0.5);

            const grad = ctx.createLinearGradient(x1 - nx, y1 - ny, x1 + nx, y1 + ny);
            grad.addColorStop(0, baseColor);
            grad.addColorStop(0.65, '#cfd8dc');
            grad.addColorStop(1, shadowColor);

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = grad;
            ctx.lineWidth = thickness;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Subtle dark outline for clean separation
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = 'rgba(38, 50, 56, 0.35)';
            ctx.lineWidth = thickness + 0.006;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Re-stroke core highlight pass so outline stays on outer edge
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = grad;
            ctx.lineWidth = thickness - 0.003;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        /**
         * Renders the 8 cm floating EVA astronaut in the background with zero-gravity
         * motion, articulated spacesuit details, undulating tether, and sun-lit visor.
         */
        function drawAstronaut() {
            const h = astronaut.heightPx;
            const t = astronaut.phase;
            const bobY = Math.sin(t) * 6;
            const bobX = Math.cos(t * 0.7) * 4;
            const tilt = Math.sin(t * 0.85) * 0.13 - 0.06;
            const armSway = Math.sin(t * 1.25) * 0.025;
            const legSway = Math.cos(t * 1.1) * 0.02;

            // Direction from astronaut toward the central Sun for subtle rim lighting
            const toSunX = centralNode.x - (astronaut.x + bobX);
            const toSunY = centralNode.y - (astronaut.y + bobY);
            const sunDist = Math.hypot(toSunX, toSunY) || 1;
            const sunDirX = toSunX / sunDist;
            const sunDirY = toSunY / sunDist;

            ctx.save();
            // Position and scale so local [-0.5, +0.5] vertical span equals exact 8 cm
            ctx.translate(astronaut.x + bobX, astronaut.y + bobY);
            ctx.rotate(tilt);
            ctx.scale(h, h);

            // Subtle background depth opacity so Sun, Earth, and trails stand out clearly
            ctx.globalAlpha = 0.62;

            // 1. Undulating Zero-Gravity Safety Tether trailing from waist
            ctx.beginPath();
            ctx.moveTo(-0.08, 0.04);
            ctx.bezierCurveTo(
                -0.24, 0.10 + Math.sin(t * 1.6) * 0.04,
                -0.32, -0.06 + Math.cos(t * 1.4) * 0.05,
                -0.44, 0.02 + Math.sin(t * 1.9) * 0.06
            );
            ctx.strokeStyle = 'rgba(176, 190, 197, 0.55)';
            ctx.lineWidth = 0.007;
            ctx.stroke();

            // 2. Back Arm (Left Arm behind torso)
            const backElbowX = -0.15 - armSway * 0.6;
            const backElbowY = -0.05 + armSway * 0.5;
            const backHandX = -0.09 - armSway * 0.4;
            const backHandY = 0.05 + armSway;
            drawSuitLimb(-0.04, -0.16, backElbowX, backElbowY, 0.068, '#cfd8dc', '#607d8b');
            drawSuitLimb(backElbowX, backElbowY, backHandX, backHandY, 0.060, '#b0bec5', '#546e7a');
            // Back Glove
            ctx.beginPath();
            ctx.arc(backHandX, backHandY, 0.032, 0, Math.PI * 2);
            ctx.fillStyle = '#90a4ae';
            ctx.fill();

            // 3. Back Leg (Left Leg)
            const backKneeX = -0.11 - legSway;
            const backKneeY = 0.24;
            const backAnkleX = -0.17 - legSway * 1.3;
            const backAnkleY = 0.41;
            drawSuitLimb(-0.03, 0.05, backKneeX, backKneeY, 0.086, '#cfd8dc', '#607d8b');
            drawSuitLimb(backKneeX, backKneeY, backAnkleX, backAnkleY, 0.074, '#b0bec5', '#546e7a');
            // Back Boot
            ctx.save();
            ctx.translate(backAnkleX, backAnkleY);
            ctx.rotate(0.18);
            drawRoundedRect(-0.038, -0.01, 0.095, 0.052, 0.018);
            ctx.fillStyle = '#78909c';
            ctx.fill();
            ctx.fillStyle = '#37474f';
            ctx.fillRect(-0.036, 0.032, 0.091, 0.012);
            ctx.restore();

            // 4. PLSS Life-Support Backpack
            const packGrad = ctx.createLinearGradient(-0.17, -0.22, -0.03, 0.06);
            packGrad.addColorStop(0, '#eceff1');
            packGrad.addColorStop(0.5, '#b0bec5');
            packGrad.addColorStop(1, '#546e7a');
            drawRoundedRect(-0.165, -0.23, 0.135, 0.285, 0.028);
            ctx.fillStyle = packGrad;
            ctx.fill();
            ctx.strokeStyle = 'rgba(38, 50, 56, 0.45)';
            ctx.lineWidth = 0.005;
            ctx.stroke();

            // Backpack Panel Seams & Status Indicator LEDs
            ctx.strokeStyle = 'rgba(55, 71, 79, 0.4)';
            ctx.lineWidth = 0.004;
            ctx.beginPath();
            ctx.moveTo(-0.16, -0.11);
            ctx.lineTo(-0.04, -0.11);
            ctx.moveTo(-0.16, -0.01);
            ctx.lineTo(-0.04, -0.01);
            ctx.stroke();

            // Pulsing Telemetry LED on backpack
            const ledAlpha = 0.55 + 0.45 * Math.sin(t * 3.2);
            ctx.beginPath();
            ctx.arc(-0.135, -0.19, 0.008, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(105, 240, 174, ${ledAlpha})`;
            ctx.fill();

            // 5. Front Leg (Right Leg - bottom sole reaches exact +0.50)
            const frontKneeX = 0.11 + legSway;
            const frontKneeY = 0.24;
            const frontAnkleX = 0.06 + legSway * 0.8;
            const frontAnkleY = 0.445;
            drawSuitLimb(0.03, 0.05, frontKneeX, frontKneeY, 0.090, '#ffffff', '#78909c');
            drawSuitLimb(frontKneeX, frontKneeY, frontAnkleX, frontAnkleY, 0.078, '#eceff1', '#607d8b');

            // Knee Joint Ribbing
            ctx.strokeStyle = 'rgba(69, 90, 100, 0.45)';
            ctx.lineWidth = 0.004;
            ctx.beginPath();
            ctx.arc(frontKneeX, frontKneeY, 0.036, -0.6, 0.9);
            ctx.stroke();

            // Front Boot (lowest point sits at y = +0.50)
            ctx.save();
            ctx.translate(frontAnkleX, frontAnkleY);
            drawRoundedRect(-0.04, -0.01, 0.105, 0.065, 0.02);
            ctx.fillStyle = '#cfd8dc';
            ctx.fill();
            // Dark rubber boot sole ending at y = +0.50
            ctx.fillStyle = '#37474f';
            ctx.fillRect(-0.038, 0.041, 0.101, 0.014);
            ctx.restore();

            // 6. Torso (Hard Upper Torso & Pressurized Waist)
            const torsoGrad = ctx.createLinearGradient(-0.09, -0.20, 0.12, 0.06);
            torsoGrad.addColorStop(0, '#ffffff');
            torsoGrad.addColorStop(0.55, '#e0e6e9');
            torsoGrad.addColorStop(1, '#78909c');
            drawRoundedRect(-0.095, -0.215, 0.205, 0.285, 0.065);
            ctx.fillStyle = torsoGrad;
            ctx.fill();

            // Subtle warm solar rim highlight along Sun-facing edge of torso
            if (sunDirX > 0) {
                ctx.strokeStyle = `rgba(255, 224, 130, ${0.35 * sunDirX})`;
                ctx.lineWidth = 0.007;
                ctx.stroke();
            }

            // Waist Bearing Ring
            ctx.fillStyle = '#90a4ae';
            drawRoundedRect(-0.092, 0.02, 0.198, 0.024, 0.01);
            ctx.fill();

            // Chest Display & Control Module (DCM)
            drawRoundedRect(0.03, -0.16, 0.092, 0.115, 0.015);
            ctx.fillStyle = '#eceff1';
            ctx.fill();
            ctx.strokeStyle = '#607d8b';
            ctx.lineWidth = 0.004;
            ctx.stroke();

            // DCM Switches & Color Stripes
            ctx.fillStyle = '#1e88e5';
            ctx.fillRect(0.045, -0.142, 0.028, 0.014);
            ctx.fillStyle = '#e53935';
            ctx.fillRect(0.080, -0.142, 0.028, 0.014);
            ctx.fillStyle = '#455a64';
            ctx.fillRect(0.045, -0.115, 0.063, 0.012);
            ctx.fillRect(0.045, -0.092, 0.042, 0.012);

            // 7. Helmet & Gold-Tinted Reflective Visor (top edge sits at exact -0.50)
            const helmetCX = 0.005;
            const helmetCY = -0.36;
            const helmetR = 0.14;

            // Neck Ring Collar
            drawRoundedRect(-0.09, -0.238, 0.19, 0.032, 0.014);
            ctx.fillStyle = '#90a4ae';
            ctx.fill();

            // Helmet Shell
            const helmetGrad = ctx.createRadialGradient(
                helmetCX - 0.04, helmetCY - 0.04, 0.02,
                helmetCX, helmetCY, helmetR
            );
            helmetGrad.addColorStop(0, '#ffffff');
            helmetGrad.addColorStop(0.68, '#eceff1');
            helmetGrad.addColorStop(1, '#78909c');

            ctx.beginPath();
            ctx.arc(helmetCX, helmetCY, helmetR, 0, Math.PI * 2);
            ctx.fillStyle = helmetGrad;
            ctx.fill();

            // Gold-Tinted EVA Visor
            ctx.save();
            ctx.beginPath();
            ctx.arc(helmetCX, helmetCY, helmetR * 0.94, 0, Math.PI * 2);
            ctx.clip();

            const visorCX = helmetCX + 0.038;
            const visorCY = helmetCY + 0.004;
            const visorGrad = ctx.createRadialGradient(
                visorCX + 0.02, visorCY - 0.03, 0.01,
                visorCX, visorCY, 0.115
            );
            visorGrad.addColorStop(0, '#ffe082');
            visorGrad.addColorStop(0.32, '#ffb300');
            visorGrad.addColorStop(0.72, '#e65100');
            visorGrad.addColorStop(1, '#263238');

            ctx.beginPath();
            ctx.ellipse(visorCX, visorCY, 0.105, 0.108, -0.08, 0, Math.PI * 2);
            ctx.fillStyle = visorGrad;
            ctx.fill();

            // Visor Specular Highlight & Subtle Reflected Sun Glint
            ctx.beginPath();
            ctx.ellipse(visorCX - 0.015, visorCY - 0.042, 0.048, 0.018, -0.35, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(visorCX + sunDirX * 0.035, visorCY + sunDirY * 0.035, 0.014, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 249, 196, 0.55)';
            ctx.fill();

            ctx.restore();

            // Side Helmet Headset / Light Pod
            drawRoundedRect(-0.045, -0.385, 0.042, 0.052, 0.012);
            ctx.fillStyle = '#b0bec5';
            ctx.fill();

            // 8. Front Arm (Right Arm reaching gently outward in zero-G)
            const frontElbowX = 0.165 + armSway * 0.5;
            const frontElbowY = -0.095 - armSway * 0.4;
            const frontHandX = 0.235 + armSway;
            const frontHandY = -0.195 - armSway * 0.8;
            drawSuitLimb(0.04, -0.16, frontElbowX, frontElbowY, 0.072, '#ffffff', '#78909c');
            drawSuitLimb(frontElbowX, frontElbowY, frontHandX, frontHandY, 0.062, '#eceff1', '#607d8b');

            // Mission Patch on Upper Arm
            ctx.beginPath();
            ctx.arc(0.095, -0.132, 0.016, 0, Math.PI * 2);
            ctx.fillStyle = '#1565c0';
            ctx.fill();
            ctx.strokeStyle = '#ffd54f';
            ctx.lineWidth = 0.003;
            ctx.stroke();

            // Front Glove
            ctx.beginPath();
            ctx.arc(frontHandX, frontHandY, 0.033, 0, Math.PI * 2);
            ctx.fillStyle = '#cfd8dc';
            ctx.fill();
            ctx.strokeStyle = '#546e7a';
            ctx.lineWidth = 0.004;
            ctx.stroke();

            ctx.restore();
        }

        /**
         * Renders the central Sun with a multi-layered glowing corona, shimmering solar
         * rays, prominence loops, limb-darkened photosphere, and rotating solar granulation.
         */
        function drawSun() {
            const r = centralNode.radius;
            const phase = centralNode.phase;
            const pulse = 1 + Math.sin(phase * 1.4) * 0.05;

            ctx.save();
            ctx.translate(centralNode.x, centralNode.y);

            // 1. Wide outer atmospheric corona halo
            const outerRadius = r * 3.8 * pulse;
            const outerGlow = ctx.createRadialGradient(0, 0, r * 0.7, 0, 0, outerRadius);
            outerGlow.addColorStop(0, 'rgba(255, 213, 79, 0.55)');
            outerGlow.addColorStop(0.3, 'rgba(255, 152, 0, 0.28)');
            outerGlow.addColorStop(0.65, 'rgba(255, 87, 34, 0.10)');
            outerGlow.addColorStop(1, 'rgba(255, 87, 34, 0)');
            ctx.beginPath();
            ctx.arc(0, 0, outerRadius, 0, Math.PI * 2);
            ctx.fillStyle = outerGlow;
            ctx.fill();

            // 2. Subtle shimmering corona rays
            const rayCount = 12;
            for (let i = 0; i < rayCount; i++) {
                const angle = (i / rayCount) * Math.PI * 2 + phase * 0.12;
                const rayLen = r * (1.85 + 0.35 * Math.sin(phase * 2.1 + i * 1.7));
                const spread = 0.13;

                const rayGrad = ctx.createRadialGradient(0, 0, r * 0.9, 0, 0, rayLen);
                rayGrad.addColorStop(0, 'rgba(255, 224, 130, 0.32)');
                rayGrad.addColorStop(1, 'rgba(255, 143, 0, 0)');

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, rayLen, angle - spread, angle + spread);
                ctx.closePath();
                ctx.fillStyle = rayGrad;
                ctx.fill();
            }

            // 3. Subtle solar prominence loops along the limb
            ctx.strokeStyle = 'rgba(255, 112, 67, 0.55)';
            ctx.lineWidth = 1.2;
            for (let p = 0; p < 3; p++) {
                const pAngle = p * 2.1 + phase * 0.18;
                const loopHeight = r * (0.24 + 0.08 * Math.sin(phase * 1.8 + p));
                ctx.save();
                ctx.rotate(pAngle);
                ctx.beginPath();
                ctx.arc(r * 0.92, 0, loopHeight, -Math.PI * 0.45, Math.PI * 0.45);
                ctx.stroke();
                ctx.restore();
            }

            // 4. Clip interior surface details to the Sun's photosphere disc
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.clip();

            // 5. Photosphere gradient (brilliant white-yellow core to fiery orange limb)
            const photoGrad = ctx.createRadialGradient(-r * 0.15, -r * 0.15, r * 0.05, 0, 0, r);
            photoGrad.addColorStop(0, '#ffffff');
            photoGrad.addColorStop(0.28, '#fff59d');
            photoGrad.addColorStop(0.62, '#ffca28');
            photoGrad.addColorStop(0.88, '#fb8c00');
            photoGrad.addColorStop(1, '#e65100');
            ctx.fillStyle = photoGrad;
            ctx.fillRect(-r, -r, r * 2, r * 2);

            // 6. Rotating solar convection cells & subtle sunspots
            const span = r * 4;
            const surfaceShift = (phase * 3.5) % span;
            const granules = [
                { x: 0.4,  y: -0.35, rx: 0.34, ry: 0.22, color: 'rgba(255, 255, 224, 0.32)' },
                { x: 1.3,  y: 0.25,  rx: 0.38, ry: 0.24, color: 'rgba(239, 108, 0, 0.24)' },
                { x: 2.2,  y: -0.20, rx: 0.32, ry: 0.20, color: 'rgba(255, 249, 196, 0.30)' },
                { x: 3.1,  y: 0.38,  rx: 0.35, ry: 0.22, color: 'rgba(230, 81, 0, 0.22)' },
                { x: 1.75, y: -0.45, rx: 0.14, ry: 0.11, color: 'rgba(183, 28, 28, 0.38)' }, // Sunspot
                { x: 3.45, y: -0.10, rx: 0.12, ry: 0.10, color: 'rgba(183, 28, 28, 0.34)' }  // Sunspot
            ];

            for (let cycle = -1; cycle <= 0; cycle++) {
                const baseOffset = surfaceShift + cycle * span;
                for (const g of granules) {
                    ctx.beginPath();
                    ctx.ellipse(
                        baseOffset + g.x * r,
                        g.y * r,
                        g.rx * r,
                        g.ry * r,
                        0,
                        0,
                        Math.PI * 2
                    );
                    ctx.fillStyle = g.color;
                    ctx.fill();
                }
            }

            // 7. Crisp luminous solar rim
            ctx.beginPath();
            ctx.arc(0, 0, r - 0.3, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 245, 157, 0.8)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.restore();
        }

        /**
         * Draws a polygon helper from an array of normalized [x, y] pairs scaled by radius r.
         */
        function drawLandPolygon(points, offsetX, r, fillStyle) {
            ctx.beginPath();
            for (let i = 0; i < points.length; i++) {
                const px = offsetX + points[i][0] * r;
                const py = points[i][1] * r;
                if (i === 0) {
                    ctx.moveTo(px, py);
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.closePath();
            ctx.fillStyle = fillStyle;
            ctx.fill();
        }

        /**
         * Renders planet Earth at (earth.x, earth.y) with oceans, rotating continents,
         * polar ice caps, drifting cloud streaks, 3D shading, and atmospheric rim glow.
         */
        function drawEarth(earth) {
            const r = earth.radius;
            const span = r * 4; // Full horizontal wrap period of planetary surface

            ctx.save();
            ctx.translate(earth.x, earth.y);

            // 1. Subtle outer atmospheric halo so Earth stands out clearly against black space
            const haloGrad = ctx.createRadialGradient(0, 0, r * 0.85, 0, 0, r + 3.2);
            haloGrad.addColorStop(0, 'rgba(100, 181, 246, 0.55)');
            haloGrad.addColorStop(0.6, 'rgba(100, 181, 246, 0.22)');
            haloGrad.addColorStop(1, 'rgba(100, 181, 246, 0)');
            ctx.beginPath();
            ctx.arc(0, 0, r + 3.2, 0, Math.PI * 2);
            ctx.fillStyle = haloGrad;
            ctx.fill();

            // 2. Clip all surface layers to Earth's circular disc
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.clip();

            // 3. Oceans: Spherical blue ocean gradient (#1e88e5 to #0d47a1)
            const oceanGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r * 1.15);
            oceanGrad.addColorStop(0, '#2196f3');
            oceanGrad.addColorStop(0.45, '#1e88e5');
            oceanGrad.addColorStop(1, '#0d47a1');
            ctx.fillStyle = oceanGrad;
            ctx.fillRect(-r, -r, r * 2, r * 2);

            // 4. Continents: Americas & Eurasia-Africa polygons wrapped smoothly across rotation
            const surfaceShift = earth.rotation % span;

            // Normalized continent shapes (relative to radius r, tiled across 0..4r)
            const northAmerica = [
                [0.25, -0.68], [0.85, -0.62], [1.05, -0.35],
                [0.78, -0.08], [0.58, 0.04], [0.42, -0.15], [0.22, -0.42]
            ];
            const northAmericaHighlight = [
                [0.35, -0.58], [0.75, -0.52], [0.82, -0.32], [0.55, -0.18]
            ];
            const southAmerica = [
                [0.68, 0.08], [1.08, 0.22], [1.15, 0.50],
                [0.92, 0.78], [0.76, 0.72], [0.72, 0.38]
            ];
            const eurasia = [
                [1.85, -0.66], [2.65, -0.70], [3.35, -0.58],
                [3.52, -0.25], [3.12, -0.05], [2.65, -0.12],
                [2.25, -0.18], [1.82, -0.35]
            ];
            const eurasiaHighlight = [
                [2.10, -0.55], [2.95, -0.56], [3.15, -0.32], [2.45, -0.26]
            ];
            const africa = [
                [1.92, -0.14], [2.48, -0.10], [2.68, 0.18],
                [2.45, 0.62], [2.22, 0.65], [2.08, 0.30], [1.86, 0.08]
            ];
            const australia = [
                [3.12, 0.28], [3.55, 0.26], [3.62, 0.52], [3.22, 0.56]
            ];

            // Draw two tiled cycles so continents wrap seamlessly around the globe
            for (let cycle = -1; cycle <= 0; cycle++) {
                const baseOffset = surfaceShift + cycle * span;

                // Base green landmass layer (#2e7d32)
                drawLandPolygon(northAmerica, baseOffset, r, '#2e7d32');
                drawLandPolygon(southAmerica, baseOffset, r, '#2e7d32');
                drawLandPolygon(eurasia, baseOffset, r, '#2e7d32');
                drawLandPolygon(africa, baseOffset, r, '#2e7d32');
                drawLandPolygon(australia, baseOffset, r, '#2e7d32');

                // Secondary lighter green elevation highlights (#43a047)
                drawLandPolygon(northAmericaHighlight, baseOffset, r, '#43a047');
                drawLandPolygon(eurasiaHighlight, baseOffset, r, '#43a047');
            }

            // 5. Polar Ice Caps (North & South)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            // North polar cap
            ctx.beginPath();
            ctx.ellipse(0, -r * 0.92, r * 0.62, r * 0.22, 0, 0, Math.PI * 2);
            ctx.fill();
            // South polar cap
            ctx.beginPath();
            ctx.ellipse(0, r * 0.94, r * 0.58, r * 0.20, 0, 0, Math.PI * 2);
            ctx.fill();

            // 6. Delicate semi-transparent cloud streaks drifting slightly faster than land
            const cloudShift = (earth.rotation * 1.25) % span;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            const clouds = [
                { x: 0.35, y: -0.35, w: 0.85, h: 0.13 },
                { x: 1.35, y: 0.05,  w: 0.95, h: 0.12 },
                { x: 2.20, y: -0.45, w: 0.90, h: 0.13 },
                { x: 2.85, y: 0.36,  w: 0.80, h: 0.12 },
                { x: 0.80, y: 0.52,  w: 0.75, h: 0.11 }
            ];

            for (let cycle = -1; cycle <= 0; cycle++) {
                const cBase = cloudShift + cycle * span;
                for (const c of clouds) {
                    ctx.beginPath();
                    ctx.ellipse(
                        cBase + c.x * r,
                        c.y * r,
                        (c.w * r) / 2,
                        (c.h * r) / 2,
                        0,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }
            }

            // 7. 3D Spherical Shadow Shading (lit from upper-left, shaded on lower-right edge)
            const shadowGrad = ctx.createRadialGradient(
                -r * 0.35, -r * 0.35, r * 0.2,
                0, 0, r
            );
            shadowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.10)');
            shadowGrad.addColorStop(0.55, 'rgba(0, 0, 0, 0.05)');
            shadowGrad.addColorStop(0.85, 'rgba(0, 6, 24, 0.42)');
            shadowGrad.addColorStop(1, 'rgba(0, 4, 16, 0.68)');
            ctx.fillStyle = shadowGrad;
            ctx.fillRect(-r, -r, r * 2, r * 2);

            // 8. Soft light-blue atmospheric rim (#64b5f6) along the perimeter
            ctx.beginPath();
            ctx.arc(0, 0, r - 0.4, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(100, 181, 246, 0.85)';
            ctx.lineWidth = 1.1;
            ctx.stroke();

            ctx.restore();
        }

        /**
         * Renders the background 8 cm astronaut, central Sun, orbital motion trail, and planet Earth.
         */
        function draw() {
            // Clear canvas background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Background 8 cm Floating Astronaut
            drawAstronaut();

            // 2. Draw Central Sun
            drawSun();

            // 3. Draw Orbital Trail & Planet Earth
            for (const earth of bodies) {
                // Draw path line
                if (earth.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(earth.trail[0].x, earth.trail[0].y);
                    for (let t = 1; t < earth.trail.length; t++) {
                        ctx.lineTo(earth.trail[t].x, earth.trail[t].y);
                    }
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }

                // Draw detailed planet Earth
                drawEarth(earth);
            }
        }

        /**
         * Main animation loop running via requestAnimationFrame.
         */
        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            animate();
        };
    </script>
</body>
