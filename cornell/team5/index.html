<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Baseline</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background: radial-gradient(ellipse at bottom, #071929 0%, #02050e 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.85);
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(40, 255, 170, 0.35);
        }

        .btn-reset {
            background: rgba(4, 15, 28, 0.6);
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #02050e;
            border: 1px solid rgba(255, 255, 255, 0.85);
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #9ab3c7;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <button class="btn-reset" onclick="resetSimulation()">Reset</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas to launch a ball.
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;         // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center

        // STATE VARIABLES
        let balls = [];
        let stars = [];
        let auroraTime = 0;

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 12
        };

        // Aurora Ribbon Configurations
        const auroraLayers = [
            {
                baseYRatio: 0.36,
                heightRatio: 0.28,
                freq1: 0.0045,
                freq2: 0.011,
                speed1: 0.55,
                speed2: -0.85,
                amp1: 42,
                amp2: 18,
                phase: 0.0,
                colors: [
                    { stop: 0.0, color: 'rgba(130, 50, 235, 0)' },
                    { stop: 0.35, color: 'rgba(125, 65, 245, 0.14)' },
                    { stop: 0.68, color: 'rgba(0, 210, 215, 0.22)' },
                    { stop: 0.90, color: 'rgba(35, 255, 145, 0.32)' },
                    { stop: 1.0, color: 'rgba(35, 255, 145, 0)' }
                ],
                edgeColor: 'rgba(70, 255, 165, 0.28)'
            },
            {
                baseYRatio: 0.52,
                heightRatio: 0.32,
                freq1: 0.0038,
                freq2: 0.0095,
                speed1: -0.45,
                speed2: 0.75,
                amp1: 50,
                amp2: 22,
                phase: 2.1,
                colors: [
                    { stop: 0.0, color: 'rgba(95, 45, 220, 0)' },
                    { stop: 0.30, color: 'rgba(110, 60, 235, 0.12)' },
                    { stop: 0.65, color: 'rgba(15, 225, 195, 0.24)' },
                    { stop: 0.88, color: 'rgba(55, 255, 130, 0.34)' },
                    { stop: 1.0, color: 'rgba(55, 255, 130, 0)' }
                ],
                edgeColor: 'rgba(90, 255, 155, 0.32)'
            },
            {
                baseYRatio: 0.68,
                heightRatio: 0.24,
                freq1: 0.0052,
                freq2: 0.013,
                speed1: 0.65,
                speed2: 0.45,
                amp1: 35,
                amp2: 15,
                phase: 4.3,
                colors: [
                    { stop: 0.0, color: 'rgba(150, 55, 245, 0)' },
                    { stop: 0.40, color: 'rgba(140, 70, 250, 0.12)' },
                    { stop: 0.72, color: 'rgba(0, 200, 230, 0.18)' },
                    { stop: 0.92, color: 'rgba(40, 245, 165, 0.24)' },
                    { stop: 1.0, color: 'rgba(40, 245, 165, 0)' }
                ],
                edgeColor: 'rgba(65, 245, 180, 0.22)'
            }
        ];

        function generateStars() {
            const count = Math.floor((canvas.width * canvas.height) / 9500);
            stars = [];
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.3 + 0.3,
                    baseAlpha: Math.random() * 0.65 + 0.2,
                    twinkleSpeed: Math.random() * 2.2 + 0.8,
                    twinklePhase: Math.random() * Math.PI * 2
                });
            }
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            generateStars();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Canvas Click Handler: Directly launch ball at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchBall(clickX, clickY);
        });

        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Overwrite existing array to strictly maintain a single ball on screen
            balls = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4,
                hue: 0,
                trail: [] // Stores history of past {x, y} coordinates
            }];
        }

        function resetSimulation() {
            balls = [];
        }

        function updatePhysics() {
            auroraTime += 0.014;

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove ball if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    balls.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity, position, and rainbow hue
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;
                b.hue = (b.hue + 6) % 360;

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }
        }

        function drawNorthernLights() {
            const w = canvas.width;
            const h = canvas.height;

            // 1. Deep Arctic Night Sky Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
            skyGrad.addColorStop(0, '#01030a');
            skyGrad.addColorStop(0.55, '#040d1d');
            skyGrad.addColorStop(1, '#081c2e');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, h);

            // 2. Twinkling Starfield
            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                const alpha = s.baseAlpha * (0.65 + 0.35 * Math.sin(auroraTime * s.twinkleSpeed + s.twinklePhase));
                ctx.fillStyle = `rgba(225, 240, 255, ${alpha.toFixed(3)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 3. Flowing Aurora Borealis Curtains
            ctx.save();
            ctx.globalCompositeOperation = 'screen';

            const step = 12;
            for (let l = 0; l < auroraLayers.length; l++) {
                const layer = auroraLayers[l];
                const baseY = h * layer.baseYRatio;
                const ribbonH = h * layer.heightRatio;

                const bottomPoints = [];
                const topPoints = [];
                let minTopY = h;
                let maxBotY = 0;

                for (let x = -step; x <= w + step; x += step) {
                    const wave1 = Math.sin(x * layer.freq1 + auroraTime * layer.speed1 + layer.phase) * layer.amp1;
                    const wave2 = Math.cos(x * layer.freq2 + auroraTime * layer.speed2 - layer.phase) * layer.amp2;
                    const shimmer = Math.sin(x * 0.028 - auroraTime * 1.4 + l) * (ribbonH * 0.16);

                    const botY = baseY + wave1 + wave2;
                    const topY = botY - ribbonH - shimmer;

                    bottomPoints.push({ x, y: botY });
                    topPoints.push({ x, y: topY });

                    if (topY < minTopY) minTopY = topY;
                    if (botY > maxBotY) maxBotY = botY;
                }

                // Vertical Aurora Color Gradient (Violet top -> Cyan mid -> Emerald green base)
                const auroraGrad = ctx.createLinearGradient(0, minTopY, 0, maxBotY);
                for (const c of layer.colors) {
                    auroraGrad.addColorStop(c.stop, c.color);
                }

                ctx.beginPath();
                ctx.moveTo(topPoints[0].x, topPoints[0].y);
                for (let i = 1; i < topPoints.length; i++) {
                    ctx.lineTo(topPoints[i].x, topPoints[i].y);
                }
                for (let i = bottomPoints.length - 1; i >= 0; i--) {
                    ctx.lineTo(bottomPoints[i].x, bottomPoints[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = auroraGrad;
                ctx.fill();

                // Luminous lower curtain ridge
                ctx.beginPath();
                ctx.moveTo(bottomPoints[0].x, bottomPoints[0].y);
                for (let i = 1; i < bottomPoints.length; i++) {
                    ctx.lineTo(bottomPoints[i].x, bottomPoints[i].y);
                }
                ctx.strokeStyle = layer.edgeColor;
                ctx.lineWidth = 2.2;
                ctx.shadowColor = 'rgba(45, 255, 160, 0.45)';
                ctx.shadowBlur = 14;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        function draw() {
            // Render Northern Lights background
            drawNorthernLights();

            // 1. Draw Central Mass Node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Center mark on node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // 2. Draw Ball & Trail
            for (const b of balls) {
                // Draw path line
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }

                // Draw ball object with rainbow gradient and cycling hue
                const rainbowGradient = ctx.createLinearGradient(
                    b.x - b.radius,
                    b.y - b.radius,
                    b.x + b.radius,
                    b.y + b.radius
                );
                rainbowGradient.addColorStop(0, `hsl(${b.hue}, 100%, 60%)`);
                rainbowGradient.addColorStop(0.5, `hsl(${(b.hue + 60) % 360}, 100%, 55%)`);
                rainbowGradient.addColorStop(1, `hsl(${(b.hue + 120) % 360}, 100%, 50%)`);

                ctx.save();
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = rainbowGradient;
                ctx.shadowColor = `hsl(${b.hue}, 100%, 55%)`;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            }
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
