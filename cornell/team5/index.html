<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics - Fish Catch</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background: radial-gradient(ellipse at bottom, #071929 0%, #02050e 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.85);
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(40, 255, 170, 0.35);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        #score-board {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #7ef9c8;
            text-shadow: 0 0 8px rgba(40, 255, 170, 0.4);
            transition: transform 0.15s ease;
        }

        #score-board.pulse {
            transform: scale(1.18);
            color: #ffffff;
        }

        .btn-reset {
            background: rgba(4, 15, 28, 0.6);
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #02050e;
            border: 1px solid rgba(255, 255, 255, 0.85);
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #9ab3c7;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <div class="header-controls">
            <div id="score-board">Fish Caught: <span id="score-val">0</span></div>
            <button class="btn-reset" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas to launch a ball and catch the fish before they disappear!
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const scoreValEl = document.getElementById('score-val');
        const scoreBoardEl = document.getElementById('score-board');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;         // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center

        // FISH GAMEPLAY CONSTANTS
        const MAX_FISH = 5;                // Max concurrent fish in the background
        const FISH_SPAWN_INTERVAL = 1.4;   // Seconds between spawn checks
        const FISH_FADE_IN = 0.8;          // Seconds to appear
        const FISH_FADE_OUT = 1.2;         // Seconds to disappear

        const FISH_PALETTES = [
            { body: '#ff8c42', belly: '#ffd166', fin: '#ff5e5b', glow: 'rgba(255, 165, 80, 0.35)' },
            { body: '#ff6b9d', belly: '#ffc2d4', fin: '#e63973', glow: 'rgba(255, 115, 165, 0.35)' },
            { body: '#00d2ff', belly: '#a8f9ff', fin: '#0088cc', glow: 'rgba(40, 225, 255, 0.35)' },
            { body: '#48e5c2', belly: '#c2fcef', fin: '#1eae98', glow: 'rgba(72, 229, 194, 0.35)' },
            { body: '#c77dff', belly: '#edd2ff', fin: '#9d4edd', glow: 'rgba(199, 125, 255, 0.35)' }
        ];

        // STATE VARIABLES
        let balls = [];
        let stars = [];
        let fishes = [];
        let catchEffects = [];
        let auroraTime = 0;
        let lastTimestamp = 0;
        let fishSpawnTimer = 0;
        let score = 0;

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 16
        };

        // Aurora Ribbon Configurations
        const auroraLayers = [
            {
                baseYRatio: 0.36,
                heightRatio: 0.28,
                freq1: 0.0045,
                freq2: 0.011,
                speed1: 0.55,
                speed2: -0.85,
                amp1: 42,
                amp2: 18,
                phase: 0.0,
                colors: [
                    { stop: 0.0, color: 'rgba(130, 50, 235, 0)' },
                    { stop: 0.35, color: 'rgba(125, 65, 245, 0.14)' },
                    { stop: 0.68, color: 'rgba(0, 210, 215, 0.22)' },
                    { stop: 0.90, color: 'rgba(35, 255, 145, 0.32)' },
                    { stop: 1.0, color: 'rgba(35, 255, 145, 0)' }
                ],
                edgeColor: 'rgba(70, 255, 165, 0.28)'
            },
            {
                baseYRatio: 0.52,
                heightRatio: 0.32,
                freq1: 0.0038,
                freq2: 0.0095,
                speed1: -0.45,
                speed2: 0.75,
                amp1: 50,
                amp2: 22,
                phase: 2.1,
                colors: [
                    { stop: 0.0, color: 'rgba(95, 45, 220, 0)' },
                    { stop: 0.30, color: 'rgba(110, 60, 235, 0.12)' },
                    { stop: 0.65, color: 'rgba(15, 225, 195, 0.24)' },
                    { stop: 0.88, color: 'rgba(55, 255, 130, 0.34)' },
                    { stop: 1.0, color: 'rgba(55, 255, 130, 0)' }
                ],
                edgeColor: 'rgba(90, 255, 155, 0.32)'
            },
            {
                baseYRatio: 0.68,
                heightRatio: 0.24,
                freq1: 0.0052,
                freq2: 0.013,
                speed1: 0.65,
                speed2: 0.45,
                amp1: 35,
                amp2: 15,
                phase: 4.3,
                colors: [
                    { stop: 0.0, color: 'rgba(150, 55, 245, 0)' },
                    { stop: 0.40, color: 'rgba(140, 70, 250, 0.12)' },
                    { stop: 0.72, color: 'rgba(0, 200, 230, 0.18)' },
                    { stop: 0.92, color: 'rgba(40, 245, 165, 0.24)' },
                    { stop: 1.0, color: 'rgba(40, 245, 165, 0)' }
                ],
                edgeColor: 'rgba(65, 245, 180, 0.22)'
            }
        ];

        function generateStars() {
            const count = Math.floor((canvas.width * canvas.height) / 9500);
            stars = [];
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.3 + 0.3,
                    baseAlpha: Math.random() * 0.65 + 0.2,
                    twinkleSpeed: Math.random() * 2.2 + 0.8,
                    twinklePhase: Math.random() * Math.PI * 2
                });
            }
        }

        function spawnFish(initialDelayOffset = 0) {
            if (canvas.width < 150 || canvas.height < 150) return;

            const margin = 60;
            const minOtterDist = centralNode.radius + 85;
            const minFishDist = 65;

            let x = 0;
            let y = 0;
            let valid = false;

            for (let attempt = 0; attempt < 30; attempt++) {
                x = margin + Math.random() * (canvas.width - margin * 2);
                y = margin + Math.random() * (canvas.height - margin * 2);

                const distOtter = Math.hypot(x - centralNode.x, y - centralNode.y);
                if (distOtter < minOtterDist) continue;

                let tooCloseToFish = false;
                for (const other of fishes) {
                    if (Math.hypot(x - other.x, y - other.y) < minFishDist) {
                        tooCloseToFish = true;
                        break;
                    }
                }
                if (!tooCloseToFish) {
                    valid = true;
                    break;
                }
            }

            if (!valid) return;

            const speed = 18 + Math.random() * 24;
            const dir = Math.random() < 0.5 ? 1 : -1;
            const palette = FISH_PALETTES[Math.floor(Math.random() * FISH_PALETTES.length)];
            const size = 14 + Math.random() * 4;

            fishes.push({
                x: x,
                y: y,
                vx: dir * speed,
                vy: (Math.random() - 0.5) * 10,
                size: size,
                palette: palette,
                age: initialDelayOffset,
                maxLife: 6.5 + Math.random() * 4.0,
                alpha: 0,
                scale: 0.4,
                tailPhase: Math.random() * Math.PI * 2,
                swimWaveOffset: Math.random() * Math.PI * 2
            });
        }

        function initInitialFishes() {
            fishes = [];
            for (let i = 0; i < 4; i++) {
                spawnFish(i * 0.6);
            }
        }

        function updateScoreDisplay(animate = false) {
            scoreValEl.textContent = score;
            if (animate) {
                scoreBoardEl.classList.remove('pulse');
                void scoreBoardEl.offsetWidth;
                scoreBoardEl.classList.add('pulse');
                setTimeout(() => scoreBoardEl.classList.remove('pulse'), 180);
            }
        }

        function createCatchEffect(x, y, palette) {
            const particles = [];
            for (let i = 0; i < 14; i++) {
                const angle = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5) * 0.3;
                const speed = 45 + Math.random() * 75;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 1.8 + Math.random() * 2.2,
                    color: i % 2 === 0 ? palette.belly : '#7ef9c8'
                });
            }

            catchEffects.push({
                x: x,
                y: y,
                age: 0,
                duration: 0.75,
                particles: particles,
                color: palette.body
            });
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            // Keep existing fish inside bounds
            for (const f of fishes) {
                f.x = Math.max(50, Math.min(canvas.width - 50, f.x));
                f.y = Math.max(50, Math.min(canvas.height - 50, f.y));
            }

            generateStars();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        initInitialFishes();

        // Canvas Click Handler: Directly launch ball at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchBall(clickX, clickY);
        });

        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Overwrite existing array to strictly maintain a single ball on screen
            balls = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4,
                hue: 0,
                trail: [] // Stores history of past {x, y} coordinates
            }];
        }

        function resetSimulation() {
            balls = [];
            catchEffects = [];
            score = 0;
            fishSpawnTimer = 0;
            updateScoreDisplay(false);
            initInitialFishes();
        }

        function updateFishes(dt) {
            fishSpawnTimer += dt;
            if (fishSpawnTimer >= FISH_SPAWN_INTERVAL) {
                fishSpawnTimer = 0;
                if (fishes.length < MAX_FISH) {
                    spawnFish(0);
                }
            }

            const margin = 48;
            const repelDist = centralNode.radius + 65;

            for (let i = fishes.length - 1; i >= 0; i--) {
                const f = fishes[i];
                f.age += dt;
                f.tailPhase += dt * 10;

                // Remove fish once its lifespan ends
                if (f.age >= f.maxLife) {
                    fishes.splice(i, 1);
                    continue;
                }

                // Compute smooth appear & disappear alpha and scale
                const remaining = f.maxLife - f.age;
                if (f.age < FISH_FADE_IN) {
                    const t = f.age / FISH_FADE_IN;
                    f.alpha = t;
                    f.scale = 0.45 + 0.55 * (1 - Math.pow(1 - t, 2));
                } else if (remaining < FISH_FADE_OUT) {
                    const t = Math.max(0, remaining / FISH_FADE_OUT);
                    // Subtle shimmer as fish starts disappearing
                    const flicker = 0.85 + 0.15 * Math.sin(f.age * 24);
                    f.alpha = t * flicker;
                    f.scale = 0.55 + 0.45 * t;
                } else {
                    f.alpha = 1;
                    f.scale = 1;
                }

                // Gentle swimming motion
                const bobVy = Math.sin(auroraTime * 2.2 + f.swimWaveOffset) * 14;
                f.x += f.vx * dt;
                f.y += (f.vy + bobVy) * dt;

                // Turn smoothly near canvas boundaries
                if (f.x < margin) {
                    f.x = margin;
                    f.vx = Math.abs(f.vx);
                } else if (f.x > canvas.width - margin) {
                    f.x = canvas.width - margin;
                    f.vx = -Math.abs(f.vx);
                }

                if (f.y < margin) {
                    f.y = margin;
                    f.vy = Math.abs(f.vy);
                } else if (f.y > canvas.height - margin) {
                    f.y = canvas.height - margin;
                    f.vy = -Math.abs(f.vy);
                }

                // Steer gently away from the central sea otter
                const dxOtter = f.x - centralNode.x;
                const dyOtter = f.y - centralNode.y;
                const distOtter = Math.hypot(dxOtter, dyOtter);
                if (distOtter < repelDist && distOtter > 0.01) {
                    const push = ((repelDist - distOtter) / repelDist) * 45 * dt;
                    f.vx += (dxOtter / distOtter) * push;
                    f.vy += (dyOtter / distOtter) * push;
                }
            }

            // Update catch particle bursts
            for (let i = catchEffects.length - 1; i >= 0; i--) {
                const eff = catchEffects[i];
                eff.age += dt;
                if (eff.age >= eff.duration) {
                    catchEffects.splice(i, 1);
                    continue;
                }
                for (const p of eff.particles) {
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vx *= 0.94;
                    p.vy *= 0.94;
                }
            }
        }

        function updatePhysics(dt) {
            auroraTime += 0.014;
            updateFishes(dt);

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove ball if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    balls.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity, position, and rainbow hue
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;
                b.hue = (b.hue + 6) % 360;

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }

                // Check collision with visible background fish
                for (let j = fishes.length - 1; j >= 0; j--) {
                    const f = fishes[j];
                    if (f.alpha < 0.25) continue;

                    const hitRadius = f.size * f.scale + b.radius + 6;
                    const distFish = Math.hypot(b.x - f.x, b.y - f.y);

                    if (distFish <= hitRadius) {
                        score += 1;
                        updateScoreDisplay(true);
                        createCatchEffect(f.x, f.y, f.palette);
                        fishes.splice(j, 1);
                    }
                }
            }
        }

        function drawNorthernLights() {
            const w = canvas.width;
            const h = canvas.height;

            // 1. Deep Arctic Night Sky Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
            skyGrad.addColorStop(0, '#01030a');
            skyGrad.addColorStop(0.55, '#040d1d');
            skyGrad.addColorStop(1, '#081c2e');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, h);

            // 2. Twinkling Starfield
            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                const alpha = s.baseAlpha * (0.65 + 0.35 * Math.sin(auroraTime * s.twinkleSpeed + s.twinklePhase));
                ctx.fillStyle = `rgba(225, 240, 255, ${alpha.toFixed(3)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 3. Flowing Aurora Borealis Curtains
            ctx.save();
            ctx.globalCompositeOperation = 'screen';

            const step = 12;
            for (let l = 0; l < auroraLayers.length; l++) {
                const layer = auroraLayers[l];
                const baseY = h * layer.baseYRatio;
                const ribbonH = h * layer.heightRatio;

                const bottomPoints = [];
                const topPoints = [];
                let minTopY = h;
                let maxBotY = 0;

                for (let x = -step; x <= w + step; x += step) {
                    const wave1 = Math.sin(x * layer.freq1 + auroraTime * layer.speed1 + layer.phase) * layer.amp1;
                    const wave2 = Math.cos(x * layer.freq2 + auroraTime * layer.speed2 - layer.phase) * layer.amp2;
                    const shimmer = Math.sin(x * 0.028 - auroraTime * 1.4 + l) * (ribbonH * 0.16);

                    const botY = baseY + wave1 + wave2;
                    const topY = botY - ribbonH - shimmer;

                    bottomPoints.push({ x, y: botY });
                    topPoints.push({ x, y: topY });

                    if (topY < minTopY) minTopY = topY;
                    if (botY > maxBotY) maxBotY = botY;
                }

                // Vertical Aurora Color Gradient (Violet top -> Cyan mid -> Emerald green base)
                const auroraGrad = ctx.createLinearGradient(0, minTopY, 0, maxBotY);
                for (const c of layer.colors) {
                    auroraGrad.addColorStop(c.stop, c.color);
                }

                ctx.beginPath();
                ctx.moveTo(topPoints[0].x, topPoints[0].y);
                for (let i = 1; i < topPoints.length; i++) {
                    ctx.lineTo(topPoints[i].x, topPoints[i].y);
                }
                for (let i = bottomPoints.length - 1; i >= 0; i--) {
                    ctx.lineTo(bottomPoints[i].x, bottomPoints[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = auroraGrad;
                ctx.fill();

                // Luminous lower curtain ridge
                ctx.beginPath();
                ctx.moveTo(bottomPoints[0].x, bottomPoints[0].y);
                for (let i = 1; i < bottomPoints.length; i++) {
                    ctx.lineTo(bottomPoints[i].x, bottomPoints[i].y);
                }
                ctx.strokeStyle = layer.edgeColor;
                ctx.lineWidth = 2.2;
                ctx.shadowColor = 'rgba(45, 255, 160, 0.45)';
                ctx.shadowBlur = 14;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        function drawFish(f) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, Math.min(1, f.alpha));
            ctx.translate(f.x, f.y);

            const facing = f.vx >= 0 ? 1 : -1;
            const tilt = Math.max(-0.25, Math.min(0.25, f.vy * 0.008));
            ctx.scale(facing * f.scale, f.scale);
            ctx.rotate(tilt);

            const r = f.size;
            const wag = Math.sin(f.tailPhase) * 4.5;

            // Soft ambient glow
            const glow = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 1.9);
            glow.addColorStop(0, f.palette.glow);
            glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, r * 1.9, 0, Math.PI * 2);
            ctx.fill();

            // Tail fin (wagging)
            ctx.fillStyle = f.palette.fin;
            ctx.beginPath();
            ctx.moveTo(-r * 0.85, 0);
            ctx.lineTo(-r * 1.55, -r * 0.58 + wag * 0.5);
            ctx.quadraticCurveTo(-r * 1.3, wag * 0.25, -r * 1.55, r * 0.58 + wag * 0.5);
            ctx.closePath();
            ctx.fill();

            // Dorsal fin
            ctx.fillStyle = f.palette.fin;
            ctx.beginPath();
            ctx.moveTo(-r * 0.2, -r * 0.52);
            ctx.quadraticCurveTo(r * 0.05, -r * 0.95, r * 0.35, -r * 0.48);
            ctx.closePath();
            ctx.fill();

            // Main fish body
            const bodyGrad = ctx.createLinearGradient(0, -r * 0.6, 0, r * 0.6);
            bodyGrad.addColorStop(0, f.palette.body);
            bodyGrad.addColorStop(1, f.palette.belly);
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.ellipse(0, 0, r, r * 0.56, 0, 0, Math.PI * 2);
            ctx.fill();

            // Pectoral side fin
            ctx.fillStyle = f.palette.fin;
            ctx.beginPath();
            ctx.ellipse(r * 0.05, r * 0.14, r * 0.28, r * 0.14, -0.45, 0, Math.PI * 2);
            ctx.fill();

            // Eye
            ctx.fillStyle = '#0e1624';
            ctx.beginPath();
            ctx.arc(r * 0.52, -r * 0.12, r * 0.14, 0, Math.PI * 2);
            ctx.fill();

            // Eye catchlight
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(r * 0.56, -r * 0.16, r * 0.055, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawCatchEffects() {
            for (const eff of catchEffects) {
                const progress = eff.age / eff.duration;
                const alpha = 1 - progress;

                ctx.save();
                // Expanding ripple ring
                ctx.strokeStyle = `rgba(126, 249, 200, ${(alpha * 0.75).toFixed(3)})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(eff.x, eff.y, 10 + progress * 34, 0, Math.PI * 2);
                ctx.stroke();

                // Sparkle particles
                ctx.globalAlpha = alpha;
                for (const p of eff.particles) {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius * (1 - progress * 0.5), 0, Math.PI * 2);
                    ctx.fill();
                }

                // Floating "+1" text
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px "Courier New", Courier, monospace';
                ctx.textAlign = 'center';
                ctx.fillText('+1', eff.x, eff.y - 12 - progress * 24);
                ctx.restore();
            }
        }

        function drawSeaOtter(cx, cy) {
            const bobY = Math.sin(auroraTime * 2.5) * 1.5;

            ctx.save();
            ctx.translate(cx, cy + bobY);

            // Soft ambient glow behind the sea otter
            const aura = ctx.createRadialGradient(0, 0, 6, 0, 0, 36);
            aura.addColorStop(0, 'rgba(180, 235, 255, 0.25)');
            aura.addColorStop(1, 'rgba(180, 235, 255, 0)');
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(0, 0, 36, 0, Math.PI * 2);
            ctx.fill();

            // 1. Tail (gently curved on the left)
            ctx.fillStyle = '#4a3121';
            ctx.beginPath();
            ctx.moveTo(-16, 2);
            ctx.quadraticCurveTo(-29, 3, -32, 7);
            ctx.quadraticCurveTo(-28, 11, -15, 8);
            ctx.closePath();
            ctx.fill();

            // 2. Hind Flippers
            ctx.fillStyle = '#3b2518';
            ctx.beginPath();
            ctx.ellipse(-20, -4, 6, 3.2, -0.35, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(-20, 7, 6, 3.2, 0.35, 0, Math.PI * 2);
            ctx.fill();

            // 3. Main Torso (floating on back)
            ctx.fillStyle = '#6e4930';
            ctx.beginPath();
            ctx.ellipse(-3, 1, 16, 11, 0, 0, Math.PI * 2);
            ctx.fill();

            // Creamy-tan chest & belly fur
            ctx.fillStyle = '#bfa084';
            ctx.beginPath();
            ctx.ellipse(-2, 0, 11, 7.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // 4. Scallop Shell resting on chest
            ctx.fillStyle = '#f3d9dc';
            ctx.strokeStyle = '#c49aa0';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.arc(-2, -1, 4.6, Math.PI * 0.15, Math.PI * 0.85, true);
            ctx.lineTo(-2, 3.6);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Shell ridges
            ctx.beginPath();
            ctx.moveTo(-2, 3.6);
            ctx.lineTo(-3.6, -5.0);
            ctx.moveTo(-2, 3.6);
            ctx.lineTo(-0.4, -5.0);
            ctx.stroke();

            // 5. Front Paws holding the shell
            ctx.fillStyle = '#573824';
            ctx.beginPath();
            ctx.ellipse(-5, -3.8, 3.6, 2.3, 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(-5, 3.8, 3.6, 2.3, -0.4, 0, Math.PI * 2);
            ctx.fill();

            // 6. Head (right side)
            const headX = 13;
            const headY = -2;
            const faceX = headX + 1.5;

            // Ears
            ctx.fillStyle = '#4a3121';
            ctx.beginPath();
            ctx.arc(headX - 3, headY - 9.5, 2.8, 0, Math.PI * 2);
            ctx.arc(headX + 4.5, headY - 8.5, 2.8, 0, Math.PI * 2);
            ctx.fill();

            // Head fur base
            ctx.fillStyle = '#7d553a';
            ctx.beginPath();
            ctx.arc(headX, headY, 10.5, 0, Math.PI * 2);
            ctx.fill();

            // Pale cream sea otter face
            ctx.fillStyle = '#ead5be';
            ctx.beginPath();
            ctx.ellipse(faceX, headY + 0.6, 8.2, 7.4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Muzzle whisker pads
            ctx.fillStyle = '#f5e6d6';
            ctx.beginPath();
            ctx.ellipse(faceX - 1.8, headY + 2.4, 3.2, 2.3, 0, 0, Math.PI * 2);
            ctx.ellipse(faceX + 1.8, headY + 2.4, 3.2, 2.3, 0, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#170f0a';
            ctx.beginPath();
            ctx.arc(faceX - 3.2, headY - 2, 1.45, 0, Math.PI * 2);
            ctx.arc(faceX + 3.2, headY - 2, 1.45, 0, Math.PI * 2);
            ctx.fill();

            // Eye catchlights
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(faceX - 3.6, headY - 2.4, 0.5, 0, Math.PI * 2);
            ctx.arc(faceX + 2.8, headY - 2.4, 0.5, 0, Math.PI * 2);
            ctx.fill();

            // Nose
            ctx.fillStyle = '#261710';
            ctx.beginPath();
            ctx.moveTo(faceX - 1.6, headY + 0.2);
            ctx.lineTo(faceX + 1.6, headY + 0.2);
            ctx.lineTo(faceX, headY + 2.3);
            ctx.closePath();
            ctx.fill();

            // Mouth
            ctx.strokeStyle = '#4a3121';
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.moveTo(faceX, headY + 2.3);
            ctx.quadraticCurveTo(faceX - 1.3, headY + 3.8, faceX - 2.6, headY + 3.2);
            ctx.moveTo(faceX, headY + 2.3);
            ctx.quadraticCurveTo(faceX + 1.3, headY + 3.8, faceX + 2.6, headY + 3.2);
            ctx.stroke();

            // Whiskers
            ctx.strokeStyle = 'rgba(255, 250, 242, 0.8)';
            ctx.lineWidth = 0.75;
            ctx.beginPath();
            ctx.moveTo(faceX - 3.5, headY + 2.1);
            ctx.lineTo(faceX - 10.5, headY + 1.1);
            ctx.moveTo(faceX - 3.5, headY + 3.1);
            ctx.lineTo(faceX - 10.2, headY + 3.7);
            ctx.moveTo(faceX + 3.5, headY + 2.1);
            ctx.lineTo(faceX + 10.5, headY + 1.1);
            ctx.moveTo(faceX + 3.5, headY + 3.1);
            ctx.lineTo(faceX + 10.2, headY + 3.7);
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            // Render Northern Lights background
            drawNorthernLights();

            // 1. Draw Background Fish
            for (const f of fishes) {
                drawFish(f);
            }

            // 2. Draw Catch Effects
            drawCatchEffects();

            // 3. Draw Central Sea Otter
            drawSeaOtter(centralNode.x, centralNode.y);

            // 4. Draw Ball & Trail
            for (const b of balls) {
                // Draw path line
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }

                // Draw ball object with rainbow gradient and cycling hue
                const rainbowGradient = ctx.createLinearGradient(
                    b.x - b.radius,
                    b.y - b.radius,
                    b.x + b.radius,
                    b.y + b.radius
                );
                rainbowGradient.addColorStop(0, `hsl(${b.hue}, 100%, 60%)`);
                rainbowGradient.addColorStop(0.5, `hsl(${(b.hue + 60) % 360}, 100%, 55%)`);
                rainbowGradient.addColorStop(1, `hsl(${(b.hue + 120) % 360}, 100%, 50%)`);

                ctx.save();
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = rainbowGradient;
                ctx.shadowColor = `hsl(${b.hue}, 100%, 55%)`;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            }
        }

        function animate(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
            lastTimestamp = timestamp;

            updatePhysics(dt);
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
