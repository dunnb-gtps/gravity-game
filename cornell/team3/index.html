<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Baseline</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .score-box {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 5px 14px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background-color: rgba(255, 255, 255, 0.06);
        }

        .score-box span {
            color: #eeff54;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #121722;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <div class="header-controls">
            <div class="score-box">Points: <span id="scoreValue">0</span></div>
            <button class="btn-reset" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas to launch a tennis ball. Hit the center yarn ball to score a point!
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const scoreValueEl = document.getElementById('scoreValue');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;          // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;      // Prevents infinite velocity near center

        // STATE VARIABLES
        let balls = [];
        let bgPattern = null;
        let score = 0;
        let hitEffects = [];
        let centerPulse = 0;

        // Central Gravity Node Definition (Yarn Ball)
        const centralNode = {
            x: 0,
            y: 0,
            radius: 20
        };

        function updateScoreDisplay() {
            scoreValueEl.textContent = score;
        }

        // Build seamless cats-and-dogs background pattern
        function createCatsAndDogsPattern() {
            const tile = document.createElement('canvas');
            const size = 360;
            tile.width = size;
            tile.height = size;
            const pctx = tile.getContext('2d');

            // Deep midnight backdrop so foreground elements stay sharp
            pctx.fillStyle = '#121722';
            pctx.fillRect(0, 0, size, size);

            // Helper: Draw a small paw print
            function drawPaw(x, y, angle, scale) {
                pctx.save();
                pctx.translate(x, y);
                pctx.rotate(angle);
                pctx.scale(scale, scale);
                pctx.fillStyle = 'rgba(255, 255, 255, 0.12)';

                // Main pad
                pctx.beginPath();
                pctx.ellipse(0, 4, 8, 6, 0, 0, Math.PI * 2);
                pctx.fill();

                // Four toes
                const toes = [
                    { x: -9, y: -4, r: 3.2 },
                    { x: -3.5, y: -8, r: 3.5 },
                    { x: 3.5, y: -8, r: 3.5 },
                    { x: 9, y: -4, r: 3.2 }
                ];
                for (const t of toes) {
                    pctx.beginPath();
                    pctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
                    pctx.fill();
                }
                pctx.restore();
            }

            // Helper: Draw Ginger Tabby Cat Face
            function drawGingerCat(x, y) {
                pctx.save();
                pctx.translate(x, y);
                pctx.globalAlpha = 0.82;

                // Pointed ears
                pctx.fillStyle = '#c97538';
                pctx.beginPath();
                pctx.moveTo(-26, -12);
                pctx.lineTo(-30, -43);
                pctx.lineTo(-6, -24);
                pctx.closePath();
                pctx.fill();

                pctx.beginPath();
                pctx.moveTo(26, -12);
                pctx.lineTo(30, -43);
                pctx.lineTo(6, -24);
                pctx.closePath();
                pctx.fill();

                // Pink inner ears
                pctx.fillStyle = '#c46d7a';
                pctx.beginPath();
                pctx.moveTo(-23, -15);
                pctx.lineTo(-26, -35);
                pctx.lineTo(-10, -23);
                pctx.closePath();
                pctx.fill();

                pctx.beginPath();
                pctx.moveTo(23, -15);
                pctx.lineTo(26, -35);
                pctx.lineTo(10, -23);
                pctx.closePath();
                pctx.fill();

                // Head
                pctx.fillStyle = '#c97538';
                pctx.beginPath();
                pctx.ellipse(0, 0, 32, 26, 0, 0, Math.PI * 2);
                pctx.fill();

                // Tabby forehead stripes
                pctx.strokeStyle = '#8a4619';
                pctx.lineWidth = 2.5;
                pctx.lineCap = 'round';
                for (const sx of [-7, 0, 7]) {
                    pctx.beginPath();
                    pctx.moveTo(sx, -23);
                    pctx.lineTo(sx, -14);
                    pctx.stroke();
                }

                // Eyes
                pctx.fillStyle = '#181412';
                pctx.beginPath();
                pctx.arc(-11, -3, 3.8, 0, Math.PI * 2);
                pctx.arc(11, -3, 3.8, 0, Math.PI * 2);
                pctx.fill();

                pctx.fillStyle = '#ffffff';
                pctx.beginPath();
                pctx.arc(-12, -4.2, 1.3, 0, Math.PI * 2);
                pctx.arc(10, -4.2, 1.3, 0, Math.PI * 2);
                pctx.fill();

                // Pink triangle nose
                pctx.fillStyle = '#d97a86';
                pctx.beginPath();
                pctx.moveTo(-3.5, 4);
                pctx.lineTo(3.5, 4);
                pctx.lineTo(0, 8);
                pctx.closePath();
                pctx.fill();

                // Cat mouth ("w")
                pctx.strokeStyle = '#3b1e0c';
                pctx.lineWidth = 1.8;
                pctx.beginPath();
                pctx.moveTo(-6, 10);
                pctx.quadraticCurveTo(-3, 13, 0, 8);
                pctx.quadraticCurveTo(3, 13, 6, 10);
                pctx.stroke();

                // Whiskers
                pctx.strokeStyle = 'rgba(255, 245, 235, 0.7)';
                pctx.lineWidth = 1.3;
                for (const side of [-1, 1]) {
                    for (let w = -1; w <= 1; w++) {
                        pctx.beginPath();
                        pctx.moveTo(side * 18, 5 + w * 4);
                        pctx.lineTo(side * 38, 3 + w * 6);
                        pctx.stroke();
                    }
                }

                pctx.restore();
            }

            // Helper: Draw Golden Floppy-Eared Dog Face
            function drawGoldenDog(x, y) {
                pctx.save();
                pctx.translate(x, y);
                pctx.globalAlpha = 0.82;

                // Floppy ears
                pctx.fillStyle = '#8c5830';
                pctx.beginPath();
                pctx.ellipse(-30, 5, 10, 23, 0.24, 0, Math.PI * 2);
                pctx.fill();

                pctx.beginPath();
                pctx.ellipse(30, 5, 10, 23, -0.24, 0, Math.PI * 2);
                pctx.fill();

                // Head
                pctx.fillStyle = '#cfa063';
                pctx.beginPath();
                pctx.ellipse(0, 0, 29, 27, 0, 0, Math.PI * 2);
                pctx.fill();

                // Cream muzzle
                pctx.fillStyle = '#e6cfa8';
                pctx.beginPath();
                pctx.ellipse(0, 9, 17, 13, 0, 0, Math.PI * 2);
                pctx.fill();

                // Eyes
                pctx.fillStyle = '#1c140e';
                pctx.beginPath();
                pctx.arc(-11, -6, 3.8, 0, Math.PI * 2);
                pctx.arc(11, -6, 3.8, 0, Math.PI * 2);
                pctx.fill();

                pctx.fillStyle = '#ffffff';
                pctx.beginPath();
                pctx.arc(-12, -7.2, 1.3, 0, Math.PI * 2);
                pctx.arc(10, -7.2, 1.3, 0, Math.PI * 2);
                pctx.fill();

                // Happy pink tongue
                pctx.fillStyle = '#d46a7a';
                pctx.beginPath();
                pctx.ellipse(0, 17, 5, 6.5, 0, 0, Math.PI);
                pctx.fill();

                // Dog nose
                pctx.fillStyle = '#241811';
                pctx.beginPath();
                pctx.ellipse(0, 3.5, 6.5, 4.8, 0, 0, Math.PI * 2);
                pctx.fill();

                // Smile lines
                pctx.strokeStyle = '#3b2618';
                pctx.lineWidth = 1.8;
                pctx.beginPath();
                pctx.moveTo(0, 8);
                pctx.lineTo(0, 12);
                pctx.moveTo(-8, 12);
                pctx.quadraticCurveTo(0, 16, 8, 12);
                pctx.stroke();

                pctx.restore();
            }

            // Helper: Draw Sitting Grey Tuxedo Cat
            function drawSittingCat(x, y) {
                pctx.save();
                pctx.translate(x, y);
                pctx.globalAlpha = 0.82;

                // Curled tail
                pctx.strokeStyle = '#636f82';
                pctx.lineWidth = 7;
                pctx.lineCap = 'round';
                pctx.beginPath();
                pctx.moveTo(14, 34);
                pctx.bezierCurveTo(42, 34, 44, 6, 28, 2);
                pctx.stroke();

                // Body
                pctx.fillStyle = '#636f82';
                pctx.beginPath();
                pctx.ellipse(0, 17, 21, 25, 0, 0, Math.PI * 2);
                pctx.fill();

                // White chest patch
                pctx.fillStyle = '#dce2ea';
                pctx.beginPath();
                pctx.ellipse(0, 15, 10, 15, 0, 0, Math.PI * 2);
                pctx.fill();

                // Ears
                pctx.fillStyle = '#636f82';
                pctx.beginPath();
                pctx.moveTo(-20, -18);
                pctx.lineTo(-22, -40);
                pctx.lineTo(-5, -26);
                pctx.closePath();
                pctx.fill();

                pctx.beginPath();
                pctx.moveTo(20, -18);
                pctx.lineTo(22, -40);
                pctx.lineTo(5, -26);
                pctx.closePath();
                pctx.fill();

                // Head
                pctx.beginPath();
                pctx.ellipse(0, -13, 23, 19, 0, 0, Math.PI * 2);
                pctx.fill();

                // Eyes
                pctx.fillStyle = '#e6c86e';
                pctx.beginPath();
                pctx.arc(-8, -14, 3.5, 0, Math.PI * 2);
                pctx.arc(8, -14, 3.5, 0, Math.PI * 2);
                pctx.fill();

                pctx.fillStyle = '#12151c';
                pctx.beginPath();
                pctx.ellipse(-8, -14, 1.4, 3, 0, 0, Math.PI * 2);
                pctx.ellipse(8, -14, 1.4, 3, 0, 0, Math.PI * 2);
                pctx.fill();

                // Nose & Whiskers
                pctx.fillStyle = '#d97a86';
                pctx.beginPath();
                pctx.arc(0, -8, 2.4, 0, Math.PI * 2);
                pctx.fill();

                pctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
                pctx.lineWidth = 1.2;
                for (const side of [-1, 1]) {
                    pctx.beginPath();
                    pctx.moveTo(side * 12, -8);
                    pctx.lineTo(side * 28, -10);
                    pctx.moveTo(side * 12, -5);
                    pctx.lineTo(side * 28, -4);
                    pctx.stroke();
                }

                pctx.restore();
            }

            // Helper: Draw Spotted Beagle Pup
            function drawSpottedDog(x, y) {
                pctx.save();
                pctx.translate(x, y);
                pctx.globalAlpha = 0.82;

                // Folded ears
                pctx.fillStyle = '#6e452b';
                pctx.beginPath();
                pctx.ellipse(-26, -6, 9, 19, 0.35, 0, Math.PI * 2);
                pctx.fill();

                pctx.beginPath();
                pctx.ellipse(26, -6, 9, 19, -0.35, 0, Math.PI * 2);
                pctx.fill();

                // Cream head
                pctx.fillStyle = '#dfd5c5';
                pctx.beginPath();
                pctx.ellipse(0, 0, 27, 25, 0, 0, Math.PI * 2);
                pctx.fill();

                // Brown eye patch
                pctx.fillStyle = '#7c4d2f';
                pctx.beginPath();
                pctx.ellipse(-11, -5, 11, 10, -0.2, 0, Math.PI * 2);
                pctx.fill();

                // Eyes
                pctx.fillStyle = '#1a1410';
                pctx.beginPath();
                pctx.arc(-11, -5, 3.6, 0, Math.PI * 2);
                pctx.arc(11, -5, 3.6, 0, Math.PI * 2);
                pctx.fill();

                pctx.fillStyle = '#ffffff';
                pctx.beginPath();
                pctx.arc(-12, -6.2, 1.2, 0, Math.PI * 2);
                pctx.arc(10, -6.2, 1.2, 0, Math.PI * 2);
                pctx.fill();

                // Collar & Gold Tag
                pctx.strokeStyle = '#b84a4a';
                pctx.lineWidth = 4.5;
                pctx.lineCap = 'round';
                pctx.beginPath();
                pctx.arc(0, 6, 22, 0.25 * Math.PI, 0.75 * Math.PI);
                pctx.stroke();

                pctx.fillStyle = '#e0b84c';
                pctx.beginPath();
                pctx.arc(0, 30, 4, 0, Math.PI * 2);
                pctx.fill();

                // Nose & Mouth
                pctx.fillStyle = '#241811';
                pctx.beginPath();
                pctx.ellipse(0, 5, 6, 4.5, 0, 0, Math.PI * 2);
                pctx.fill();

                pctx.strokeStyle = '#3b2618';
                pctx.lineWidth = 1.7;
                pctx.beginPath();
                pctx.moveTo(0, 9);
                pctx.lineTo(0, 14);
                pctx.moveTo(-7, 13);
                pctx.quadraticCurveTo(0, 17, 7, 13);
                pctx.stroke();

                pctx.restore();
            }

            // Populate tile with cats, dogs, and paw prints
            drawGingerCat(85, 85);
            drawGoldenDog(265, 95);
            drawSpottedDog(85, 265);
            drawSittingCat(265, 265);

            drawPaw(175, 45, -0.3, 0.95);
            drawPaw(40, 175, 0.4, 0.9);
            drawPaw(180, 180, -0.2, 1.05);
            drawPaw(320, 185, 0.35, 0.9);
            drawPaw(175, 315, 0.25, 0.95);

            return ctx.createPattern(tile, 'repeat');
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        bgPattern = createCatsAndDogsPattern();
        resizeCanvas();

        // Canvas Click Handler: Directly launch ball at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchBall(clickX, clickY);
        });

        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Overwrite existing array to strictly maintain a single ball on screen
            balls = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 10,
                rotation: 0,
                trail: [] // Stores history of past {x, y} coordinates
            }];
        }

        function resetSimulation() {
            balls = [];
            hitEffects = [];
            centerPulse = 0;
            score = 0;
            updateScoreDisplay();
        }

        function updatePhysics() {
            // Decay center node hit pulse
            if (centerPulse > 0) {
                centerPulse = Math.max(0, centerPulse - 0.06);
            }

            // Update floating +1 point effects
            for (let i = hitEffects.length - 1; i >= 0; i--) {
                const fx = hitEffects[i];
                fx.y -= 1.1;
                fx.ringRadius += 1.6;
                fx.alpha -= 0.025;
                if (fx.alpha <= 0) {
                    hitEffects.splice(i, 1);
                }
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove ball if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass -> score 1 point
                if (dist < centralNode.radius + b.radius) {
                    score += 1;
                    updateScoreDisplay();
                    centerPulse = 1;
                    hitEffects.push({
                        x: centralNode.x,
                        y: centralNode.y - centralNode.radius - 10,
                        ringRadius: centralNode.radius,
                        alpha: 1
                    });
                    balls.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity, position, and ball spin
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;
                b.rotation += Math.hypot(b.vx, b.vy) * 0.03;

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }
        }

        // Draw the moving projectile as a tennis ball
        function drawTennisBall(x, y, r, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);

            // Base sphere fill so outer drop shadow renders around the ball
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = '#c8e619';
            ctx.fill();

            // Disable outer shadow for crisp interior shading & seams
            ctx.shadowColor = 'transparent';
            ctx.clip();

            // 1. Optic-yellow felt radial gradient
            const feltGrad = ctx.createRadialGradient(-r * 0.32, -r * 0.32, r * 0.1, 0, 0, r);
            feltGrad.addColorStop(0, '#eeff54');
            feltGrad.addColorStop(0.55, '#c6e317');
            feltGrad.addColorStop(1, '#7c9606');
            ctx.fillStyle = feltGrad;
            ctx.fillRect(-r, -r, r * 2, r * 2);

            // 2. Subtle fuzzy felt texture specks
            ctx.fillStyle = 'rgba(255, 255, 225, 0.24)';
            const fuzzPoints = [
                [-0.45, -0.2], [0.3, -0.45], [-0.15, 0.45], [0.45, 0.25],
                [0.05, -0.15], [-0.35, 0.25], [0.25, 0.05], [-0.1, -0.5]
            ];
            for (const [fx, fy] of fuzzPoints) {
                ctx.beginPath();
                ctx.arc(fx * r, fy * r, 0.75, 0, Math.PI * 2);
                ctx.fill();
            }

            // 3. Classic curved white tennis ball seams
            ctx.lineCap = 'round';

            // Dark seam groove underneath white rubber
            ctx.strokeStyle = 'rgba(72, 88, 4, 0.48)';
            ctx.lineWidth = r * 0.25;
            ctx.beginPath();
            ctx.arc(-r * 1.15, 0, r * 0.92, -Math.PI * 0.42, Math.PI * 0.42);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(r * 1.15, 0, r * 0.92, Math.PI - Math.PI * 0.42, Math.PI + Math.PI * 0.42);
            ctx.stroke();

            // Crisp off-white seam lines
            ctx.strokeStyle = '#f7f9f0';
            ctx.lineWidth = r * 0.16;
            ctx.beginPath();
            ctx.arc(-r * 1.15, 0, r * 0.92, -Math.PI * 0.42, Math.PI * 0.42);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(r * 1.15, 0, r * 0.92, Math.PI - Math.PI * 0.42, Math.PI + Math.PI * 0.42);
            ctx.stroke();

            ctx.restore();

            // 4. Subtle outer rim highlight
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(245, 255, 170, 0.45)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }

        // Draw the central gravity node as a detailed ball of yarn
        function drawYarnBall(cx, cy, r) {
            ctx.save();

            // 1. Loose trailing yarn strand curling out from the bottom-right
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(cx + r * 0.45, cy + r * 0.72);
            ctx.bezierCurveTo(
                cx + r * 1.15, cy + r * 1.15,
                cx + r * 1.45, cy + r * 0.55,
                cx + r * 1.85, cy + r * 0.85
            );
            ctx.strokeStyle = '#c93848';
            ctx.lineWidth = 2.6;
            ctx.stroke();

            // Disable outer drop shadow for crisp internal strand rendering
            ctx.shadowColor = 'transparent';

            // Subtle highlight along the loose strand
            ctx.beginPath();
            ctx.moveTo(cx + r * 0.45, cy + r * 0.72 - 0.5);
            ctx.bezierCurveTo(
                cx + r * 1.15, cy + r * 1.15 - 0.5,
                cx + r * 1.45, cy + r * 0.55 - 0.5,
                cx + r * 1.85, cy + r * 0.85 - 0.5
            );
            ctx.strokeStyle = 'rgba(255, 190, 198, 0.45)';
            ctx.lineWidth = 0.9;
            ctx.stroke();

            // 2. Clip to main yarn ball sphere
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();

            // Base spherical gradient
            const baseGrad = ctx.createRadialGradient(
                cx - r * 0.3, cy - r * 0.3, r * 0.1,
                cx, cy, r
            );
            baseGrad.addColorStop(0, '#f06878');
            baseGrad.addColorStop(0.55, '#d13b4c');
            baseGrad.addColorStop(1, '#851b27');
            ctx.fillStyle = baseGrad;
            ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

            // Helper to draw a wrapped bundle of parallel yarn strands at an angle
            function drawYarnBand(angle, offsetY, bandWidth, curveAmount, strandCount) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);

                // Band base fill so overlapping bundles layer naturally
                ctx.beginPath();
                ctx.moveTo(-r * 1.2, offsetY - bandWidth / 2);
                ctx.quadraticCurveTo(0, offsetY - bandWidth / 2 + curveAmount, r * 1.2, offsetY - bandWidth / 2);
                ctx.lineTo(r * 1.2, offsetY + bandWidth / 2);
                ctx.quadraticCurveTo(0, offsetY + bandWidth / 2 + curveAmount, -r * 1.2, offsetY + bandWidth / 2);
                ctx.closePath();
                ctx.fillStyle = '#cf3a4b';
                ctx.fill();

                // Band edge crease
                ctx.strokeStyle = 'rgba(75, 12, 20, 0.65)';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // Individual parallel yarn threads within the bundle
                for (let i = 0; i < strandCount; i++) {
                    const frac = (i + 0.5) / strandCount - 0.5;
                    const yPos = offsetY + frac * bandWidth;

                    // Dark thread groove
                    ctx.beginPath();
                    ctx.moveTo(-r * 1.2, yPos);
                    ctx.quadraticCurveTo(0, yPos + curveAmount, r * 1.2, yPos);
                    ctx.strokeStyle = 'rgba(82, 14, 24, 0.55)';
                    ctx.lineWidth = 1.1;
                    ctx.stroke();

                    // Soft yarn fiber highlight
                    ctx.beginPath();
                    ctx.moveTo(-r * 1.2, yPos - 0.8);
                    ctx.quadraticCurveTo(0, yPos + curveAmount - 0.8, r * 1.2, yPos - 0.8);
                    ctx.strokeStyle = 'rgba(255, 185, 195, 0.35)';
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                }

                ctx.restore();
            }

            // Layer crisscrossing yarn bundles to create the wound-ball texture
            drawYarnBand(-0.55, -r * 0.35, r * 0.68, r * 0.25, 4);
            drawYarnBand(0.75, -r * 0.25, r * 0.72, -r * 0.22, 4);
            drawYarnBand(-0.15, r * 0.28, r * 0.75, r * 0.28, 4);
            drawYarnBand(1.15, r * 0.22, r * 0.65, -r * 0.25, 4);
            drawYarnBand(-0.85, r * 0.05, r * 0.58, r * 0.18, 3);

            // 3. Spherical 3D shading overlay
            const shadeGrad = ctx.createRadialGradient(
                cx - r * 0.35, cy - r * 0.35, r * 0.05,
                cx, cy, r
            );
            shadeGrad.addColorStop(0, 'rgba(255, 225, 230, 0.28)');
            shadeGrad.addColorStop(0.5, 'rgba(0, 0, 0, 0)');
            shadeGrad.addColorStop(1, 'rgba(35, 4, 10, 0.58)');
            ctx.fillStyle = shadeGrad;
            ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

            ctx.restore();

            // 4. Crisp outer rim
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 215, 220, 0.45)';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.restore();
        }

        function draw() {
            // Draw Cats & Dogs Background Pattern
            ctx.fillStyle = bgPattern || '#121722';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle shadow so foreground elements stay crisp over the background
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
            ctx.shadowBlur = 5;

            // 1. Draw Central Yarn Ball Node (with subtle bounce pulse on score)
            const pulseScale = 1 + centerPulse * 0.22;
            ctx.save();
            ctx.translate(centralNode.x, centralNode.y);
            ctx.scale(pulseScale, pulseScale);
            ctx.translate(-centralNode.x, -centralNode.y);
            drawYarnBall(centralNode.x, centralNode.y, centralNode.radius);
            ctx.restore();

            // 2. Draw Tennis Ball & Trail
            for (const b of balls) {
                // Draw path line
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = 'rgba(235, 255, 110, 0.8)';
                    ctx.lineWidth = 1.4;
                    ctx.stroke();
                }

                // Draw tennis ball object
                drawTennisBall(b.x, b.y, b.radius, b.rotation);
            }

            // 3. Draw Score Hit Effects (+1 popup & expanding ring)
            for (const fx of hitEffects) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(centralNode.x, centralNode.y, fx.ringRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(238, 255, 84, ${fx.alpha * 0.75})`;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.font = 'bold 18px "Courier New", Courier, monospace';
                ctx.textAlign = 'center';
                ctx.fillStyle = `rgba(238, 255, 84, ${fx.alpha})`;
                ctx.fillText('+1', fx.x, fx.y);
                ctx.restore();
            }

            ctx.restore();
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
