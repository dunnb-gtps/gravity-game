<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        #ballCounter {
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <div class="header-controls">
            <span id="ballCounter">Balls: 0</span>
            <button class="btn-reset" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas to launch multiple balls.
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const ballCounter = document.getElementById('ballCounter');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;          // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;      // Prevents infinite velocity near center
        const MAX_BALLS = 50;              // Maximum simultaneous balls on screen

        // Natural sky rainbow spectrum in ROYGBIV order
        const RAINBOW_COLORS = [
            '#FF0000', // Red
            '#FF7F00', // Orange
            '#FFFF00', // Yellow
            '#00E640', // Green
            '#1E90FF', // Blue
            '#5D3FD3', // Indigo
            '#BF00FF'  // Violet
        ];

        // STATE VARIABLES
        let balls = [];
        let rainbowIndex = 0;

        // Central Gravity Node Definition (radius matches duck visual size)
        const centralNode = {
            x: 0,
            y: 0,
            radius: 18
        };

        function updateBallCounter() {
            ballCounter.textContent = `Balls: ${balls.length}`;
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Canvas Click Handler: Launch a new ball at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchBall(clickX, clickY);
        });

        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Cap maximum balls on screen to preserve performance
            if (balls.length >= MAX_BALLS) {
                balls.shift();
            }

            // Pick the next color in the ROYGBIV rainbow sequence
            const color = RAINBOW_COLORS[rainbowIndex];
            rainbowIndex = (rainbowIndex + 1) % RAINBOW_COLORS.length;

            // Append new ball so multiple balls can be thrown and orbited at once
            balls.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4,
                color: color,
                trail: [] // Stores history of past {x, y} coordinates
            });

            updateBallCounter();
        }

        function resetSimulation() {
            balls = [];
            rainbowIndex = 0;
            updateBallCounter();
        }

        function updatePhysics() {
            let countChanged = false;

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove ball if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    countChanged = true;
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    balls.splice(i, 1);
                    countChanged = true;
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }

            if (countChanged) {
                updateBallCounter();
            }
        }

        /**
         * Renders a cute vector duck centered at (x, y) matching centralNode.radius = 18.
         */
        function drawDuck(x, y) {
            ctx.save();
            ctx.translate(x, y);

            // 1. Orange beak facing right (#FF8C00)
            ctx.beginPath();
            ctx.moveTo(13.5, -10.2);
            ctx.quadraticCurveTo(22.0, -8.5, 21.5, -7.0);
            ctx.quadraticCurveTo(21.0, -5.5, 13.2, -5.0);
            ctx.closePath();
            ctx.fillStyle = '#FF8C00';
            ctx.fill();

            // 2. Yellow body with upturned tail on the left (#FFD700)
            ctx.beginPath();
            ctx.moveTo(11.0, -2.0);
            ctx.quadraticCurveTo(15.0, 5.5, 11.5, 13.5);
            ctx.quadraticCurveTo(0.0, 16.5, -11.5, 13.0);
            ctx.quadraticCurveTo(-16.0, 9.5, -18.0, -3.0);
            ctx.quadraticCurveTo(-12.5, 1.5, -6.5, 1.0);
            ctx.quadraticCurveTo(-1.5, 0.5, 1.0, -3.5);
            ctx.closePath();
            ctx.fillStyle = '#FFD700';
            ctx.fill();

            // 3. Yellow head (#FFD700)
            ctx.beginPath();
            ctx.arc(7.0, -8.0, 7.5, 0, Math.PI * 2);
            ctx.fillStyle = '#FFD700';
            ctx.fill();

            // 4. Subtle curved wing line (#E6AC00)
            ctx.beginPath();
            ctx.moveTo(-5.5, 3.5);
            ctx.quadraticCurveTo(0.0, 11.5, 6.5, 6.0);
            ctx.strokeStyle = '#E6AC00';
            ctx.lineWidth = 1.6;
            ctx.lineCap = 'round';
            ctx.stroke();

            // 5. Dark eye (#000000) with tiny white highlight (#FFFFFF)
            ctx.beginPath();
            ctx.arc(9.5, -9.5, 2.1, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(10.2, -10.2, 0.75, 0, Math.PI * 2);
            ctx.fillStyle = '#FFFFFF';
            ctx.fill();

            ctx.restore();
        }

        function draw() {
            // Clear canvas background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Central Duck Node
            drawDuck(centralNode.x, centralNode.y);

            // 2. Draw Balls & Trails
            for (const b of balls) {
                // Draw path line
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = b.color;
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }

                // Draw ball object
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.fill();
            }
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
