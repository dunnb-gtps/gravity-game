<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #14213d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.7);
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        #ballCounter {
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #14213d;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #89cff0;
            border: 2px solid #ffffff;
            border-radius: 4px;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #cbd5e1;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <div class="header-controls">
            <span id="ballCounter">Balls: 0</span>
            <button class="btn-reset" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas to launch multiple balls.
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const ballCounter = document.getElementById('ballCounter');

        // Offscreen canvas to cache the ducks & rainbows background for smooth 60fps rendering
        const bgCanvas = document.createElement('canvas');
        const bgCtx = bgCanvas.getContext('2d');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;          // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;      // Prevents infinite velocity near center
        const MAX_BALLS = 50;              // Maximum simultaneous balls on screen

        // Natural sky rainbow spectrum in ROYGBIV order
        const RAINBOW_COLORS = [
            '#FF0000', // Red
            '#FF7F00', // Orange
            '#FFFF00', // Yellow
            '#00E640', // Green
            '#1E90FF', // Blue
            '#5D3FD3', // Indigo
            '#BF00FF'  // Violet
        ];

        // STATE VARIABLES
        let balls = [];
        let rainbowIndex = 0;

        // Central Gravity Node Definition (radius matches duck visual size)
        const centralNode = {
            x: 0,
            y: 0,
            radius: 18
        };

        function updateBallCounter() {
            ballCounter.textContent = `Balls: ${balls.length}`;
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            // Rebuild cached ducks-and-rainbows background to fit new dimensions
            bgCanvas.width = canvas.width;
            bgCanvas.height = canvas.height;
            renderBackground();
        }

        window.addEventListener('resize', resizeCanvas);

        // Canvas Click Handler: Launch a new ball at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchBall(clickX, clickY);
        });

        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Cap maximum balls on screen to preserve performance
            if (balls.length >= MAX_BALLS) {
                balls.shift();
            }

            // Pick the next color in the ROYGBIV rainbow sequence
            const color = RAINBOW_COLORS[rainbowIndex];
            rainbowIndex = (rainbowIndex + 1) % RAINBOW_COLORS.length;

            // Append new ball so multiple balls can be thrown and orbited at once
            balls.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4,
                color: color,
                trail: [] // Stores history of past {x, y} coordinates
            });

            updateBallCounter();
        }

        function resetSimulation() {
            balls = [];
            rainbowIndex = 0;
            updateBallCounter();
        }

        function updatePhysics() {
            let countChanged = false;

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove ball if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    countChanged = true;
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    balls.splice(i, 1);
                    countChanged = true;
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }

            if (countChanged) {
                updateBallCounter();
            }
        }

        /**
         * Renders a cute vector duck on the target 2D context.
         */
        function drawDuckSprite(targetCtx, x, y, scale = 1, flipX = false, rotation = 0, showRipples = false) {
            targetCtx.save();
            targetCtx.translate(x, y);
            targetCtx.rotate(rotation);
            targetCtx.scale(flipX ? -scale : scale, scale);

            // Optional subtle pond ripples underneath background ducks
            if (showRipples) {
                targetCtx.beginPath();
                targetCtx.ellipse(0, 16.5, 19, 3.2, 0, 0.1 * Math.PI, 0.9 * Math.PI);
                targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
                targetCtx.lineWidth = 1.4;
                targetCtx.lineCap = 'round';
                targetCtx.stroke();
            }

            // 1. Orange beak facing right (#FF8C00)
            targetCtx.beginPath();
            targetCtx.moveTo(13.5, -10.2);
            targetCtx.quadraticCurveTo(22.0, -8.5, 21.5, -7.0);
            targetCtx.quadraticCurveTo(21.0, -5.5, 13.2, -5.0);
            targetCtx.closePath();
            targetCtx.fillStyle = '#FF8C00';
            targetCtx.fill();

            // 2. Yellow body with upturned tail on the left (#FFD700)
            targetCtx.beginPath();
            targetCtx.moveTo(11.0, -2.0);
            targetCtx.quadraticCurveTo(15.0, 5.5, 11.5, 13.5);
            targetCtx.quadraticCurveTo(0.0, 16.5, -11.5, 13.0);
            targetCtx.quadraticCurveTo(-16.0, 9.5, -18.0, -3.0);
            targetCtx.quadraticCurveTo(-12.5, 1.5, -6.5, 1.0);
            targetCtx.quadraticCurveTo(-1.5, 0.5, 1.0, -3.5);
            targetCtx.closePath();
            targetCtx.fillStyle = '#FFD700';
            targetCtx.fill();

            // 3. Yellow head (#FFD700)
            targetCtx.beginPath();
            targetCtx.arc(7.0, -8.0, 7.5, 0, Math.PI * 2);
            targetCtx.fillStyle = '#FFD700';
            targetCtx.fill();

            // 4. Subtle curved wing line (#E6AC00)
            targetCtx.beginPath();
            targetCtx.moveTo(-5.5, 3.5);
            targetCtx.quadraticCurveTo(0.0, 11.5, 6.5, 6.0);
            targetCtx.strokeStyle = '#E6AC00';
            targetCtx.lineWidth = 1.6;
            targetCtx.lineCap = 'round';
            targetCtx.stroke();

            // 5. Dark eye (#000000) with tiny white highlight (#FFFFFF)
            targetCtx.beginPath();
            targetCtx.arc(9.5, -9.5, 2.1, 0, Math.PI * 2);
            targetCtx.fillStyle = '#000000';
            targetCtx.fill();

            targetCtx.beginPath();
            targetCtx.arc(10.2, -10.2, 0.75, 0, Math.PI * 2);
            targetCtx.fillStyle = '#FFFFFF';
            targetCtx.fill();

            targetCtx.restore();
        }

        /**
         * Renders a 7-band rainbow arc with fluffy clouds at both ends.
         */
        function drawRainbowSprite(targetCtx, x, y, outerRadius = 44, rotation = 0) {
            targetCtx.save();
            targetCtx.translate(x, y);
            targetCtx.rotate(rotation);

            const bandWidth = 3.4;

            // Draw ROYGBIV bands from outermost to innermost
            for (let i = 0; i < RAINBOW_COLORS.length; i++) {
                const r = outerRadius - i * bandWidth;
                if (r <= 4) break;
                targetCtx.beginPath();
                targetCtx.arc(0, 0, r, Math.PI, 0, false);
                targetCtx.strokeStyle = RAINBOW_COLORS[i];
                targetCtx.lineWidth = bandWidth + 0.6;
                targetCtx.lineCap = 'butt';
                targetCtx.stroke();
            }

            // Fluffy cloud helper at the two base ends of the rainbow
            const midRadius = outerRadius - (RAINBOW_COLORS.length * bandWidth) / 2;
            const drawCloudPuff = (cx, cy) => {
                targetCtx.fillStyle = '#FFFFFF';
                targetCtx.beginPath();
                targetCtx.arc(cx - 8, cy + 2, 7.5, 0, Math.PI * 2);
                targetCtx.arc(cx, cy - 2, 9.5, 0, Math.PI * 2);
                targetCtx.arc(cx + 9, cy + 2, 7.5, 0, Math.PI * 2);
                targetCtx.arc(cx + 1, cy + 4, 8, 0, Math.PI * 2);
                targetCtx.fill();
            };

            drawCloudPuff(-midRadius, 2);
            drawCloudPuff(midRadius, 2);

            targetCtx.restore();
        }

        /**
         * Generates the full ducks-and-rainbows background onto bgCanvas.
         */
        function renderBackground() {
            const w = bgCanvas.width;
            const h = bgCanvas.height;

            // Cheerful sky-blue gradient backdrop
            const skyGrad = bgCtx.createLinearGradient(0, 0, 0, h);
            skyGrad.addColorStop(0, '#89CFF0');
            skyGrad.addColorStop(0.55, '#BCE4FA');
            skyGrad.addColorStop(1, '#E3F4FE');
            bgCtx.fillStyle = skyGrad;
            bgCtx.fillRect(0, 0, w, h);

            // Staggered repeating grid of rainbows, ducks, and ducklings
            const cellW = 210;
            const cellH = 180;
            const rows = Math.ceil(h / cellH) + 2;
            const cols = Math.ceil(w / cellW) + 2;

            for (let r = -1; r < rows; r++) {
                const rowShift = (Math.abs(r) % 2 === 1) ? cellW * 0.5 : 0;

                for (let c = -1; c < cols; c++) {
                    const baseX = c * cellW + rowShift;
                    const baseY = r * cellH;
                    const parity = Math.abs(r + c);

                    // 1. Rainbow arc with clouds
                    bgCtx.save();
                    bgCtx.globalAlpha = 0.72;
                    const rainbowTilt = (parity % 2 === 0) ? -0.07 : 0.07;
                    drawRainbowSprite(bgCtx, baseX + 75, baseY + 92, 43, rainbowTilt);
                    bgCtx.restore();

                    // 2. Main background duck
                    bgCtx.save();
                    bgCtx.globalAlpha = 0.82;
                    const duckFlip = (parity % 2 === 1);
                    const duckTilt = ((parity % 3) - 1) * 0.06;
                    drawDuckSprite(bgCtx, baseX + 168, baseY + 128, 1.0, duckFlip, duckTilt, true);
                    bgCtx.restore();

                    // 3. Little duckling companion
                    bgCtx.save();
                    bgCtx.globalAlpha = 0.80;
                    drawDuckSprite(bgCtx, baseX + 42, baseY + 146, 0.65, !duckFlip, -duckTilt, true);
                    bgCtx.restore();
                }
            }
        }

        /**
         * Renders the central gravitational duck with a subtle glow so it stands out clearly.
         */
        function drawCentralDuck(x, y) {
            ctx.save();

            // Soft glowing aura around the central gravity duck
            const glow = ctx.createRadialGradient(x, y, 4, x, y, 36);
            glow.addColorStop(0, 'rgba(255, 255, 255, 0.92)');
            glow.addColorStop(0.65, 'rgba(255, 250, 210, 0.45)');
            glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(x, y, 36, 0, Math.PI * 2);
            ctx.fill();

            // Subtle dashed gravity well ring
            ctx.beginPath();
            ctx.arc(x, y, 26, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(20, 33, 61, 0.25)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.restore();

            // Draw the central duck
            drawDuckSprite(ctx, x, y, 1, false, 0, false);
        }

        function draw() {
            // 1. Draw cached Ducks & Rainbows background
            ctx.drawImage(bgCanvas, 0, 0);

            // 2. Draw Central Duck Node
            drawCentralDuck(centralNode.x, centralNode.y);

            // 3. Draw Balls & Trails
            for (const b of balls) {
                // Draw path line with subtle backing for crisp visibility against sky & rainbows
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = 'rgba(20, 33, 61, 0.28)';
                    ctx.lineWidth = 2.6;
                    ctx.stroke();

                    ctx.strokeStyle = b.color;
                    ctx.lineWidth = 1.6;
                    ctx.stroke();
                }

                // Draw ball object
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(20, 33, 61, 0.45)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
