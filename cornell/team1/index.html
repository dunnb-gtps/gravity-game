<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #14213d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.7);
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-counter {
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #14213d;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #89cff0;
            border: 2px solid #ffffff;
            border-radius: 4px;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #cbd5e1;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1 id="headerTitle">Gravity Simulation</h1>
        <div class="header-controls">
            <span id="hitCounter" class="status-counter">Hits: 0/5</span>
            <span id="ballCounter" class="status-counter">Balls: 0</span>
            <button class="btn-reset" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div id="instructionsText" class="instructions">
        Click anywhere on the canvas to launch multiple balls.
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const headerTitle = document.getElementById('headerTitle');
        const ballCounter = document.getElementById('ballCounter');
        const hitCounter = document.getElementById('hitCounter');
        const instructionsText = document.getElementById('instructionsText');

        // Offscreen canvas to cache the ducks & rainbows background for smooth 60fps rendering
        const bgCanvas = document.createElement('canvas');
        const bgCtx = bgCanvas.getContext('2d');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;          // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;      // Prevents infinite velocity near center
        const MAX_BALLS = 50;              // Maximum simultaneous balls on screen
        const MAX_DUCK_HITS = 5;           // Duck blows up on the 5th hit

        // Natural sky rainbow spectrum in ROYGBIV order
        const RAINBOW_COLORS = [
            '#FF0000', // Red
            '#FF7F00', // Orange
            '#FFFF00', // Yellow
            '#00E640', // Green
            '#1E90FF', // Blue
            '#5D3FD3', // Indigo
            '#BF00FF'  // Violet
        ];

        const YELLOW_BATTLE_CRIES = ['QUACK!', 'HOLD THE POND!', 'BREAD BARRAGE!', 'FOR THE FLOCK!', 'INCOMING!'];
        const RED_BATTLE_CRIES = ['CWASHOUT!', 'VENGEANCE!', 'NO MERCY!', 'QUACK ATTACK!', 'CHARGE!'];

        // STATE VARIABLES
        let balls = [];
        let rainbowIndex = 0;

        // Duck hit, speech, and explosion state
        let duckHits = 0;
        let duckExploded = false;
        let speechText = '';
        let speechTimer = 0;       // Remaining frames to show speech bubble (-1 = stays visible)
        let hitAnimTimer = 0;      // Pop/recoil animation timer when hit
        let screenShakeTimer = 0;  // Screen shake duration
        let explosionFlash = 0;    // Flash intensity on explosion
        let explosionParticles = [];
        let shockwaves = [];

        // Duck War state
        let duckWarActive = false;
        let warBannerTimer = 0;
        let warWave = 1;
        let yellowKOs = 0;
        let redKOs = 0;
        let warDucks = [];
        let warProjectiles = [];
        let airstrikes = [];

        // Central Gravity Node Definition (radius matches duck visual size)
        const centralNode = {
            x: 0,
            y: 0,
            radius: 18
        };

        function updateBallCounter() {
            if (duckWarActive) {
                ballCounter.textContent = `Ducks: ${warDucks.length}`;
            } else {
                ballCounter.textContent = `Balls: ${balls.length}`;
            }
        }

        function updateHitCounter() {
            if (duckWarActive) {
                hitCounter.textContent = `YEL ${yellowKOs} : ${redKOs} RED`;
            } else {
                hitCounter.textContent = `Hits: ${duckHits}/${MAX_DUCK_HITS}`;
            }
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            // Rebuild cached ducks-and-rainbows background to fit new dimensions
            bgCanvas.width = canvas.width;
            bgCanvas.height = canvas.height;
            renderBackground();
        }

        window.addEventListener('resize', resizeCanvas);

        // Canvas Click Handler: Launch a ball (peace mode) or call an orbital bread-bomb airstrike (Duck War mode)
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            if (duckWarActive) {
                callRainbowAirstrike(clickX, clickY);
            } else {
                launchBall(clickX, clickY);
            }
        });

        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            // Cap maximum balls on screen to preserve performance
            if (balls.length >= MAX_BALLS) {
                balls.shift();
            }

            // Pick the next color in the ROYGBIV rainbow sequence
            const color = RAINBOW_COLORS[rainbowIndex];
            rainbowIndex = (rainbowIndex + 1) % RAINBOW_COLORS.length;

            // Append new ball so multiple balls can be thrown and orbited at once
            balls.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4,
                color: color,
                trail: [] // Stores history of past {x, y} coordinates
            });

            updateBallCounter();
        }

        function resetSimulation() {
            balls = [];
            rainbowIndex = 0;
            duckHits = 0;
            duckExploded = false;
            speechText = '';
            speechTimer = 0;
            hitAnimTimer = 0;
            screenShakeTimer = 0;
            explosionFlash = 0;
            explosionParticles = [];
            shockwaves = [];

            // Reset Duck War state
            duckWarActive = false;
            warBannerTimer = 0;
            warWave = 1;
            yellowKOs = 0;
            redKOs = 0;
            warDucks = [];
            warProjectiles = [];
            airstrikes = [];

            headerTitle.textContent = 'Gravity Simulation';
            instructionsText.textContent = 'Click anywhere on the canvas to launch multiple balls.';
            updateBallCounter();
            updateHitCounter();
        }

        function handleDuckHit() {
            if (duckExploded) return;

            duckHits++;
            updateHitCounter();

            if (duckHits >= MAX_DUCK_HITS) {
                triggerDuckExplosion();
            } else if (duckHits === 4) {
                speechText = 'hit me one more time then i cwashout';
                speechTimer = -1; // Keep warning visible until the 5th hit or reset
                hitAnimTimer = 26;
                screenShakeTimer = 10;
            } else {
                speechText = 'stop';
                speechTimer = 150; // Visible for ~2.5 seconds
                hitAnimTimer = 20;
                screenShakeTimer = 6;
            }
        }

        function spawnExplosion(x, y, primaryColor = '#FFD700', intensity = 1) {
            const firePalette = ['#FF0000', '#FF3B00', '#FF7F00', '#FFD700', '#FFFFFF'];
            const count = Math.round(28 * intensity);

            shockwaves.push({
                x: x,
                y: y,
                radius: 6 * intensity,
                maxRadius: 95 * intensity,
                alpha: 0.95,
                lineWidth: 3.5 * intensity,
                color: primaryColor
            });

            for (let i = 0; i < count; i++) {
                if (explosionParticles.length > 260) break;
                const angle = Math.random() * Math.PI * 2;
                const speed = (1.2 + Math.random() * 5.8) * Math.sqrt(intensity);
                const isSmoke = i >= Math.round(count * 0.78);
                const isFeather = !isSmoke && i % 3 === 0;

                explosionParticles.push({
                    x: x + (Math.random() - 0.5) * 8,
                    y: y + (Math.random() - 0.5) * 8,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - (isSmoke ? 0.4 : 0),
                    size: isSmoke
                        ? (6 + Math.random() * 8) * Math.sqrt(intensity)
                        : (isFeather ? (4.5 + Math.random() * 3.5) : (2 + Math.random() * 3.5)),
                    color: isSmoke
                        ? 'rgba(55, 65, 81, 0.8)'
                        : (isFeather ? primaryColor : firePalette[Math.floor(Math.random() * firePalette.length)]),
                    alpha: 1,
                    decay: isSmoke ? (0.016 + Math.random() * 0.012) : (0.02 + Math.random() * 0.02),
                    drag: isSmoke ? 0.95 : 0.96,
                    gravity: isFeather ? 0.07 : (isSmoke ? -0.03 : 0.04),
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.25,
                    isFeather: isFeather
                });
            }
        }

        function triggerDuckExplosion() {
            duckExploded = true;
            speechText = '';
            speechTimer = 0;
            screenShakeTimer = 34;
            explosionFlash = 0.9;

            const cx = centralNode.x;
            const cy = centralNode.y;

            // Giant initial explosion
            shockwaves.push(
                { x: cx, y: cy, radius: 12, maxRadius: 240, alpha: 1.0, lineWidth: 7, color: '#FF4500' },
                { x: cx, y: cy, radius: 6, maxRadius: 165, alpha: 0.95, lineWidth: 4.5, color: '#FFD700' }
            );

            const firePalette = ['#FF0000', '#FF3B00', '#FF7F00', '#FFD700', '#FFFFFF'];
            for (let i = 0; i < 95; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1.5 + Math.random() * 9.0;
                const isSmoke = i >= 72;
                const isFeather = !isSmoke && i % 3 === 0;

                explosionParticles.push({
                    x: cx + (Math.random() - 0.5) * 10,
                    y: cy + (Math.random() - 0.5) * 10,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - (isSmoke ? 0.5 : 0),
                    size: isSmoke ? (8 + Math.random() * 12) : (isFeather ? (5 + Math.random() * 4) : (2.5 + Math.random() * 4.5)),
                    color: isSmoke
                        ? 'rgba(55, 65, 81, 0.85)'
                        : (isFeather ? (Math.random() > 0.4 ? '#E61414' : '#FFD700') : firePalette[Math.floor(Math.random() * firePalette.length)]),
                    alpha: 1,
                    decay: isSmoke ? (0.012 + Math.random() * 0.01) : (0.016 + Math.random() * 0.018),
                    drag: isSmoke ? 0.95 : 0.96,
                    gravity: isFeather ? 0.08 : (isSmoke ? -0.03 : 0.04),
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.25,
                    isFeather: isFeather
                });
            }

            startDuckWar();
        }

        function startDuckWar() {
            duckWarActive = true;
            warBannerTimer = 210; // ~3.5 seconds banner announcement
            warWave = 1;
            yellowKOs = 0;
            redKOs = 0;
            warDucks = [];
            warProjectiles = [];
            airstrikes = [];

            headerTitle.textContent = 'DUCK WAR';
            instructionsText.textContent = 'DUCK WAR! Click anywhere on the battlefield to call down Rainbow Bread-Bomb Airstrikes!';
            updateHitCounter();

            // Deploy initial opposing squadrons
            spawnWarSquadron('yellow', 6, false);
            spawnWarSquadron('red', 6, false);
            updateBallCounter();
        }

        function spawnWarSquadron(team, count, includeCommander = false) {
            const isYellow = team === 'yellow';
            for (let i = 0; i < count; i++) {
                if (warDucks.length >= 22) break;

                const isCommander = includeCommander && i === 0;
                const scale = isCommander ? 1.45 : (0.85 + Math.random() * 0.25);
                const maxHp = isCommander ? 7 : 3;
                const weaponRoll = Math.random();
                const weaponType = isCommander
                    ? 'egg'
                    : (weaponRoll < 0.55 ? 'seed' : (weaponRoll < 0.85 ? 'laser' : 'egg'));

                const spawnX = isYellow
                    ? -25 - Math.random() * 90
                    : canvas.width + 25 + Math.random() * 90;
                const spawnY = 60 + Math.random() * Math.max(120, canvas.height - 120);

                const cries = isYellow ? YELLOW_BATTLE_CRIES : RED_BATTLE_CRIES;
                const cry = (i === 0 && Math.random() < 0.75)
                    ? cries[Math.floor(Math.random() * cries.length)]
                    : '';

                warDucks.push({
                    x: spawnX,
                    y: spawnY,
                    vx: isYellow ? (2.2 + Math.random() * 1.4) : -(2.2 + Math.random() * 1.4),
                    vy: (Math.random() - 0.5) * 1.2,
                    team: team,
                    hp: maxHp,
                    maxHp: maxHp,
                    scale: scale,
                    isCommander: isCommander,
                    facing: isYellow ? 1 : -1,
                    bobPhase: Math.random() * Math.PI * 2,
                    fireCooldown: 25 + Math.floor(Math.random() * 45),
                    weaponType: weaponType,
                    hitFlash: 0,
                    battleCry: cry,
                    cryTimer: cry ? 95 : 0
                });
            }
        }

        function callRainbowAirstrike(targetX, targetY) {
            const color = RAINBOW_COLORS[rainbowIndex];
            rainbowIndex = (rainbowIndex + 1) % RAINBOW_COLORS.length;

            airstrikes.push({
                x: targetX + (Math.random() - 0.5) * 80,
                y: -30,
                targetX: targetX,
                targetY: targetY,
                speed: 14,
                color: color,
                trail: []
            });
        }

        function updateDuckWar() {
            if (!duckWarActive) return;

            if (warBannerTimer > 0) {
                warBannerTimer--;
            }

            // Count active ducks per faction and send reinforcements when a side runs low
            let yellowCount = 0;
            let redCount = 0;
            for (const d of warDucks) {
                if (d.team === 'yellow') yellowCount++;
                else redCount++;
            }

            if (yellowCount < 4) {
                warWave++;
                spawnWarSquadron('yellow', 4, warWave % 2 === 0);
                updateBallCounter();
            }
            if (redCount < 4) {
                warWave++;
                spawnWarSquadron('red', 4, warWave % 2 === 1);
                updateBallCounter();
            }

            // Update Warrior Ducks AI, movement, and firing
            for (let i = warDucks.length - 1; i >= 0; i--) {
                const d = warDucks[i];
                d.bobPhase += 0.12;
                if (d.hitFlash > 0) d.hitFlash--;
                if (d.cryTimer > 0) {
                    d.cryTimer--;
                    if (d.cryTimer === 0) d.battleCry = '';
                }

                // Find nearest enemy duck
                let nearestEnemy = null;
                let nearestDist = Infinity;
                for (const other of warDucks) {
                    if (other.team === d.team) continue;
                    const dx = other.x - d.x;
                    const dy = other.y - d.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearestEnemy = other;
                    }
                }

                if (nearestEnemy) {
                    const dx = nearestEnemy.x - d.x;
                    const dy = nearestEnemy.y - d.y;
                    d.facing = dx >= 0 ? 1 : -1;

                    // Desired combat range
                    const preferredDist = d.weaponType === 'egg' ? 280 : 195;
                    const dirX = dx / (nearestDist || 1);
                    const dirY = dy / (nearestDist || 1);

                    let desiredVx = 0;
                    let desiredVy = dirY * 1.6 + Math.cos(d.bobPhase) * 0.9;

                    if (nearestDist > preferredDist + 40) {
                        desiredVx = dirX * 2.4;
                    } else if (nearestDist < preferredDist - 40) {
                        desiredVx = -dirX * 1.8;
                    } else {
                        desiredVx = Math.sin(d.bobPhase * 0.5) * 0.8;
                    }

                    // Friendly separation so squads spread out cleanly
                    for (const ally of warDucks) {
                        if (ally === d || ally.team !== d.team) continue;
                        const adx = d.x - ally.x;
                        const ady = d.y - ally.y;
                        const adist = Math.hypot(adx, ady);
                        if (adist > 0 && adist < 54) {
                            desiredVx += (adx / adist) * 1.4;
                            desiredVy += (ady / adist) * 1.4;
                        }
                    }

                    d.vx += (desiredVx - d.vx) * 0.08;
                    d.vy += (desiredVy - d.vy) * 0.08;

                    // Fire weapon when on screen and cooldown finishes
                    d.fireCooldown--;
                    const onScreen = d.x > 15 && d.x < canvas.width - 15;
                    if (onScreen && d.fireCooldown <= 0) {
                        fireDuckWeapon(d, nearestEnemy);
                        d.fireCooldown = d.weaponType === 'seed'
                            ? (36 + Math.floor(Math.random() * 25))
                            : (d.weaponType === 'laser' ? 52 : 75);
                    }
                }

                d.x += d.vx;
                d.y += d.vy;

                // Keep ducks within vertical battlefield margins
                const marginY = 48;
                if (d.y < marginY) {
                    d.y = marginY;
                    d.vy = Math.abs(d.vy) * 0.5;
                } else if (d.y > canvas.height - marginY) {
                    d.y = canvas.height - marginY;
                    d.vy = -Math.abs(d.vy) * 0.5;
                }

                // Keep ducks inside horizontal bounds once they enter the arena
                if (d.x > 25 && d.x < canvas.width - 25) {
                    d.enteredArena = true;
                }
                if (d.enteredArena) {
                    if (d.x < 24) {
                        d.x = 24;
                        d.vx = Math.abs(d.vx);
                    } else if (d.x > canvas.width - 24) {
                        d.x = canvas.width - 24;
                        d.vx = -Math.abs(d.vx);
                    }
                }
            }

            // Update War Projectiles
            for (let i = warProjectiles.length - 1; i >= 0; i--) {
                const p = warProjectiles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.type === 'egg') {
                    p.vy += 0.14; // Arcing egg mortar gravity
                    p.rotation += 0.18;
                }

                if (p.x < -50 || p.x > canvas.width + 50 || p.y < -50 || p.y > canvas.height + 50) {
                    warProjectiles.splice(i, 1);
                    continue;
                }

                // Check collision against opposing ducks
                let hitSomething = false;
                for (let j = warDucks.length - 1; j >= 0; j--) {
                    const target = warDucks[j];
                    if (target.team === p.team) continue;

                    const hitRadius = 17 * target.scale + p.radius;
                    const dist = Math.hypot(target.x - p.x, target.y - p.y);
                    if (dist < hitRadius) {
                        hitSomething = true;
                        damageWarDuck(j, p.damage, p.vx * 0.28, p.vy * 0.28);

                        if (p.type === 'egg') {
                            spawnExplosion(p.x, p.y, p.team === 'yellow' ? '#FFD700' : '#FF3B00', 0.65);
                            screenShakeTimer = Math.max(screenShakeTimer, 5);
                        }
                        break;
                    }
                }

                if (hitSomething) {
                    warProjectiles.splice(i, 1);
                }
            }

            // Update Player Rainbow Bread-Bomb Airstrikes
            for (let i = airstrikes.length - 1; i >= 0; i--) {
                const strike = airstrikes[i];
                const dx = strike.targetX - strike.x;
                const dy = strike.targetY - strike.y;
                const dist = Math.hypot(dx, dy);

                strike.trail.push({ x: strike.x, y: strike.y });
                if (strike.trail.length > 14) strike.trail.shift();

                if (dist <= strike.speed) {
                    // Detonate Rainbow Airstrike!
                    spawnExplosion(strike.targetX, strike.targetY, strike.color, 1.25);
                    screenShakeTimer = Math.max(screenShakeTimer, 12);

                    const blastRadius = 85;
                    for (let j = warDucks.length - 1; j >= 0; j--) {
                        const d = warDucks[j];
                        const bdx = d.x - strike.targetX;
                        const bdy = d.y - strike.targetY;
                        const bdist = Math.hypot(bdx, bdy);
                        if (bdist < blastRadius) {
                            const push = ((blastRadius - bdist) / blastRadius) * 7;
                            const nx = bdx / (bdist || 1);
                            const ny = bdy / (bdist || 1);
                            damageWarDuck(j, 3, nx * push, ny * push - 1.5);
                        }
                    }

                    airstrikes.splice(i, 1);
                } else {
                    strike.x += (dx / dist) * strike.speed;
                    strike.y += (dy / dist) * strike.speed;
                }
            }
        }

        function fireDuckWeapon(shooter, target) {
            const muzzleX = shooter.x + shooter.facing * (18 * shooter.scale);
            const muzzleY = shooter.y - 6 * shooter.scale;
            const dx = target.x - muzzleX;
            const dy = target.y - muzzleY;
            const dist = Math.hypot(dx, dy) || 1;
            const spread = (Math.random() - 0.5) * 0.14;
            const angle = Math.atan2(dy, dx) + spread;

            if (shooter.weaponType === 'seed') {
                const speed = 6.8;
                warProjectiles.push({
                    x: muzzleX,
                    y: muzzleY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    team: shooter.team,
                    type: 'seed',
                    radius: 3.2,
                    damage: 1,
                    color: shooter.team === 'yellow' ? '#FFE600' : '#FF5500'
                });
            } else if (shooter.weaponType === 'laser') {
                const speed = 8.8;
                warProjectiles.push({
                    x: muzzleX,
                    y: muzzleY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    team: shooter.team,
                    type: 'laser',
                    radius: 3.5,
                    damage: 1.5,
                    color: shooter.team === 'yellow' ? '#00F5D4' : '#FF0055'
                });
            } else {
                // Explosive Egg Mortar
                const flightFrames = Math.max(28, Math.min(55, dist / 6));
                const vx = dx / flightFrames;
                const vy = (dy / flightFrames) - 0.5 * 0.14 * flightFrames;
                warProjectiles.push({
                    x: muzzleX,
                    y: muzzleY,
                    vx: vx,
                    vy: vy,
                    team: shooter.team,
                    type: 'egg',
                    radius: 5.5,
                    damage: 2.5,
                    rotation: 0,
                    color: '#FFFFFF'
                });
            }
        }

        function damageWarDuck(index, damage, knockVx, knockVy) {
            const d = warDucks[index];
            if (!d) return;

            d.hp -= damage;
            d.hitFlash = 6;
            d.vx += knockVx;
            d.vy += knockVy;

            if (d.hp <= 0) {
                const featherColor = d.team === 'yellow' ? '#FFD700' : '#E61414';
                spawnExplosion(d.x, d.y, featherColor, d.isCommander ? 1.25 : 0.85);
                screenShakeTimer = Math.max(screenShakeTimer, d.isCommander ? 10 : 4);

                if (d.team === 'yellow') {
                    redKOs++;
                } else {
                    yellowKOs++;
                }

                warDucks.splice(index, 1);
                updateHitCounter();
                updateBallCounter();
            }
        }

        function updateEffects() {
            if (speechTimer > 0) {
                speechTimer--;
                if (speechTimer === 0) {
                    speechText = '';
                }
            }

            if (hitAnimTimer > 0) {
                hitAnimTimer--;
            }

            if (screenShakeTimer > 0) {
                screenShakeTimer--;
            }

            if (explosionFlash > 0) {
                explosionFlash = Math.max(0, explosionFlash - 0.045);
            }

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.radius += (sw.maxRadius - sw.radius) * 0.14 + 2.5;
                sw.alpha -= 0.035;
                if (sw.alpha <= 0) {
                    shockwaves.splice(i, 1);
                }
            }

            for (let i = explosionParticles.length - 1; i >= 0; i--) {
                const p = explosionParticles[i];
                p.vx *= p.drag;
                p.vy = p.vy * p.drag + p.gravity;
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotSpeed;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    explosionParticles.splice(i, 1);
                }
            }
        }

        function updatePhysics() {
            let countChanged = false;

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove ball if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    countChanged = true;
                    continue;
                }

                if (!duckExploded) {
                    // Distance vector to central gravity node
                    const dx = centralNode.x - b.x;
                    const dy = centralNode.y - b.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq);

                    // Absorption check: ball collides with central duck
                    if (dist < centralNode.radius + b.radius) {
                        balls.splice(i, 1);
                        countChanged = true;
                        handleDuckHit();
                        continue;
                    }

                    // Inverse square law gravity acceleration
                    const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                    // Acceleration vector components
                    const ax = acceleration * (dx / dist);
                    const ay = acceleration * (dy / dist);

                    // Update velocity
                    b.vx += ax;
                    b.vy += ay;
                } else if (duckWarActive) {
                    // Leftover orbiting rainbow balls can knock out warrior ducks during the war!
                    let hitWarDuck = false;
                    for (let j = warDucks.length - 1; j >= 0; j--) {
                        const d = warDucks[j];
                        const dist = Math.hypot(d.x - b.x, d.y - b.y);
                        if (dist < 16 * d.scale + b.radius) {
                            damageWarDuck(j, 2, b.vx * 0.4, b.vy * 0.4);
                            spawnExplosion(b.x, b.y, b.color, 0.55);
                            balls.splice(i, 1);
                            countChanged = true;
                            hitWarDuck = true;
                            break;
                        }
                    }
                    if (hitWarDuck) continue;
                }

                // Update position
                b.x += b.vx;
                b.y += b.vy;

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }

            if (countChanged && !duckWarActive) {
                updateBallCounter();
            }
        }

        /**
         * Computes progressively redder body & wing colors as duckHits increases (0 to 4).
         */
        function getDuckColors(hits) {
            const t = Math.min(hits, 4) / 4;

            // Body transitions from yellow #FFD700 (255, 215, 0) to deep red (230, 20, 20)
            const r = Math.round(255 + (230 - 255) * t);
            const g = Math.round(215 + (20 - 215) * t);
            const b = Math.round(0 + (20 - 0) * t);

            // Wing transitions from #E6AC00 (230, 172, 0) to dark crimson (158, 8, 8)
            const wr = Math.round(230 + (158 - 230) * t);
            const wg = Math.round(172 + (8 - 172) * t);
            const wb = Math.round(0 + (8 - 0) * t);

            return {
                body: `rgb(${r}, ${g}, ${b})`,
                wing: `rgb(${wr}, ${wg}, ${wb})`
            };
        }

        /**
         * Renders a cute vector duck on the target 2D context, with optional war gear.
         */
        function drawDuckSprite(
            targetCtx,
            x,
            y,
            scale = 1,
            flipX = false,
            rotation = 0,
            showRipples = false,
            bodyColor = '#FFD700',
            wingColor = '#E6AC00',
            angerLevel = 0,
            warGear = 'none'
        ) {
            targetCtx.save();
            targetCtx.translate(x, y);
            targetCtx.rotate(rotation);
            targetCtx.scale(flipX ? -scale : scale, scale);

            // Optional subtle pond ripples underneath background ducks
            if (showRipples) {
                targetCtx.beginPath();
                targetCtx.ellipse(0, 16.5, 19, 3.2, 0, 0.1 * Math.PI, 0.9 * Math.PI);
                targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
                targetCtx.lineWidth = 1.4;
                targetCtx.lineCap = 'round';
                targetCtx.stroke();
            }

            // 1. Orange beak facing right (#FF8C00)
            targetCtx.beginPath();
            targetCtx.moveTo(13.5, -10.2);
            targetCtx.quadraticCurveTo(22.0, -8.5, 21.5, -7.0);
            targetCtx.quadraticCurveTo(21.0, -5.5, 13.2, -5.0);
            targetCtx.closePath();
            targetCtx.fillStyle = '#FF8C00';
            targetCtx.fill();

            // 2. Body with upturned tail on the left
            targetCtx.beginPath();
            targetCtx.moveTo(11.0, -2.0);
            targetCtx.quadraticCurveTo(15.0, 5.5, 11.5, 13.5);
            targetCtx.quadraticCurveTo(0.0, 16.5, -11.5, 13.0);
            targetCtx.quadraticCurveTo(-16.0, 9.5, -18.0, -3.0);
            targetCtx.quadraticCurveTo(-12.5, 1.5, -6.5, 1.0);
            targetCtx.quadraticCurveTo(-1.5, 0.5, 1.0, -3.5);
            targetCtx.closePath();
            targetCtx.fillStyle = bodyColor;
            targetCtx.fill();

            // 3. Head
            targetCtx.beginPath();
            targetCtx.arc(7.0, -8.0, 7.5, 0, Math.PI * 2);
            targetCtx.fillStyle = bodyColor;
            targetCtx.fill();

            // 4. Subtle curved wing line
            targetCtx.beginPath();
            targetCtx.moveTo(-5.5, 3.5);
            targetCtx.quadraticCurveTo(0.0, 11.5, 6.5, 6.0);
            targetCtx.strokeStyle = wingColor;
            targetCtx.lineWidth = 1.6;
            targetCtx.lineCap = 'round';
            targetCtx.stroke();

            // 5. Dark eye (#000000) with tiny white highlight (#FFFFFF)
            targetCtx.beginPath();
            targetCtx.arc(9.5, -9.5, 2.1, 0, Math.PI * 2);
            targetCtx.fillStyle = '#000000';
            targetCtx.fill();

            targetCtx.beginPath();
            targetCtx.arc(10.2, -10.2, 0.75, 0, Math.PI * 2);
            targetCtx.fillStyle = '#FFFFFF';
            targetCtx.fill();

            // 6. Angry eyebrow as hits build up or during Duck War
            if (angerLevel >= 2) {
                targetCtx.beginPath();
                targetCtx.moveTo(6.5, -13.2);
                targetCtx.lineTo(12.2, -11.4);
                targetCtx.strokeStyle = '#14213d';
                targetCtx.lineWidth = angerLevel >= 4 ? 2.0 : 1.5;
                targetCtx.lineCap = 'round';
                targetCtx.stroke();
            }

            // 7. Duck War Helmets & Headbands
            if (warGear === 'yellow_army' || warGear === 'yellow_commander') {
                // Olive-navy army helmet
                targetCtx.beginPath();
                targetCtx.arc(6.8, -10.2, 7.6, Math.PI * 1.05, Math.PI * 1.98);
                targetCtx.fillStyle = warGear === 'yellow_commander' ? '#1E3A8A' : '#3F6212';
                targetCtx.fill();
                targetCtx.strokeStyle = '#14213d';
                targetCtx.lineWidth = 1.1;
                targetCtx.stroke();

                // Helmet rim
                targetCtx.beginPath();
                targetCtx.moveTo(-1.5, -10.4);
                targetCtx.lineTo(15.2, -10.4);
                targetCtx.strokeStyle = '#14213d';
                targetCtx.lineWidth = 1.5;
                targetCtx.stroke();

                // Gold star emblem on commander helmet
                if (warGear === 'yellow_commander') {
                    targetCtx.fillStyle = '#FFD700';
                    targetCtx.beginPath();
                    targetCtx.arc(8.5, -13.2, 1.8, 0, Math.PI * 2);
                    targetCtx.fill();
                }
            } else if (warGear === 'red_rebel' || warGear === 'red_commander') {
                // Dark battle bandana / spiked war cap
                targetCtx.beginPath();
                targetCtx.arc(6.8, -10.2, 7.6, Math.PI * 1.05, Math.PI * 1.98);
                targetCtx.fillStyle = '#1F2937';
                targetCtx.fill();

                // Red war headband with trailing ribbon
                targetCtx.beginPath();
                targetCtx.moveTo(-1.0, -11.2);
                targetCtx.lineTo(14.5, -11.2);
                targetCtx.strokeStyle = '#DC2626';
                targetCtx.lineWidth = 2.4;
                targetCtx.stroke();

                targetCtx.beginPath();
                targetCtx.moveTo(-1.0, -11.2);
                targetCtx.lineTo(-6.5, -8.5);
                targetCtx.moveTo(-1.0, -11.2);
                targetCtx.lineTo(-6.0, -13.5);
                targetCtx.strokeStyle = '#DC2626';
                targetCtx.lineWidth = 1.6;
                targetCtx.stroke();

                // Horn/spike for Red Commander
                if (warGear === 'red_commander') {
                    targetCtx.beginPath();
                    targetCtx.moveTo(5.0, -17.2);
                    targetCtx.lineTo(7.2, -22.5);
                    targetCtx.lineTo(9.4, -17.2);
                    targetCtx.closePath();
                    targetCtx.fillStyle = '#FFD700';
                    targetCtx.fill();
                }
            }

            targetCtx.restore();
        }

        /**
         * Renders a comic speech bubble above a duck.
         */
        function drawSpeechBubble(targetCtx, anchorX, anchorY, text, isWarning, compact = false) {
            if (!text) return;

            targetCtx.save();
            targetCtx.font = compact
                ? 'bold 11px "Courier New", Courier, monospace'
                : 'bold 14px "Courier New", Courier, monospace';
            const textMetrics = targetCtx.measureText(text);
            const paddingX = compact ? 8 : 14;
            const boxWidth = Math.ceil(textMetrics.width + paddingX * 2);
            const boxHeight = compact ? 22 : 32;
            const radius = compact ? 6 : 8;

            // Keep bubble within horizontal canvas bounds
            let boxX = anchorX - boxWidth / 2;
            boxX = Math.max(8, Math.min(canvas.width - boxWidth - 8, boxX));
            const boxY = Math.max(8, anchorY - (compact ? 46 : 64));

            // Pop-in scale when newly triggered
            const popScale = (!compact && hitAnimTimer > 14) ? (1 + (hitAnimTimer - 14) * 0.025) : 1;
            const centerX = boxX + boxWidth / 2;
            const centerY = boxY + boxHeight / 2;
            targetCtx.translate(centerX, centerY);
            targetCtx.scale(popScale, popScale);
            targetCtx.translate(-centerX, -centerY);

            // Speech bubble body
            targetCtx.beginPath();
            targetCtx.roundRect(boxX, boxY, boxWidth, boxHeight, radius);
            targetCtx.fillStyle = isWarning ? '#FFF1F2' : '#FFFFFF';
            targetCtx.fill();
            targetCtx.lineWidth = compact ? 1.5 : 2;
            targetCtx.strokeStyle = isWarning ? '#DC2626' : '#14213d';
            targetCtx.stroke();

            // Speech bubble pointer tail pointing toward the duck
            const tailX = Math.max(boxX + 10, Math.min(boxX + boxWidth - 10, anchorX));
            const pointerY = anchorY - (compact ? 18 : 22);
            targetCtx.beginPath();
            targetCtx.moveTo(tailX - 5, boxY + boxHeight - 1);
            targetCtx.lineTo(anchorX, pointerY);
            targetCtx.lineTo(tailX + 5, boxY + boxHeight - 1);
            targetCtx.closePath();
            targetCtx.fillStyle = isWarning ? '#FFF1F2' : '#FFFFFF';
            targetCtx.fill();

            // Outline for the tail sides
            targetCtx.beginPath();
            targetCtx.moveTo(tailX - 5, boxY + boxHeight);
            targetCtx.lineTo(anchorX, pointerY);
            targetCtx.lineTo(tailX + 5, boxY + boxHeight);
            targetCtx.strokeStyle = isWarning ? '#DC2626' : '#14213d';
            targetCtx.lineWidth = compact ? 1.5 : 2;
            targetCtx.stroke();

            // Text inside bubble
            targetCtx.fillStyle = isWarning ? '#B91C1C' : '#14213d';
            targetCtx.textAlign = 'center';
            targetCtx.textBaseline = 'middle';
            targetCtx.fillText(text, boxX + boxWidth / 2, boxY + boxHeight / 2 + 1);

            targetCtx.restore();
        }

        /**
         * Renders a 7-band rainbow arc with fluffy clouds at both ends.
         */
        function drawRainbowSprite(targetCtx, x, y, outerRadius = 44, rotation = 0) {
            targetCtx.save();
            targetCtx.translate(x, y);
            targetCtx.rotate(rotation);

            const bandWidth = 3.4;

            // Draw ROYGBIV bands from outermost to innermost
            for (let i = 0; i < RAINBOW_COLORS.length; i++) {
                const r = outerRadius - i * bandWidth;
                if (r <= 4) break;
                targetCtx.beginPath();
                targetCtx.arc(0, 0, r, Math.PI, 0, false);
                targetCtx.strokeStyle = RAINBOW_COLORS[i];
                targetCtx.lineWidth = bandWidth + 0.6;
                targetCtx.lineCap = 'butt';
                targetCtx.stroke();
            }

            // Fluffy cloud helper at the two base ends of the rainbow
            const midRadius = outerRadius - (RAINBOW_COLORS.length * bandWidth) / 2;
            const drawCloudPuff = (cx, cy) => {
                targetCtx.fillStyle = '#FFFFFF';
                targetCtx.beginPath();
                targetCtx.arc(cx - 8, cy + 2, 7.5, 0, Math.PI * 2);
                targetCtx.arc(cx, cy - 2, 9.5, 0, Math.PI * 2);
                targetCtx.arc(cx + 9, cy + 2, 7.5, 0, Math.PI * 2);
                targetCtx.arc(cx + 1, cy + 4, 8, 0, Math.PI * 2);
                targetCtx.fill();
            };

            drawCloudPuff(-midRadius, 2);
            drawCloudPuff(midRadius, 2);

            targetCtx.restore();
        }

        /**
         * Generates the full ducks-and-rainbows background onto bgCanvas.
         */
        function renderBackground() {
            const w = bgCanvas.width;
            const h = bgCanvas.height;

            // Cheerful sky-blue gradient backdrop
            const skyGrad = bgCtx.createLinearGradient(0, 0, 0, h);
            skyGrad.addColorStop(0, '#89CFF0');
            skyGrad.addColorStop(0.55, '#BCE4FA');
            skyGrad.addColorStop(1, '#E3F4FE');
            bgCtx.fillStyle = skyGrad;
            bgCtx.fillRect(0, 0, w, h);

            // Staggered repeating grid of rainbows, ducks, and ducklings
            const cellW = 210;
            const cellH = 180;
            const rows = Math.ceil(h / cellH) + 2;
            const cols = Math.ceil(w / cellW) + 2;

            for (let r = -1; r < rows; r++) {
                const rowShift = (Math.abs(r) % 2 === 1) ? cellW * 0.5 : 0;

                for (let c = -1; c < cols; c++) {
                    const baseX = c * cellW + rowShift;
                    const baseY = r * cellH;
                    const parity = Math.abs(r + c);

                    // 1. Rainbow arc with clouds
                    bgCtx.save();
                    bgCtx.globalAlpha = 0.72;
                    const rainbowTilt = (parity % 2 === 0) ? -0.07 : 0.07;
                    drawRainbowSprite(bgCtx, baseX + 75, baseY + 92, 43, rainbowTilt);
                    bgCtx.restore();

                    // 2. Main background duck
                    bgCtx.save();
                    bgCtx.globalAlpha = 0.82;
                    const duckFlip = (parity % 2 === 1);
                    const duckTilt = ((parity % 3) - 1) * 0.06;
                    drawDuckSprite(bgCtx, baseX + 168, baseY + 128, 1.0, duckFlip, duckTilt, true);
                    bgCtx.restore();

                    // 3. Little duckling companion
                    bgCtx.save();
                    bgCtx.globalAlpha = 0.80;
                    drawDuckSprite(bgCtx, baseX + 42, baseY + 146, 0.65, !duckFlip, -duckTilt, true);
                    bgCtx.restore();
                }
            }
        }

        /**
         * Renders the central gravitational duck with progressive red tinting and speech bubble.
         */
        function drawCentralDuck(x, y) {
            if (duckExploded) return;

            const colors = getDuckColors(duckHits);
            const redRatio = Math.min(duckHits, 4) / 4;

            // Recoil / nervous tremble offsets
            let offsetX = 0;
            let offsetY = 0;
            let scale = 1;

            if (hitAnimTimer > 0) {
                scale = 1 + Math.sin((hitAnimTimer / 20) * Math.PI) * 0.25;
                offsetX = (Math.random() - 0.5) * 4;
                offsetY = (Math.random() - 0.5) * 4;
            } else if (duckHits === 4) {
                // Angry trembling right before cwashout
                offsetX = (Math.random() - 0.5) * 2.5;
                offsetY = (Math.random() - 0.5) * 2.5;
            }

            ctx.save();

            // Glowing aura shifts from warm white/yellow to angry red as hits increase
            const glow = ctx.createRadialGradient(x, y, 4, x, y, 36);
            glow.addColorStop(0, redRatio > 0 ? `rgba(255, ${Math.round(255 * (1 - redRatio * 0.75))}, ${Math.round(255 * (1 - redRatio * 0.85))}, 0.92)` : 'rgba(255, 255, 255, 0.92)');
            glow.addColorStop(0.65, redRatio > 0 ? `rgba(255, ${Math.round(250 * (1 - redRatio))}, ${Math.round(210 * (1 - redRatio))}, 0.45)` : 'rgba(255, 250, 210, 0.45)');
            glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(x, y, 36, 0, Math.PI * 2);
            ctx.fill();

            // Subtle dashed gravity well ring
            ctx.beginPath();
            ctx.arc(x, y, 26, 0, Math.PI * 2);
            ctx.strokeStyle = redRatio > 0.5 ? 'rgba(220, 38, 38, 0.45)' : 'rgba(20, 33, 61, 0.25)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.restore();

            // Draw the central duck with current hit color
            drawDuckSprite(
                ctx,
                x + offsetX,
                y + offsetY,
                scale,
                false,
                0,
                false,
                colors.body,
                colors.wing,
                duckHits
            );

            // Draw speech bubble if active
            if (speechText) {
                drawSpeechBubble(ctx, x, y, speechText, duckHits === 4);
            }
        }

        function drawDuckWar() {
            if (!duckWarActive) return;

            // Subtle smoky battle tint over the sky
            ctx.save();
            ctx.fillStyle = 'rgba(20, 33, 61, 0.14)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();

            // Draw Airstrike target markers & incoming rainbow bombs
            for (const strike of airstrikes) {
                // Ground/sky target crosshair
                ctx.save();
                ctx.strokeStyle = strike.color;
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.arc(strike.targetX, strike.targetY, 22, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();

                // Rainbow trail
                if (strike.trail.length > 1) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(strike.trail[0].x, strike.trail[0].y);
                    for (let t = 1; t < strike.trail.length; t++) {
                        ctx.lineTo(strike.trail[t].x, strike.trail[t].y);
                    }
                    ctx.strokeStyle = strike.color;
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    ctx.restore();
                }

                // Bread-bomb payload
                ctx.save();
                ctx.beginPath();
                ctx.arc(strike.x, strike.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#FFFFFF';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = strike.color;
                ctx.stroke();
                ctx.restore();
            }

            // Draw War Projectiles
            for (const p of warProjectiles) {
                ctx.save();
                if (p.type === 'seed') {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.strokeStyle = '#14213d';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                } else if (p.type === 'laser') {
                    const angle = Math.atan2(p.vy, p.vx);
                    ctx.translate(p.x, p.y);
                    ctx.rotate(angle);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-9, -2, 18, 4);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(-6, -1, 12, 2);
                } else if (p.type === 'egg') {
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 6.5, 4.8, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#FFFBEB';
                    ctx.fill();
                    ctx.strokeStyle = p.team === 'yellow' ? '#D97706' : '#DC2626';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Draw Warrior Ducks
            for (const d of warDucks) {
                const isYellow = d.team === 'yellow';
                const bobOffset = Math.sin(d.bobPhase) * 3;
                const tilt = Math.sin(d.bobPhase * 0.8) * 0.08 * d.facing;

                let bodyColor = isYellow ? '#FFD700' : '#E61414';
                let wingColor = isYellow ? '#E6AC00' : '#9E0808';
                if (d.hitFlash > 0) {
                    bodyColor = '#FFFFFF';
                    wingColor = '#FCA5A5';
                }

                const gear = isYellow
                    ? (d.isCommander ? 'yellow_commander' : 'yellow_army')
                    : (d.isCommander ? 'red_commander' : 'red_rebel');

                drawDuckSprite(
                    ctx,
                    d.x,
                    d.y + bobOffset,
                    d.scale,
                    d.facing < 0,
                    tilt,
                    false,
                    bodyColor,
                    wingColor,
                    isYellow ? 2 : 4,
                    gear
                );

                // Mini health bar above damaged or commander ducks
                if (d.hp < d.maxHp || d.isCommander) {
                    const barW = 26 * d.scale;
                    const barH = 4;
                    const bx = d.x - barW / 2;
                    const by = d.y + bobOffset - 22 * d.scale;
                    const hpRatio = Math.max(0, d.hp / d.maxHp);

                    ctx.save();
                    ctx.fillStyle = 'rgba(20, 33, 61, 0.75)';
                    ctx.fillRect(bx - 1, by - 1, barW + 2, barH + 2);
                    ctx.fillStyle = isYellow ? '#FACC15' : '#EF4444';
                    ctx.fillRect(bx, by, barW * hpRatio, barH);
                    ctx.restore();
                }

                // Battle cry speech bubble
                if (d.battleCry) {
                    drawSpeechBubble(ctx, d.x, d.y + bobOffset, d.battleCry, !isYellow, true);
                }
            }

            // Compact War Scoreboard HUD at top-center of canvas
            ctx.save();
            const hudText = `YELLOW ARMY KOs: ${yellowKOs}   |   WAVE ${warWave}   |   RED REBELS KOs: ${redKOs}`;
            ctx.font = 'bold 12px "Courier New", Courier, monospace';
            const hudW = ctx.measureText(hudText).width + 28;
            const hudH = 26;
            const hudX = (canvas.width - hudW) / 2;
            const hudY = 10;

            ctx.beginPath();
            ctx.roundRect(hudX, hudY, hudW, hudH, 5);
            ctx.fillStyle = 'rgba(20, 33, 61, 0.85)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(hudText, canvas.width / 2, hudY + hudH / 2 + 1);
            ctx.restore();

            // Dramatic Duck War start banner (fades out automatically)
            if (warBannerTimer > 0) {
                const alpha = Math.min(1, warBannerTimer / 35);
                ctx.save();
                ctx.globalAlpha = alpha;
                const msg = 'THE DUCK CWASHED OUT! DUCK WAR BEGINS!';
                ctx.font = 'bold 16px "Courier New", Courier, monospace';
                const w = ctx.measureText(msg).width + 36;
                const h = 42;
                const bx = (canvas.width - w) / 2;
                const by = canvas.height / 2 - h / 2;

                ctx.beginPath();
                ctx.roundRect(bx, by, w, h, 6);
                ctx.fillStyle = 'rgba(185, 28, 28, 0.92)';
                ctx.fill();
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.fillStyle = '#FFFFFF';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(msg, canvas.width / 2, canvas.height / 2 + 1);
                ctx.restore();
            }
        }

        function drawExplosionEffects() {
            // Shockwave rings
            for (const sw of shockwaves) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                ctx.strokeStyle = sw.color;
                ctx.globalAlpha = Math.max(0, sw.alpha);
                ctx.lineWidth = sw.lineWidth;
                ctx.stroke();
                ctx.restore();
            }

            // Particles & feathers
            for (const p of explosionParticles) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = p.color;

                if (p.isFeather) {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.size * 1.6, p.size * 0.65, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // Brief screen flash
            if (explosionFlash > 0) {
                ctx.save();
                ctx.fillStyle = `rgba(255, 245, 220, ${explosionFlash})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }
        }

        function draw() {
            ctx.save();

            // Apply screen shake on impact, explosion, or airstrike
            if (screenShakeTimer > 0) {
                const intensity = duckExploded ? (screenShakeTimer * 0.45) : (screenShakeTimer * 0.35);
                const sx = (Math.random() - 0.5) * intensity;
                const sy = (Math.random() - 0.5) * intensity;
                ctx.translate(sx, sy);
            }

            // 1. Draw cached Ducks & Rainbows background
            ctx.drawImage(bgCanvas, 0, 0);

            // 2. Draw Central Duck Node (if not blown up)
            drawCentralDuck(centralNode.x, centralNode.y);

            // 3. Draw Balls & Trails
            for (const b of balls) {
                // Draw path line with subtle backing for crisp visibility against sky & rainbows
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = 'rgba(20, 33, 61, 0.28)';
                    ctx.lineWidth = 2.6;
                    ctx.stroke();

                    ctx.strokeStyle = b.color;
                    ctx.lineWidth = 1.6;
                    ctx.stroke();
                }

                // Draw ball object
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(20, 33, 61, 0.45)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // 4. Draw Duck War battle if active
            drawDuckWar();

            // 5. Draw explosion shockwaves, particles, and screen flash
            drawExplosionEffects();

            ctx.restore();
        }

        function animate() {
            updatePhysics();
            updateDuckWar();
            updateEffects();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
