<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kitty & Cinnamoroll Gravity Simulation</title>
    <!-- Friendly Rounded Kawaii Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Nunito', 'Quicksand', sans-serif;
        }

        body {
            /* Soft cotton-candy pink to Cinnamoroll baby-blue pastel gradient */
            background: linear-gradient(135deg, #ffe6f0 0%, #fff6fa 48%, #dff3ff 100%);
            color: #5c2d46;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 14px 16px;
        }

        /* Top Header Bar - Kawaii Cloud & Ribbon Card */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.88);
            border: 2.5px solid #ffb3cf;
            border-radius: 999px;
            box-shadow: 0 6px 18px rgba(255, 118, 168, 0.16), 0 2px 6px rgba(90, 169, 230, 0.12);
            gap: 12px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffe0ec, #dff3ff);
            border: 2px solid #ff8ab4;
            flex-shrink: 0;
        }

        h1 {
            font-size: 19px;
            letter-spacing: 1px;
            font-weight: 700;
            color: #d93870;
            text-shadow: 0 1px 0 #ffffff;
        }

        .subtitle-tag {
            display: inline-block;
            font-family: 'Nunito', sans-serif;
            font-size: 11px;
            font-weight: 800;
            color: #3d8ac7;
            background: #e3f4ff;
            border: 1.5px solid #9dd4fa;
            padding: 2px 10px;
            border-radius: 999px;
            letter-spacing: 0.4px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Collected Flowers Score Pill */
        .score-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: linear-gradient(180deg, #fff9fc 0%, #ffe8f2 100%);
            border: 2px solid #ff9ec2;
            border-radius: 999px;
            padding: 6px 15px;
            font-size: 14px;
            font-weight: 700;
            color: #c92a67;
            box-shadow: 0 3px 8px rgba(255, 118, 168, 0.16);
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .score-pill.pop {
            transform: scale(1.14);
        }

        .score-value {
            display: inline-block;
            min-width: 18px;
            text-align: center;
            color: #d93870;
            font-weight: 700;
        }

        @media (max-width: 680px) {
            h1 {
                font-size: 15px;
            }
            .subtitle-tag {
                display: none;
            }
            #header {
                padding: 8px 14px;
            }
            .score-pill {
                padding: 5px 11px;
                font-size: 13px;
            }
        }

        /* Cute Strawberry-Pink Pill Reset Button */
        .btn-reset {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(180deg, #ff7aa8 0%, #ff5c93 100%);
            color: #ffffff;
            border: 2px solid #ffffff;
            outline: 2px solid #ff7aa8;
            border-radius: 999px;
            padding: 7px 18px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.8px;
            box-shadow: 0 4px 10px rgba(255, 92, 147, 0.32);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .btn-reset:hover {
            background: linear-gradient(180deg, #ff6399 0%, #eb467f 100%);
            transform: translateY(-1px) scale(1.03);
            box-shadow: 0 6px 14px rgba(255, 92, 147, 0.42);
        }

        .btn-reset:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 28px;
            border: 3.5px solid #ffffff;
            box-shadow: 0 12px 32px rgba(255, 118, 168, 0.2), 0 4px 14px rgba(90, 169, 230, 0.18);
            overflow: hidden;
            background: #e6f5ff;
        }

        canvas {
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
            border-radius: 24px;
        }

        /* Instructions Pill */
        .instructions {
            margin-top: 10px;
            padding: 5px 16px;
            font-family: 'Nunito', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #6b3b54;
            background: rgba(255, 255, 255, 0.82);
            border: 1.5px solid #ffd1e3;
            border-radius: 999px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(255, 138, 180, 0.12);
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <div class="title-group">
            <!-- Cute Hello Kitty Bow SVG Badge -->
            <div class="header-badge" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
                    <path d="M12.5 16C9.5 11.5 4.5 11 4.5 16C4.5 21 9.5 20.5 12.5 16Z" fill="#ff477e" stroke="#591936" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M19.5 16C22.5 11.5 27.5 11 27.5 16C27.5 21 22.5 20.5 19.5 16Z" fill="#ff477e" stroke="#591936" stroke-width="2" stroke-linejoin="round"/>
                    <circle cx="16" cy="16" r="3.6" fill="#ff7aa8" stroke="#591936" stroke-width="2"/>
                </svg>
            </div>
            <h1>Gravity Simulation</h1>
            <span class="subtitle-tag">Hello Kitty &amp; Cinnamoroll</span>
        </div>

        <div class="header-controls">
            <!-- Collected Flowers Counter -->
            <div class="score-pill" id="scorePill" title="Collected Flowers">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="5.5" r="3.4" fill="#ff7aa8" stroke="#591936" stroke-width="1.6"/>
                    <circle cx="18.2" cy="10" r="3.4" fill="#ff7aa8" stroke="#591936" stroke-width="1.6"/>
                    <circle cx="15.8" cy="17.2" r="3.4" fill="#ff7aa8" stroke="#591936" stroke-width="1.6"/>
                    <circle cx="8.2" cy="17.2" r="3.4" fill="#ff7aa8" stroke="#591936" stroke-width="1.6"/>
                    <circle cx="5.8" cy="10" r="3.4" fill="#ff7aa8" stroke="#591936" stroke-width="1.6"/>
                    <circle cx="12" cy="12" r="3.2" fill="#ffd43b" stroke="#591936" stroke-width="1.6"/>
                </svg>
                <span>Flowers: <span class="score-value" id="scoreCount">0</span></span>
            </div>

            <button class="btn-reset" onclick="resetSimulation()">
                <!-- Mini Star Sparkle Icon -->
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 2L14.6 9.4L22 12L14.6 14.6L12 22L9.4 14.6L2 12L9.4 9.4L12 2Z"/>
                </svg>
                Reset
            </button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click anywhere on the canvas to launch a flower and collect the floating blossoms!
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const scoreCountEl = document.getElementById('scoreCount');
        const scorePillEl = document.getElementById('scorePill');

        // =========================================================================
        // SIMULATION CONSTANTS (Preserved verbatim from baseline)
        // =========================================================================
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;          // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;      // Prevents infinite velocity near center
        const COLLECTIBLE_COUNT = 5;       // Number of collectible blossoms active per wave

        // Kawaii Pastel Palettes for Collectible Flowers
        const COLLECTIBLE_PALETTES = [
            {
                name: 'cinnamoroll',
                inner: '#339af0',
                mid: '#74c0fc',
                outer: '#e7f5ff',
                stroke: '#2b6cb0',
                centerInner: '#fff9db',
                centerOuter: '#fcc419',
                aura: 'rgba(116, 192, 252, 0.34)'
            },
            {
                name: 'buttercup',
                inner: '#f59f00',
                mid: '#ffd43b',
                outer: '#fff9db',
                stroke: '#9c6300',
                centerInner: '#ffe3ec',
                centerOuter: '#ff6b98',
                aura: 'rgba(255, 212, 59, 0.34)'
            },
            {
                name: 'lavender',
                inner: '#845ef7',
                mid: '#b197fc',
                outer: '#f3f0ff',
                stroke: '#5234a8',
                centerInner: '#fff9db',
                centerOuter: '#ffd43b',
                aura: 'rgba(177, 151, 252, 0.34)'
            },
            {
                name: 'peach',
                inner: '#f76707',
                mid: '#ffa94d',
                outer: '#fff4e6',
                stroke: '#9c4208',
                centerInner: '#fff9db',
                centerOuter: '#fcc419',
                aura: 'rgba(255, 169, 77, 0.34)'
            },
            {
                name: 'mint',
                inner: '#12b886',
                mid: '#63e6be',
                outer: '#e6fcf5',
                stroke: '#0b7254',
                centerInner: '#fff9db',
                centerOuter: '#ffd43b',
                aura: 'rgba(99, 230, 190, 0.34)'
            }
        ];

        // =========================================================================
        // STATE VARIABLES
        // =========================================================================
        let balls = [];
        let collectibleFlowers = [];
        let petalParticles = [];
        let launchBursts = [];
        let floatingTexts = [];
        let collectedCount = 0;
        let animTime = 0;
        let scorePopTimeout = null;

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 12
        };

        // Decorative Background Clouds & Sparkles
        let clouds = [];
        let sparkles = [];

        /**
         * Updates the collected flowers HUD counter with a gentle kawaii pop animation.
         */
        function updateScoreDisplay(animate = false) {
            scoreCountEl.textContent = collectedCount;
            if (animate) {
                scorePillEl.classList.remove('pop');
                void scorePillEl.offsetWidth;
                scorePillEl.classList.add('pop');
                clearTimeout(scorePopTimeout);
                scorePopTimeout = setTimeout(() => {
                    scorePillEl.classList.remove('pop');
                }, 220);
            }
        }

        /**
         * Spawns a wave of kawaii collectible flowers positioned across reachable orbital zones
         * around the central gravity node.
         */
        function spawnCollectibleWave() {
            collectibleFlowers = [];
            const w = Math.max(canvas.width, 320);
            const h = Math.max(canvas.height, 320);
            const cx = centralNode.x;
            const cy = centralNode.y;

            const minOrbitR = 62;
            const maxOrbitR = Math.max(minOrbitR + 40, Math.min(w * 0.40, h * 0.38));
            const edgeMargin = 46;
            const minFlowerSpacing = 54;

            for (let i = 0; i < COLLECTIBLE_COUNT; i++) {
                let placed = false;
                const baseAngle = ((i / COLLECTIBLE_COUNT) * Math.PI * 2) + (Math.random() * 0.65);

                for (let attempt = 0; attempt < 30; attempt++) {
                    const angle = baseAngle + attempt * 0.27;
                    const t = (i + Math.random() * 0.85) / COLLECTIBLE_COUNT;
                    const dist = minOrbitR + t * (maxOrbitR - minOrbitR);

                    const fx = Math.max(edgeMargin, Math.min(w - edgeMargin, cx + Math.cos(angle) * dist));
                    const fy = Math.max(edgeMargin, Math.min(h - edgeMargin, cy + Math.sin(angle) * dist));

                    // Keep clear of central gravity node
                    const distToCenter = Math.hypot(fx - cx, fy - cy);
                    if (distToCenter < minOrbitR) continue;

                    // Keep clear of other collectible flowers
                    const overlaps = collectibleFlowers.some(
                        other => Math.hypot(fx - other.x, fy - other.y) < minFlowerSpacing
                    );
                    if (overlaps) continue;

                    const palette = COLLECTIBLE_PALETTES[(i + Math.floor(Math.random() * 2)) % COLLECTIBLE_PALETTES.length];
                    collectibleFlowers.push({
                        x: fx,
                        y: fy,
                        radius: 13,
                        palette: palette,
                        phase: Math.random() * Math.PI * 2,
                        spinOffset: Math.random() * Math.PI * 2,
                        spawnScale: 0.05
                    });
                    placed = true;
                    break;
                }

                // Fallback placement if canvas is very small
                if (!placed) {
                    const angle = (i / COLLECTIBLE_COUNT) * Math.PI * 2;
                    const dist = Math.min(85, maxOrbitR);
                    const palette = COLLECTIBLE_PALETTES[i % COLLECTIBLE_PALETTES.length];
                    collectibleFlowers.push({
                        x: Math.max(edgeMargin, Math.min(w - edgeMargin, cx + Math.cos(angle) * dist)),
                        y: Math.max(edgeMargin, Math.min(h - edgeMargin, cy + Math.sin(angle) * dist)),
                        radius: 13,
                        palette: palette,
                        phase: Math.random() * Math.PI * 2,
                        spinOffset: Math.random() * Math.PI * 2,
                        spawnScale: 0.05
                    });
                }
            }
        }

        /**
         * Initializes fluffy kawaii clouds and floating pastel stars/hearts
         * scaled cleanly to the current canvas dimensions.
         */
        function initDecorations() {
            const w = Math.max(canvas.width, 320);
            const h = Math.max(canvas.height, 320);

            clouds = [
                { x: w * 0.14, y: h * 0.16, scale: 0.95, speed: 0.18 },
                { x: w * 0.44, y: h * 0.11, scale: 0.78, speed: 0.13 },
                { x: w * 0.62, y: h * 0.25, scale: 0.65, speed: 0.21 },
                { x: w * 0.34, y: h * 0.84, scale: 0.88, speed: 0.15 },
                { x: w * 0.82, y: h * 0.78, scale: 1.05, speed: 0.16 }
            ];

            sparkles = [
                { x: w * 0.08, y: h * 0.32, size: 7, type: 'star', color: '#ffd966', phase: 0.2 },
                { x: w * 0.25, y: h * 0.22, size: 6, type: 'heart', color: '#ff9ec2', phase: 1.1 },
                { x: w * 0.36, y: h * 0.36, size: 5, type: 'sparkle', color: '#8acbf7', phase: 2.0 },
                { x: w * 0.64, y: h * 0.14, size: 7, type: 'star', color: '#ffd966', phase: 2.7 },
                { x: w * 0.71, y: h * 0.42, size: 6, type: 'heart', color: '#ff9ec2', phase: 0.8 },
                { x: w * 0.91, y: h * 0.52, size: 7, type: 'sparkle', color: '#8acbf7', phase: 1.9 },
                { x: w * 0.28, y: h * 0.68, size: 6, type: 'sparkle', color: '#ff9ec2', phase: 3.1 },
                { x: w * 0.68, y: h * 0.88, size: 7, type: 'star', color: '#ffd966', phase: 1.5 },
                { x: w * 0.92, y: h * 0.88, size: 6, type: 'heart', color: '#ff9ec2', phase: 2.4 }
            ];
        }

        /**
         * Resizes canvas to fit container and recenters the central gravity node.
         */
        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            const prevW = canvas.width || wrapper.clientWidth;
            const prevH = canvas.height || wrapper.clientHeight;

            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            // Keep existing collectible flowers scaled within bounds on resize
            if (collectibleFlowers.length > 0 && prevW > 0 && prevH > 0) {
                for (const f of collectibleFlowers) {
                    f.x = Math.max(40, Math.min(canvas.width - 40, (f.x / prevW) * canvas.width));
                    f.y = Math.max(40, Math.min(canvas.height - 40, (f.y / prevH) * canvas.height));
                }
            }

            initDecorations();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Canvas Click Handler: Directly launch flower projectile at click position
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchBall(clickX, clickY);
        });

        /**
         * Spawns a kawaii floral burst at the click point when the flower shoots out.
         */
        function spawnLaunchBurst(x, y, vx, vy) {
            launchBursts.push({
                x: x,
                y: y,
                radius: 4,
                maxRadius: 28,
                alpha: 0.95,
                color: '255, 92, 147'
            });

            const petalColors = ['#ff5c93', '#ff8ab4', '#ffd43b', '#ffffff'];
            for (let i = 0; i < 9; i++) {
                const spreadAngle = ((i / 9) * Math.PI * 2) + (Math.random() * 0.35);
                const speed = 1.4 + Math.random() * 2.2;
                petalParticles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(spreadAngle) * speed + vx * 0.22,
                    vy: Math.sin(spreadAngle) * speed + vy * 0.22,
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.18,
                    size: 3.4 + Math.random() * 2.2,
                    alpha: 1,
                    decay: 0.032 + Math.random() * 0.015,
                    color: petalColors[i % petalColors.length],
                    isSparkle: i % 3 === 2
                });
            }
        }

        /**
         * Spawns a celebratory sparkle & petal burst when a collectible flower is gathered.
         */
        function spawnCollectBurst(flower) {
            launchBursts.push({
                x: flower.x,
                y: flower.y,
                radius: 6,
                maxRadius: 38,
                alpha: 0.98,
                color: '255, 196, 25'
            });

            const burstColors = [
                flower.palette.mid,
                flower.palette.outer,
                '#ffd43b',
                '#ff7aa8',
                '#ffffff'
            ];

            for (let i = 0; i < 14; i++) {
                const spreadAngle = ((i / 14) * Math.PI * 2) + (Math.random() * 0.25);
                const speed = 1.6 + Math.random() * 2.6;
                petalParticles.push({
                    x: flower.x,
                    y: flower.y,
                    vx: Math.cos(spreadAngle) * speed,
                    vy: Math.sin(spreadAngle) * speed - 0.4,
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.22,
                    size: 3.8 + Math.random() * 2.4,
                    alpha: 1,
                    decay: 0.026 + Math.random() * 0.012,
                    color: burstColors[i % burstColors.length],
                    isSparkle: i % 2 === 0
                });
            }

            floatingTexts.push({
                x: flower.x,
                y: flower.y - 10,
                vy: -1.15,
                text: '+1 🌸',
                color: '#d93870',
                alpha: 1,
                scale: 1
            });
        }

        /**
         * Launches a single flower projectile at (x, y) using the exact baseline physics parameters.
         */
        function launchBall(x, y) {
            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  // sin(90°) = 1  -> vx = 5
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0  -> vy = 0

            spawnLaunchBurst(x, y, vx, vy);

            // Overwrite existing array to strictly maintain a single active projectile on screen
            balls = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4,         // Physical collision radius preserved from baseline
                rotation: 0,
                frameCount: 0,
                trail: []          // Stores history of past {x, y} coordinates
            }];
        }

        /**
         * Clears active flower projectile, resets collected flower count, and spawns fresh flowers.
         */
        function resetSimulation() {
            balls = [];
            petalParticles = [];
            launchBursts = [];
            floatingTexts = [];
            collectedCount = 0;
            updateScoreDisplay(false);
            spawnCollectibleWave();
        }

        /**
         * Updates orbital physics (inverse square law gravity, absorption, and trail history),
         * checks collectible flower pickups, and animates decorative particles.
         */
        function updatePhysics() {
            // Smooth pop-in animation for collectible flowers
            for (const f of collectibleFlowers) {
                if (f.spawnScale < 1) {
                    f.spawnScale = Math.min(1, f.spawnScale + 0.07);
                }
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove projectile if it travels too far off-screen (prevents memory leak)
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin ||
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: projectile collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    spawnLaunchBurst(b.x, b.y, 0, 0);
                    balls.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;
                b.rotation += 0.09;
                b.frameCount++;

                // Check collection against floating collectible flowers
                for (let j = collectibleFlowers.length - 1; j >= 0; j--) {
                    const target = collectibleFlowers[j];
                    const bobY = target.y + Math.sin(animTime * 0.0032 + target.phase) * 3.5;
                    const collectDist = Math.hypot(b.x - target.x, b.y - bobY);

                    if (collectDist <= b.radius + target.radius + 7) {
                        collectedCount++;
                        updateScoreDisplay(true);
                        spawnCollectBurst({ ...target, y: bobY });
                        collectibleFlowers.splice(j, 1);

                        // Spawn a fresh bouquet wave once all flowers on screen are collected
                        if (collectibleFlowers.length === 0) {
                            floatingTexts.push({
                                x: centralNode.x,
                                y: centralNode.y - 36,
                                vy: -0.75,
                                text: 'Bouquet Complete! ✨',
                                color: '#3d8ac7',
                                alpha: 1,
                                scale: 1.15
                            });
                            spawnCollectibleWave();
                        }
                    }
                }

                // Shoot tiny petals and sparkles outward from the flying flower
                if (b.frameCount % 4 === 0 && petalParticles.length < 85) {
                    const ejectAngle = Math.atan2(-b.vy, -b.vx) + (Math.random() - 0.5) * 1.6;
                    const ejectSpeed = 0.7 + Math.random() * 1.1;
                    const colors = ['#ff7aa8', '#ffb3cf', '#ffe066', '#ffffff'];
                    petalParticles.push({
                        x: b.x,
                        y: b.y,
                        vx: Math.cos(ejectAngle) * ejectSpeed,
                        vy: Math.sin(ejectAngle) * ejectSpeed,
                        rotation: Math.random() * Math.PI * 2,
                        vRot: (Math.random() - 0.5) * 0.14,
                        size: 2.8 + Math.random() * 1.8,
                        alpha: 0.92,
                        decay: 0.025,
                        color: colors[b.frameCount % colors.length],
                        isSparkle: b.frameCount % 8 === 0
                    });
                }

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }

            // Update launch & collection ring bursts
            for (let i = launchBursts.length - 1; i >= 0; i--) {
                const burst = launchBursts[i];
                burst.radius += 1.6;
                burst.alpha -= 0.055;
                if (burst.alpha <= 0 || burst.radius >= burst.maxRadius) {
                    launchBursts.splice(i, 1);
                }
            }

            // Update shooting petals & sparkles
            for (let i = petalParticles.length - 1; i >= 0; i--) {
                const p = petalParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.96;
                p.vy *= 0.96;
                p.rotation += p.vRot;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    petalParticles.splice(i, 1);
                }
            }

            // Update floating score & celebration text
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.022;
                if (ft.alpha <= 0) {
                    floatingTexts.splice(i, 1);
                }
            }
        }

        /**
         * Draws the pastel baby-blue to blush-pink sky gradient with subtle polka dots.
         */
        function drawPastelSky() {
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#d7f0ff');    // Cinnamoroll baby-blue top
            skyGrad.addColorStop(0.52, '#f7f9ff'); // Soft airy cloud-white mid
            skyGrad.addColorStop(1, '#ffe0ed');    // Hello Kitty blush-pink bottom

            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle pastel polka-dot pattern
            const spacing = 48;
            ctx.save();
            for (let row = 0; row * spacing < canvas.height + spacing; row++) {
                const offsetX = (row % 2) * (spacing / 2);
                for (let col = 0; col * spacing < canvas.width + spacing; col++) {
                    const px = col * spacing + offsetX;
                    const py = row * spacing;
                    ctx.beginPath();
                    ctx.arc(px, py, 2.2, 0, Math.PI * 2);
                    ctx.fillStyle = (row + col) % 2 === 0
                        ? 'rgba(255, 255, 255, 0.65)'
                        : 'rgba(255, 173, 206, 0.22)';
                    ctx.fill();
                }
            }
            ctx.restore();
        }

        /**
         * Draws a fluffy white kawaii cloud with a soft sky-blue outline.
         */
        function drawFluffyCloud(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            ctx.beginPath();
            ctx.moveTo(-44, 16);
            ctx.bezierCurveTo(-58, 16, -62, -2, -46, -8);
            ctx.bezierCurveTo(-46, -26, -22, -32, -12, -18);
            ctx.bezierCurveTo(-2, -34, 24, -30, 28, -12);
            ctx.bezierCurveTo(46, -14, 56, 2, 44, 16);
            ctx.closePath();

            // Soft white fill with gentle blue bottom tint
            const cloudGrad = ctx.createLinearGradient(0, -28, 0, 18);
            cloudGrad.addColorStop(0, 'rgba(255, 255, 255, 0.96)');
            cloudGrad.addColorStop(1, 'rgba(232, 246, 255, 0.92)');
            ctx.fillStyle = cloudGrad;
            ctx.fill();

            // Crisp soft sky-blue outline
            ctx.lineWidth = 2.2;
            ctx.strokeStyle = '#97cef5';
            ctx.stroke();

            ctx.restore();
        }

        /**
         * Draws twinkling stars, tiny pastel hearts, and 4-point sparkles.
         */
        function drawSparkleItem(item, time) {
            const pulse = 0.78 + 0.22 * Math.sin(time * 0.003 + item.phase);
            ctx.save();
            ctx.translate(item.x, item.y);
            ctx.scale(pulse, pulse);
            ctx.globalAlpha = 0.75;
            ctx.fillStyle = item.color;

            const s = item.size;
            if (item.type === 'sparkle') {
                // 4-point diamond sparkle
                ctx.beginPath();
                ctx.moveTo(0, -s * 1.4);
                ctx.quadraticCurveTo(0, 0, s * 1.4, 0);
                ctx.quadraticCurveTo(0, 0, 0, s * 1.4);
                ctx.quadraticCurveTo(0, 0, -s * 1.4, 0);
                ctx.quadraticCurveTo(0, 0, 0, -s * 1.4);
                ctx.fill();
            } else if (item.type === 'heart') {
                // Cute mini pastel heart
                ctx.beginPath();
                ctx.moveTo(0, s * 0.6);
                ctx.bezierCurveTo(-s * 1.2, -s * 0.4, -s * 0.6, -s * 1.3, 0, -s * 0.5);
                ctx.bezierCurveTo(s * 0.6, -s * 1.3, s * 1.2, -s * 0.4, 0, s * 0.6);
                ctx.fill();
            } else {
                // Rounded 5-point pastel star
                ctx.beginPath();
                for (let i = 0; i < 10; i++) {
                    const r = i % 2 === 0 ? s * 1.25 : s * 0.55;
                    const a = (i * Math.PI) / 5 - Math.PI / 2;
                    if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                    else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
        }

        /**
         * Draws a floating pastel kawaii collectible flower with mint leaves,
         * soft pulsing aura ring, and glossy petal highlights.
         */
        function drawCollectibleFlower(flower, time) {
            const bobY = flower.y + Math.sin(time * 0.0032 + flower.phase) * 3.5;
            const gentleRot = flower.spinOffset + Math.sin(time * 0.0018 + flower.phase) * 0.25;
            const auraPulse = 17 + Math.sin(time * 0.0045 + flower.phase) * 2.5;
            const p = flower.palette;

            ctx.save();
            ctx.translate(flower.x, bobY);
            ctx.scale(flower.spawnScale, flower.spawnScale);

            // Soft pastel glow aura behind collectible flower
            ctx.beginPath();
            ctx.arc(0, 0, auraPulse, 0, Math.PI * 2);
            ctx.fillStyle = p.aura;
            ctx.fill();

            // Crisp white backing circle so flower pops over sky and clouds
            ctx.beginPath();
            ctx.arc(0, 0, 14.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.fill();
            ctx.lineWidth = 1.4;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.98)';
            ctx.stroke();

            // Two cute mint-green leaves at bottom-left and bottom-right
            const leafAngles = [Math.PI * 0.72, Math.PI * 0.28];
            for (const la of leafAngles) {
                ctx.save();
                ctx.rotate(la);
                ctx.beginPath();
                ctx.ellipse(12, 0, 5.2, 2.8, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#69db7c';
                ctx.fill();
                ctx.lineWidth = 1.2;
                ctx.strokeStyle = '#2b8a3e';
                ctx.stroke();
                ctx.restore();
            }

            // Rotate flower petals gently
            ctx.rotate(gentleRot);

            const petalCount = 5;
            const petalDist = 6.6;
            const petalRadiusX = 5.6;
            const petalRadiusY = 4.5;

            for (let i = 0; i < petalCount; i++) {
                const angle = (i * Math.PI * 2) / petalCount;
                ctx.save();
                ctx.rotate(angle);

                const petalGrad = ctx.createRadialGradient(2, 0, 1, petalDist, 0, petalRadiusX + 1);
                petalGrad.addColorStop(0, p.inner);
                petalGrad.addColorStop(0.65, p.mid);
                petalGrad.addColorStop(1, p.outer);

                ctx.beginPath();
                ctx.ellipse(petalDist, 0, petalRadiusX, petalRadiusY, 0, 0, Math.PI * 2);
                ctx.fillStyle = petalGrad;
                ctx.fill();
                ctx.lineWidth = 1.4;
                ctx.strokeStyle = p.stroke;
                ctx.stroke();

                ctx.restore();
            }

            // Flower center button
            const centerGrad = ctx.createRadialGradient(-1, -1, 0.5, 0, 0, 4.4);
            centerGrad.addColorStop(0, p.centerInner);
            centerGrad.addColorStop(0.65, p.centerOuter);
            centerGrad.addColorStop(1, p.stroke);

            ctx.beginPath();
            ctx.arc(0, 0, 4.3, 0, Math.PI * 2);
            ctx.fillStyle = centerGrad;
            ctx.fill();
            ctx.lineWidth = 1.3;
            ctx.strokeStyle = p.stroke;
            ctx.stroke();

            // Glossy catchlight dot on center
            ctx.beginPath();
            ctx.arc(-1.3, -1.3, 1.15, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.restore();
        }

        /**

        function drawFlowerProjectile(b) {

        /**
         * Draws launch burst rings, tiny shooting petals/sparkles, and floating score popups.
         */
        function drawPetalEffects() {
            // Expanding blossom burst rings at launch & collection points
            for (const burst of launchBursts) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(burst.x, burst.y, burst.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${burst.color || '255, 92, 147'}, ${burst.alpha})`;
                ctx.lineWidth = 2.4;
                ctx.stroke();
                ctx.restore();
            }

            // Shooting mini petals & sparkles
            for (const p of petalParticles) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;

                if (p.isSparkle) {
                    const s = p.size;
                    ctx.beginPath();
                    ctx.moveTo(0, -s * 1.3);
                    ctx.quadraticCurveTo(0, 0, s * 1.3, 0);
                    ctx.quadraticCurveTo(0, 0, 0, s * 1.3);
                    ctx.quadraticCurveTo(0, 0, -s * 1.3, 0);
                    ctx.quadraticCurveTo(0, 0, 0, -s * 1.3);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.size, p.size * 0.62, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 0.8;
                    ctx.strokeStyle = 'rgba(89, 25, 54, 0.55)';
                    ctx.stroke();
                }

                ctx.restore();
            }

            // Floating "+1 🌸" & wave celebration text
            for (const ft of floatingTexts) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, ft.alpha);
                ctx.font = `700 ${Math.round(16 * ft.scale)}px 'Fredoka', sans-serif`;
                ctx.textAlign = 'center';
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }
        }

        // =========================================================================
        // MAIN RENDER LOOP
        // =========================================================================

        function draw() {
            animTime += 16.67;

            // 1. Pastel Sky Background with Polka Dots
            drawPastelSky();

            // 2. Drifting Fluffy Clouds
            for (const c of clouds) {
                c.x += c.speed;
                if (c.x - 70 * c.scale > canvas.width) {
                    c.x = -70 * c.scale;
                }
                drawFluffyCloud(c.x, c.y, c.scale);
            }

            // 3. Twinkling Sparkles, Stars & Mini Hearts
            for (const sp of sparkles) {
                drawSparkleItem(sp, animTime);
            }

            // 4. Theme Characters: Hello Kitty (Lower-Left) & Cinnamoroll (Upper-Right)
            drawHelloKitty();
            drawCinnamoroll(animTime);

            // 5. Collectible Floating Flowers
            for (const flower of collectibleFlowers) {
                drawCollectibleFlower(flower, animTime);
            }

            // 6. Central Mass Node (radius = 12) - High-Contrast Strawberry & Gold Planet
            const pulseAura = 18 + Math.sin(animTime * 0.004) * 2.5;
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, pulseAura, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 71, 126, 0.16)';
            ctx.fill();

            // Main planet sphere (exact radius = 12)
            const nodeGrad = ctx.createRadialGradient(
                centralNode.x - 4, centralNode.y - 4, 2,
                centralNode.x, centralNode.y, centralNode.radius
            );
            nodeGrad.addColorStop(0, '#ff9ebb');
            nodeGrad.addColorStop(0.55, '#ff477e');
            nodeGrad.addColorStop(1, '#c9184a');

            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = nodeGrad;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#591936';
            ctx.stroke();

            // Center golden 4-point star emblem on node
            ctx.fillStyle = '#ffe066';
            ctx.beginPath();
            const sr = 5;
            ctx.moveTo(centralNode.x, centralNode.y - sr);
            ctx.quadraticCurveTo(centralNode.x, centralNode.y, centralNode.x + sr, centralNode.y);
            ctx.quadraticCurveTo(centralNode.x, centralNode.y, centralNode.x, centralNode.y + sr);
            ctx.quadraticCurveTo(centralNode.x, centralNode.y, centralNode.x - sr, centralNode.y);
            ctx.quadraticCurveTo(centralNode.x, centralNode.y, centralNode.x, centralNode.y - sr);
            ctx.fill();

            // 7. Launch & Collection Bursts, Shooting Mini-Petals & Popups
            drawPetalEffects();

            // 8. Flower Projectile & High-Contrast Magenta-Pink Orbit Trail
            for (const b of balls) {
                if (b.trail.length > 1) {
                    ctx.save();
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    // Soft crisp white under-halo so trail stands out cleanly over characters & clouds
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.lineWidth = 4.2;
                    ctx.stroke();

                    // Rich magenta-pink core orbit trail (#e63973)
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = '#e63973';
                    ctx.lineWidth = 2.2;
                    ctx.stroke();

                    ctx.restore();
                }

                // Kawaii 5-petal flower projectile
                drawFlowerProjectile(b);
            }
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            spawnCollectibleWave();
            animate();
        };
    </script>
</body>
</html>
